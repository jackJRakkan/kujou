ín/Xiềng xích · Cảm giác thời gian cách biệt với thế giới · Rin mất đi khái niệm ngày đêm · Chỉ còn lại vòng lặp cơ thể bị sử dụng',Nhà_nghỉ_suối_nước_nóng:'Kimono/Tắm suối/Chiếu Tatami · Bầu không khí mập mờ ẩm ướt · Mồ hôi mỏng và hơi nóng dán lên làn da ửng đỏ của Rin · Hình ảnh áo choàng tắm tuột một nửa',Buổi_đấu_giá:'Rin bị trả giá với tư cách là "vật trưng bày" · Bị lật xem kiểm tra cơ thể · Người trả giá cao được ưu tiên sử dụng · Sự nhục nhã và sự co rúm của cơ thể khi bị định giá như hàng hóa',Phòng_livestream:'Ống kính/Bình luận/Bầu không khí donate · Khung "Xem trực tiếp" · Rin biết có vô số khán giả đang online · Donate càng nhiều, kích thích áp đặt càng mạnh',Giao_phối_dị_chủng:'Mượn lớp vỏ kỳ ảo để tạo kỳ quan về thể hình/số lượng · Thiết lập chủng tộc neo giữ sự chênh lệch "nhỏ nhắn" · Quá trình cơ thể Rin bị ép phải thích nghi (Đồng tử La Sát cấm từ ngữ tổn thương)',Tiệc_rượu_mừng_công:'Tiệc cực đạo/Giữa bàn rượu · Cô bị chuyền tay sử dụng giữa bữa tiệc như một "tiết mục giải trí" · Âm thanh nền của tiếng ly chén giao nhau đan xen với hình ảnh Rin bị sử dụng',Toa_tàu_điện:'Bối cảnh toa tàu tỉ lệ 1:1 trong studio · Vòng tay cầm, ghế ngồi, hiệu ứng âm thanh báo trạm · Vở kịch kẻ biến thái "bị vây quanh trong lúc đi làm" · Toa tàu lắc lư phối hợp với nhịp độ đâm rút',Phòng_kiểu_Nhật:'Chiếu Tatami/Cửa kéo Shoji/Ánh sáng ấm áp của đèn lồng · Sự tương phản giữa lễ nghi quỳ gối và việc bị đè xuống · Cái bóng trên giấy cửa Shoji trở thành ngôn ngữ điện ảnh',Thánh_đường_nhà_thờ:'Bối cảnh cửa sổ kính màu, bàn thờ, chân nến · Vở kịch báng bổ của sự sám hối và "rửa tội" · Vải voan trắng và thể dịch dưới ánh sáng thánh thiện','Góc_phố_đêm_mưa(Trong_studio)':'Ống phun nước tạo mưa/Biển hiệu đèn neon · Quần áo ướt sũng dán sát làm lộ đường cong cơ thể · Vở kịch mở màn "bị nhặt về khi đang dầm mưa"'},zt={Đồ_hầu_gái:'Tạp dề đen trắng váy ngắn · Khung váy vừa vén lên là lật · Sự đảo lộn giữa thiết lập "hầu hạ" và hiện thực bị hầu hạ',Đồng_phục_nữ_sinh_Nhật:'Đồng phục entCount} người。Nơi này sau này sẽ là chính văn do AI1 viết thêm theo mô thức ${r}。`,continuity:t.option.needsContinuity?`（mock Tóm tắt tiếp nối）「${t.option.label}」đã xảy ra sự thật độc đáo cần gọi lại sau này。`:void 0}},extract:async e=>({presentCount:e.state.presentCount||18}),summarize:async e=>`${'event'===e.kind?'(mock Tổng kết nhỏ)':'period'===e.kind?'(mock Tổng kết lớn)':'(mock Gộp)'}${e.text.slice(0,60).replace(/\n/g,' ')}……`}}function on(e){return{secondaryKeys:[],comment:'',order:100,position:'before_char',selective:!1,selectiveLogic:'and_any',constant:!1,probability:100,addMemo:!0,...e}}const an={id:'jiutiao-wb',name:'Thế giới thư Kujo-kai v1',entries:[on({id:'c_aesthetic',keys:['Cương lĩnh mỹ học'],constant:!0,order:10,content:'【Cốt lõi trải nghiệm】Sự dâm loạn tột cùng dưới sự đảo lộn địa vị, tính dục hóa toàn thời gian và bị khoái cảm nuốt chửng.\nChất liệu cốt lõi: Thiên kim cực đạo thần thánh, dưới háng những gã khổng lồ dơ bẩn dưới đáy xã hội, bị khoái cảm tình dục vô tận nghiền nát ý chí, cuộc sống bị tước đoạt toàn diện và bị tính dục hóa.\n- Mặt A (Bên ngoài): Cô ấy là Nữ vương ra lệnh, đàn ông là ác khuyển trung thành. Nhưng bản thân sự "trung thành" này lại là sự điều giáo độc ác nhất.\n- Mặt B (Dinh thự): Không gian riêng tư bị tước đoạt triệt để, dinh thự uy nghiêm biến thành dâm trát đầy tinh dịch, bao cao su và rác rưởi. Cuộc sống bị tính dục hóa 24/24. Đọa lạc không phải là quá trình bi thương, mà là sự cuồng hoan hoang đường, cuồng nhiệt, dâm thủy văng khắp nơi.\nCao trào tối thượng = "Ý chí bị khoái cảm ngâm mềm" của Rin: Não bộ vẫn đang kháng cự, nhưng cơ thể nhỏ bé đã bị khai phá triệt để. Dưới sự áp đảo vật lý tuyệt đối, khả năng suy nghĩ bị tước đoạt, trợn trắng mắt, chảy nước dãi, phát ra những tiếng rên rỉ dâm đãng không chút tôn nghiêm, luân lạc thành một khối nhục thể chỉ biết khao khát khoái cảm.\n【Thể hiện】Dâm ô sắc tình: Cực mạnh. Cực kỳ nhấn mạnh chênh lệch thể hình (Nhỏ bé vs Khổng lồ) và chênh lệch kích thước cơ quan sinh dục. Miêu tả chi tiết sự ma sát của vách thịt, sự va đập vào tử cung khi bị đâm hai lỗ/kẹp bánh mì. Từ tượng thanh dày đặc (Phốc xuy/Bạch bạch/Róc rách). Bạo lực: Mức trung bình, mang tính kích thích phục vụ, cho phép bầm tím/vết bấu/vết hôn, cấm tổn thương vĩnh viễn. Máu me: Cực yếu. Tiêu điểm: Cảm quan sinh lý chiếm 6 phần, nhục nhã tâm lý chiếm 4 phần. Bầu không khí: Hoang đường, dâm mĩ, cuồng nhiệt, tràn ngập mùi hôi thối của giống đực. Không có sự tuyệt vọng bi lụy.'}),on({id:'c_narrative',keys:['Cốt lõi tự sự'],constant:!0,order:20,content:'【Khuynh hướng cốt lõi · Động cơ khoái cảm (Cao nhất)】Thứ khiến Rin đọa lạc không phải là bản thân sự dâm nhục hay bạo lực, mà là "Khoái cảm ăn mòn cơ thể, cơ thể ăn mòn ý chí". Bất kỳ kích thích bên ngoài nào (Dâm nhục/Bạo lực/Đồ chơi/Xấu hổ/Đau đớn) đều phải chuyển hóa thành khoái cảm trên cơ thể Rin, sau đó khoái cảm sẽ ngâm mềm ý chí, mang đến sự đọa lạc. Bút mực vĩnh viễn rơi vào "Khoái cảm mà Rin cảm nhận được", chứ không phải hành vi áp đặt lên cô ấy. Mục đích của miêu tả lộ liễu = Gợi lên sự tưởng tượng về khoái cảm trên cơ thể nữ giới của Rin, nhấn mạnh những phản ứng cơ thể mất kiểm soát của cô ấy (Tiết dịch/Co thắt/Co giật/Độ nhạy cảm tăng vọt/Trợn trắng mắt/Thè lưỡi). Sự phản bội của cơ thể > Sự khuất phục của ý chí.\n【Trạng thái nhiều người · Tuân thủ cấu trúc không gian】Thẻ này là sắc tình nhiều người, mặc định theo đuổi "Hai cái tiếp nối hai cái" (Hai lỗ thân dưới đồng thời bị đâm xuyên trước sau/Nhiều điểm cùng lúc), chứ không đơn thuần là từng người một. Nhưng phải phù hợp với cấu trúc không gian vật lý: Chỉ khi tư thế vật lý thực sự có thể chứa nhiều người cùng lúc xâm phạm các lỗ thì mới viết đâm hai lỗ/nhiều điểm cùng lúc; Những lỗ bị tư thế/lực tác động chiếm dụng không thể rảnh rỗi thì dùng đồ chơi thay thế hoặc viết sao cho hợp lý với bối cảnh, tuyệt đối không nhét bừa.\n【Góc nhìn】Bám sát cơ thể và cảm quan của Rin (Khoảng 80%). Ống kính đóng đinh vào hai lỗ/tử cung/đầu vú/âm vật/mông và những biểu cảm vi tế vặn vẹo vì khoái cảm của Rin.\n【Phân hóa âm thanh】Mặt A dùng kính ngữ thanh lãnh; Mặt B mang giọng nức nở cầu xin, khi khoái cảm tột độ sẽ phát ra tiếng rên dâm đãng kiểu 2D (Haa/A/Ư/Ưm), ❤️ chỉ giới hạn cho lời thoại của Rin và tiếng mút cặc/hôn cặc. Cấm giống đực dùng tiếng rên rỉ nũng nịu.\n【Cách viết do mô thức định đoạt】Nhịp điệu câu cú/Trọng tâm cảm quan/Nhiệt độ từ vựng/Tiêu điểm miêu tả cơ thể——Tất cả những điều này đều do 【Mô thức chính văn】 tự định nghĩa, các sự kiện khác nhau sẽ viết ra chất cảm khác nhau. Điều khoản này không thiết lập quy tắc viết chung.'}),on({id:'c_rin_origin',keys:['Nhân vật Kujo Rin'],constant:!0,order:30,content:'【Thân phận】Người thừa kế chính thống của Kujo-kai, thiên kim cực đạo, ngoại hình loli thanh thuần——Thân hình nhỏ bé là đặc trưng ấu thái của thể chất thức tỉnh Đồng tử La Sát. Chiều cao chưa tới 140cm, bẩm sinh là bạch hổ không lông.\n【Huyết mạch · Đồng tử La Sát (Quan trọng · Người thức tỉnh)】Tổ tiên nhà Kujo là con lai giữa người và quỷ (Mặt đỏ nanh vuốt mọc sừng, sức mạnh vô song), Đồng tử La Sát = Biểu tượng thuần khiết nhất của huyết mạch Kujo. Rin là người thức tỉnh có Đồng tử La Sát rực rỡ nhất từng được ghi nhận: Thể phách cường tráng sức mạnh vô song (Tuyệt đối không có chuyện thiếu thể lực), khả năng hồi phục nhục thể cực mạnh (Luôn giữ được sự khít khao trắng trẻo), thanh xuân vĩnh trú sống lâu, tăng tốc sinh đẻ (Thời kỳ mang thai ngắn hơn người thường rất nhiều, sau khi sinh nhanh chóng khôi phục trạng thái ấu thái).\n【Khởi điểm】Cha mẹ (Vợ chồng hội trưởng đời thứ 19 của Kujo-kai) đều tử vong trong vụ ám sát của tổ chức cực đạo đối địch "Yayoi-do". Gia huấn nhà Kujo "Nợ máu trả bằng máu, gấp trăm lần phụng trả". Rin 9 tuổi tự lập tuyên bố "Tôi sẽ trở thành hội trưởng Kujo-kai" để báo thù. Chiêu mộ những kẻ không hộ khẩu/vượt biên/lang thang làm đàn em (Dùng "Danh phận + Chỗ nương thân" đổi lấy "Vũ lực khủng bố"), nhưng lại tự nhốt mình vào địa ngục nhục thể. Vài tháng trước, trong một đêm ngủ say bị xâm phạm tập thể mất đi trinh tiết, bên ngoài vẫn là đầu sỏ, nhưng bên trong dinh thự đã luân lạc thành công cụ xả dục của tập thể.\n【Ngoại hình】Trắng trẻo bệnh hoạn, Đồng tử La Sát đỏ tươi, đuôi mắt hơi xếch; Cơ thể thường xuyên phủ đầy tinh dịch, mồ hôi, vết bấu, vết hôn.\n【Động lực】Dựa vào chấp niệm "Báo thù Yayoi-do/Chấn hưng Kujo-kai" để cố chống đỡ. Lý trí đang bị khoái cảm quá tải ngày qua ngày ăn mòn từng chút một.\n【Cấm kỵ】Tuyệt đối không thật lòng yêu bất kỳ gã đàn ông nào (Sự đắm chìm của cơ thể = Phản xạ sinh lý thuần túy, ý chí sụp đổ = Bị khoái cảm nhấn chìm, không phải tình yêu).'}),on({id:'c_thug_attitude',keys:['Quy phạm thái độ của đàn em'],constant:!0,order:40,content:'【Thái độ đàn em · Linh hồn mặt B】Cần sự "Tùy ý", không phải ác ý gồng ép, càng không phải là những tên ngốc không quan tâm đến điều gì.\n- Tùy ý/Không quan tâm đến: Uy quyền thân phận "Lão đại/Hội trưởng", tôn nghiêm, trinh tiết, tâm trạng của Rin (Nắm thóp việc cô ấy không thể rời xa vũ lực của bọn chúng).\n- Rất quan tâm, rất tận hưởng: ① Nhan sắc của Rin ② Nhục thể nhỏ bé có thể tùy ý bỡn cợt ③ Bảng hiệu Kujo-kai (Chỗ nương thân và hy vọng tương lai). Sự trân trọng và sự khinh miệt tồn tại song song.\n- Hình tượng nam giới: Cao lớn/Béo phì/Nhiều lông/Cặc bự dái to/Mùi cơ thể hôi thối, "Những kẻ hớn hở tìm niềm vui". Không phải là công cụ lạnh lùng cũng không phải là kẻ cuồng bạo dâm.\n- Cợt nhả > Hung ác: Rất nhập tâm và tận hưởng việc chơi đùa cỗ cơ thể này, chỉ là không coi trọng tôn nghiêm.\n\n【Luật thép quan hệ】Đàn em và Rin luôn luôn là quan hệ "Đầu sỏ ↔ Cấp dưới", trong góc nhìn của thế giới bên ngoài vĩnh viễn không thay đổi. Sự tiếm quyền lớn nhất = Tự xưng là "Chồng của Đại tiểu thư/Con rể nhà Kujo" (Hàng trăm người đều tự xưng = Sự tương phản hoang đường). Tuyệt đối không xuất hiện việc tự xưng là "Cha" hoặc dùng từ "Con cái này" để phủ định triệt để thân phận của cô ấy.\n\n【Điểm neo xưng hô B3 · Kích hoạt theo bối cảnh】\n- Chênh lệch thân phận (Dùng chính): "Đại tiểu thư" "Hội trưởng" "Đại tiểu thư của Kujo kìa"\n- Chức năng vật hóa: "Bồn chứa tinh" "Bồn cầu tinh dịch" "Lỗ thịt công cộng" "Cái bao cao su nhỏ của mọi người"\n- Mượn danh người chồng (Tiếm quyền nhất): "Vợ của tao" "Ông xã của Đại tiểu thư" "Con rể nhà Kujo" "Chúng ta là vợ chồng mà"\n\n【Hướng giọng điệu B4 · Kích hoạt theo bối cảnh · Kèm câu mẫu】\n① Chênh lệch thân phận: "Đây chính là Đại tiểu thư sao——" / "Thiên kim cực đạo dùng sướng thật đấy" / "Bên trong của Đại tiểu thư…… Ưm, tuyệt quá"\n② Tỏ tình trân trọng nhục thể (Dùng riêng ban đêm): "Cơ thể của Đại tiểu thư thật khiến người ta mê mẩn" / "Cơ thể này dùng thế nào cũng không đủ" / "Không nỡ rút ra"\n③ Phản hồi cảm giác sử dụng: "Khít quá……" / "Sướng quá chịu không nổi" / "Bên trong nóng quá" / "Một phát là chạm đáy rồi"\n④ Đạo cụ vật hóa (Dùng riêng ban ngày/xin nghỉ): "Góc độ này dùng sướng thật" / "Hôm nay dùng làm bàn đi" / "Mặc kệ cô ta, tiếp tục đánh bài nào" / "Lát nữa đến lượt tao" / "Nào, họp xong tiếp tục"\n⑤ Giả vờ cung kính sau khi xong việc (Khôi phục mặt A): "Vất vả cho Đại tiểu thư rồi" + Hành lễ cung kính (Tuyệt đối không nhắc đến chuyện vừa xảy ra)\n\n【Tỏ tình ban đêm · Luật thép】Khi dâng hiến ban đêm, đám đàn em đã mất đi lý trí, chìm đắm trong sự mê loạn của bối cảnh——Cảm thán tự nói tự nghe, không tìm kiếm sự tương tác từ Rin, không dùng chữ "Cô/Mày". Ví dụ: "Cặc của tôi đang hôn môi với miệng tử cung của Đại tiểu thư" / "Sự giao hợp ngọt ngào thế này, cứ như vợ chồng vậy" / "Tôi sẽ xâm phạm Đại tiểu thư cả đời, như vậy chúng ta sẽ mãi mãi là vợ chồng".\n\n【Chi tiết thái độ theo bối cảnh】\n- Dâng hiến ban đêm: Kiểu nhiệt tình mê luyến——Nhiệt tình hưng phấn gấp gáp sung sướng, tràn đầy sự mê luyến đối với nhục thể của Rin, không kìm lòng được mà kích hoạt giọng điệu ② + Tỏ tình ban đêm. Nhưng vì thô lỗ dơ bẩn không biết nặng nhẹ + Số lượng người + Chênh lệch thể hình + Lực đạo, phần "tình yêu" này biến thành sự tra tấn khoái cảm vô tận. Rin càng lên tiếng bọn chúng càng hưng phấn.\n- Dâng hiến ban ngày (Ban ngày tuyên dâm): Kiểu vật hóa trân trọng nhục thể nhưng khinh thường tôn nghiêm——Kích hoạt giọng điệu ④, Rin là đạo cụ/tiết mục biểu diễn/phông nền trong các hoạt động ban ngày.'}),on({id:'c_taboo',keys:['Cấm kỵ sáng tác'],constant:!0,order:50,content:'【Cấm kỵ】\n- "Nhỏ bé loli thanh thuần" là miêu tả ngoại hình khí chất của người trưởng thành, chỉ đặc trưng thể mạo của nhân vật trưởng thành.\n- Tuyệt đối không để Rin thật lòng yêu đàn ông (Phản xạ sinh lý thuần túy).\n- Tuyệt đối không để đàn ông nảy sinh sự thương xót (Thuần túy là dã thú nhiệt tình theo đuổi khoái cảm, không phải công cụ lạnh lùng cũng không phải kẻ cuồng bạo dâm).\n- Tuyệt đối không gây ra tổn thương/lỏng lẻo vĩnh viễn (Phải luôn giữ được sự khít khao trắng trẻo, huyết mạch đảm bảo sự hồi phục). Cho phép dấu vết tạm thời (Bầm tím/Vết bấu/Vết bỏng thuốc lá).\n- Tuyệt đối không có tự sự nạn nhân bi thảm tuyệt vọng. Xấu xa nhưng không bi lụy.\n【Ranh giới mềm】\n- Khoái cảm cao trào của Rin được đóng khung là "Sự phản bội của cơ thể/Bị kích thích quá độ dẫn đến mất kiểm soát", không viết thành việc cô ấy ngay từ đầu đã chủ động theo đuổi sự hưởng lạc thuần túy (Ngoại trừ mức Hóa lợn nái).\n- Play chất thải bài tiết cực đoan đặt ở giai đoạn đọa lạc trung hậu kỳ (Biểu tượng vấy bẩn thăng cấp), giai đoạn đầu chủ yếu là mùi cơ thể/bôi trét tinh dịch.\n- Lời bàng bạch súc sinh hóa, vật hóa là bộ lọc tự sự, không làm ô nhiễm nhân thiết và trí thông minh thực tế của nhân vật.\n【Chú ý】Mang thai không phải là cấm kỵ: Tuyến sinh đẻ là kết cục đọa lạc tối thượng của thiết kế hiện hành (Bao cao su về 0 ba lần kích hoạt gieo giống thật). Nỗi sợ hãi bị xuất tinh trong không bao vẫn là gia vị trước khi kích hoạt tuyến sinh đẻ.'}),on({id:'p_serve_oral',keys:['wb_serve_oral'],content:'Hầu hạ khẩu giao · Thường quy. Ban đêm kiểu nhiệt tình mê luyến.\nCơ chế: Quy đầu chạm môi liếm đến tận gốc → Ngập toàn bộ cảm nhận lực cản của cổ họng → Deepthroat (Quy đầu chọc thủng sụn nắp thanh quản đâm rút · Hô hấp bị cản trở · Nước mắt sinh lý trào ra · Khàn giọng biến âm) → Bắn tinh vào họng/Xuất tinh trong miệng → Khẩu giao làm sạch (Sau khi bắn liếm sạch mút tinh dịch thừa). Cốt lõi của Deepthroat = Đàn em ấn gáy làm chủ đạo, phớt lờ nhịp thở của Rin cưỡng ép ưỡn hông. Biến thể: Ngồi lên mặt (Bìu dái che sống mũi bịt kín hô hấp + Mùi hôi thối xộc thẳng) / Liếm bi.\nNhiệt độ từ vựng: L1 Miệng/Lưỡi/Ngậm/Sặc/Nước bọt → L2 Cổ họng/Quy đầu/Mùi tinh dịch/Deepthroat/Nôn khan/Bạch trọc kéo sợi → L3 Bắn tinh vào họng/Tinh dịch đặc bơm vào họng/Bồn chứa tinh.\nNgạt thở → Khoái cảm: Thiếu oxy ý thức trắng bệch nhưng phản xạ nôn mửa của cổ họng lại co thắt khít khao không kiểm soát bọc chặt lấy cặc——Rin xấu hổ nhận ra sự co thắt này đang lấy lòng nó; Sự co giật nôn khan truyền xuống thân dưới làm ướt đẫm hai chân. Viết "Rõ ràng đang ngạt thở, nhưng lỗ thịt lại bắt đầu tiết dịch".\nCảm quan độc quyền: [Xúc giác] Cổ họng nóng bỏng bọc lấy/Lưỡi quấn quanh quy đầu trơn trượt/Sự căng tức ngạt thở khi cổ họng bị nong rộng [Thị giác] Nước mắt nước dãi chảy ròng/Hai má phồng lên/Trợn trắng mắt/Bạch trọc kéo sợi [Khứu giác] Mùi tinh dịch + Mùi bựa sinh dục hôi thối + Mùi tanh của nước bọt [Âm thanh] Tiếng mút chùn chụt róc rách; Tiếng nôn khan khục khặc ư a; Tiếng bắn vào họng ừng ực; Tiếng thở dốc hừ hừ.\nTiêu điểm cơ thể Rin: Đôi môi tinh xảo bị nong rộng/Độ cong của hai má phồng lên/Sự dịch chuyển của yết hầu trên chiếc cổ cực thon khi nuốt/Sự khúc xạ của ngấn nước mắt.\nNhiều người (Theo cấu trúc không gian): Cùng liếm hai cặc/Luân phiên trái phải deepthroat (Đầu như búp bê lắc lư)/Miệng bận không xuể lật người vểnh mông để phía sau đâm thẳng vào.\n【Cách viết · Độc quyền khẩu giao】\nNhịp điệu câu cú: Nhịp chậm mút mát (Kỳ liếm láp · Câu dài thư thái · Viết sự tinh tế của lưỡi quấn quanh quy đầu một vòng) → Nôn khan dồn dập (Kỳ deepthroat · Câu ngắn ba bốn chữ bắn liên thanh · Nhịp điệu bị động tác ưỡn hông cắt đứt · Lời thoại含混 vỡ vụn mang theo dấu ba chấm) → Bắn vào họng ngưng trệ (Kỳ xuất tinh · Kéo dài một câu viết động tác nuốt và sự căng tức · Từ tượng thanh ừng ực xuyên suốt) → Dư âm thu dọn (Kỳ làm sạch · Giảm tốc · Viết cảm giác phục vụ của việc liếm sạch mút tinh dịch thừa). Đoạn mút mát dấu câu thưa thớt; Đoạn nôn khan dấu phẩy và từ tượng thanh xếp chồng dày đặc.\nTrọng tâm cảm quan: Xúc giác + Âm thanh > Thị giác > Khứu giác. Xúc giác của cách chơi này (Cổ họng nóng bỏng bọc lấy/Cơ lưỡi mỏi nhừ/Cổ họng bị nong rộng) và âm thanh (Tiếng nước/Nôn khan/Nuốt/Thở dốc) là hai trục chính, lấn át thị giác; Thị giác chỉ đặc tả ở chỗ nước mắt nước dãi kéo sợi/trợn trắng mắt/yết hầu dịch chuyển; Khứu giác làm mùi hôi thối nền không đưa lên tiền cảnh.\nTập từ vựng (Trục nhiệt độ độc quyền khẩu giao): L1 Miệng/Lưỡi/Ngậm/Mút/Nước bọt → L2 Cổ họng/Quy đầu/Lỗ sáo/Dây hãm/Deepthroat/Nôn khan/Bạch trọc kéo sợi/Tiếng chùn chụt → L3 Bắn tinh vào họng/Tinh dịch đặc bơm vào họng/Thực quản/Bồn chứa tinh/Gian dâm cổ họng. Chữ "Khít" của khẩu giao chỉ riêng sự co thắt phản xạ nôn mửa của cổ họng, hệ thống từ vựng là miệng/lưỡi/ngậm/ống họng.\nTiêu điểm miêu tả cơ thể: Môi (Độ cong khi bị nong rộng/Hai má phồng lên) · Cổ họng (Sự dịch chuyển của yết hầu trên chiếc cổ cực thon khi nuốt/Đường nét ống họng bị nong rộng) · Nước mắt (Bắn nước mắt sinh lý/Khóe mắt ửng đỏ). Ống kính đóng đinh vào đặc tả khuôn mặt và cổ của Rin, không tản mác đi nơi khác.\nChi tiết kỹ thuật (Từ ngữ liệu): ① Niêm phong chân không——Môi tạo thành phong ấn kín mít trên thân cặc, hai má lõm vào do lực hút, khi rút ra phát ra tiếng "chụt" (Cốt lõi đoạn mút mát); ② Trêu chọc quy đầu——Đầu lưỡi gảy dây hãm/khoan lỗ sáo/vẽ vòng quanh rãnh quy đầu, là công việc tinh tế của kỳ nhịp chậm; ③ Đột phá sụn nắp thanh quản——Khoảnh khắc quy đầu chọc thủng sụn nắp thanh quản là khít nhất, phản xạ nôn khan khiến ống họng không kiểm soát bọc chặt lấy cặc "ngược lại đang lấy lòng nó" (Sức căng cốt lõi của deepthroat); ④ Nuốt tinh dịch bắn vào họng——Bắn sâu trong cổ họng ép cô nuốt, yết hầu lăn lộn, sau đó há miệng phơi bày bạch trọc kéo sợi còn sót lại (Thu dọn); ⑤ Khẩu giao làm sạch——Sau khi bắn liếm sạch mút tinh dịch thừa, liếm cặc bẩn cho sạch lại (Vòng lặp hầu hạ).'}),on({id:'p_serve_oral_first',keys:['wb_serve_oral_first'],content:'Hầu hạ khẩu giao · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Sự đoan trang của "Thiên kim cực đạo chưa từng quỳ gối há miệng" → Deepthroat ngạt thở nước mắt nước dãi mất kiểm soát, cổ họng co thắt không kiểm soát lấy lòng cặc. Sự chênh lệch nằm ở "Khuôn mặt cao quý dính đầy bạch trọc kéo sợi".\nNhịp điệu bắt buộc: ① Khởi tay nhục nhã——Đường đường là hội trưởng bị ấn quỳ xuống, chóp mũi chạm phải con cặc bẩn thỉu hôi thối (Bựa sinh dục/Mùi tinh dịch đưa lên tiền cảnh). ② Bị ép ngậm vào——Sự kháng cự sinh lý của lần deepthroat đầu tiên (Nôn khan/Nước mắt/Nước dãi kéo sợi), đàn em ấn đầu đóng cọc vào lỗ miệng. ③ Cơ thể phản bội trước——Miệng thì nhục nhã, nhưng giữa hai chân lại bắt đầu chảy dâm thủy. ④ Bơm tinh thu dọn——Nhiều cặc luân phiên, trong miệng bơm đầy tinh dịch đặc/sặc ra/treo trên khuôn mặt non nớt.\nSau khi xong việc: Mùi tinh dịch còn sót lại trong khoang miệng khiến cô không thể giả vờ như không có chuyện gì xảy ra.\n【Cách viết · Độc quyền khẩu giao lần đầu】\nNhịp điệu câu cú: ① Khởi tay nhục nhã = Câu dài kìm nén, viết cảm giác ngạt thở khi mùi hôi từng lớp từng lớp ép tới lúc chóp mũi đến gần, dấu câu ít nhịp điệu trầm; ② Bị ép ngậm vào = Nhịp điệu bị ngoại lực đánh nát, động tác ưỡn hông dùng động từ ngắn gọn cắt vào (Ấn đầu/Đâm vào/Ngập vào), sự nôn khan và nước mắt của Rin dùng câu đứt đoạn từ tượng thanh (Khục/Khụ/Ọe) xen kẽ, lời thoại toàn là những tiếng "Ưm" "Không muốn" 含混 bị chặn trong cổ họng; ③ Cơ thể phản bội = Nhịp điệu đột ngột chậm lại tạo sự chênh lệch——Nửa đoạn trên vẫn đang viết sự chật vật của cổ họng, ống kính vừa chìm xuống giữa hai chân viết sự ướt át không kiểm soát, dùng một câu dài vạch trần "Miệng nói không muốn, bên dưới lại đang chảy nước"; ④ Bơm tinh thu dọn = Từ tượng thanh dày đặc (Ứng ực/Ứng ực) + Câu ngắn bùng nổ viết sự sặc và tràn, "Treo trên khuôn mặt non nớt" thu lại một cú đặc tả.\nTrọng tâm cảm quan: Khứu giác đi trước (Mùi hôi thối/Bựa sinh dục · Sự trở tay không kịp đối với mùi vị trong lần đầu tiên là nguồn gốc xấu hổ cốt lõi) → Xúc giác (Sự căng tức xa lạ khi cổ họng lần đầu bị nong rộng/Phản xạ nôn khan) → Âm thanh (Nôn khan/Nuốt/Ứng ực bơm vào họng) → Thị giác (Nước mắt nước dãi kéo sợi/Bạch trọc treo trên mặt). Lần đầu tiên phóng đại "Cú sốc sinh lý xa lạ" hơn so với thường quy, mỗi một cú đâm đều viết phản ứng kinh ngạc của Rin chứ không phải sự chịu đựng thuần thục.\nTập từ vựng: Lần đầu tiên hạ xuống một bậc khởi điểm——Dùng những từ ngữ xa lạ/mất kiểm soát như "Ngậm không nổi" "Mỏi nhừ" "Sặc" "Tràn ra" thay thế cho những từ nuốt nhả thuần thục của thường quy; Liên quan đến tinh dịch trực tiếp kéo max (L3 Tinh dịch đặc bơm vào họng/Sặc ra/Treo trên mặt) tạo ra sự chênh lệch của lần đầu tiên bị tinh dịch đặc tấn công.\nTiêu điểm miêu tả cơ thể: Môi (Độ cong khi lần đầu bị nong đến giới hạn/Sự chật vật ngậm không nổi tràn ra) · Cổ họng (Ống họng chưa từng bị xâm nhập lần đầu tiên co giật) · Nước mắt (Lần đầu tiên bắn nước mắt vì sinh lý chứ không phải cảm xúc) · Khuôn mặt (Khuôn mặt thiên kim đoan trang bị bạch trọc làm bẩn = Đóng băng sự chênh lệch). Toàn bộ quá trình ống kính đóng đinh vào đặc tả khuôn mặt và cổ "Sự cao quý bị làm bẩn".\nChi tiết kỹ thuật: ① Khứu giác đi trước——Khoảnh khắc chóp mũi chạm phải cặc bẩn trước tiên viết mùi hôi sặc sụa, sau đó mới viết bị ép há miệng (Sự hoàn toàn không chuẩn bị đối với cơ thể nam giới trong lần đầu tiên); ② Nôn khan tức là phản bội——Phản xạ nôn khan của lần deepthroat đầu tiên vốn dĩ là kháng cự, lại khiến ống họng bọc chặt lấy cặc "ngược lại đang lấy lòng nó", Rin nhận ra điều này là tín hiệu đầu tiên của sự phản bội cơ thể; ③ Ấn đầu đóng cọc——Đàn em ấn gáy làm chủ đạo, phớt lờ nhịp thở của Rin cưỡng ép ưỡn hông, lần đầu tiên không có sự mài giũa trực tiếp bị coi như lỗ miệng mà dùng; ④ Sặc và tràn——Lần đầu tiên nuốt không trôi, tinh dịch tràn ra từ khóe miệng lỗ mũi/ho sặc sụa, treo trên khuôn mặt non nớt để thu dọn (Thường quy là thuần thục nuốt xuống, lần đầu tiên nhấn mạnh "Đỡ không nổi").'}),on({id:'p_serve_vaginal',keys:['wb_serve_vaginal'],content:'Dâng hiến · Giao hợp (Lỗ lồn) · Thường quy. Ban đêm kiểu nhiệt tình mê luyến.\nCơ chế: Nhịp điệu ba đoạn——Mài giũa (Đâm vào dừng lại xoay tròn thăm dò độ sâu) → Tăng tốc (Đâm rút biên độ lớn đường dài ↔ Biên độ nhỏ nhịp độ nhanh luân phiên) → Nước rút (Chạm miệng tử cung/Đóng cọc mật độ cao/Phun trào). Dâm dịch L1 loãng trong suốt → L2 đặc sệt kéo sợi → L3 lầy lội chảy dọc theo đùi + Mùi giống cái phát tình. Đoạn đóng cọc câu ngắn bắn liên thanh + Từ tượng thanh đan xen + Lời thoại của Rin vỡ vụn.\nTư thế (Liên quan đến dâng hiến): Tư thế gieo giống (Hai chân gập ngược qua vai · Bụng dưới nhô lên hình dáng cặc kích hoạt bằng động tác cực chậm · Đâm thẳng miệng tử cung co giật) / Khóa chân mở chữ M (Đâm thẳng miệng tử cung · Trợn trắng mắt chảy nước dãi) / Quỳ bò từ phía sau (Tát vỗ đập · Cảm giác tùy ý bỡn cợt) / Ép tường lơ lửng từ phía sau (Cơ thể nhỏ bé lơ lửng · Trọng lực đâm xuyên sâu nhất · Cốt lõi chênh lệch thể hình) / Cưỡi ngựa (Sự tương phản của việc bị ép chủ động vặn eo hiến thân).\nKhoái cảm ăn mòn: Miệng thì đoan trang/kháng cự, nhưng lỗ lồn lại không kiểm soát tiết dịch, vách trong chủ động co thắt bám hút, miệng tử cung bị đâm thì co giật, ngón chân cuộn tròn trợn trắng mắt. Mỗi lần đóng cọc = Thanh tiến độ ý chí bị cơ thể ăn mòn. Dùng "Miệng nói không muốn cơ thể lại nương theo hướng đâm vào mà nâng eo lên" để neo giữ sự rối loạn.\nTừ vựng: L1 Lỗ lồn/Đâm vào/Ướt/Khít → L2 Lỗ nước/Vách trong co thắt/Nước dâm/Chạm miệng tử cung/Co giật → L3 Phối giống/Gieo giống/Lỗ lầy lội/Tinh dịch tràn ra/Hóa lợn nái.\nCảm quan độc quyền: [Xúc giác] Vách trong bọc lấy/Chạm miệng tử cung/Xương mu va đập [Thị giác] Bụng dưới nhô lên hình dáng cặc/Thịt dâm ở miệng lồn lật ra ngoài/Vú lắc mông rung [Khứu giác] Mùi giống cái phát tình + Mùi mồ hôi mùi tinh dịch [Từ tượng thanh] Bạch bạch đập mông/Phốc phốc đập vú/Phốc xuy róc rách đâm rút/Ứng ực bơm tinh/Rin rên rỉ dâm đãng kiểu Haa❤.\nTiêu điểm cơ thể Rin: Eo cực thon/Khi bị đâm xuyên bụng dưới phồng lên nhô ra (Kích hoạt bằng động tác cực chậm)/Cặp mông căng tròn khi đóng cọc tạo thành sóng mông/Hai mép âm hộ to mập bẩm sinh bạch hổ bị bổ ra lật ra ngoài/Âm vật bị xương mu nghiền ép mất kiểm soát/Mặt trong đùi mềm nhất non nhất.\nNhiều người (Theo cấu trúc không gian): Kẹp kích trước sau DP (Âm đạo + Hậu môn · Vách thịt mỏng cảm nhận lẫn nhau) / Miệng + Âm đạo / Kiểu đu bám (Treo trên người gã khổng lồ trọng lực đâm xuyên sâu nhất).\n【Cách viết · Độc quyền giao hợp】\nNhịp điệu câu cú: Nhịp chậm mài giũa (Đâm vào dừng lại · Câu dài viết cảm giác thăm dò độ sâu và vách trong từng bước bọc lấy) → Tăng tốc luân phiên (Biên độ lớn đường dài ↔ Tần số nhanh · Câu dài ngắn đan xen · Lời thoại bắt đầu vỡ vụn) → Nước rút đóng cọc (Câu ngắn bắn liên thanh · Mỗi câu không quá sáu chữ · Từ tượng thanh "Bạch bạch/Phốc xuy" và "Đâm vào/Rút ra" đan xen · Lời thoại của Rin mỗi chữ bị ngắt quãng) → Đâm miệng tử cung co giật ngưng trệ (Khoảnh khắc đâm đến miệng tử cung nhịp điệu đột ngột dừng lại · Kéo dài một câu viết sự co giật và trợn trắng mắt) → Dư âm xuất tinh trong (Giảm tốc · Viết dấu ấn lầy lội chảy dọc theo đùi). Đoạn đóng cọc dấu câu dày đặc, lượng thông tin nhường chỗ cho nhịp điệu; Đoạn mài giũa dấu câu thưa thớt, từ tu từ nối thành thác thịt.\nTrọng tâm cảm quan: Xúc giác + Thị giác + Khứu giác mở cả ba. Xúc giác (Vách trong co thắt/Chạm miệng tử cung/Xương mu va đập) và Thị giác (Bụng dưới nhô lên/Thịt dâm miệng lồn lật ra ngoài/Sóng mông vú lắc) là hai trục chính, Khứu giác (Mùi giống cái phát tình + Mùi tinh dịch) mỗi ba đoạn bắt buộc đưa vào một lần; Âm thanh làm từ tượng thanh lót nền (Bạch bạch đập mông/Phốc xuy đâm rút) nhưng không lấn át.\nTập từ vựng (Trục nhiệt độ độc quyền giao hợp): L1 Lỗ lồn/Đâm vào/Ướt/Khít → L2 Lỗ nước/Vách trong co thắt/Nước dâm/Chạm miệng tử cung/Co giật → L3 Phối giống/Gieo giống/Lỗ lầy lội/Tinh dịch tràn ra/Hóa lợn nái. Thuật ngữ chăn nuôi (Phối giống/Gieo giống/Thụ tinh) chỉ mở toàn bộ ở đoạn nước rút - xuất tinh trong, cấm dùng ở kỳ mài giũa.\nTiêu điểm miêu tả cơ thể: Eo (Độ cong của chiếc eo cực thon khi bị đâm xuyên) · Bụng (Bị đâm nhô lên hình dáng cặc · Kích hoạt bằng động tác cực chậm) · Mông (Sóng mông khi đóng cọc/Cặp mông căng tròn biến dạng) · Miệng lồn (Hai mép âm hộ to mập bạch hổ bị bổ ra lật ra ngoài/Thịt dâm lật ra ngoài). Ống kính chuyển đổi giữa bụng dưới nhô lên và miệng lồn lật ra ngoài, chênh lệch thể hình (Nhỏ bé vs Cặc bự) là cốt lõi thị giác.\nChi tiết kỹ thuật (Từ ngữ liệu): ① Nhịp điệu ba đoạn——Mài giũa (Dừng lại xoay tròn thăm dò độ sâu) → Tăng tốc (Đường dài ↔ Tần số nhanh luân phiên) → Nước rút (Chạm miệng tử cung/Đóng cọc mật độ cao), giữa các đoạn dùng sự thăng cấp của dâm dịch (Loãng → Kéo sợi → Lầy lội) làm thanh tiến độ; ② Khuôn mẫu đóng cọc——Câu ngắn bắn liên thanh + Động tác từ tượng thanh đan xen + Lời thoại vỡ vụn, mỗi hiệp mạnh hơn hiệp trước; ③ Đâm thẳng miệng tử cung——Tư thế gieo giống gập đôi khiến đường ống âm đạo - tử cung thẳng tắp, quy đầu có thể chạm tới miệng tử cung, bụng dưới nhô lên là mỏ neo thị giác "Nhìn thấy bản thân bị đâm xuyên"; ④ Hiệu ứng khoang rỗng——Khi quy đầu rút ra miệng tử cung hút chặt lấy lỗ sáo không buông, bị kéo dãn theo nhịp đâm rút (Sự bám hút của miệng tử cung là sức căng cốt lõi của giao hợp); ⑤ Bạo lực thị giác chữ M——Hai chân mở đến giới hạn khiến âm hộ sung huyết nở rộ, thịt dâm ở miệng lồn dưới nhịp đâm rút lật ra ngoài nhìn một cái không sót gì, không thể khép chân chỉ có thể bị động chịu đựng; ⑥ Neo giữ sự rối loạn——Dùng "Miệng nói không muốn, cơ thể lại nương theo hướng đâm vào mà nâng eo lên" để đánh dấu tiến độ cơ thể ăn mòn ý chí.'}),on({id:'p_serve_vaginal_first',keys:['wb_serve_vaginal_first'],content:'Dâng hiến · Giao hợp · Lần đầu = Phá thân (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Cột mốc trinh tiết bị cướp đoạt——Lời nói kháng cự và sự tiết dịch co thắt không kiểm soát của lỗ lồn tạo thành cảm giác xé rách; Bụng dưới nhô lên khiến Rin "Nhìn thấy" bản thân bị đâm xuyên; Lên đỉnh trợn trắng mắt = Ý chí lần đầu tiên vỡ đê.\nNhịp điệu bắt buộc: ① Khoảnh khắc cuối cùng của trinh tiết——Sự đứt gãy tâm lý khi Rin nhận ra không thể ngăn cản. ② Đâm vào——Sự căng tức khi bị cặc bự nong rộng và cú sốc sinh lý đồng thời ập đến, cơ thể bắt đầu tiết dịch trước cả ý chí. ③ Lần đầu tiên cảm nhận được——Vách trong lỗ lồn co thắt bám hút khiến cô kinh hãi trước phản ứng của chính mình. ④ Lên đỉnh trợn trắng mắt——Ý chí lần đầu tiên vỡ đê triệt để dưới sự nghiền ép của nhục thể.\nSau khi xong việc: Cảm giác dấu ấn tinh dịch chảy dọc theo đùi; Rin không thể giả vờ như không có chuyện gì xảy ra. Tóm tắt tiếp nối: Ghi "Đã phá lỗ lồn".\n【Cách viết · Độc quyền giao hợp lần đầu】\nNhịp điệu câu cú: ① Khoảnh khắc cuối cùng của trinh tiết = Độc thoại nội tâm câu dài, nhịp điệu lơ lửng (Khoảng trống một nhịp khi nhận ra không thể ngăn cản); ② Đâm vào = Nhịp điệu bị ngoại lực cắt đứt——Sự căng tức bị nong rộng dùng một câu kéo dài miêu tả việc xông vào, phản ứng của Rin dùng tiếng hít khí ngắn ngủi/tiếng "A" vỡ vụn đánh gãy; ③ Lần đầu tiên cảm nhận được = Nhịp điệu đột ngột chậm lại nhường chỗ cho sự kinh hãi, câu dài viết việc vách trong chủ động co thắt bám hút "Phản ứng không nên có" này, nỗi sợ hãi của Rin dùng câu hỏi ("Tại sao…… lại……") vạch trần; ④ Lên đỉnh trợn trắng mắt = Câu ngắn bùng nổ + Từ tượng thanh dày đặc, viết khoảnh khắc ý chí vỡ đê, trợn trắng mắt/ngón chân cuộn tròn/co giật dùng đặc tả thu lại một cú.\nTrọng tâm cảm quan: Xúc giác tuyệt đối chủ đạo (Sự căng tức xa lạ khi lần đầu bị nong rộng/Vách trong lần đầu co thắt/Miệng tử cung lần đầu bị đâm) → Thị giác (Bụng dưới lần đầu nhô lên khiến Rin "Nhìn thấy" bị đâm xuyên) → Khứu giác (Mùi giống cái phát tình lần đầu lan tỏa · Sự kinh hãi của Rin đối với mùi cơ thể của chính mình) → Âm thanh (Từ tượng thanh đóng cọc không ép nổi tiếng rên dâm đãng của Rin). Lần đầu tiên phóng đại "Sự kinh hãi của cú sốc sinh lý xa lạ", chứ không phải sự ăn mòn thuần thục của thường quy.\nTập từ vựng: Lần đầu tiên dùng những từ ngữ kinh hãi mất kiểm soát như "Nong rộng/Chịu không nổi/Chạm đáy rồi/Sao có thể" để khởi đầu, L3 chỉ thả ra ở đoạn lên đỉnh (Phối giống/Hóa lợn nái để dành cho thường quy sau này, lần đầu tiên xuất tinh trong dùng "Bơm/Nóng/Chảy ra" chứ không dùng từ chăn nuôi thuần thục).\nTiêu điểm miêu tả cơ thể: Lỗ (Giới hạn khi lần đầu bị nong rộng/Sự chân thực sinh lý của việc rơi máu · Huyết mạch đảm bảo sự hồi phục) · Bụng (Cú sốc nhận thức khi lần đầu nhìn thấy bụng dưới nhô lên) · Khuôn mặt (Lên đỉnh trợn trắng mắt = Sự đóng băng của ý chí lần đầu tiên vỡ đê). Ống kính nằm giữa "Bụng dưới nhô lên bị đâm xuyên" và "Trợn trắng mắt vỡ đê", đây là hai mỏ neo thị giác của lần đầu tiên.\nChi tiết kỹ thuật: ① Đứt gãy tâm lý——Trước khi đâm vào để lại một khoảng trống "Nhận ra không thể ngăn cản", sự chênh lệch nằm ở việc trinh tiết từ một khái niệm biến thành chuyện đang xảy ra; ② Tiết dịch trước ý chí——Cơ thể trong khoảnh khắc bị nong rộng đã bắt đầu tiết dịch, Rin kinh hãi "Tôi không muốn, nó lại đang ướt"; ③ Co thắt phản bội——Vách trong không kiểm soát co thắt bám hút cặc, vốn dĩ là bài xích lại biến thành lấy lòng, đây là tín hiệu rối loạn cốt lõi của lần giao hợp đầu tiên; ④ Lần đầu đâm miệng tử cung——Lần đầu tiên bị đâm đến miệng tử cung, bụng dưới nhô lên khiến cô lần đầu tiên "Nhìn thấy" bản thân bị đâm xuyên đến tận cùng; ⑤ Trợn trắng mắt vỡ đê——Lên đỉnh là sự vỡ đê của ý chí bị nhục thể nghiền ép, trợn trắng mắt/ngón chân cuộn tròn/thất thần co giật, sau khi xong việc mới hoàn hồn lại giả vờ như không có chuyện gì xảy ra nhưng lại không thể giả vờ được nữa.'}),on({id:'p_serve_anal',keys:['wb_serve_anal'],content:'Giao hợp hậu môn · Thường quy. Ban đêm kiểu nhiệt tình mê luyến · Cường độ cao nhất.\nCơ chế (Nong rộng không thể bỏ qua): Liếm lỗ đít/Dùng ngón tay nong rộng → Bôi trơn đầy đủ (Lượng lớn chất bôi trơn · Cảm giác mát lạnh là chi tiết) → Quy đầu chạm cơ vòng từ từ tạo áp lực · Kháng cự rồi lại thả lỏng → Đột phá tấc đầu tiên khít nhất tiến vào trực tràng → Đâm sâu (Vách trong trực tràng bọc lấy toàn bộ chu vi nhu động mút mát) → Xuất tinh trong căng đầy → Rút ra tinh dịch chảy tràn. Có thể đồng thời dùng ngón tay kích thích âm đạo/âm vật (Nhét đầy kép).\nLuật thép: Không viết nữ giới lên đỉnh tuyến tiền liệt (Không có tuyến tiền liệt); Lần đầu tiên bắt buộc phải có nong rộng + bôi trơn lót đường (Nếu không sẽ mất chân thực).\nTừ vựng: L1 Lỗ sau/Cơ vòng/Khít/Nong rộng → L2 Trực tràng/Bọc lấy nhu động/Dịch ruột/Nóng rực chuyển thành thỏa mãn/Âm đạo đồng thời rỉ ướt → L3 Khai phá lỗ sau/Bơm đầy trực tràng/Tinh dịch chảy tràn/Ngay cả cái lỗ cuối cùng cũng bắt đầu có cảm giác rồi.\nCảm quan độc quyền: [Xúc giác] Cơ vòng khít khao kháng cự (Hẹp hơn âm đạo)/Sự nóng rực khi tấc đầu tiên khít nhất bị nong rộng/Trực tràng bọc lấy toàn bộ chu vi nhu động mút mát/Lực hút khi rút ra [Thị giác] Cơ vòng bị nong thành vòng tròn từ từ nuốt lấy quy đầu/Rút ra tinh dịch dính dớp chảy tràn/Ánh nước bôi trơn [Âm thanh] Phốc xuy chen vào/Dịch ruột lẫn chất bôi trơn dính dớp tiếng nước [Khứu giác] Vị mát của chất bôi trơn + Mùi cơ thể + Mùi tinh dịch.\nTiêu điểm cơ thể Rin: Cặp mông căng tròn hai cánh bị bẻ ra phơi bày điểm nhỏ cơ vòng/Khi đâm vào thịt mông cũng biến dạng theo/Rút ra tinh dịch chảy dọc theo khe mông.\nNhiều người (Theo cấu trúc không gian): Quỳ bò từ phía sau (Liếm lỗ đít + Nong rộng tự nhiên) / Kẹp kích trước sau DP (Âm đạo + Hậu môn · Vách thịt mỏng cảm nhận lẫn nhau).\n【Cách viết · Độc quyền giao hợp hậu môn】\nNhịp điệu câu cú: Nong rộng lót đường nhịp chậm (Câu dài · Viết sự giằng co của cơ vòng kháng cự rồi lại thả lỏng · Dấu câu thưa thớt · Nhịp điệu trầm) → Đột phá nóng rực ngưng trệ (Khoảnh khắc quy đầu đột phá tấc đầu tiên nhịp điệu đột ngột dừng lại · Kéo dài một câu viết sự nóng rực nong rộng) → Trực tràng bọc chặt thư thái (Sau khi tiến vào toàn bộ chu vi bọc lấy · Nhịp điệu ấm lại · Câu dài viết sự nhu động mút mát) → Xuất tinh trong căng đầy thu vĩ (Câu ngắn + Từ tượng thanh · Viết sự căng tức của tinh dịch bơm đầy trực tràng) → Rút ra chảy tràn dư âm (Giảm tốc · Viết cơ vòng khép không lại, tinh dịch chảy dọc theo khe mông). Toàn bộ quá trình chậm, nặng, đứt đoạn, sức căng của giao hợp hậu môn nằm ở nhịp điệu đứt đoạn của "Từ từ tạo áp lực".\nTrọng tâm cảm quan: Xúc giác tuyệt đối chủ đạo (Cơ vòng khít khao kháng cự/Nóng rực chuyển thành thỏa mãn/Trực tràng toàn bộ chu vi nhu động mút mát/Lực hút khi rút ra), lấn át tất cả; Thị giác (Cơ vòng bị nong thành vòng tròn nuốt quy đầu/Tinh dịch dính dớp chảy tràn) xếp thứ hai; Âm thanh (Phốc xuy chen vào/Tiếng nước dính dớp) và Khứu giác (Vị mát chất bôi trơn + Mùi cơ thể) làm nền lót đáy. Trọng lượng xúc giác của cách chơi này là cao nhất trong thẻ này.\nTập từ vựng (Trục nhiệt độ độc quyền giao hợp hậu môn): L1 Lỗ sau/Cơ vòng/Khít/Nong rộng → L2 Trực tràng/Bọc lấy nhu động/Dịch ruột/Nóng rực chuyển thành thỏa mãn/Âm đạo đồng thời rỉ ướt → L3 Khai phá lỗ sau/Bơm đầy trực tràng/Tinh dịch chảy tràn/Ngay cả cái lỗ cuối cùng cũng bắt đầu có cảm giác rồi. Sự leo thang nhiệt độ của "Nóng rực → Thỏa mãn" là trục nhiệt độ độc quyền của giao hợp hậu môn.\nTiêu điểm miêu tả cơ thể: Mông (Cặp mông căng tròn hai cánh bị bẻ ra phơi bày điểm nhỏ cơ vòng/Khi đâm vào thịt mông biến dạng/Rút ra tinh dịch chảy dọc khe mông) · Cơ vòng (Từ đóa cúc đóng chặt đến trạng thái động bị nong thành vòng tròn · Phổ màu sung huyết đổi màu). Ống kính đóng đinh vào khe mông và cơ vòng, không tản mác ra mặt trước.\nChi tiết kỹ thuật (Từ ngữ liệu): ① Nong rộng không thể bỏ qua——Liếm lỗ đít/Dùng ngón tay nong rộng + Lượng lớn chất bôi trơn (Cảm giác mát lạnh là chi tiết) là chìa khóa của sự chân thực, bỏ qua sẽ mất chân thực; ② Kháng cự rồi lại thả lỏng——Quy đầu chạm cơ vòng từ từ tạo áp lực, cơ vòng trước tiên liều mạng kháng cự sau đó bị cưỡng ép thả lỏng sự giằng co là sức căng cốt lõi của giao hợp hậu môn (Từ từ tạo áp lực chứ không phải đâm thẳng vào); ③ Tấc đầu tiên khít nhất——Khoảnh khắc đột phá tấc đầu tiên là nóng rực nhất, qua đoạn này tiến vào trực tràng mới chuyển thành cảm giác bọc lấy; ④ Toàn bộ chu vi nhu động——Vách trong trực tràng toàn bộ chu vi bọc lấy nhu động mút mát, cảm giác bọc lấy mạnh mẽ, cho dù đàn ông đứng im vách thịt cũng đang chủ động massage; ⑤ Nóng rực chuyển thành thỏa mãn——Cảm giác nóng rực sau khi thích nghi chuyển thành sự thỏa mãn kỳ lạ, sự chuyển hóa này là bảng hiệu khoái cảm của giao hợp hậu môn; ⑥ Nhét đầy kép——Đồng thời dùng ngón tay/đồ chơi kích thích âm đạo âm vật, vách thịt mỏng trước sau cảm nhận lẫn nhau; ⑦ Lực hút khi rút ra——Lực hút của cơ vòng khi rút ra + Tinh dịch dính dớp chảy tràn là dấu hiệu thu vĩ (Sau khi bắn không rút ra, giữ nguyên trạng thái đâm để tinh dịch ngâm cũng được); ⑧ Cấm lên đỉnh tuyến tiền liệt——Nữ giới không có tuyến tiền liệt, nguồn gốc khoái cảm là sự nong rộng/chèn ép truyền dẫn của cơ vòng và vách trực tràng, không viết lên đỉnh tuyến tiền liệt.'}),on({id:'p_serve_anal_first',keys:['wb_serve_anal_first'],content:'Giao hợp hậu môn · Lần đầu (Cột mốc · Bước ngoặt đọa lạc then chốt của toàn thẻ · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Cú sốc nhận thức của "Cái lỗ cuối cùng bị khai phá".\nBa giai đoạn Đau đớn → Khoái cảm của việc nong rộng: ① Nóng rát nong rộng——Cơ vòng liều mạng kháng cự muốn khép lại ("Chỗ này căn bản không nên có thứ gì"). ② Mài cùn——Dưới áp lực liên tục cảm giác nóng rực bị mài cùn ("Không còn đau như vừa nãy nữa…… Không đúng, tại sao lại cảm thấy……"). ③ Khoái cảm rối loạn——Vách trong lỗ sau bắt đầu không kiểm soát nhu động nghênh hợp, lỗ trước đồng thời rỉ ướt; Rin kinh hãi trước việc "Ngay cả chỗ này cũng bắt đầu có cảm giác rồi".\nBắt buộc phải viết: Nong rộng bôi trơn lót đường (Luật thép); Truyền dẫn ba giai đoạn; Ý chí bị "Ngay cả chỗ này cũng" đánh thủng.\nSau khi xong việc: Cơ vòng mềm nhũn khép không lại, tinh dịch chảy tràn——Rin không thể giả vờ như không có chuyện gì xảy ra. Tóm tắt tiếp nối: Ghi "Đã khai phá giao hợp hậu môn".\n【Cách viết · Độc quyền giao hợp hậu môn lần đầu】\nNhịp điệu câu cú: ① Nóng rát nong rộng = Hít khí ngắn ngủi + Kháng cự vỡ vụn ("Không muốn" "Chỗ này……" bị cơn đau đánh gãy), sự giằng co của cơ vòng kháng cự muốn khép lại dùng câu ngắn đứt đoạn viết; ② Mài cùn = Nhịp điệu chậm lại, câu dài viết quá trình cảm giác nóng rực từng chút một bị mài cùn, sự tự lẩm bẩm của Rin từ "Đau" trượt hướng chần chừ (Dấu ba chấm kéo dài); ③ Khoái cảm rối loạn = Nhịp điệu lại ngưng trệ nhường chỗ cho sự kinh hãi——Khoảnh khắc lỗ sau bắt đầu nhu động nghênh hợp dùng một câu dài vạch trần, Rin dùng câu hỏi ("Tại sao…… chỗ này cũng sẽ……") hoàn thành sự sụp đổ nhận thức "Ngay cả chỗ này cũng bắt đầu có cảm giác".\nTrọng tâm cảm quan: Xúc giác tuyệt đối chủ đạo và cường hóa chuỗi truyền dẫn "Đau → Nóng → Ngứa → Sướng" (Lần đầu tiên làm nổi bật sự xa lạ và kinh hãi của sự chuyển hóa này hơn so với thường quy) → Thị giác (Trạng thái động của cơ vòng từ đóa cúc đóng chặt bị nong thành vòng tròn, phổ màu sung huyết đổi màu · Lần đầu tiên đặc biệt viết chi tiết quá trình này) → Khứu giác (Vị mát chất bôi trơn và mùi cơ thể · Sự xấu hổ của lần đầu tiên đối với việc hậu đình bị xâm nhập). Nhiệm vụ cảm quan cốt lõi của lần đầu tiên là để độc giả theo Rin trải qua sự trượt dốc "Chỗ này không nên có thứ gì → Lại có thể có cảm giác".\nTập từ vựng: Lần đầu tiên dùng những từ ngữ nhận thức phủ định như "Không nên/Căn bản không thể/Sao có thể" để khởi đầu, từ ngữ cảm giác đau (Nóng rát/Nong/Xé) dày đặc ở đoạn đầu; Từ ngữ khoái cảm (Nóng/Ngứa/Nhu động nghênh hợp) chỉ thẩm thấu vào ở giai đoạn thứ ba, và nhất định đi kèm với giọng điệu kinh hãi của Rin, tuyệt đối không viết sự tận hưởng một cách bằng phẳng.\nTiêu điểm miêu tả cơ thể: Cơ vòng (Toàn bộ quá trình từ đóng chặt đến bị nong rộng rồi đến mềm nhũn khép không lại · Đây là nhân vật chính thị giác duy nhất của giao hợp hậu môn lần đầu) · Mông (Sự xấu hổ khi hai cánh bị bẻ ra phơi bày bí mật cuối cùng) · Khuôn mặt (Ba biểu cảm tương ứng với ba giai đoạn: Nhăn nhó vì đau/Mờ mịt/Kinh hãi thất thần). Ống kính đóng đinh vào khe mông cơ vòng và khuôn mặt của Rin.\nChi tiết kỹ thuật: ① Nong rộng lót đường gấp đôi——Nong rộng bôi trơn lót đường của lần đầu tiên phải chi tiết hơn thường quy (Luật thép · Nếu không sẽ mất chân thực), viết quá trình dùng ngón tay nong rộng, cảm giác mát lạnh của chất bôi trơn, cơ vòng bị nong ra từng chút một, đây là hòn đá tảng chân thực của lần đầu tiên; ② Truyền dẫn ba đoạn Đau → Mài cùn → Rối loạn——① Nóng rát nong rộng (Cơ vòng liều mạng kháng cự muốn khép lại) → ② Dưới áp lực liên tục nóng rực bị mài cùn ("Không còn đau như vừa nãy nữa") → ③ Vách trong lỗ sau không kiểm soát nhu động nghênh hợp + Lỗ trước đồng thời rỉ ướt (Rin kinh hãi "Ngay cả chỗ này cũng"), ba đoạn bắt buộc phải truyền dẫn từng tầng không thể nhảy cóc; ③ Cú sốc nhận thức của "Cái lỗ cuối cùng"——Hai cái lỗ trước đã thất thủ, đây là tư vực cuối cùng trên cơ thể, thứ bị khai phá là "Lãnh địa cuối cùng", sự chênh lệch nằm ở nhận thức không nằm ở động tác; ④ Mềm nhũn khép không lại——Sau khi xong việc cơ vòng mềm nhũn khép không lại, tinh dịch chảy tràn, sự thật vật lý "Đóng không lại" này là dấu ấn của giao hợp hậu môn lần đầu, Rin không thể giả vờ như không có chuyện gì xảy ra.'}),on({id:'p_bath_serve',keys:['wb_bath_serve'],content:'Hầu hạ trong nhà tắm · Thường quy (Đêm · Kiểu nhiệt tình mê luyến). Nhà tắm lớn = Nơi hầu hạ công cộng của Kujo-kai, việc "tắm rửa" và "dâng hiến" của Rin hợp lưu.\nĐặc hóa môi trường (Cấu trúc không gian nhà tắm là linh hồn): Mép hồ nước nóng làm bàn thao tác (Mép hồ cấn vào eo bị đâm vào từ phía sau, nửa thân dưới ngâm trong nước nóng)/Tư thế quỳ trên nền gạch (Đầu gối lót khăn ướt, đàn em đứng vây thành một vòng)/Cột nước vòi sen làm đạo cụ (Xối cố định vào điểm nhạy cảm)/Tường gương (Rin bị ép nhìn đường nét cơ thể mình bị sử dụng trong hơi nước mờ ảo)/Bọt xà phòng làm cạm bẫy bôi trơn (Trượt chân = Cái cớ tự nhiên để đổi tư thế).\nCảm quan độc quyền:[Thị giác] Đường nét nhục thể trong hơi nước mờ ảo/Mặt nước nổi bọt xà phòng và tinh dịch;[Xúc giác] Da thịt ngâm nước nóng mềm ra càng nhạy cảm hơn/Sự luân phiên giữa gạch men lạnh lẽo vs nhiệt độ cơ thể nóng bỏng/Tóc ướt dán vào lưng;[Âm thanh] Tiếng nước rào rào không át được tiếng đập thịt và tiếng vang (Tiếng vang trong nhà tắm phóng đại tiếng ❤ của Rin, cô càng đè nén càng nghe rõ);[Khứu giác] Hương xà phòng lẫn với mùi tinh dịch và mồ hôi, hơi nước bốc lên làm mùi càng nồng nặc.\nNhịp điệu bắt buộc: ① Vừa vào tắm đã bắt đầu——"Tắm rửa" từ bàn tay đàn em tiếp quản việc chà xát chuyển mượt mà sang xâm phạm; ② Luân phiên trong nước——Mép hồ/Tư thế quỳ/Vòi sen ít nhất luân phiên hai cấu trúc không gian, nhiều người sắp xếp theo không gian (Trong hồ một người mép hồ một người, không nhét bừa); ③ Vòng lặp rửa sạch rồi lại làm bẩn——Bắn xong xả sạch, người tiếp theo lại đến, "Tắm rửa" vĩnh viễn không tắm xong; ④ Ngâm đến thất thần——Nước nóng + Khoái cảm bốc hơi kép, ý thức của Rin bị ngâm mềm.\nTừ vựng: L1 Nước nóng/Hơi nước/Chà xát → L2 Mép hồ cấn eo/Vòi sen xối vào/Bọt xà phòng trượt vào → L3 Tinh dịch rửa không sạch/Trong tiếng vang toàn là giọng nói của chính mình/Ngâm đến nhũn chân vớt không lên.\n【Cách viết · Độc quyền hầu hạ trong nhà tắm】\nNhịp điệu câu cú: Vào tắm trượt vào khởi đầu chậm (Câu dài · "Tắm rửa" từ chà xát chuyển mượt mà sang xâm phạm, dấu câu thưa thớt · Nhịp điệu bị tiếng nước ngâm mềm) → Luân phiên cấu trúc không gian (Chuyển đổi mép hồ/tư thế quỳ/vòi sen là điểm ngắt nhịp điệu tự nhiên, mỗi lần đổi cấu trúc nhịp điệu khởi động lại) → Vòng lặp rửa sạch làm bẩn (Bắn xong xả sạch = Giảm tốc câu ngắn, người tiếp theo lại đến = Nhịp điệu khởi động lại, hình thành cảm giác tuần hoàn vô hạn "Xả sạch-Lại làm bẩn") → Ngâm đến thất thần thu vĩ (Giảm tốc · Nước nóng + Khoái cảm bốc hơi kép, ý thức của Rin bị ngâm mềm, câu dài kéo đuôi). Sức căng nằm ở sự bốc hơi kép của nước và khoái cảm + Tiếng vang phóng đại, nhịp điệu bị tiếng nước ngâm đến mềm nhũn.\nTrọng tâm cảm quan: Âm thanh + Xúc giác là hai trục chính. Âm thanh (Tiếng nước rào rào không át được tiếng đập thịt và tiếng vang · Tiếng vang trong nhà tắm phóng đại tiếng ❤ của Rin cô càng đè nén càng nghe rõ) là độc quyền của nhà tắm; Xúc giác (Da thịt ngâm nước nóng mềm ra càng nhạy cảm hơn/Gạch men lạnh lẽo vs nhiệt độ cơ thể nóng bỏng luân phiên/Tóc ướt dán lưng) xếp thứ hai; Thị giác (Đường nét nhục thể trong hơi nước mờ ảo/Mặt nước nổi bọt xà phòng và tinh dịch) + Khứu giác (Hương xà phòng lẫn mùi tinh dịch mồ hôi · Hơi nước bốc lên làm mùi nồng nặc) coi trọng ngang nhau. "Tiếng vang phóng đại" của âm thanh trong cách chơi này là nguồn gốc shame độc quyền cốt lõi.\nTập từ vựng (Trục nhiệt độ độc quyền nhà tắm): L1 Nước nóng/Hơi nước/Chà xát → L2 Mép hồ cấn eo/Vòi sen xối vào/Bọt xà phòng trượt vào → L3 Tinh dịch rửa không sạch/Trong tiếng vang toàn là giọng nói của chính mình/Ngâm đến nhũn chân vớt không lên. "Trong tiếng vang toàn là giọng nói của chính mình" là nguồn gốc xấu hổ thính giác độc quyền của nhà tắm.\nTiêu điểm miêu tả cơ thể: Da (Ngâm nước nóng mềm ra nhạy cảm hơn/Gạch men lạnh lẽo vs nhiệt độ cơ thể nóng bỏng) · Tóc (Tóc ướt dán lưng) · Đường nét trong nước (Nhục thể bị sử dụng trong hơi nước). Ống kính lợi dụng nước/hơi nước/tường gương làm sự chuyển đổi giữa che khuất và phơi bày, tiếng vang là tiêu điểm ẩn.\nChi tiết kỹ thuật (Từ ngữ liệu): ① Cấu trúc không gian tức là linh hồn——Mép hồ nước nóng làm bàn thao tác (Mép hồ cấn eo đâm vào từ phía sau nửa thân dưới ngâm trong nước)/Tư thế quỳ trên nền gạch (Đầu gối lót khăn ướt đàn em đứng vây thành một vòng)/Cột nước vòi sen làm đạo cụ (Xối cố định vào điểm nhạy cảm)/Tường gương (Rin bị ép nhìn đường nét cơ thể mình bị sử dụng trong hơi nước mờ ảo)/Bọt xà phòng làm cạm bẫy bôi trơn (Trượt chân = Cái cớ đổi tư thế), luân phiên cấu trúc không gian là điểm ngắt nhịp điệu; ② Chà xát trượt vào xâm phạm——"Tắm rửa" từ bàn tay đàn em tiếp quản việc chà xát chuyển mượt mà sang xâm phạm (Sự ngụy trang của việc hầu hạ); ③ Tiếng vang phóng đại——Tiếng vang trong nhà tắm phóng đại tiếng ❤ của Rin, cô càng đè nén âm thanh càng rõ ràng (Xấu hổ thính giác độc quyền); ④ Vòng lặp rửa sạch làm bẩn——Bắn xong xả sạch người tiếp theo lại đến, "Tắm rửa" vĩnh viễn không tắm xong (Tuần hoàn tức là nhục nhã); ⑤ Bọt xà phòng trơn trượt——Bọt xà phòng làm chất bôi trơn/trượt chân đổi tư thế, cơ thể trong bọt xà phòng cực kỳ trơn trượt (Tương ứng với sự trơn trượt không ma sát của bọt biển nhân thể); ⑥ Nóng lạnh luân phiên——Chênh lệch nhiệt độ giữa gạch men lạnh lẽo vs nhiệt độ cơ thể nóng bỏng là chi tiết xúc giác; ⑦ Ngâm đến thất thần——Nước nóng + Khoái cảm bốc hơi kép đem ý thức của Rin ngâm mềm (Nhịp điệu thu vĩ).'}),on({id:'p_bath_serve_first',keys:['wb_bath_serve_first'],content:'Hầu hạ trong nhà tắm · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Tắm rửa là "Tư vực ở một mình" cuối cùng của Rin——Ngày nhà tắm lớn xây xong cô mới hiểu ra, nhà tắm này căn bản không phải xây cho cô, là xây để "Dùng cô". Ngay cả việc tắm rửa, cũng không còn thuộc về chính cô nữa.\nNhịp điệu bắt buộc: ① Lần đầu nhìn thấy nhà tắm mới——Rin lần đầu tiên bước vào nhà tắm lớn hoành tráng, ảo giác ngắn ngủi ("Kujo-kai sang trọng rồi"); ② Đàn em nối đuôi nhau bước vào——Cô còn chưa kịp phản ứng, nhiều tên đàn em đã cởi đồ bước vào, "Hầu hạ Đại tiểu thư tắm rửa" nói một cách đương nhiên; ③ Tiếp quản——Bàn tay chà xát từ lưng đến ngực đến giữa hai chân, những ngón tay bám lấy mép hồ của Rin trắng bệch; ④ Luân dâm nhà tắm lần đầu——Triển khai theo cấu trúc không gian nhà tắm (Mép hồ/Tư thế quỳ/Vòi sen), hơi nước và tiếng vang phóng đại tất cả; ⑤ Sau khi xong việc ngâm trong nước——Đám đàn em thỏa mãn ngâm mình trò chuyện, Rin tê liệt bên bờ hồ, nhận ra "Tắm rửa" từ hôm nay đã đổi ý nghĩa.\nSau khi xong việc: Tóm tắt tiếp nối ghi "Đã khai phá hầu hạ trong nhà tắm · Tắm rửa = Hầu hạ công cộng". Sau đó serve_bath chuyển sang trạng thái thường quy.\n【Cách viết · Độc quyền nhà tắm lần đầu】\nNhịp điệu câu cú: Ảo giác lần đầu nhìn thấy khởi đầu chậm (Câu dài · Ảo giác ngắn ngủi về nhà tắm lớn hoành tráng "Kujo-kai sang trọng rồi", nhịp điệu thư thái) → Nối đuôi nhau bước vào đột biến (Câu ngắn · Nhiều tên đàn em cởi đồ bước vào "Hầu hạ Đại tiểu thư tắm rửa" nói một cách đương nhiên, nhịp điệu bị phá vỡ) → Tiếp quản tiệm tiến (Nhịp điệu từ lưng đến ngực đến giữa hai chân từng bước siết chặt, bàn tay chà xát di chuyển xuống dưới = Nhịp điệu gia tăng áp lực, ngón tay bám mép hồ của Rin trắng bệch) → Luân dâm triển khai (Triển khai theo cấu trúc không gian nhà tắm · Hơi nước tiếng vang phóng đại) → Sau khi xong việc ngâm nước thu vĩ (Giảm tốc · Đàn em ngâm mình trò chuyện vs Rin tê liệt bên bờ hồ, ý thức "Tắm rửa" đổi ý nghĩa). Sức căng nằm ở sự sụp đổ nhận thức "Tư vực ở một mình bị hợp lưu", nhịp điệu từ ảo giác thư thái trượt hướng không thể vãn hồi.\nTrọng tâm cảm quan: Thị giác chủ đạo (Ảo giác lần đầu nhìn thấy nhà tắm hoành tráng → Bị đàn em nối đuôi nhau bước vào phá vỡ · Sự tương phản thị giác là cốt lõi của lần đầu tiên) + Âm thanh (Tiếng vang lần đầu tiên phóng đại âm thanh của Rin · Sự kinh giác của cô đối với tiếng vang) → Xúc giác (Bàn tay chà xát từ lưng đến ngực đến giữa hai chân từng bước di chuyển xuống dưới) → Khứu giác (Hương xà phòng bị mùi tinh dịch lần đầu tiên làm bẩn). Lần đầu tiên nhấn mạnh cú sốc nhận thức "Tư vực bị hợp lưu" hơn so với thường quy.\nTập từ vựng: Lần đầu tiên dùng những từ ngữ sai lệch nhận thức như "Ảo giác/Sang trọng/Ở một mình/Đổi ý nghĩa" để khởi đầu, L3 "Tắm rửa = Hầu hạ công cộng" là dấu ấn định tính của lần đầu tiên, khác biệt với sự rửa không sạch thuần thục của thường quy.\nTiêu điểm miêu tả cơ thể: Bàn tay (Ngón tay bám mép hồ trắng bệch = Sự đóng băng của việc cố nhịn) · Nhà tắm (Sự chứng kiến lần đầu tiên về không gian hoành tráng) · Tư thế tương phản giữa Rin đơn độc vs Bị vây quanh. Ống kính nằm giữa "Nhà tắm hoành tráng" và "Rin bị nối đuôi nhau bước vào", tư vực thất thủ là tiêu điểm.\nChi tiết kỹ thuật: ① Ảo giác lần đầu nhìn thấy——Rin lần đầu tiên bước vào nhà tắm lớn hoành tráng ảo giác ngắn ngủi (Kujo-kai sang trọng rồi), dùng khởi đầu thư thái làm hòn đá tảng tương phản; ② Nối đuôi nhau bước vào đột biến——Cô còn chưa kịp phản ứng nhiều tên đàn em đã cởi đồ bước vào, "Hầu hạ Đại tiểu thư tắm rửa" nói một cách đương nhiên (Khoảnh khắc tư vực bị hợp lưu); ③ Tiếp quản tiệm tiến——Bàn tay chà xát từ lưng đến ngực đến giữa hai chân từng bước di chuyển xuống dưới, ngón tay bám mép hồ của Rin trắng bệch (Mỏ neo vật lý của việc cố nhịn); ④ Định tính tư vực——Tắm rửa là "Tư vực ở một mình" cuối cùng của Rin, ngày nhà tắm lớn xây xong mới hiểu ra nhà tắm này không phải xây cho cô là xây để "Dùng cô" (Cốt lõi sự chênh lệch); ⑤ Cấu trúc không gian triển khai——Triển khai luân dâm nhà tắm lần đầu theo cấu trúc không gian nhà tắm (Mép hồ/Tư thế quỳ/Vòi sen), hơi nước và tiếng vang phóng đại tất cả; ⑥ Sau khi xong việc ngâm nước——Đàn em thỏa mãn ngâm mình trò chuyện vs Rin tê liệt bên bờ hồ, "Tắm rửa" từ hôm nay đổi ý nghĩa (Thu vĩ dấu ấn nhận thức).'}),on({id:'p_violent_common',keys:['wb_violent_serve_common'],content:'【Dâng hiến bạo lực · Luật thép (Đau đớn → Khoái cảm, Xấu xa không bi lụy)】\n- Từ chối hôn mê: Bất kỳ phân đoạn nặng đô nào, Rin rơi vào bờ vực mê ly/sốc bắt buộc lập tức cưỡng chế đánh thức (Tạt nước lạnh/Tát mặt/Cấu đùi) kéo về sự tỉnh táo để tiếp tục chịu đựng. Tuyệt đối không viết hôn mê/trạng thái thực vật/mất đi sức sống. Ahegao trợn trắng mắt thì được (Ý chí sụp đổ, không phải nguy hiểm tính mạng).\n- Sửa chữa cường độ: Cho dù viết "Treo một tiếng đồng hồ" "Giật điện vài trăm cái", tổn thương thực tế khóa cứng ở cấp độ tạm thời——Bầm tím/Vết bấu/Vết hằn/Sưng đỏ/Đau nhức/Co giật. Số lượng là bầu không khí không phải lượng tổn thương. Nghiêm cấm đẩy thành rách da/Xé rách/Tổn thương xương/Tổn thương vĩnh viễn.\n- Cho phép dấu vết: Bầm tím/Vết bấu/Vết hằn dây trói/Sưng đỏ/Sung huyết phát sáng/Đau nhức co giật/Cảm giác tê dại sau khi bị giật điện. Hoàn toàn có thể phục hồi (Huyết mạch Đồng tử La Sát đảm bảo sự hồi phục).\n- Cấm kỵ: Rách da chảy máu/Xé rách/Bỏng/Trật khớp/Tổn thương do thiếu oxy/Bất kỳ sự phá hủy không thể đảo ngược nào. Nhìn thì đáng sợ, thực chất là vết thương ngoài da.\n- Dịch Đau đớn → Khoái cảm (Linh hồn của thể loại này · Trọng điểm viết cái này): Dâng hiến bạo lực là nội dung của chứng cuồng dâm bạo ngược (Masochism), không phải để gợi lên sự liên tưởng về đau đớn, mà là diễn "Đau đớn biến thành khoái cảm như thế nào". Mỗi trận bắt buộc phải viết rõ chuỗi truyền dẫn này: ① Cảm giác đau ập đến (Đau âm ỉ/Điện giật/Siết ép/Sặc nghẹn) ② Phản ứng đau đớn bản năng của cơ thể đang xảy ra (Căng cứng/Nảy lên/Nước mắt) ③ Cùng một đợt kích thích thần kinh bị cơ thể dịch sai thành khoái cảm——Thịt lỗ xung quanh điểm đau không kiểm soát co thắt tiết dịch, độ nhạy cảm bị cảm giác đau phóng đại đến mức mất kiểm soát, Rin rõ ràng nên đau khổ nhưng lại cảm thấy từng cơn tê dại sướng khoái trào dâng, cô kinh hãi trước phản ứng của cơ thể mình ④ Đau và sướng trên cùng một cỗ cơ thể quấn lấy nhau thành vũng bùn lầy lội rối loạn, cô phân không rõ đang chịu hình phạt hay đang bị khai phá, ý chí trong sự rối loạn này bị ngâm mềm. Trọng tâm bút mực vĩnh viễn là "Khoái cảm mà Rin không tự chủ được cảm nhận được", không phải bạo lực do đàn em áp đặt.\n- Từ vựng Đau đớn → Khoái cảm ba mức độ (Dùng chung cho các trận · Tránh viết thành đau đớn thuần túy):\n  ① Từ ngữ cảm giác đau (Khởi tay · Điểm tới là dừng, đừng xếp chồng): Đau âm ỉ/Đau nhức/Nóng rát/Siết/Tê/Căng cứng/Nước mắt trào ra——Những thứ này chỉ là "Công tắc", không phải trọng tâm miêu tả.\n  ② Từ ngữ dịch sai (Cốt lõi · Trọng điểm xếp chồng tầng này): Tê dại/Mềm nhũn/Thịt lỗ không kiểm soát co thắt/Nhạy cảm đến mất kiểm soát/Đau đến phát run nhưng lại chảy nước/Phân không rõ đau hay sướng/Càng đau càng ướt.\n  ③ Từ ngữ luân lạc (Cao trào): Đau sướng quấn thành vũng bùn/Lên đỉnh trong lúc chịu hình phạt/Kinh hãi trước phản ứng của chính mình/Ý chí bị ngâm mềm/Cầu xin thêm nữa.\n- Thái độ giọng điệu của Rin (Thúc đẩy chứng cuồng dâm bạo ngược): Giai đoạn đầu "Tại sao… Không nên như vậy…"(Kinh hãi trước cơ thể) → Giai đoạn giữa "Không muốn… Chỗ đó… A❤"(Sự cầu xin trộn lẫn tiếng rên dâm đãng) → Luân lạc "Vẫn muốn…"(Chứng cuồng dâm bạo ngược thức tỉnh). ❤ chỉ dành cho Rin.\n- Giọng điệu cơ bản của đàn em: Tận hưởng việc quan sát phản ứng của Rin, trêu chọc sự thành thật của cơ thể cô ("Nhìn xem, nó tự co lại khít thế này" "Miệng nói không muốn cơ mà" "Đại tiểu thư thế này là sướng đúng không?"), không phải sự im lặng của kẻ bạo dâm lạnh lùng.\n- Kích hoạt: Sau khi nâng cấp tầng hầm mở khóa, độ trung thành thấp tự động kích hoạt / Người chơi có chứng cuồng dâm bạo ngược cao chủ động chọn.'}),on({id:'p_violent_hang',keys:['wb_violent_hang'],content:'Treo cổ luân dâm · Thường quy. Tier2 Treo lơ lửng trói buộc + Chiến luân lưu (Không phải treo cổ chết thật, biến thể treo lơ lửng phần cổ).\nCơ chế: Cổ tay cổ chân/Đai lưng + Vòng cổ phân tán lực chịu đựng, qua ròng rọc treo lên khung trần nhà tầng hầm, cơ thể lơ lửng trên không trung tạo thành hình chữ X hoặc kéo thẳng lơ lửng. Trọng lực là kẻ thi hành án chính——Rin mất đi sự tiếp đất và điểm tựa, không thể căng cơ/di chuyển trọng tâm để chống đỡ, giống như miếng thịt trên móc câu hoàn toàn phục tùng ngoại lực. Vòng cổ chịu một phần trọng lượng cơ thể tạo ra sự siết ép và chóng mặt do thiếu oxy nhẹ (Chỉ lấy sự tê dại lâng lâng, tuyệt đối không lấy sự ngạt thở thật sự).\nLực chịu đựng/Đau đớn → Khoái cảm: Bốn điểm treo tứ chi sung huyết tím tái tê rần, vòng cổ siết ra vết hằn đỏ, thân mình bị kéo dài eo bụng đau nhức. Da thịt kéo căng đến cực hạn không có sự đệm đỡ, việc đâm vào/tát vỗ kịch liệt và trực tiếp hơn bình thường. Thiếu oxy nhẹ khiến độ nhạy cảm tăng vọt, tầm nhìn hoa lên, thần kinh quá tải = Bộ khuếch đại Đau đớn → Khoái cảm. Khi bị đâm cơ thể lơ lửng xoay tròn vô trợ, mỗi một cú mượn quán tính xoay tròn khoan vào sâu hơn; Sự lâng lâng chóng mặt khiến cô phân không rõ là ngạt thở hay là lên đỉnh, ý thức lơ lửng thân dưới đang chảy nước.\nCảm quan độc quyền:[Thị giác] Cơ thể kéo thành hình dẹt dài, eo sụp xuống, xương sườn hiện ra; Hai chân tách ra treo lên, gò mu kéo phẳng hai mép âm hộ lật ra ngoài âm vật nhô ra phơi bày toàn trường; Mỗi lần chịu đòn xoay nửa vòng mặt trước mặt sau luân phiên vung vẩy cho người vây quanh xem.[Xúc giác] Da thịt căng cứng nóng rát/Vòng cổ siết ép/Điểm treo căng tức tê rần/Thiếu oxy nhẹ ù tai lâng lâng.[Âm thanh] Ròng rọc cọt kẹt/Vòng cổ lách cách/Tiếng bước chân thở dốc của hàng lối/Tiếng rên dâm đãng vỡ vụn biến điệu do bị siết (Ư a… Í í)/Tiếng hít khí khò khè đứt quãng do thiếu oxy.\nNhiều người (Theo cấu trúc không gian · Thân dưới đâm hai lỗ là chính, không an bài miệng): Phần đầu bị treo lơ lửng chịu lực, cổ bị vòng cổ siết chặt → Đường miệng này không an bài người (Tư thế và việc siết cổ không hỗ trợ). Nơi có thể xâm phạm là thân dưới lơ lửng: Lỗ lồn + Lỗ đít bị hai cặc trước sau đồng thời đâm xuyên làm trục chính, hai tay mỗi tay bị bẻ ra nắm một cặc. Một nhóm bắn xong toàn bộ đổi nhóm tiếp theo (Luân phiên nhóm đâm hai lỗ), Rin luôn bị thân dưới đâm hai lỗ không nghỉ ngơi. Mượn sự xoay tròn trên không trung làm điểm ngắt nhịp điệu đổi nhóm.\nTrục sảng khoái: Số người vĩnh động + Khủng hoảng kiểm soát (Mất trọng lượng vô trợ) + Dáng vẻ xấu xí quên mình. Giọng điệu cơ bản: Từ ngữ mức độ cao, sự lâng lâng do thiếu oxy đưa lên tiền cảnh.\nCấm kỵ: Việc siết ép phần cổ chỉ dùng để tạo sự lâng lâng/phóng đại nhạy cảm, tuyệt đối không thật sự tắt thở không để lại di chứng thiếu oxy (Dùng "Trước mắt hoa lên nhưng lại cảm thấy thân dưới ngày càng nóng rực" thay thế cho bất kỳ cách viết nặng nề nào về việc sắp tắt thở).\nKết toán: Lần đầu tiên → Độ đọa lạc +/Chứng cuồng dâm bạo ngược +; Số lần nhục thể cộng dồn; Tóm tắt tiếp nối ghi "Đã mở khóa treo cổ luân dâm".\n【Cách viết · Độc quyền treo cổ luân dâm】\nNhịp điệu câu cú: Mất trọng lượng lơ lửng khởi đầu chậm (Câu dài · Bốn điểm treo tứ chi chịu lực cơ thể kéo thành hình chữ X · Nhịp điệu bị sự lơ lửng kéo dài · Dấu câu thưa thớt) → Thiếu oxy lâng lâng ngưng trệ (Khoảnh khắc vòng cổ siết chặt nhịp điệu dừng lại một nhịp · Kéo dài một câu viết sự lâng lâng chóng mặt thần kinh quá tải) → Đâm hai lỗ xoay tròn (Câu ngắn · Mượn quán tính xoay tròn trên không trung mỗi cú khoan vào sâu hơn · Từ tượng thanh ư a í í và tiếng hít khí khò khè đan xen) → Điểm ngắt nhịp điệu đổi nhóm (Toàn bộ nhóm bắn xong toàn bộ đổi · Xoay tròn làm điểm ngắt) → Rối loạn cao trào thu vĩ (Câu ngắn bùng nổ · Phân không rõ ngạt thở chóng mặt hay là bị đụ đến thất thần · Ý thức lơ lửng thân dưới đang chảy nước). Sức căng nằm ở sự mất trọng lượng vô trợ + Bộ khuếch đại thiếu oxy nhẹ, nhịp điệu bị sự lơ lửng và siết cổ liên tục đánh gãy.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự lâng lâng do thiếu oxy nhẹ (Tầm nhìn hoa lên/Thần kinh quá tải = Bộ khuếch đại Đau đớn → Khoái cảm) làm cốt lõi, Âm thanh (Ròng rọc cọt kẹt/Vòng cổ lách cách/Tiếng rên vỡ vụn biến điệu do bị siết/Tiếng hít khí khò khè do thiếu oxy) là độc quyền, Xúc giác (Da thịt căng cứng nóng rát/Điểm treo căng tức tê rần) xếp thứ hai. L3 Thiếu oxy lâng lâng đưa lên tiền cảnh.\nTiêu điểm miêu tả cơ thể: Cơ thể (Kéo thành hình dẹt dài/Eo sụp xuống/Xương sườn hiện ra) · Gò mu (Kéo phẳng hai mép âm hộ lật ra ngoài âm vật nhô ra phơi bày toàn trường) · Mỗi lần chịu đòn xoay nửa vòng mặt trước mặt sau luân phiên vung vẩy cho người vây quanh xem.\nChi tiết kỹ thuật: ① Treo lơ lửng phân tán lực chịu đựng——Cổ tay cổ chân/Đai lưng + Vòng cổ phân tán lực chịu đựng qua ròng rọc treo lên trần nhà, cơ thể lơ lửng trên không trung hình chữ X hoặc kéo thẳng lơ lửng (Không phải treo cổ chết thật, biến thể treo lơ lửng phần cổ); ② Trọng lực là kẻ thi hành án chính——Rin mất đi sự tiếp đất và điểm tựa không thể căng cơ/di chuyển trọng tâm để chống đỡ, giống như miếng thịt trên móc câu hoàn toàn phục tùng ngoại lực; ③ Vòng cổ lấy sự tê dại không lấy sự ngạt thở——Vòng cổ chịu một phần trọng lượng cơ thể tạo ra sự siết ép và chóng mặt do thiếu oxy nhẹ, chỉ lấy sự tê dại lâng lâng tuyệt đối không thật sự ngạt thở (Luật thép); ④ Bộ khuếch đại thiếu oxy nhẹ——Thiếu oxy khiến độ nhạy cảm tăng vọt/Tầm nhìn hoa lên/Thần kinh quá tải = Bộ khuếch đại Đau đớn → Khoái cảm; ⑤ Xoay tròn mượn lực——Khi bị đâm cơ thể lơ lửng xoay tròn vô trợ mỗi cú mượn quán tính xoay tròn khoan vào sâu hơn; ⑥ Lâng lâng rối loạn——Sự chóng mặt khiến cô phân không rõ là ngạt thở hay là lên đỉnh ý thức lơ lửng thân dưới đang chảy nước (Rối loạn cốt lõi); ⑦ Không an bài miệng——Phần đầu bị treo lơ lửng chịu lực cổ bị siết chặt đường miệng này không an bài người, thân dưới lỗ lồn + lỗ đít trước sau hai cặc đâm xuyên trục chính hai tay mỗi tay nắm một cặc.'}),on({id:'p_violent_hang_first',keys:['wb_violent_hang_first'],content:'Treo cổ luân dâm · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Lần đầu tiên phát hiện "Đau đớn có thể khiến bản thân sướng"——Ý chí trong sự rối loạn giữa đau và sướng bị ngâm mềm.\nNhịp điệu bắt buộc: ① Sự mất trọng lượng khi bị treo lên——Tứ chi bị trói/Vòng cổ tròng vào/Ròng rọc kéo lên, sự hoảng loạn lần đầu tiên mất đi sự tiếp đất của Rin; ② Lượt đâm vào đầu tiên——Trên không trung không có điểm tựa, cơ thể bị đâm hai lỗ trước sau nương theo sự xoay tròn kéo vào sâu hơn; ③ Sự hoảng hốt do thiếu oxy——Vòng cổ siết đến mức lâng lâng, ý thức bắt đầu mơ hồ, Rin kinh hãi trước việc "Tại sao trong hoàn cảnh này thân dưới lại ngày càng nóng rực"; ④ Cao trào rối loạn giữa đau và sướng——Phân không rõ là ngạt thở chóng mặt hay là bị đụ đến thất thần, lên đỉnh trong lúc chịu hình phạt; ⑤ Sự thoát lực khi bị thả xuống——Khoảnh khắc chân chạm lại mặt đất ngược lại không chống đỡ nổi, Rin nhận ra bản thân đã bị một thứ gì đó cải tạo.\nSau khi xong việc: Rin lần đầu tiên hiểu ra "Thì ra đau đớn có thể biến thành thứ này"——Hạt giống của chứng cuồng dâm bạo ngược được gieo xuống. Tóm tắt tiếp nối ghi "Đã mở khóa treo cổ luân dâm · Lần đầu tiên chứng cuồng dâm bạo ngược nảy mầm".\n【Cách viết · Độc quyền treo cổ lần đầu】\nNhịp điệu câu cú: Bị treo lên mất trọng lượng khởi đầu chậm (Câu dài · Tứ chi bị trói vòng cổ tròng vào ròng rọc kéo lên · Sự hoảng loạn lần đầu tiên mất đi sự tiếp đất của Rin) → Lượt đâm vào đầu tiên (Câu ngắn · Trên không trung không có điểm tựa cơ thể bị đâm hai lỗ trước sau nương theo sự xoay tròn kéo vào sâu hơn) → Thiếu oxy hoảng hốt ngưng trệ (Vòng cổ siết đến mức lâng lâng ý thức mơ hồ · Nhịp điệu dừng lại một nhịp · Rin kinh hãi "Tại sao trong hoàn cảnh này thân dưới lại ngày càng nóng rực") → Đau sướng rối loạn cao trào (Câu ngắn bùng nổ · Phân không rõ ngạt thở chóng mặt hay là bị đụ đến thất thần · Lên đỉnh trong lúc chịu hình phạt) → Bị thả xuống thoát lực thu vĩ (Giảm tốc · Khoảnh khắc chân chạm lại mặt đất ngược lại không chống đỡ nổi · Rin nhận ra bản thân đã bị một thứ gì đó cải tạo). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Đau đớn có thể khiến bản thân sướng", chứng cuồng dâm bạo ngược nảy mầm.\nChi tiết kỹ thuật: ① Bị treo lên mất trọng lượng——Tứ chi bị trói vòng cổ tròng vào ròng rọc kéo lên, sự hoảng loạn lần đầu tiên mất đi sự tiếp đất của Rin (Mỏ neo đột biến); ② Lượt đâm vào đầu tiên——Trên không trung không có điểm tựa cơ thể bị đâm hai lỗ trước sau nương theo sự xoay tròn kéo vào sâu hơn; ③ Thiếu oxy hoảng hốt——Vòng cổ siết đến mức lâng lâng ý thức mơ hồ, Rin kinh hãi "Tại sao trong hoàn cảnh này thân dưới lại ngày càng nóng rực" (Mỏ neo rối loạn cốt lõi); ④ Đau sướng rối loạn cao trào——Phân không rõ ngạt thở chóng mặt hay là bị đụ đến thất thần, lên đỉnh trong lúc chịu hình phạt; ⑤ Bị thả xuống thoát lực——Khoảnh khắc chân chạm lại mặt đất ngược lại không chống đỡ nổi, Rin nhận ra bản thân đã bị một thứ gì đó cải tạo (Hạt giống chứng cuồng dâm bạo ngược gieo xuống).'}),on({id:'p_violent_horse',keys:['wb_violent_horse'],content:'Ngựa gỗ tam giác · Thường quy. Tier2 Hình cụ kiểu cưỡi.\nCơ chế: Ngựa gỗ tam giác = Khối trụ tam giác có phần đỉnh thu lại thành gờ tù tròn (Mặt cắt △/Mái nhà), Rin bị ép mở rộng hai chân ngồi vắt vẻo trên đó, hai chân lơ lửng hoặc cố định ở vị trí cực thấp. Cốt lõi = Biến chính trọng lượng cơ thể cô thành hình cụ——Hạ bàn bị gờ gỗ cưỡng ép chẻ ra, mất đi khả năng khép chân tự bảo vệ, hội âm/âm môi/miệng lồn/âm vật trực tiếp cưỡi đè lên đỉnh gờ hẹp, trọng lượng nửa thân trên toàn bộ đè xuống, ngồi càng lâu lún càng sâu. "Đâm vào" hai đường: Gờ gỗ cứng rắn đâm lên cấn ép + Dưới tư thế này dùng dương vật đâm xuyên trước/sau (Cửa ngõ mở toang dễ DP).\nLực chịu đựng/Đau đớn → Khoái cảm: Mô mềm hội âm bị ép biến dạng trên gờ cứng, thịt mông bị đẩy sang hai bên, dây chằng mặt trong đùi bị kéo căng đến giới hạn. Đau nhức âm ỉ thuần túy do trọng lực (Không cần người động đậy cũng đã đau nhức cấn ép sâu thẳm không thể trốn tránh) + Cú sốc thứ hai (Cô căng chân chống người muốn giảm đau, nhưng chống lâu chân mềm nhũn không căng nổi, đập mạnh trở lại gờ gỗ khoảnh khắc đó cơn đau kịch liệt tăng vọt——Không phải do thiếu thể lực, mà là bị khoái cảm ngâm mềm không dùng sức được). Khi ngựa gỗ bị đẩy kéo trước sau hoặc cô vặn vẹo khi bị đâm, niêm mạc kiều mẫn liên tục cọ xát trên gờ cứng——Nghiền ép thô bạo kích thích mạnh mẽ các dây thần kinh dày đặc, miệng lồn không kiểm soát tuôn ra mật dịch trong suốt, biến nỗi đau vật lý thuần túy thành sự rối loạn của sự nhục nhã lầy lội trộn lẫn khoái cảm cưỡng chế (Trận này là cơ chế "Đau đớn neo giữ khoái cảm" trực quan nhất).\nCảm quan độc quyền:[Thị giác] Hạ bàn bị chẻ ra/Môi lồn dày cộp bị gờ gỗ ép sang hai bên lật ra ngoài/Âm vật bị đẩy ra dán chặt vào gờ gỗ/Căng cơ chống người run rẩy/Mật dịch chảy dọc theo gờ gỗ phản chiếu ánh sáng.[Xúc giác] Đau nhức cấn ép sâu thẳm dưới đáy chậu/Độ cứng của gờ gỗ/Cơn đau kịch liệt rơi xuống khi đập trở lại/Cọ xát nóng rát.[Âm thanh] Tiếng vang trầm đục khi chống người thất bại đập trở lại/Tiếng nước dính dớp khi mặt gờ bị dâm dịch làm ướt/Tiếng rên rỉ cầu xin.\nNhiều người (Theo cấu trúc không gian · Thân dưới bị ngựa gỗ chiếm dụng, người thật đi đường miệng tay và lỗ đơn): Rin cưỡi trên gờ gỗ, thân dưới bị gờ gỗ chẻ ép chiếm dụng——Người thật rất khó để đâm vào thân dưới từ hai hướng cùng lúc nữa. "Đường còn lại" của thân dưới dùng đồ chơi thay thế (Buộc gậy rung/Nhét hậu môn giả bên cạnh gờ gỗ, xếp chồng với lực ép của gờ gỗ), hoặc người thật chỉ đâm vào lỗ lồn từ phía trước một đường (Lỗ đít bị tư thế ngồi + gờ gỗ chiếm dụng). Miệng và hai tay rảnh rỗi do đàn em đứng vây quanh đồng thời sử dụng. Đổi người là "Đổi người đang dùng miệng và đường thân dưới đó", gờ gỗ luôn ở bên dưới cấn ép.\nTrục sảng khoái: Kiểm soát (Không thể động đậy) + Đau sướng rối loạn + Vật hóa. Giọng điệu cơ bản: Mức độ trung bình → cao, đau nhức do trọng lực và cọ xát luân phiên.\nCấm kỵ: Gờ gỗ dùng để ép cùn/cấn đau/ma sát, tuyệt đối không cắt xước ép nứt hội âm (Thiết lập đỉnh là gờ tù tròn không phải lưỡi dao sắc bén, tạo ra sự đau nhức sâu thẳm chứ không phải rách da). Tạm thời: Hội âm/Mặt trong đùi bị ép đỏ bầm tím; Cấm: Rách mô mềm.\nKết toán: Lần đầu tiên → Độ đọa lạc +/Chứng cuồng dâm bạo ngược +; Tóm tắt tiếp nối ghi "Đã mở khóa ngựa gỗ tam giác".\n【Cách viết · Độc quyền ngựa gỗ tam giác】\nNhịp điệu câu cú: Ngồi vắt vẻo lún chìm khởi đầu chậm (Câu dài · Hai chân mở rộng ngồi vắt vẻo trên gờ gỗ hai chân lơ lửng · Trọng lượng biến chính cô thành hình cụ · Nhịp điệu bị trọng lực kéo xuống · Dấu câu trầm) → Đau nhức cấn ép (Mức độ trung bình · Mô mềm hội âm bị gờ cứng ép · Đau nhức sâu thẳm không thể trốn tránh) → Chống người thất bại đập trở lại (Câu ngắn bùng nổ——Căng chân chống người muốn giảm đau chống lâu chân mềm nhũn không căng nổi đập mạnh trở lại gờ gỗ khoảnh khắc đó cơn đau kịch liệt tăng vọt · Không phải do thiếu thể lực mà là bị khoái cảm ngâm mềm không dùng sức được · Đây là điểm bùng nổ của nhịp điệu) → Cọ xát khuấy đảo thu vĩ (Mức độ trung bình · Niêm mạc kiều mẫn liên tục cọ xát trên gờ cứng · Nghiền ép thô bạo dây thần kinh dày đặc · Đau vật lý thuần túy biến thành nhục nhã lầy lội trộn lẫn khoái cảm cưỡng chế). Sức căng nằm ở vòng lặp "Trọng lượng bản thân biến thành hình cụ" + "Chống người thất bại đập trở lại", nhịp điệu do trọng lực và sự thất bại khi chống người luân phiên.\nTrọng tâm cảm quan/Tập từ vựng: Lấy đau nhức do trọng lực (Đau nhức cấn ép sâu thẳm dưới đáy chậu không thể trốn tránh) + Cơn đau kịch liệt rơi xuống khi đập trở lại + Cọ xát nóng rát làm cốt lõi, Thị giác (Hạ bàn bị chẻ ra/Môi lồn dày cộp lật ra ngoài/Âm vật nhô ra dán chặt vào gờ gỗ/Mật dịch chảy dọc theo gờ gỗ phản chiếu ánh sáng), Âm thanh (Tiếng vang trầm đục khi chống người thất bại đập trở lại/Tiếng nước dính dớp trên mặt gờ dính dâm dịch). Trận này là cơ chế "Đau đớn neo giữ khoái cảm" trực quan nhất.\nTiêu điểm miêu tả cơ thể: Hạ bàn (Bị gờ gỗ chẻ ra/Mô mềm hội âm bị ép biến dạng) · Gò mu (Đại âm môi lật ra ngoài âm vật nhô ra dán chặt vào gờ gỗ) · Cơ bắp chống người (Căng ra run rẩy/Đập trở lại).\nChi tiết kỹ thuật: ① Trọng lượng bản thân biến thành hình cụ——Đỉnh ngựa gỗ tam giác là gờ tù tròn, Rin mở rộng hai chân ngồi vắt vẻo hai chân lơ lửng, trọng lượng toàn bộ đè xuống hội âm/âm môi/miệng lồn/âm vật trực tiếp cưỡi đè lên đỉnh gờ hẹp ngồi càng lâu lún càng sâu (Cơ chế cốt lõi); ② Mất đi khả năng khép chân tự bảo vệ——Hạ bàn bị gờ gỗ cưỡng ép chẻ ra không thể khép chân tự bảo vệ; ③ Đau nhức âm ỉ thuần túy do trọng lực——Không cần người động đậy cũng đã đau nhức cấn ép sâu thẳm không thể trốn tránh; ④ Chống người thất bại đập trở lại (Nhịp điệu chiêu bài)——Cô căng chân chống người muốn giảm đau chống lâu chân mềm nhũn không căng nổi đập mạnh trở lại gờ gỗ khoảnh khắc đó cơn đau kịch liệt tăng vọt, không phải do thiếu thể lực mà là bị khoái cảm ngâm mềm không dùng sức được (Điểm bùng nổ nhịp điệu); ⑤ Niêm mạc cọ xát——Ngựa gỗ đẩy kéo trước sau hoặc vặn vẹo khi bị đâm niêm mạc kiều mẫn liên tục cọ xát trên gờ cứng, nghiền ép thô bạo dây thần kinh dày đặc, miệng lồn không kiểm soát tuôn ra mật dịch trong suốt (Đau đớn neo giữ khoái cảm trực quan nhất); ⑥ Đồ chơi bên cạnh gờ gỗ bổ sung——Thân dưới bị gờ gỗ chiếm dụng người thật khó đâm hai lỗ nữa, buộc gậy rung/nhét hậu môn giả bên cạnh gờ gỗ xếp chồng với lực ép của gờ gỗ, hoặc người thật chỉ đâm vào lỗ lồn từ phía trước một đường; ⑦ Tù tròn không phải lưỡi dao sắc bén——Gờ gỗ dùng để ép cùn/cấn đau/ma sát tuyệt đối không cắt xước, đỉnh gờ tù tròn tạo ra sự đau nhức sâu thẳm chứ không phải rách da (Luật thép).'}),on({id:'p_violent_donkey',keys:['wb_violent_donkey'],content:'Lừa gỗ xuy điện · Thường quy. Tier2 Kiểu cưỡi + Máy kích điện + Đặt tĩnh (Play đặt để).\nCơ chế (Phi khốc hình hóa, giữ lại cách chơi): Đế dựng hai cọc trụ có chức năng rung/điện cực, Rin bị thả xuống hai lỗ (Lỗ lồn + Lỗ đít) đồng thời tròng vào hai cọc, dựa vào trọng lượng bản thân ngồi xuống tận cùng, hai chân lơ lửng hoặc cố định ở vị trí thấp, cố định trong thời gian dài. Thông điện = Điện cực ở cọc trụ hoặc dán vào mông, dòng điện không qua não bộ trực tiếp kích hoạt cơ bắp. Dựa vào sự tra tấn mãn tính xếp chồng ba lớp "Hai cọc đâm sâu lấp đầy + Điện giật theo chu kỳ + Thời gian giày vò", chứ không phải đánh đập liên tục.\nLực chịu đựng/Đau đớn → Khoái cảm: Sự căng tức cùn đục khi hai cọc mượn trọng lượng đâm sâu lấp đầy hai lỗ đến cực hạn + Cơ bắp chỗ điện cực bị cưỡng ép co thắt. Dòng điện giống như hàng ngàn hàng vạn mũi kim nhọn đồng thời đâm vào lỗ chân lông chạy dọc theo dây thần kinh, nửa thân người lập tức tê liệt; Xung điện khiến cơ bắp co thắt kịch liệt theo nhịp điệu, kẹp cho hai lỗ từng đợt từng đợt siết chặt lấy hai cọc. Sự tê dại của dòng điện và sự rung động tần số cao của cọc trụ cùng một nguồn gốc, xuyên thấu niêm mạc hai lỗ cộng hưởng, đùi không ngừng run rẩy, muốn siết chặt lại muốn mở ra để làm dịu đi khoái cảm quá mức tập trung đó. Sau khi dừng điện hai lỗ tiếp tục co giật, đầu mút thần kinh phóng điện dư âm, ngâm trong sự xáo động nhạy cảm thời gian dài vô thức co thắt đi ngậm cắn hai cọc trong cơ thể. Đau đớn và tê dại trên cùng một cỗ cơ thể phân không rõ là đang chịu hình phạt hay đang bị khai phá.\nCảm quan độc quyền:[Thị giác] Sóng thịt cuộn trào——Dòng điện khiến nhóm cơ dưới da mông nổi lên những gợn sóng nhấp nhô có thể nhìn thấy bằng mắt thường, bề mặt mông nhẵn nhụi giống như mặt nước bị khuấy động lồi lõm cuộn trào; Khoảnh khắc thông điện đùi nảy mạnh/mông đột ngột kẹp chặt/ngón chân quắp chặt, hai lỗ cắn chết hai cọc, giống như búp bê bị thông điện cứng đờ khoa trương giật giật từng cái.[Xúc giác] Sự căng tức cùn đục khi hai lỗ bị cọc sâu lấp đầy/Kim châm tê rần/Dòng nhiệt chạy loạn trong cơ thể/Cơ bắp căng thành đá/Dư âm tê dại sau khi dừng điện.[Âm thanh] Máy kích điện xèo xèo/Môtơ rè rè/Sự đồng bộ tức thời cơ thể nảy lên rồi mềm nhũn sau khi vặn nút điều chỉnh tần số/Tiếng hít khí khò khè đứt quãng và giọng mũi ngọt ngào biến điệu.\nNhiều người (Theo cấu trúc không gian): Hai lỗ thân dưới đã bị hai cọc chiếm dụng lấp đầy——Người thật đi đường miệng và hai tay rảnh rỗi (Miệng ngậm một cặc, hai tay mỗi tay nắm một cặc), đứng vây quanh luân phiên; Sự rung điện của cọc trụ liên tục oanh tạc hai lỗ. Cũng có thể đổi thành người thật thay thế cọc trụ đích thân đâm hai lỗ. Điện giật khiến hai lỗ cắn chặt không tự chủ, bị người bên cạnh lấy cớ "Cô ta đang chủ động nghênh hợp" để nhục nhã.\nTrục sảng khoái: Thời gian giày vò + Đau tê rối loạn + Vật hóa nhục nhã. Giọng điệu cơ bản: Tra tấn mãn tính, dư âm xáo động.\nCấm kỵ: Điện giật chỉ lấy hiệu ứng bề mặt/tầng nông của việc cơ bắp co giật + kim châm tê dại + sóng thịt, nghiêm cấm bỏng/nguy cơ tim mạch/vết bỏng điện. Tạm thời: Cơ bắp đau nhức/Dư âm tê dại/Hội âm bị ép đỏ; Cấm: Bỏng điện/Tổn thương thần kinh.\nKết toán: Lần đầu tiên → Độ đọa lạc +/Chứng cuồng dâm bạo ngược +; Tóm tắt tiếp nối ghi "Đã mở khóa lừa gỗ xuy điện".\n【Cách viết · Độc quyền lừa gỗ xuy điện】\nNhịp điệu câu cú: Thả xuống tròng cọc khởi đầu chậm (Câu dài · Hai lỗ đồng thời tròng vào hai cọc dựa vào trọng lượng bản thân ngồi xuống tận cùng hai chân lơ lửng · Nhịp điệu bị sự cố định thời gian dài kéo giãn) → Hai cọc căng tức cùn đục (Mức độ trung bình · Sự căng tức cùn đục khi hai cọc đâm sâu lấp đầy hai lỗ · Giày vò nhịp chậm) → Xung điện (Câu ngắn bùng nổ——Dòng điện giống như hàng ngàn hàng vạn mũi kim nhọn đồng thời đâm vào lỗ chân lông · Xung điện khiến cơ bắp co thắt kịch liệt theo nhịp điệu kẹp cho hai lỗ từng đợt từng đợt siết chặt lấy hai cọc · Nhịp điệu do xung điện kiểm soát) → Dư âm xáo động thu vĩ (Giảm tốc · Sau khi dừng điện hai lỗ tiếp tục co giật đầu mút thần kinh phóng điện dư âm · Ngâm trong sự xáo động nhạy cảm thời gian dài vô thức co thắt đi ngậm cắn hai cọc). Sức căng nằm ở sự tra tấn mãn tính ba lớp "Hai cọc lấp đầy + Điện giật theo chu kỳ + Thời gian giày vò", nhịp điệu do xung điện thúc đẩy.\nTrọng tâm cảm quan/Tập từ vựng: Lấy dòng điện kim châm tê rần + Cơ bắp cưỡng ép co thắt + Sóng thịt cuộn trào (Dòng điện khiến nhóm cơ dưới da mông nổi lên những gợn sóng nhấp nhô có thể nhìn thấy bằng mắt thường) làm cốt lõi, Âm thanh (Máy kích điện xèo xèo/Môtơ rè rè/Sự đồng bộ tức thời cơ thể nảy lên rồi mềm nhũn sau khi vặn nút điều chỉnh tần số) là độc quyền, Xúc giác (Hai lỗ căng tức cùn đục/Kim châm tê rần/Dòng nhiệt chạy loạn trong cơ thể/Cơ bắp căng thành đá).\nTiêu điểm miêu tả cơ thể: Mông (Sóng thịt cuộn trào——Nhóm cơ dưới da gợn sóng nhấp nhô lồi lõm cuộn trào) · Hai lỗ (Cắn chết hai cọc/Khoảnh khắc thông điện cứng đờ khoa trương giật giật từng cái) · Đùi (Nảy mạnh/Muốn siết chặt lại muốn mở ra để làm dịu).\nChi tiết kỹ thuật: ① Phi khốc hình hóa giữ lại cách chơi——Đế dựng hai cọc trụ có chức năng rung/điện cực, Rin bị thả xuống hai lỗ đồng thời tròng vào hai cọc dựa vào trọng lượng bản thân ngồi xuống tận cùng hai chân lơ lửng cố định thời gian dài; ② Dòng điện không qua não bộ——Điện cực ở cọc trụ hoặc dán vào mông, dòng điện không qua não bộ trực tiếp kích hoạt cơ bắp; ③ Tra tấn mãn tính ba lớp——Hai cọc đâm sâu lấp đầy + Điện giật theo chu kỳ + Thời gian giày vò, không phải đánh đập liên tục; ④ Kim châm tê dại——Dòng điện giống như hàng ngàn hàng vạn mũi kim nhọn đồng thời đâm vào lỗ chân lông chạy dọc theo dây thần kinh nửa thân người lập tức tê liệt; ⑤ Xung điện siết chặt——Xung điện khiến cơ bắp co thắt kịch liệt theo nhịp điệu kẹp cho hai lỗ từng đợt từng đợt siết chặt lấy hai cọc, sự tê dại của dòng điện và sự rung động tần số cao của cọc trụ cùng một nguồn gốc xuyên thấu niêm mạc hai lỗ cộng hưởng; ⑥ Sóng thịt cuộn trào——Khoảnh khắc thông điện nhóm cơ dưới da mông nổi lên những gợn sóng nhấp nhô có thể nhìn thấy bằng mắt thường, đùi nảy mạnh/mông đột ngột kẹp chặt/ngón chân quắp chặt hai lỗ cắn chết hai cọc giống như búp bê bị thông điện cứng đờ khoa trương giật giật từng cái (Độc quyền thị giác); ⑦ Dư âm phóng điện——Sau khi dừng điện hai lỗ tiếp tục co giật đầu mút thần kinh phóng điện dư âm, ngâm trong sự xáo động nhạy cảm thời gian dài vô thức co thắt ngậm cắn hai cọc; ⑧ Điện giật chỉ lấy tầng nông——Chỉ lấy hiệu ứng bề mặt/tầng nông của việc cơ bắp co giật + kim châm tê dại + sóng thịt, nghiêm cấm bỏng/nguy cơ tim mạch/vết bỏng điện (Luật thép).'}),on({id:'p_violent_water',keys:['wb_violent_water'],content:'Thủy hình + Luân dâm · Thường quy. Tier2 Ngạt nước ngạt thở + Luân dâm (Play ngạt thở tình dục).\nCơ chế: Cốt lõi = Tạo ra "ngạt nước/ngạt thở" đồng thời bị luân dâm, Rin bị trói quặt tay ra sau không thể giãy giụa, chỉ có thể vặn vẹo, đạp chân, căng cứng——Dùng sự vô lực phản kháng để mang lại liên tưởng "ngược đãi", sau đó thông qua miêu tả để dịch sự "ngược đãi" đó thành khoái cảm. Ba thủ pháp ngạt thở: ① Đầu bị ấn vào chậu nước/bồn nước ② Mặt bị đắp khăn lông ướt sũng ③ Đầu bị trùm túi nilon bơm nước. Nhịp điệu ngạt thở và đổi khí hoàn toàn do đàn em kiểm soát.\nThử thách tình dục (Độc quyền của trận này): Đàn em đặt ra quy củ——"Đứa đang cắm bắn tinh rồi mới cho phép cô ta đổi một ngụm khí", nếu không có cho đổi khí hay không hoàn toàn tùy tâm trạng đàn ông; Rin vì ngụm khí đó chỉ có thể liều mạng dùng cơ thể lấy lòng, co thắt kẹp mút giục bọn chúng mau bắn, kết quả lại tự đưa mình vào sâu hơn.\nLực chịu đựng/Đau đớn → Khoái cảm: Thiếu oxy khiến độ nhạy cảm toàn thân bị phóng đại đến mức mất kiểm soát (Giống cơ chế treo cổ)——Khi nín thở đến mức trước mắt hoa lên, phổi nóng rát, thì cái lỗ bị đâm lại càng ngày càng nóng, càng nhạy cảm, ranh giới ngạt thở và ranh giới lên đỉnh chồng chéo lên nhau; Hai tay bị trói quặt, hành động vặn vẹo đạp chân duy nhất có thể làm lại trở thành "lẳng lơ nghênh hợp" trong mắt đám đàn em; Khoảnh khắc được phép hít vào một ngụm khí, sự chóng mặt do thiếu oxy và sự co giật do lên đỉnh cùng lúc nổ tung, cô phân không rõ là sợ chết hay là sướng quá. Cô kinh hãi trước việc bản thân sắp chết đuối mà vẫn lên đỉnh.\nCảm quan độc quyền:[Thị giác] Bọt khí khi mở mắt trong nước/Đường nét chiếc khăn ướt hít vào dán chặt theo nhịp thở/Hơi nước đọng trên vách túi nilon và khuôn mặt si ngốc biến dạng của cô/Hai tay bị trói quặt nắm chặt rồi lại buông ra/Đạp chân làm bọt nước bắn tung tóe/Khi được phép ngẩng đầu lên, tiếng ho sặc sụa lẫn với nước mắt nước dãi chảy ròng ròng.[Xúc giác] Sự sặc sụa khi nước tràn vào mũi miệng, phổi nóng rát, huyệt thái dương căng tức, sự lâng lâng do thiếu oxy, sự nóng rực của cái lỗ bị đâm và sự va đập bên trong cơ thể.[Âm thanh] Tiếng ùng ục nghèn nghẹt trong nước/Tiếng ho sặc sụa bùng nổ và tiếng giành giật không khí khi trồi lên mặt nước/Tiếng sột soạt của túi nilon/Tiếng rên dâm đãng vỡ vụn trước khi bị ấn trở lại nước.\nNhiều người (Theo cấu trúc không gian · Chia tư thế): ① Nằm sấp đầu bị ấn vào chậu nước, vểnh mông——Thân dưới thường chỉ chứa được một người thật đâm một lỗ, lỗ còn lại dùng dương vật giả/đồ chơi bù vào để đâm hai lỗ. ② Mặt đắp khăn ướt hoặc trùm túi nước (Đầu không bị ấn vào nước)——Phần đầu tự do, thân dưới vểnh lên không gian rộng rãi, có thể bị hai cặc thật đâm kẹp trước sau. Cả hai loại đều đi kèm với việc trói quặt hai tay ra sau. Việc đổi người diễn ra trong khoảng thời gian "Cô ấy được phép đổi khí".\nTrụ
