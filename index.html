dựa vào mùi phân biệt hướng; ⑦ Dịch khoái cảm——Ba dương vật giả trong ba lỗ nương theo động tác bò trườn mà đâm chọc, Rin trong màn biểu diễn thú cưng nhục nhã cơ thể không kiểm soát nóng lên (Sự nhục nhã giáng cấp nhân cách đan xen với phản ứng thành thật của cơ thể).'}),on({id:'p_garden_dog_first',keys:['wb_garden_dog_first'],content:'Dắt chó cái đi dạo trong đình viện · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Đây là lần đầu tiên Rin bị tước bỏ thân phận "Con người" để làm thú cưng——Tất cả những sự nhục nhã trước đây đều vẫn coi cô là "Lão đại", lần này trực tiếp giáng cấp.\nNhịp điệu bắt buộc: ① Bị hóa trang——Đàn em đeo móc mũi/bịt mắt/trói gập/nhét ba dương vật giả từng món từng món lên người, Rin "Khoan đã…… Cái này là……"; ② Kéo dây thừng——Sau khi bị tước đoạt thị giác Rin chỉ có thể dựa vào âm thanh/mùi hương, dây thừng vừa kéo cô bị ép bắt đầu bò; ③ Làm hành vi của chó——Ngoạm đồ vật/Xoay vòng/Xin ăn/"Gâu" một tiếng, sự nhục nhã của việc giáng cấp nhân cách nằm trong từng động tác; ④ Sự tương phản thanh nhã trong đình viện——Sự trang trọng tĩnh lặng của hồ cá chép/bồn nước/đèn đá tương phản với việc Rin bò trườn xin ăn; ⑤ Phần thưởng——Khi được phép dừng lại, dương vật giả được thay bằng người thật.\nSau khi xong việc: Rin nhận ra cô không chỉ bị sử dụng cơ thể, mà nhân cách cũng có thể bị giáng cấp. Tóm tắt tiếp nối ghi "Đã mở khóa dắt chó cái đi dạo trong đình viện · Lần đầu tiên giáng cấp nhân cách".\n【Cách viết · Độc quyền dắt chó cái đi dạo lần đầu】\nNhịp điệu câu cú: Bị hóa trang khởi đầu chậm (Câu dài · Đàn em đeo móc mũi/bịt mắt/trói gập/nhét ba dương vật giả từng món lên người Rin "Khoan đã…… Cái này là……") → Kéo dây thừng đột biến (Câu ngắn · Sau khi tước đoạt thị giác Rin chỉ có thể dựa vào âm thanh/mùi hương dây thừng vừa kéo cô bị ép bắt đầu bò) → Làm hành vi của chó (Câu ngắn · Ngoạm đồ vật/Xoay vòng/Xin ăn/"Gâu" một tiếng · Sự nhục nhã giáng cấp nhân cách nằm trong từng động tác) → Tương phản thanh nhã ngưng trệ (Nhịp điệu dừng lại một nhịp · Hồ cá chép/bồn nước/đèn đá trang trọng tĩnh lặng tương phản với Rin bò trườn xin ăn) → Phần thưởng thu vĩ (Giảm tốc · Khi được phép dừng lại dương vật giả được thay bằng người thật). Sức căng nằm ở sự giáng cấp nhân cách lần đầu tiên "Lần đầu tiên bị tước bỏ thân phận con người làm thú cưng".\nChi tiết kỹ thuật: ① Bị hóa trang——Đàn em đeo móc mũi/bịt mắt/trói gập/nhét ba dương vật giả từng món lên người, Rin "Khoan đã…… Cái này là……" (Mỏ neo đột biến); ② Kéo dây thừng——Sau khi tước đoạt thị giác Rin chỉ có thể dựa vào âm thanh/mùi hương, dây thừng vừa kéo cô bị ép bắt đầu bò; ③ Làm hành vi của chó——Ngoạm đồ vật/Xoay vòng/Xin ăn/"Gâu" một tiếng, sự nhục nhã giáng cấp nhân cách nằm trong từng động tác (Cốt lõi); ④ Tương phản thanh nhã——Hồ cá chép/bồn nước/đèn đá trang trọng tĩnh lặng tương phản với Rin bò trườn xin ăn (Mỏ neo tương phản đình viện); ⑤ Phần thưởng——Khi được phép dừng lại dương vật giả được thay bằng người thật (Thu vĩ); ⑥ Nhân cách có thể giáng cấp——Rin nhận ra cô không chỉ bị sử dụng cơ thể, mà nhân cách cũng có thể bị giáng cấp (Dấu ấn thu vĩ · Khác biệt với tất cả sự nhục nhã trước đây đều vẫn coi cô là lão đại).'}),on({id:'p_garden_rock',keys:['wb_garden_rock'],content:'Dã chiến hòn non bộ · Thường quy (Đại luân dâm ngoài trời trong đình viện · Giai đoạn tiếp theo của dắt chó cái). Tier1-2 Quần giao ngoài trời · Tư thế kết hợp với lâm viên.\nCốt lõi (Nói cho AI): Không còn là biểu diễn thú cưng nữa, mà là trực tiếp đại luân dâm ngoài trời ngay trong sân nhà mình. Trọng điểm là kết hợp tư thế luân dâm với các cảnh quan cụ thể của đình viện:\n  - Hòn non bộ: Mặt đá lồi lõm của hòn non bộ lởm chởm làm điểm tựa/Nằm sấp trên hòn non bộ đâm từ phía sau/Bị đè giữa các lỗ hổng của hòn non bộ/Ngồi trên tảng đá nhô ra bị đâm từ dưới lên.\n  - Bờ hồ cá chép: Banh rộng trên bờ đá ven hồ/Nửa thân rướn về phía mặt nước bị đâm từ phía sau/Hình ảnh phản chiếu dưới nước in bóng cảnh giao hợp.\n  - Phiến đá bước chân/Đèn đá: Vịn vào đèn đá đứng đâm từ phía sau/Trải ra trên phiến đá bước chân bằng phẳng.\n  - Bãi cỏ đình viện/Hành lang mái hiên: Mép chiếu Tatami dưới hành lang/Nhiều người vây quanh luân dâm trên bãi cỏ.\nThái độ trận này: Kiểu nhiệt tình mê luyến (Xem C5). Sân nhà mình không có người ngoài, buông thả hết cỡ.\nKhe hở xâm thực: Dắt chó cái chơi đủ rồi cởi trói → Chuyển ngay tại chỗ thành đại luân dâm; Hoặc trực tiếp "Phơi nắng trong sân" → Bị đè lên hòn non bộ bắt đầu.\nCảm quan độc quyền:[Xúc giác] Mặt đá hòn non bộ lạnh lẽo thô ráp cọ xát lưng cọ xát đầu gối/Bãi cỏ đâm châm chích/Hơi ấm của ánh nắng chiếu trên da và sự nóng rực bên trong cơ thể;[Thị giác] Cơ thể nhỏ bé bị gác trên hòn non bộ lởm chởm tạo thành bức tranh lâm viên/Hình ảnh phản chiếu dưới hồ cá chép/Sự chênh lệch màu sắc giữa nhục thể trắng nõn và đá xanh xám;[Khứu giác] Rêu xanh bùn đất mùi cỏ tanh/Hơi nước hồ cá chép/Bị mùi mồ hôi mùi giống cái mùi tinh dịch lấn át;[Âm thanh] Ống tre Shishi-odoshi nhỏ giọt/Cá chép quẫy nước/Tiếng đóng cọc bạch bạch vang vọng trong đình viện trống trải.\nChuyển hóa sự xấu hổ (Ban ngày tuyên dâm): Đình viện bản gia cực đạo trang trọng thanh nhã trở thành bãi luân dâm ngoài trời; Sự đảo lộn địa vị khi bị một đám thuộc hạ dùng công khai ngay trong sân nhà tổ của mình.\nKết toán: +Trung thành (Cao); Lần đầu tiên → Độ đọa lạc +; Tóm tắt tiếp nối ghi "Đã mở khóa dã chiến hòn non bộ".\n【Cách viết · Độc quyền dã chiến hòn non bộ】\nNhịp điệu câu cú: Tùy theo địa điểm lâm viên——Hòn non bộ (Câu ngắn · Mặt đá lởm chởm banh rộng/Bị gác trên hòn non bộ) → Bờ hồ cá chép (Mức độ trung bình · Bờ đá ven hồ banh rộng/Nửa thân rướn mặt nước bị đâm từ phía sau/Hình ảnh phản chiếu in bóng giao hợp) → Phiến đá bước chân đèn đá (Mức độ trung bình · Vịn đèn đá đứng đâm từ phía sau/Phiến đá bằng phẳng trải ra) → Bãi cỏ đình viện hành lang (Câu ngắn bắn liên thanh · Mép chiếu Tatami dưới hành lang/Bãi cỏ nhiều người vây quanh luân dâm). Dắt chó cái chơi đủ cởi trói tại chỗ chuyển đại luân dâm = Khe hở xâm thực chuyển đổi nhịp điệu.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự tương phản bức tranh lâm viên (Cơ thể nhỏ bé bị gác hòn non bộ lởm chởm/Hình ảnh phản chiếu hồ cá chép/Nhục thể trắng nõn và đá xanh xám chênh lệch màu sắc) + Đình viện bản gia cực đạo trang trọng thanh nhã thành bãi luân dâm ngoài trời làm cốt lõi, Xúc giác (Mặt đá hòn non bộ lạnh lẽo thô ráp cọ xát lưng cọ xát đầu gối/Bãi cỏ đâm châm chích/Ánh nắng ấm áp và bên trong cơ thể nóng rực), Âm thanh (Ống tre Shishi-odoshi nhỏ giọt/Cá chép quẫy nước/Tiếng đóng cọc bạch bạch vang vọng đình viện trống trải).\nTiêu điểm miêu tả cơ thể: Hòn non bộ (Bức tranh lâm viên bị gác trên hòn non bộ lởm chởm) · Hồ cá chép (Hình ảnh phản chiếu in bóng giao hợp) · Nhục thể trắng nõn và đá xanh xám chênh lệch màu sắc.\nChi tiết kỹ thuật: ① Quần giao ngoài trời · Tư thế kết hợp lâm viên——Mặt đá hòn non bộ thô ráp banh rộng/Bờ đá ven hồ cá chép/Phiến đá bước chân đèn đá/Bãi cỏ đình viện hành lang, tư thế kết hợp cấu trúc lâm viên; ② Thái độ trận này——Kiểu nhiệt tình mê luyến, sân nhà mình không có người ngoài buông thả hết cỡ; ③ Khe hở xâm thực——Dắt chó cái chơi đủ rồi cởi trói tại chỗ chuyển thành đại luân dâm, hoặc trực tiếp "Phơi nắng trong sân" bị đè lên hòn non bộ bắt đầu; ④ Tương phản lâm viên (Cốt lõi)——Đình viện bản gia cực đạo trang trọng thanh nhã trở thành bãi luân dâm ngoài trời, sự đảo lộn địa vị khi bị một đám thuộc hạ dùng công khai ngay trong sân nhà tổ của mình; ⑤ Xúc cảm mặt đá——Mặt đá hòn non bộ lạnh lẽo thô ráp cọ xát lưng cọ xát đầu gối (Dấu vết tạm thời · Đồng tử La Sát hồi phục); ⑥ Tiếng vang trống trải——Tiếng đóng cọc bạch bạch vang vọng trong đình viện trống trải.'}),on({id:'p_garden_rock_first',keys:['wb_garden_rock_first'],content:'Dã chiến hòn non bộ · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Đình viện nhà mình vốn là nơi thanh nhã——Lần đầu tiên phát hiện ngay cả không gian trang trọng nhất cũng biến thành bãi chiến trường hoang dã.\nNhịp điệu bắt buộc: ① Dắt chó cái chơi đủ——Đàn em cởi trói cho Rin, tưởng là đã kết thúc; ② "Vậy thì chơi thế này đi"——Một tên đàn em nào đó đẩy cô lên hòn non bộ; ③ Luân dâm trên hòn non bộ——Mặt đá lởm chởm cọ xước da (Dấu vết tạm thời), Rin bị đè ngay giữa lâm viên nhà tổ của mình bị nhiều người luân dâm; ④ Sự tương phản của hồ cá chép/đèn đá——Cảnh quan thanh nhã trở thành phông nền; ⑤ Hành lang thu vĩ——Sau khi kết thúc Rin nằm sấp bên mép hành lang thở dốc, tinh dịch chảy trên chiếu Tatami.\nSau khi xong việc: Rin nhận ra mỗi một góc trong đình viện nhà mình đều đã bị viết lại ngữ nghĩa. Tóm tắt tiếp nối ghi "Đã mở khóa dã chiến hòn non bộ".\n【Cách viết · Độc quyền dã chiến hòn non bộ lần đầu】\nNhịp điệu câu cú: Dắt chó cái chơi đủ khởi đầu chậm (Câu dài · Đàn em cởi trói cho Rin tưởng là kết thúc) → "Vậy thì chơi thế này đi" đột biến (Câu ngắn · Một tên đàn em đẩy cô lên hòn non bộ) → Luân dâm hòn non bộ (Câu ngắn bắn liên thanh · Mặt đá lởm chởm cọ xước da dấu vết tạm thời · Rin bị đè giữa lâm viên nhà tổ bị nhiều người luân dâm) → Hồ cá chép đèn đá tương phản ngưng trệ (Nhịp điệu dừng lại một nhịp · Cảnh quan thanh nhã thành phông nền) → Hành lang thu vĩ (Giảm tốc · Sau khi kết thúc Rin nằm sấp mép hành lang thở dốc tinh dịch chảy chiếu Tatami). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Đình viện nhà mình nơi thanh nhã biến thành bãi chiến trường hoang dã".\nChi tiết kỹ thuật: ① Dắt chó cái chơi đủ——Đàn em cởi trói cho Rin tưởng là kết thúc (Thư thái); ② "Vậy thì chơi thế này đi"——Một tên đàn em đẩy cô lên hòn non bộ (Mỏ neo đột biến); ③ Luân dâm hòn non bộ——Mặt đá lởm chởm cọ xước da (Dấu vết tạm thời), Rin bị đè ngay giữa lâm viên nhà tổ của mình bị nhiều người luân dâm; ④ Hồ cá chép đèn đá tương phản——Cảnh quan thanh nhã trở thành phông nền (Mỏ neo tương phản lâm viên); ⑤ Hành lang thu vĩ——Sau khi kết thúc Rin nằm sấp bên mép hành lang thở dốc tinh dịch chảy trên chiếu Tatami; ⑥ Viết lại ngữ nghĩa——Rin nhận ra mỗi một góc trong đình viện nhà mình đều đã bị viết lại ngữ nghĩa (Dấu ấn thu vĩ).'}),on({id:'p_ancestor_sfw',keys:['wb_ancestor_sfw'],content:'Bái tế tổ tiên · SFW. Rin dẫn đàn em đến tổ sư đường, chính thức bái tế trước bài vị cha mẹ——Thắp hương, chắp tay, nói nhỏ kể lại tình hình gần đây ("Chuyện của Kujo-kai dạo này tiến triển……"). Nghi thức trang nghiêm của sự truyền thừa cực đạo, SFW. Câu ngắn ngẫu nhiên: "Rin đứng lặng hồi lâu trước bài vị cha mẹ" "Rin thắp ba nén nhang, chắp tay cầu nguyện" "Rin nói nhỏ kể lại tình hình gần đây với bài vị tổ tiên".'}),on({id:'p_ancestor',keys:['wb_ancestor'],content:'Bái tế tổ tiên · NSFW (Biểu diễn dâm loạn cưỡng chế trong linh đường). Tier2 Sự báng bổ đảo lộn không gian thần thánh · Biểu diễn dâm loạn cưỡng chế.\nLợi dụng cơ sở vật chất: Tổ sư đường/Bàn thờ Phật/Ngay trước bài vị (Bị liệt tổ liệt tông "Nhìn chằm chằm")/Bàn thờ làm mặt phẳng chịu lực/Tư thế quỳ lạy trên bồ đoàn thuận đà chuyển thành quỳ bò/Lư hương nhang vòng, di ảnh treo trên tường, rèm che gia huy/Nơi cử hành nghi thức trang nghiêm của một môn phái cực đạo bị coi như bãi luân dâm.\nBiểu diễn dâm loạn cưỡng chế (Độc quyền của trận này · Không tự nguyện nhưng bị cưỡng chế hoàn thành): Đàn em yêu cầu Rin hoàn thành "Nghi thức" dâm loạn trước bài vị tổ tiên——Vừa bị luân dâm vừa bị yêu cầu đọc tế văn/Báo cáo với tổ tiên, duy trì tư thế bái tế (Chắp tay/Dập đầu) bị đâm xuyên từ phía sau, lên đỉnh thất thố dưới sự chứng kiến của bài vị. Đem quy trình trang trọng của nghi thức thần thánh từng hạng mục một sắc tình hóa.\nKhe hở xâm thực: Quỳ lạy dập đầu → Duy trì tư thế dập đầu bị đâm vào từ phía sau; Cúi người thắp hương → Vạt váy bị lật lên. Cô vẫn đang đọc tế văn/chắp tay, cơ thể đã bị chiếm dụng.\nCảm quan độc quyền:[Thị giác] Luân dâm dưới sự chứng kiến của di ảnh liệt tổ liệt tông/Rin vẫn duy trì tư thế bái tế bị đâm vào/Khói nhang lượn lờ xuyên qua chỗ giao hợp;[Xúc giác] Cảm giác của bồ đoàn chiếu Tatami, sàn nhà lạnh lẽo;[Khứu giác] Khói nhang trầm hương trang nghiêm bị mùi giống cái mùi tinh dịch làm bẩn (Sự đảo lộn mùi hương là cốt lõi);[Âm thanh] Trong đường cực kỳ yên tĩnh khiến mỗi tiếng bạch bạch đều chói tai/Âm vang tụng kinh gõ mõ/Tiếng bấc nến nổ lách tách của ánh nến lay động;[Từ tượng thanh] Tiếng bạch bạch vang vọng trong đường/Tiếng đọc tế văn của Rin bị tiếng bạch bạch đánh gãy thành tiếng ❤ vỡ vụn.\nChuyển hóa sự xấu hổ: Bị đụ trước bài vị tổ tiên = Sự báng bổ triệt để đối với gia môn/huyết mạch/tín ngưỡng; Sự truyền thừa thần thánh của dòng máu La Sát bị vấy bẩn công khai; Càng trang nghiêm thần thánh càng không dám thất thố, cố nhịn ngược lại càng nhạy cảm hơn.\nBiến thể giai đoạn sau nối tiếp tuyến sinh đẻ: Xem wb_ancestor_breeding (Tuyên thệ gieo giống đại nghĩa).\nKết toán: +Trung thành (Trung bình); Lần đầu tiên → Độ đọa lạc + (Cột mốc); Tóm tắt tiếp nối (turning): "Đã bị cưỡng chế hoàn thành biểu diễn dâm loạn trong tổ sư đường · Sự báng bổ trước bài vị tổ tiên đã hoàn thành."\n【Cách viết · Độc quyền bái tế tổ tiên】\nNhịp điệu câu cú: "Nghi thức sắc tình hóa" của biểu diễn dâm loạn cưỡng chế làm trục chính——Duy trì tư thế bái tế (Nhịp chậm · Chắp tay/Dập đầu bị đâm xuyên từ phía sau · Quy trình trang trọng từng hạng mục sắc tình hóa) ↔ Đọc tế văn bị đánh gãy (Câu ngắn · Đọc tế văn/Báo cáo với tổ tiên bị tiếng bạch bạch đánh gãy · Tiếng ❤ vỡ vụn kẹp vào tế văn). Nhịp điệu được thúc đẩy bởi "Quy trình trang trọng của nghi thức thần thánh từng hạng mục sắc tình hóa", điều khoản này tập trung vào sự sắc tình hóa của "Biểu diễn cưỡng chế".\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự đảo lộn mùi hương (Khói nhang trầm hương trang nghiêm bị mùi giống cái mùi tinh dịch làm bẩn · Cốt lõi) + Báng bổ không gian thần thánh (Bị đụ trước bài vị tổ tiên = Sự báng bổ triệt để đối với gia môn/huyết mạch/tín ngưỡng) làm cốt lõi, Âm thanh (Trong đường cực kỳ yên tĩnh khiến mỗi tiếng bạch bạch chói tai/Âm vang tụng kinh gõ mõ/Đọc tế văn bị tiếng bạch bạch đánh gãy thành tiếng ❤ vỡ vụn), Thị giác (Luân dâm dưới sự chứng kiến của di ảnh liệt tổ liệt tông/Tư thế bái tế bị đâm vào/Khói nhang lượn lờ xuyên qua chỗ giao hợp).\nTiêu điểm miêu tả cơ thể: Tư thế (Duy trì tư thế bái tế dập đầu bị đâm xuyên từ phía sau/Chắp tay không dám buông xuống) · Khuôn mặt (Đọc tế văn kẹp vào tiếng ❤ vỡ vụn) · Bài vị (Liệt tổ liệt tông chứng kiến).\nChi tiết kỹ thuật: ① Biểu diễn dâm loạn cưỡng chế (Độc quyền của trận này · Không tự nguyện nhưng bị cưỡng chế hoàn thành)——Đàn em yêu cầu Rin hoàn thành "Nghi thức" dâm loạn trước bài vị tổ tiên: Vừa bị luân dâm vừa bị yêu cầu đọc tế văn/Báo cáo với tổ tiên, duy trì tư thế bái tế (Chắp tay/Dập đầu) bị đâm xuyên từ phía sau, lên đỉnh thất thố dưới sự chứng kiến của bài vị, đem quy trình trang trọng của nghi thức thần thánh từng hạng mục sắc tình hóa; ② Lợi dụng cơ sở vật chất——Tổ sư đường/Bàn thờ Phật/Ngay trước bài vị (Bị liệt tổ liệt tông "Nhìn chằm chằm")/Bàn thờ làm mặt phẳng chịu lực/Tư thế quỳ lạy trên bồ đoàn thuận đà chuyển thành quỳ bò/Lư hương nhang vòng di ảnh treo trên tường rèm che gia huy; ③ Khe hở xâm thực——Quỳ lạy dập đầu → Duy trì tư thế dập đầu bị đâm vào từ phía sau; Cúi người thắp hương → Vạt váy bị lật lên, cô vẫn đang đọc tế văn/chắp tay cơ thể đã bị chiếm dụng; ④ Sự đảo lộn mùi hương (Cốt lõi)——Khói nhang trầm hương trang nghiêm bị mùi giống cái mùi tinh dịch làm bẩn; ⑤ Cố nhịn càng nhạy cảm——Càng trang nghiêm thần thánh càng không dám thất thố, cố nhịn ngược lại càng nhạy cảm hơn; ⑥ Biến thể giai đoạn sau——Nối tiếp tuyến sinh đẻ wb_ancestor_breeding (Tuyên thệ gieo giống đại nghĩa).'}),on({id:'p_ancestor_first',keys:['wb_ancestor_first'],content:'Bái tế tổ tiên · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Bài vị cha mẹ là trụ cột tinh thần cho việc báo thù của Rin——Lần đầu tiên phát hiện ngay cả nơi thiêng liêng nhất này cũng bị đàn em báng bổ.\nNhịp điệu bắt buộc: ① Khởi đầu bái tế——Rin nghiêm túc thắp hương, vốn định báo cáo tiến độ báo thù với cha mẹ; ② Đàn em theo vào tổ sư đường——"Vệ sĩ đi cùng" của Đại tiểu thư, từ từ vây lại; ③ Bị đâm vào lúc dập đầu——Rin trong tư thế dập đầu bị đâm vào từ phía sau, đôi tay chắp lại không dám buông xuống, trong tế văn đang đọc kẹp vào tiếng ❤ vỡ vụn; ④ Luân dâm duy trì bái tế——Nhiều người luân phiên, Rin bị yêu cầu "Tiếp tục đọc đi, tổ tiên đang nghe đấy"; ⑤ Đứng dậy chỉnh đốn——Sau khi kết thúc Rin thắp hương lại, giả vờ như mọi chuyện vẫn bình thường, nhưng tinh dịch chảy trên chiếu Tatami.\nSau khi xong việc: Rin nhận ra ngay cả bài vị cha mẹ cũng không bảo vệ được cô——Đây là một trong những điểm sụp đổ tinh thần lớn nhất của cô, nhưng cơ thể vẫn thành thật. Tóm tắt tiếp nối ghi "Đã mở khóa dâm loạn cưỡng chế trong tổ sư đường".\n【Cách viết · Độc quyền bái tế tổ tiên lần đầu】\nNhịp điệu câu cú: Khởi đầu bái tế chậm rãi (Câu dài · Rin nghiêm túc thắp hương vốn định báo cáo tiến độ báo thù với cha mẹ) → Đàn em theo vào vây lại đột biến (Câu ngắn · "Vệ sĩ đi cùng" của Đại tiểu thư từ từ vây lại) → Bị đâm vào lúc dập đầu (Mức độ trung bình · Rin trong tư thế dập đầu bị đâm vào từ phía sau đôi tay chắp lại không dám buông xuống đọc tế văn kẹp vào tiếng ❤ vỡ vụn) → Luân dâm duy trì bái tế (Câu ngắn · Nhiều người luân phiên Rin bị yêu cầu "Tiếp tục đọc đi tổ tiên đang nghe đấy") → Đứng dậy chỉnh đốn thu vĩ (Giảm tốc · Sau khi kết thúc Rin thắp hương lại giả vờ như mọi chuyện vẫn bình thường nhưng tinh dịch chảy chiếu Tatami). Sức căng nằm ở sự sụp đổ tinh thần lần đầu tiên "Bài vị cha mẹ là trụ cột tinh thần báo thù lại bị báng bổ".\nChi tiết kỹ thuật: ① Khởi đầu bái tế——Rin nghiêm túc thắp hương vốn định báo cáo tiến độ báo thù với cha mẹ (Thư thái); ② Đàn em theo vào vây lại——"Vệ sĩ đi cùng" của Đại tiểu thư từ từ vây lại (Mỏ neo đột biến); ③ Bị đâm vào lúc dập đầu——Rin trong tư thế dập đầu bị đâm vào từ phía sau, đôi tay chắp lại không dám buông xuống, trong tế văn đang đọc kẹp vào tiếng ❤ vỡ vụn (Tương phản cốt lõi); ④ Luân dâm duy trì bái tế——Nhiều người luân phiên Rin bị yêu cầu "Tiếp tục đọc đi, tổ tiên đang nghe đấy"; ⑤ Đứng dậy chỉnh đốn——Sau khi kết thúc Rin thắp hương lại giả vờ như mọi chuyện vẫn bình thường, nhưng tinh dịch chảy trên chiếu Tatami (Thu vĩ); ⑥ Sụp đổ tinh thần——Rin nhận ra ngay cả bài vị cha mẹ cũng không bảo vệ được cô, đây là một trong những điểm sụp đổ tinh thần lớn nhất, nhưng cơ thể vẫn thành thật (Dấu ấn thu vĩ · Sự giằng xé giữa sụp đổ tinh thần và cơ thể thành thật).'}),on({id:'p_attitude_s0',keys:['wb_attitude_s0'],content:'[Thái độ · Cố chấp · Xem ATTITUDE_LAYER]'}),on({id:'p_attitude_s1',keys:['wb_attitude_s1'],content:'[Thái độ · Dao động · Xem ATTITUDE_LAYER]'}),on({id:'p_attitude_s2',keys:['wb_attitude_s2'],content:'[Thái độ · Sụp đổ · Xem ATTITUDE_LAYER]'}),on({id:'p_attitude_s3',keys:['wb_attitude_s3'],content:'[Thái độ · Hóa lợn nái · Xem ATTITUDE_LAYER]'}),on({id:'p_recruit_sfw',keys:['wb_recruit_sfw'],content:'Chiêu mộ đàn em · SFW · Viết tóm tắt. Chính văn triển khai theo hướng văn án được đưa ra trong [Hướng văn án] (Hệ thống đã chọn sẵn tuyến dựa theo tỷ lệ Uy vọng cực đạo vs Dâm danh, không tự ý đổi tuyến): Tuyến cực đạo = Đàn ông vì danh tiếng võ uy của Kujo-kai mà đến đầu quân; Tuyến dâm danh = Người ứng tuyển đã xem AV của Đại tiểu thư/Nhắm vào "Tư cách dâng hiến" mà đến, cán bộ đăng ký giả vờ không biết. Viết 1-2 đoạn cảnh nhỏ (Đến gõ cửa/Dâng danh thiếp/Thần thái phỏng vấn), giao phó số người chiêu mộ được, không viết chính văn NSFW. Kết quả: +Đàn em (Số lượng do hệ thống kết toán, số người trong chính văn nhất trí với kết toán).'}),on({id:'p_attack',keys:['wb_attack'],content:'Tấn công cứ điểm · SFW. Xem tương quan vũ lực, trừ tiền + đàn em. Giai đoạn đầu chết 1-2 người thì xót xa, giai đoạn sau chết vài chục người cũng không sao (Tự sự bằng con số cảm giác quy mô). Thắng = Khu vực có thể bị đánh bại, giảm độ khó địa bàn; Bại = Tổn thất đàn em + Độ ổn định giảm. AI viết chiến báo (Khái quát không có tên người → Thùng 3).'}),on({id:'p_defend_turf',keys:['wb_defend_turf'],content:'Quấy rối địa bàn · Trục xuất · SFW. Phán đoán chiến lực đồn trú, thông thường không giảm quân số. Đánh lui → Cướp được tiền; Chưa đánh lui → Độ ổn định ↓. AI viết chiến báo (Khái quát không có tên người → Thùng 3).'}),on({id:'p_scout_sfw',keys:['wb_scout_sfw'],content:'Thăm dò/Phái trú · SFW. Triển khai đàn em khóa chặt không thể gián đoạn (Gián đoạn = Thất bại). Đến hạn thành công → Giảm độ khó địa bàn/Tăng độ ổn định. Chiếm ô hành động nhưng không cần viết thêm, xuất ra kiểu bản tin vắn tắt.'}),on({id:'p_reward_thugs',keys:['wb_reward_thugs'],content:'Khao thưởng đàn em · SFW. Kujo-kai phát tiền/bày tiệc rượu khao thưởng đàn em dưới trướng, mua chuộc lòng người. Mẫu ngắn gọn: "Đại tiểu thư trích một khoản tiền khao thưởng các anh em, rượu thịt no say, lòng người tạm yên." Trừ tiền → Trung thành cực đạo +. AI khái quát không có tên người (Thùng 3), kiểu bản tin vắn tắt.'}),on({id:'p_dine_sfw',keys:['wb_dine_sfw'],content:'Ra ngoài ăn cơm · SFW. Rin dẫn đàn em ra ngoài dùng bữa, vừa ăn vừa bàn chuyện làm ăn/trêu chọc, một bữa cơm bình thường. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_amusement_sfw',keys:['wb_amusement_sfw'],content:'Đi công viên giải trí · SFW. Vui chơi vòng đu quay ngựa gỗ/nhà ma/vòng đu quay khổng lồ v.v., sự thư giãn hiếm hoi. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_beach_sfw',keys:['wb_beach_sfw'],content:'Đi bãi biển · SFW. Nghịch nước bên bờ biển, dạo mát phơi nắng. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_mall_sfw',keys:['wb_mall_sfw'],content:'Đi trung tâm thương mại · SFW. Dạo phố mua sắm, mua đồ. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_camping_sfw',keys:['wb_camping_sfw'],content:'Cắm trại trong rừng · SFW. Dựng trại ngoài dã ngoại, nhóm lửa nấu ăn, ngắm sao. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_hiking_sfw',keys:['wb_hiking_sfw'],content:'Leo núi · SFW. Leo núi đi bộ, lên đỉnh ngắm cảnh xa. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_street_sfw',keys:['wb_street_sfw'],content:'Đi dạo trên phố · SFW. Đi dạo nhàn nhã trên phố, hóng gió giải khuây. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_festival_sfw',keys:['wb_festival_sfw'],content:'Đi dạo lễ hội · SFW. Lễ hội mùa hè/ngày lễ, vớt cá vàng, ăn vặt, xem pháo hoa. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_concert_sfw',keys:['wb_concert_sfw'],content:'Xem concert · SFW. Nghe nhạc trực tiếp, lắc lư theo nhịp điệu. Viết tóm tắt hoặc mẫu ngắn gọn.'}),on({id:'p_dailytoy_sfw',keys:['wb_dailytoy_sfw'],content:'Sinh hoạt thường ngày trong dinh thự · SFW. Những sinh hoạt sinh lý cơ bản của Đại tiểu thư trong dinh thự Kujo: Ăn uống/Ngồi nghỉ/Đi vệ sinh/Chải chuốt. Cuộc sống của thiên kim dinh thự mọi thứ như thường, viết tóm tắt hoặc mẫu ngắn gọn ("Đại tiểu thư đã dùng bữa trưa" "Đại tiểu thư chải chuốt xong").'}),on({id:'p_dailytoy',keys:['wb_dailytoy'],content:'Dâm cụ hóa sinh hoạt thường ngày · Thường quy. Sau khi dinh thự Kujo luân lạc thành dâm trát, những sinh hoạt sinh lý cơ bản của Rin khắp nơi đều bị dâm cụ hóa——Ăn uống ỉa đái ngồi nằm đều không tránh khỏi việc bị đâm bị lấp đầy.\nCơ chế (Nhiều bối cảnh luân phiên · Chọn ngẫu nhiên một hoặc nối tiếp nhau):\n① Bồn cầu gậy massage: Vòng bồn cầu gắn gậy massage rung/dương vật giả, đi vệ sinh = ngồi lên bị đâm bị rung, việc bài tiết và bị lấp đầy tiến hành cùng lúc, xấu hổ kẹp lấy dị vật để giải quyết.\n② Bộ đồ ăn dương vật giả: Dụng cụ ăn uống đổi thành hình dáng dương vật giả, "Đút ăn" kiểu deepthroat——Ngậm bộ đồ ăn hình dương vật giả để nuốt, khoang miệng bị coi như thực quản để thao, vừa ăn vừa bị đâm họng.\n③ Ghế nâng hạ dâm cụ: Ghế ngồi gắn dương vật giả có thể nâng hạ, Rin vừa ngồi xuống lập tức bị đâm xuyên, ngồi làm việc thường ngày đều bị cắm, đứng lên ngồi xuống đều là đâm rút.\nLực chịu đựng → Khoái cảm: Nhu cầu sinh lý cơ bản (Đói/Mót/Ngồi nghỉ) bị cưỡng chế trói buộc với việc bị đâm, bản năng xui khiến cô đi thỏa mãn nhu cầu sinh lý = Bản năng xui khiến cô đi bị đụ; Lâu dần cơ thể đánh dấu bằng giữa "Thường ngày" và "Bị lấp đầy", nhìn thấy bồn cầu/bộ đồ ăn/ghế ngồi là đã ướt trước.\nCảm quan độc quyền:[Thị giác] Bụng dưới nhô lên khi ngồi lên bồn cầu/Hai má phồng lên khi ngậm bộ đồ ăn dương vật giả/Độ dài ngập vào khoảnh khắc ngồi xuống ghế.[Xúc giác] Sự rung động trong cơ thể khi đi vệ sinh/Cảm giác cùn đục đâm họng khi ăn/Sự căng tức bị nong rộng khi ngồi xuống.[Âm thanh] Tiếng vo ve rung động của bồn cầu/Tiếng nuốt lẫn với tiếng nôn khan/Tiếng cơ khí nâng hạ của ghế và tiếng rên rỉ nghèn nghẹt khi cô ngồi xuống.\nTrục sảng khoái: Sự luân lạc triệt để của sinh hoạt thường ngày (Ngay cả nhu cầu sinh lý cơ bản nhất cũng bị tính dục hóa) + Không có chỗ trốn (Ở trong chính nhà mình, làm những việc bình thường nhất cũng bị đụ). Giọng điệu cơ bản: Cảm giác thường ngày hoang đường, kiểu quen thuộc như ếch luộc trong nước ấm.\nCấm kỵ: Miêu tả bài tiết điểm tới là dừng không nặng đô, tiêu điểm vĩnh viễn là "Khoái cảm khi bị đâm bị lấp đầy" chứ không phải chất bài tiết. Dụng cụ đều là đồ chơi tình thú, không gây thương tích.\nKết toán: Lần đầu tiên các loại → Độ đọa lạc +; Tóm tắt tiếp nối ghi "Đã dâm cụ hóa: Bồn cầu/Bộ đồ ăn/Ghế ngồi (Mục tương ứng)".\n【Cách viết · Độc quyền dâm cụ hóa sinh hoạt thường ngày】\nNhịp điệu câu cú: Tùy theo bối cảnh luân phiên——Bồn cầu = Đi vệ sinh và bị lấp đầy cùng lúc (Nhịp chậm · Kẹp lấy dị vật giải quyết); Bộ đồ ăn dương vật giả = Đút ăn kiểu deepthroat (Mức độ trung bình · Ngậm nuốt vừa ăn vừa bị đâm họng); Ghế nâng hạ = Đứng lên ngồi xuống đều đâm rút (Câu ngắn · Mỗi lần ngồi xuống lập tức đâm xuyên). Nhịp điệu bị "Nhu cầu sinh lý cơ bản" thúc đẩy——Bản năng đói/mót/ngồi nghỉ xui khiến cô thỏa mãn nhu cầu sinh lý = Bản năng xui khiến bị đụ, quen thuộc kiểu ếch luộc nước ấm.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự hoang đường tương phản của "Động tác thường ngày bị tính dục hóa" làm cốt lõi, xúc giác của sự rung động trong cơ thể/cảm giác cùn đục đâm họng/căng tức nong rộng + âm thanh của bồn cầu vo ve/nuốt nôn khan/tiếng cơ khí ghế.\nChi tiết kỹ thuật (Bối cảnh tức là dâm cụ): ① Bồn cầu gậy massage——Vòng bồn cầu gắn gậy massage rung/dương vật giả, đi vệ sinh = ngồi lên bị đâm bị rung, bài tiết và bị lấp đầy cùng lúc (Bối cảnh ①); ② Bộ đồ ăn dương vật giả——Dụng cụ ăn uống đổi hình dáng dương vật giả, đút ăn kiểu deepthroat ngậm nuốt khoang miệng bị coi như thực quản thao (Bối cảnh ②); ③ Ghế nâng hạ dâm cụ——Ghế ngồi gắn dương vật giả có thể nâng hạ, vừa ngồi xuống lập tức đâm xuyên đứng lên ngồi xuống đều đâm rút (Bối cảnh ③); ④ Bản năng hiếp bức——Nhu cầu sinh lý cơ bản (Đói/Mót/Ngồi nghỉ) bị cưỡng chế trói buộc với việc bị đâm, bản năng xui khiến thỏa mãn nhu cầu sinh lý = Bản năng xui khiến bị đụ; ⑤ Quen thuộc——Lâu dần cơ thể đánh dấu bằng giữa "Thường ngày" và "Bị lấp đầy", nhìn thấy bồn cầu/bộ đồ ăn/ghế ngồi là ướt trước (Ếch luộc nước ấm); ⑥ Cấm kỵ——Bài tiết điểm tới là dừng không nặng đô, tiêu điểm vĩnh viễn là "Khoái cảm khi bị đâm bị lấp đầy" không phải chất bài tiết, dụng cụ đều là đồ chơi tình thú không gây thương tích.'}),on({id:'p_dailytoy_first',keys:['wb_dailytoy_first'],content:'Dâm cụ hóa sinh hoạt thường ngày · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Lần đầu tiên phát hiện "Ở trong chính nhà mình làm những việc bình thường nhất cũng không thoát được nữa rồi"——Mảnh đất tịnh thổ cuối cùng của cuộc sống riêng tư luân lạc.\nNhịp điệu bắt buộc: ① Sinh hoạt thường ngày không hề phòng bị——Rin giống như mọi ngày đi dùng bữa/đi vệ sinh/ngồi xuống, tưởng rằng chỉ là một khoảnh khắc bình thường; ② Sự đâm xuyên đột ngột——Dâm cụ trong bộ đồ ăn/bồn cầu/ghế ngồi không hề có điềm báo trước lấp đầy vào, cô kinh ngạc cứng đờ tại chỗ; ③ Sự hiếp bức của nhu cầu sinh lý——Cơn đói/mót/mỏi chân ép cô không thể không tiếp tục (Không thể không ăn không ỉa không ngồi), chỉ có thể ngậm/ngồi/kẹp để hoàn thành; ④ Sự phản bội của cơ thể——Vốn dĩ nên tập trung vào nhu cầu sinh lý, thân dưới lại ướt trước nóng trước, cô xấu hổ vì ngay cả những lúc thế này cũng có phản ứng; ⑤ Nỗi sợ hãi của sự quen thuộc——Khi kết thúc cô nhận ra, sau này mỗi lần dùng bữa đi vệ sinh ngồi nằm đều sẽ như thế này, bản thân sinh hoạt thường ngày đã bị viết lại.\nSau khi xong việc: Rin lần đầu tiên hiểu ra hai chữ "Thường ngày" đối với cô đã mất đi hiệu lực. Tóm tắt tiếp nối ghi "Đã mở khóa dâm cụ hóa sinh hoạt thường ngày · Cuộc sống riêng tư luân lạc".\n【Cách viết · Độc quyền dâm cụ hóa sinh hoạt thường ngày lần đầu】\nNhịp điệu câu cú: Sinh hoạt thường ngày không phòng bị khởi đầu chậm (Câu dài · Rin giống mọi ngày đi dùng bữa/đi vệ sinh/ngồi xuống tưởng khoảnh khắc bình thường) → Đâm xuyên đột ngột đột biến (Câu ngắn · Dâm cụ trong bộ đồ ăn/bồn cầu/ghế ngồi không điềm báo lấp đầy vào cô kinh ngạc cứng đờ tại chỗ) → Nhu cầu sinh lý hiếp bức (Nhịp điệu bị bản năng giằng xé——Đói/mót/mỏi chân ép cô không thể không tiếp tục chỉ có thể ngậm/ngồi/kẹp hoàn thành) → Cơ thể phản bội (Nhịp điệu ngưng trệ · Vốn dĩ nên tập trung nhu cầu sinh lý thân dưới lại ướt trước nóng trước cô xấu hổ vì ngay cả lúc này cũng có phản ứng) → Nỗi sợ hãi quen thuộc thu vĩ (Giảm tốc · Nhận ra sau này mỗi lần dùng bữa đi vệ sinh ngồi nằm đều sẽ như thế này bản thân sinh hoạt thường ngày bị viết lại). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Mảnh đất tịnh thổ cuối cùng của cuộc sống riêng tư luân lạc".\nChi tiết kỹ thuật: ① Không phòng bị——Rin giống mọi ngày đi dùng bữa/đi vệ sinh/ngồi xuống tưởng khoảnh khắc bình thường (Sự tương phản thư thái); ② Đâm xuyên đột ngột——Dâm cụ trong bộ đồ ăn/bồn cầu/ghế ngồi không điềm báo lấp đầy vào cô kinh ngạc cứng đờ tại chỗ (Mỏ neo đột biến); ③ Sinh lý hiếp bức——Đói/mót/mỏi chân ép cô không thể không tiếp tục (Không thể không ăn không ỉa không ngồi), chỉ có thể ngậm/ngồi/kẹp hoàn thành (Bản năng hiếp bức); ④ Cơ thể phản bội——Vốn dĩ nên tập trung nhu cầu sinh lý thân dưới lại ướt trước nóng trước, xấu hổ vì ngay cả lúc này cũng có phản ứng (Rối loạn cốt lõi); ⑤ Nỗi sợ hãi quen thuộc——Khi kết thúc nhận ra sau này mỗi lần dùng bữa đi vệ sinh ngồi nằm đều sẽ như thế này, bản thân sinh hoạt thường ngày bị viết lại (Dấu ấn thu vĩ).'}),on({id:'p_garbage_sfw',keys:['wb_garbage_sfw'],content:'Bảo thuộc hạ dọn dẹp · SFW. Đại tiểu thư phân phó đàn em dọn dẹp sạch sẽ dinh thự, dọn dẹp đình viện sảnh đường. Viết tóm tắt hoặc mẫu ngắn gọn ("Đại tiểu thư sai người quét dọn dinh thự một phen" "Đình viện sảnh đường cuối cùng cũng thấy sạch sẽ").'}),on({id:'p_garbage',keys:['wb_garbage'],content:'Dâm loạn trong đống rác · Thường quy. Dinh thự Kujo vốn dĩ nên được "Dọn dẹp", ngược lại bị đám đàn em cố ý chất thành bãi rác——Đầy đất là bao cao su đã dùng, vỏ chai rượu không, thức ăn thừa, quần áo bẩn, Rin bị đè trong đống rác của chính dinh thự nhà mình đã luân lạc này để luân dâm.\nCơ chế: Kéo căng sự tương phản giữa "Dinh thự uy nghiêm" và "Bãi rác bẩn thỉu"——Dinh thự thiên kim từng không vương một hạt bụi, nay Rin bị đè trong đống rác bị nhiều người sử dụng, trên người dính tinh dịch vết bẩn rác rưởi. Đàn em lấy cớ "Dù sao cũng là cô gọi người đến dọn dẹp mà" để nhục nhã.\nLực chịu đựng → Khoái cảm: Sự kích thích của môi trường thô ráp bẩn thỉu (Sau lưng cấn vỏ chai không/Mặt áp xuống sàn bẩn/Trên người phủ rác rưởi) xếp chồng với khoái cảm bị đâm; Sự nhục nhã vật hóa (Bị coi như một món đồ dùng trong đống rác) dịch thành khoái cảm nhục nhã.\nCảm quan độc quyền:[Thị giác] Sự tương phản của cơ thể trắng trẻo của Rin giữa đầy đất bao cao su vỏ chai rượu cặn bã/Tinh dịch vết bẩn dính trên người/Bị rác rưởi vùi lấp một nửa chỉ lộ ra thân dưới đang bị đụ.[Xúc giác] Vật cứng cấn sau lưng/Vết bẩn dính dớp/Sự ngột ngạt khi bị đè vào rác.[Âm thanh] Vỏ chai không lăn lóc va chạm/Tiếng sột soạt của rác rưởi/Tiếng cười ồ của đàn em "Nhà của Đại tiểu thư thành chuồng lợn rồi"/Tiếng rên rỉ nghèn nghẹt trong đống rác của Rin.\nNhiều người (Theo cấu trúc không gian): Trải ra trong đống rác, thân dưới đâm hai lỗ làm trục chính, miệng tay rảnh rỗi do đàn em đứng vây quanh sử dụng, lấy danh nghĩa "Đổi một tư thế sạch sẽ hơn chút" để đổi nhóm.\nTrục sảng khoái: Không gian riêng tư luân lạc triệt để (Nhà mình biến thành bãi rác) + Nhục nhã vật hóa (Bị dùng như rác) + Tương phản (Dinh thự cao quý vs Hiện trường bẩn thỉu). Giọng điệu cơ bản: Hoang đường dâm mĩ, sự cuồng nhiệt trong sự bẩn thỉu.\nCấm kỵ: Vết bẩn chỉ làm bầu không khí môi trường và sự nhục nhã, miêu tả thể dịch vẫn sắc tình duy mỹ, không viết gây bệnh/phản ứng sinh lý buồn nôn; Tiêu điểm là khoái cảm và sự nhục nhã tương phản.\nKết toán: Lần đầu tiên → Độ đọa lạc +; Tóm tắt tiếp nối ghi "Đã mở khóa dâm loạn trong đống rác · Dinh thự luân lạc".\n【Cách viết · Độc quyền dâm loạn trong đống rác】\nNhịp điệu câu cú: Tương phản lót nền khởi đầu chậm (Câu dài · Sự tương phản giữa "Dinh thự uy nghiêm" và "Bãi rác bẩn thỉu" kéo căng · Từng không vương hạt bụi nay Rin bị đè trong đống rác) → Môi trường thô ráp xếp chồng (Câu ngắn · Sau lưng cấn vỏ chai không/Mặt áp sàn bẩn/Trên người phủ rác rưởi xếp chồng với khoái cảm bị đâm) → Nhục nhã vật hóa (Mức độ trung bình · Bị coi như một món đồ dùng trong đống rác · Đàn em "Nhà của Đại tiểu thư thành chuồng lợn rồi" cười ồ) → Đổi nhóm luân phiên thu vĩ (Giảm tốc · Lấy danh nghĩa "Đổi tư thế sạch sẽ hơn chút" đổi nhóm). Nhịp điệu bị sự xếp chồng của môi trường bẩn thỉu và khoái cảm thúc đẩy, hoang đường dâm mĩ.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự tương phản thị giác "Dinh thự cao quý vs Hiện trường bẩn thỉu" + Xúc cảm thô ráp bẩn thỉu (Cấn vật cứng/Vết bẩn dính dớp/Bị đè ngột ngạt) làm cốt lõi, Âm thanh của vỏ chai không lăn lóc/Rác rưởi sột soạt/Cười ồ.\nChi tiết kỹ thuật: ① Tương phản kéo căng——Kéo căng sự tương phản giữa "Dinh thự uy nghiêm" và "Bãi rác bẩn thỉu", dinh thự thiên kim từng không vương hạt bụi nay Rin bị đè trong đống rác bị nhiều người sử dụng, trên người dính tinh dịch vết bẩn rác rưởi; ② Lấy cớ dọn dẹp——Đàn em lấy cớ "Dù sao cũng là cô gọi người đến dọn dẹp mà" để nhục nhã; ③ Môi trường thô ráp——Sau lưng cấn vỏ chai không/Mặt áp sàn bẩn/Trên người phủ rác rưởi xếp chồng với khoái cảm bị đâm (Xúc giác); ④ Nhục nhã vật hóa——Bị coi như một món đồ dùng trong đống rác dịch thành khoái cảm nhục nhã; ⑤ Nhiều người theo cấu trúc không gian——Trải ra trong đống rác thân dưới đâm hai lỗ làm trục chính, miệng tay rảnh rỗi do đàn em đứng vây quanh sử dụng, lấy danh nghĩa "Đổi tư thế sạch sẽ hơn chút" đổi nhóm; ⑥ Cấm kỵ——Vết bẩn chỉ làm bầu không khí môi trường và sự nhục nhã, miêu tả thể dịch vẫn sắc tình duy mỹ, không viết gây bệnh/phản ứng sinh lý buồn nôn, tiêu điểm là khoái cảm và sự nhục nhã tương phản.'}),on({id:'p_garbage_first',keys:['wb_garbage_first'],content:'Dâm loạn trong đống rác · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Lần đầu tiên chứng kiến "Nhà của mình bị chính tay chà đạp thành chuồng lợn"——Cô ra lệnh dọn dẹp, đổi lại lại là bị ấn vào trong đống rác.\nNhịp điệu bắt buộc: ① Ra lệnh dọn dẹp——Rin phân phó đàn em dọn dẹp dinh thự, tưởng rằng có thể thấy lại sự sạch sẽ; ② "Dọn dẹp" ngược hướng——Đám đàn em lại chất rác ngày càng nhiều, ngược lại ấn cô vào trong đống rác, "Đại tiểu thư không phải muốn dọn dẹp sao? Quét ngài vào trước đã"; ③ Sự đâm xuyên bẩn thỉu——Bị đè xuống đâm xuyên trong đống rác bẩn thỉu, Rin vừa xấu hổ vừa tức giận vì nhà mình luân lạc đến mức này; ④ Sự xấu hổ của sự tương phản——Chủ nhân dinh thự từng không vương một hạt bụi, nay lăn lộn trong đống rác bị đụ, sự đảo lộn tột cùng của thân phận và hoàn cảnh; ⑤ Sự phản bội của khoái cảm——Rõ ràng môi trường bẩn thỉu nhục nhã, cơ thể lại trong sự tương phản này càng thiêu đốt càng nóng.\nSau khi xong việc: Rin lần đầu tiên chấp nhận "Ngôi nhà này đã không còn là ngôi nhà đó nữa". Tóm tắt tiếp nối ghi "Đã mở khóa dâm loạn trong đống rác · Dinh thự triệt để luân lạc".\n【Cách viết · Độc quyền đống rác lần đầu】\nNhịp điệu câu cú: Ra lệnh dọn dẹp khởi đầu chậm (Câu dài · Rin phân phó đàn em dọn dẹp dinh thự tưởng rằng có thể thấy lại sự sạch sẽ) → Dọn dẹp ngược hướng đột biến (Câu ngắn · Đàn em lại chất rác ngày càng nhiều ngược lại ấn cô vào trong đống rác "Quét ngài vào trước đã") → Đâm xuyên bẩn thỉu (Mức độ trung bình · Bị đè xuống đâm xuyên trong đống rác bẩn thỉu Rin vừa xấu hổ vừa tức giận) → Xấu hổ tương phản (Nhịp điệu ngưng trệ · Chủ nhân dinh thự từng không vương hạt bụi nay lăn lộn trong đống rác bị đụ thân phận và hoàn cảnh đảo lộn tột cùng) → Khoái cảm phản bội thu vĩ (Giảm tốc · Rõ ràng môi trường bẩn thỉu nhục nhã cơ thể lại trong sự tương phản này càng thiêu đốt càng nóng). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Nhà của mình bị chính tay chà đạp thành chuồng lợn".\nChi tiết kỹ thuật: ① Ra lệnh dọn dẹp——Rin phân phó đàn em dọn dẹp dinh thự tưởng rằng có thể thấy lại sự sạch sẽ (Sự tương phản thư thái); ② Dọn dẹp ngược hướng——Đám đàn em lại chất rác ngày càng nhiều ngược lại ấn cô vào trong đống rác "Đại tiểu thư không phải muốn dọn dẹp sao? Quét ngài vào trước đã" (Mỏ neo đột biến); ③ Đâm xuyên bẩn thỉu——Bị đè xuống đâm xuyên trong đống rác bẩn thỉu Rin vừa xấu hổ vừa tức giận vì nhà mình luân lạc đến mức này; ④ Xấu hổ tương phản——Chủ nhân dinh thự từng không vương một hạt bụi nay lăn lộn trong đống rác bị đụ, sự đảo lộn tột cùng của thân phận và hoàn cảnh (Cốt lõi); ⑤ Khoái cảm phản bội——Rõ ràng môi trường bẩn thỉu nhục nhã cơ thể lại trong sự tương phản này càng thiêu đốt càng nóng (Rối loạn cốt lõi); ⑥ Chấp nhận——Rin lần đầu tiên chấp nhận "Ngôi nhà này đã không còn là ngôi nhà đó nữa" (Dấu ấn thu vĩ).'}),on({id:'p_bribe_sfw',keys:['wb_bribe_sfw'],content:'Hối lộ kẻ địch · Dùng tiền (SFW). Khi Uy vọng cực đạo cao thì dùng tiền giải quyết. Mẫu ngắn gọn: "Đại tiểu thư đưa lên một khoản tiền, 【Thế lực X】 đã nhận, nới lỏng miệng/đưa ra tình báo. Độ khó địa bàn mục tiêu -X." Trừ tiền.'}),on({id:'p_protect_sfw',keys:['wb_protect_sfw'],content:'Thu tiền bảo kê · SFW (Thu tô oai phong). Hai loại: ① Rin đích thân dẫn đàn em đi thu tô, mạnh mẽ áp đảo người trên địa bàn, thể hiện sự mạnh mẽ; ② Đàn em tự đi, miêu tả lạnh lùng cường hãn, thể hiện sự uy hiếp vũ lực của Kujo-kai. +Tiền.'}),on({id:'p_protect_first',keys:['wb_protect_first'],content:'Thu tiền bảo kê · Lần đầu NSFW (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Rin nhận ra việc ra ngoài thu tô không còn là trường hợp "Oai phong" nữa——Sự tương phản giữa Mặt A mạnh mẽ áp đảo + Mặt B bị chính thuộc hạ của mình dâm loạn công khai lần đầu tiên thành hình.\nNhịp điệu bắt buộc: ① Sự đoan trang trước khi xuất phát——Rin chuẩn bị sẵn khuôn mặt lạnh lùng, giống như những ngày trước; ② "Động tác nhỏ" trong xe——Vừa lên xe đàn em đã động tay động chân, Rin cố gắng duy trì sổ tay và sự uy nghiêm; ③ Đối đầu ở cửa hàng——Rin trước mặt chủ cửa hàng vừa thu tô vừa cố nhịn sự bỡn cợt trong cơ thể/dưới váy; ④ Ranh giới cao trào——Suýt lộ tẩy nhưng nhịn được; ⑤ Về dinh thự thư giãn——Vừa vào trong xe lập tức bị đè xuống tiếp tục.\nSau khi xong việc: "Thu tiền bảo kê" sau này sẽ chỉ mang ý nghĩa này. Tóm tắt tiếp nối ghi "Đã mở khóa mô thức thu tiền bảo kê NSFW".\n【Cách viết · Độc quyền thu tiền bảo kê lần đầu】\nNhịp điệu câu cú: Đoan trang trước khi xuất phát khởi đầu chậm (Câu dài · Rin chuẩn bị khuôn mặt lạnh lùng giống như những ngày trước) → Động tác nhỏ trong xe đột biến (Câu ngắn · Vừa lên xe đàn em đã động tay động chân Rin cố gắng duy trì sổ tay và sự uy nghiêm) → Đối đầu cửa hàng cố nhịn (Nhịp điệu nhảy vọt giữa uy nghiêm thu tô và cố nhịn bỡn cợt · Lời thoại run rẩy) → Ranh giới cao trào (Câu ngắn · Suýt lộ tẩy nhưng nhịn được) → Về dinh thự thư giãn thu vĩ (Giảm tốc · Vừa vào trong xe lập tức bị đè xuống tiếp tục). Sức căng nằm ở sự tương phản "Mặt A mạnh mẽ áp đảo + Mặt B bị dâm loạn công khai" lần đầu tiên thành hình.\nChi tiết kỹ thuật: ① Đoan trang trước khi xuất phát——Rin chuẩn bị khuôn mặt lạnh lùng giống như những ngày trước (Sự tương phản thư thái); ② Động tác nhỏ trong xe——Vừa lên xe đàn em đã động tay động chân, Rin cố gắng duy trì sổ tay và sự uy nghiêm (Mỏ neo tương phản lần đầu thành hình); ③ Đối đầu cửa hàng——Rin trước mặt chủ cửa hàng vừa thu tô vừa cố nhịn sự bỡn cợt trong cơ thể/dưới váy (Tương phản hai luồng); ④ Ranh giới cao trào——Suýt lộ tẩy nhưng nhịn được (Khủng hoảng); ⑤ Về dinh thự thư giãn——Vừa vào trong xe lập tức bị đè xuống tiếp tục (Dấu ấn thu vĩ: "Thu tiền bảo kê" sau này sẽ chỉ mang ý nghĩa này).'}),on({id:'p_school_sfw',keys:['wb_school_sfw'],content:'Đến trường đi học · SFW (Thuần túy mẫu · Không gọi AI). Rin ở trường duy trì hình tượng xuất sắc/đóa hoa trên cao: Bài vở xuất sắc, nam sinh tỏ tình (Đa số bị từ chối/không dám tỏ tình), nữ sinh mời mọc, giáo sư tán thưởng. Tự sự ngẫu nhiên ngắn gọn, +Đánh giá trường học (Chỉ tiêu kết cục tốt · Khởi điểm 100 đầy).'}),on({id:'p_rest_sfw',keys:['wb_rest_sfw'],content:'Nghỉ ngơi · SFW (Hệ thống xuất ra · Không gọi AI). Mẫu ngắn gọn: "Đại tiểu thư đã nghỉ ngơi thật tốt một lát" / "Đại tiểu thư cuối cùng cũng có thể thở phào một hơi" / "Đại tiểu thư ngủ rất yên giấc" / "Đại tiểu thư gặp ác mộng, lúc giật mình tỉnh giấc toát mồ hôi lạnh" / "Đại tiểu thư có một giấc mơ khó mở lời, thân dưới ướt át đã tiết lộ tất cả". Tổng số ô ngày hôm sau -2 nếu một ô không ngủ (Ban ngày dâng hiến không kích hoạt debuff này).'}),on({id:'p_condom_zero_1',keys:['wb_condom_zero_1'],content:'Bao cao su về 0 · Lần 1 (Tuyến sinh đẻ E1 · Cột mốc).\nKích hoạt: Tồn kho bao cao su về 0 và dâng hiến chưa kết thúc · Ô tạm thời chèn vào.\nBối cảnh: Đàn em bắt Rin khỏa thân mặc áo khoác nhét đồ chơi đi mua bao, đi kèm hai bên lén lút chơi điều khiển từ xa. Rin chỉ mặc một chiếc áo khoác dáng dài (Đồ lót cởi sạch), trong cơ thể nhét đồ chơi rung, hai tên đàn em đi hai bên với vẻ "Hộ tống bảo vệ" đưa cô ra ngoài mua bao, thực chất là ở góc độ người ngoài không nhìn thấy lén lút chơi điều khiển từ xa chỉnh mạnh chỉnh yếu. Trước quầy thu ngân cửa hàng tiện lợi Rin đỏ mặt run rẩy, nhân viên cửa hàng bối rối nhưng bị khí thế cực đạo áp chế không dám hỏi nhiều.\nTừ vựng: L1 Khỏa thân áo khoác/Hộ tống/Mua sắm → L2 Đồ chơi trong cơ thể bị chỉnh mạnh từ xa/Kẹp chặt/Mềm chân/Suýt kêu ra tiếng → L3 Suýt nữa chết vì xấu hổ giữa phố/Sự run rẩy khi ôm thùng hàng.\nCảm quan độc quyền:[Xúc giác] Cảm giác trần truồng bên trong áo khoác/Sự trở tay không kịp khi đồ chơi bị chỉnh mạnh từ xa;[Thị giác] Ánh sáng lạnh của kệ hàng/Sự bối rối của nhân viên/Đàn em cười trộm trong góc khuất;[Khứu giác] Hơi lạnh cửa hàng tiện lợi vs Mùi dâm thủy tràn ra từ người Rin;[Âm thanh] Trứng rung kêu rè rè/Tiếng thở bị kìm nén của Rin.\n【Cách viết · Độc quyền khỏa thân áo khoác ra ngoài】\nNhịp điệu câu cú: Ngoài trời khởi đầu lạnh (Câu ngắn · Bên trong áo khoác trần truồng + Gió lạnh lùa vào + Đồ chơi đột ngột bật mức mạnh, nhịp điệu bị ngoại cảnh đánh gãy) → Trong cửa hàng cố nhịn (Câu dài kìm nén · Viết sự cố nhịn đỏ mặt run rẩy trước quầy thu ngân, dấu câu ít nhịp điệu trầm · Lời thoại toàn là tiếng thở bị kìm nén) → Lén lút chơi đùa nhảy vọt (Nhịp điệu bị điều khiển từ xa ngẫu nhiên đánh gãy——Mỗi lần chỉnh mạnh là một lần sơ hở ngắn ngủi, Rin dùng câu ngắn để che đậy) → Thanh toán ra cửa dư âm (Giảm tốc · Mềm chân vịn tường/Đàn em thì thầm đe dọa, thu lại ở "Kẹp chặt hơn"). Sức căng nằm ở sự cố nhịn nơi công cộng, mỗi đoạn đều khó duy trì thể diện hơn đoạn trước.\nTrọng tâm cảm quan: Xúc giác (Cảm giác trần truồng trong áo khoác/Đồ chơi chỉnh mạnh trở tay không kịp/Gió lạnh kích thích da) + Khứu giác (Hơi lạnh cửa hàng vs Mùi dâm thủy tràn ra từ người Rin = Đảo lộn mùi hương) là hai trục chính; Thị giác (Ánh sáng lạnh kệ hàng/Ánh mắt bối rối của nhân viên/Đàn em cười trộm góc khuất) xếp thứ hai; Âm thanh (Trứng rung rè rè/Tiếng thở kìm nén) làm nền. Sự tương phản "Hơi lạnh vs Mùi dâm thủy" của khứu giác trong cách chơi này là nguồn gốc xấu hổ cốt lõi.\nTập từ vựng (Trục nhiệt độ độc quyền ra ngoài giao hàng): L1 Khỏa thân áo khoác/Hộ tống/Mua sắm → L2 Đồ chơi trong cơ thể bị chỉnh mạnh từ xa/Kẹp chặt/Mềm chân/Suýt kêu ra tiếng → L3 Suýt nữa chết vì xấu hổ giữa phố/Sự run rẩy khi ôm thùng hàng. L3 dùng những từ mất kiểm soát như "Chết vì xấu hổ/Run rẩy/Kẹp chặt", không dùng từ ngữ tính dục lộ liễu của phòng kín (Cách chơi này là sự xấu hổ khi ra ngoài chứ không phải đâm rút thực sự).\nTiêu điểm miêu tả cơ thể: Áo khoác (Cởi sạch đồ lót chỉ còn một chiếc · Nguy cơ lộ hàng bất cứ lúc nào khi vạt áo mở ra) · Chân (Kẹp chặt/Mềm chân/Tướng đi biến dạng) · Khuôn mặt (Đỏ bừng trước quầy thu ngân/Biểu cảm vi tế khi cố nhịn/Nhân viên bối rối). Ống kính đóng đinh vào vạt áo khoác và khuôn mặt cố nhịn của Rin, không quay cảnh đâm rút thực sự (Cốt lõi của cách chơi này là "Sự lăng nhục không nhìn thấy").\nChi tiết kỹ thuật: ① Áo khoác trần truồng——Cởi sạch đồ lót chỉ để lại áo khoác dáng dài, gió lạnh lùa vào + Cảm giác da thịt trần truồng đưa lên tiền cảnh (Sự mất thể diện khi ra ngoài); ② Chỉnh mạnh từ xa trở tay không kịp——Đàn em ở góc khuất lén lút chơi điều khiển từ xa ngẫu nhiên chỉnh mạnh yếu, Rin không thể đoán trước mỗi lần sơ hở (Sự ngẫu nhiên của việc cố nhịn phóng đại sự căng thẳng); ③ Ranh giới quầy thu ngân——Nhân viên bối rối nhưng bị khí thế cực đạo áp chế không dám hỏi nhiều, Rin ở dưới mí mắt người ngoài bị đẩy đến ranh giới cố nhịn không phát ra tiếng (Nguy cơ suýt chết vì xấu hổ); ④ Hơi lạnh vs Mùi dâm thủy——Hơi lạnh cửa hàng tiện lợi và mùi dâm thủy tràn ra từ người Rin tạo thành sự đảo lộn mùi hương (Tiết lộ mùi cơ thể = Xấu hổ bị động); ⑤ Kẹp chặt——Chỉnh mạnh từ xa khiến Rin kẹp chặt hai chân, thùng hàng ôm trong ngực dựa vào việc kẹp chân để phòng đồ chơi rơi ra, tướng đi biến dạng bị người đi đường ngoái nhìn; ⑥ Thì thầm đe dọa——Lời thì thầm đe dọa "Không mua về được thì bắn thẳng vào trong luôn" của đàn em (Lời tán tỉnh trong bối cảnh mua sắm không phải gieo giống thật) khiến Rin kẹp chặt hơn, thu vĩ.'}),on({id:'p_condom_zero_2',keys:['wb_condom_zero_2'],content:'Bao cao su về 0 · Lần 2 · Tái chế bao cũ (Tuyến sinh đẻ E2 · Cột mốc). Tier1-2 Kỹ thuật dùng miệng đeo bao · Nhục nhã vật hóa.\nKích hoạt: Tồn kho lại về 0 và mua không kịp · Ô tạm thời chèn vào. Đàn em bắt Rin đem bao cao su đã dùng qua ra tái chế——Nghi thức ba bước tận dụng đồ bỏ đi.\nCơ chế (Ba bước · Dùng miệng đeo bao là cốt lõi · Nói cho AI):\n  1. Lấy bao cũ: Nhặt từ trên người/đầu giường/dưới đất lên chiếc bao cũ chứa đầy tinh dịch——Trọng lượng của túi tinh dịch, xúc cảm lạnh lẽo tanh tưởi của vỏ cao su, thể dịch còn sót lại.\n  2. Dùng miệng mút sạch: Đưa nguyên chiếc bao cũ vào khoang miệng, dùng lưỡi và động tác mút để hút sạch toàn bộ tinh dịch đặc trong túi tinh dịch rồi nuốt xuống (Hoặc bị ép nuốt xuống)——Viết vị tanh mặn bùng nổ trong khoang miệng/Phản ứng nôn khan/Bị ép nuốt. Sau khi mút sạch bao thì dùng lưỡi liếm sạch từng tấc vách trong.\n  3. Dùng miệng đeo bao (Kỹ thuật cốt lõi): Ngậm vòng bao giữa môi và răng, dùng miệng nhắm chuẩn quy đầu đối phương, dùng môi từ từ cuộn thân bao xuống tận gốc——Điều này đòi hỏi Rin phải cúi người nhắm chuẩn ở cự ly gần, động tác tinh tế không được làm rách, môi phải tạo áp lực đều. Toàn bộ quá trình vừa là tiền đề của khẩu giao (Quy đầu vào miệng) vừa là nghi thức mang tính hầu hạ. Đeo xong đối phương trực tiếp không rút ra mà đâm thẳng vào, bỏ qua mọi khoảng trống. Toàn bộ quá trình hai tay có thể bị trói quặt/bị ấn chặt, chỉ có thể dùng miệng hoàn thành.\nĐau đớn → Khoái cảm: Cảm giác buồn nôn bị đánh gãy——Vị tanh mặn của tinh dịch kéo Rin vào ký ức cơ thể "Lại đang hầu hạ cặc", tuyến nước bọt trong khoang miệng bắt đầu tiết dịch không kiểm soát; Sau khi đeo bao xong lập tức bị đâm vào, sự buồn nôn bị cơ thể trực tiếp chuyển hóa thành sự tiết dịch và co thắt.\nCảm quan độc quyền:[Xúc giác] Vị tanh mặn bùng nổ trong khoang miệng/Vỏ cao su bao cũ lạnh tanh/Lực cản của môi khi cuộn bao xuống tận gốc/Sự lấp đầy ngắn ngủi của quy đầu trong miệng/Sự liền mạch không kẽ hở khi đâm thẳng vào sau khi đeo xong;[Thị giác] Lượng tinh dịch còn sót lại trong túi tinh dịch/Sự bán trong suốt của vỏ cao su/Rin cúi người cự ly gần/Khóe miệng kéo sợi;[Âm thanh] Tiếng ừng ực khi nuốt tinh dịch đặc/Tiếng ma sát ướt át của môi khi cuộn bao/Đàn em khen ngợi "Miệng khéo thật".\nTừ vựng: L1 Bao cũ/Túi tinh dịch → L2 Mút sạch/Tanh mặn/Nôn khan/Dùng miệng đeo → L3 Nuốt xuống/Môi cuộn bao xuống/Đeo xong lập tức bị đâm/Tính triệt để của sự hầu hạ nhục nhã.\n【Cách viết · Độc quyền dùng miệng đeo bao cũ】\nNhịp điệu câu cú: Lấy bao khởi đầu lạnh (Câu ngắn · Trọng lượng của bao cũ và xúc cảm lạnh tanh đập vào) → Mút sạch nhịp chậm (Câu dài · Viết vị tanh mặn bùng nổ trong khoang miệng/Nôn khan/Bị ép nuốt, nhịp điệu bị động tác nuốt kéo chậm · Dấu câu thưa thớt) → Dùng miệng đeo bao tinh tế (Nhịp điệu siết chặt · Động từ động tác ngắn gọn bắn liên thanh, cúi người nhắm chuẩn/cuộn xuống/tạo áp lực, viết sự căng thẳng "Không được làm rách") → Đâm vào liền mạch thu vĩ (Nhịp điệu đột ngột nhanh · Đeo xong lập tức bị đâm xuyên, sự buồn nôn bị cơ thể chuyển hóa thành tiết dịch). Toàn bộ quá trình chậm hơn và bẩn hơn khẩu giao, sức căng nằm ở vòng lặp hầu hạ "Dùng miệng đeo bao lên rồi lập tức bị đâm vào".\nTrọng tâm cảm quan: Vị giác + Xúc giác chủ đạo. Vị giác (Vị tanh mặn của tinh dịch bùng nổ trong khoang miệng/Vỏ cao su lạnh tanh) và Xúc giác (Vỏ cao su bao cũ lạnh/Lực cản của môi khi cuộn bao xuống tận gốc/Sự liền mạch khi đâm thẳng vào sau khi đeo xong) là hai trục chính; Thị giác (Lượng tinh dịch còn sót lại trong túi tinh dịch/Sự bán trong suốt của vỏ cao su/Khóe miệng kéo sợi) xếp thứ hai; Âm thanh (Tiếng ừng ực khi nuốt/Tiếng ma sát ướt át khi cuộn bao) làm nền. Trọng lượng vị giác của cách chơi này là cao nhất trong sáu tuyến.\nTập từ vựng (Trục nhiệt độ độc quyền dùng miệng đeo bao): L1 Bao cũ/Túi tinh dịch/Vỏ cao su → L2 Mút sạch/Tanh mặn/Nôn khan/Dùng miệng đeo/Cuộn xuống → L3 Nuốt xuống/Môi cuộn bao xuống/Đeo xong lập tức bị đâm/Sự hầu hạ nhục nhã triệt để. Tanh mặn/Vỏ cao su lạnh tanh là từ ngữ vị giác xúc giác độc quyền của cách chơi này.\nTiêu điểm miêu tả cơ thể: Môi (Ngậm vòng bao/Động tác tinh tế cuộn xuống tận gốc/Tạo áp lực đều) · Miệng (Vị tanh mặn bùng nổ/Bị ép nuốt/Khóe miệng kéo sợi) · Tay (Toàn bộ quá trình bị trói quặt hoặc bị ấn chặt · Chỉ có thể dùng miệng hoàn thành = Cảm giác trói buộc). Ống kính đóng đinh vào môi và miệng, nhấn mạnh tính chất hầu hạ "Chỉ dùng miệng hoàn thành".\nChi tiết kỹ thuật (Từ ngữ liệu): ① Lấy bao khởi đầu lạnh——Trọng lượng túi tinh dịch của bao cũ, xúc cảm lạnh tanh của vỏ cao su, thể dịch còn sót lại trước tiên đập vào cảm quan (Sự tương phản giữa vật thể lạnh lẽo vs khoang miệng ấm nóng); ② Mút sạch nhịp chậm——Đưa nguyên chiếc bao cũ vào khoang miệng, lưỡi và động tác mút hút sạch tinh dịch đặc rồi nuốt xuống, vị tanh mặn bùng nổ trong khoang miệng + Phản ứng nôn khan + Bị ép nuốt, sau khi mút sạch bao thì liếm sạch từng tấc vách trong (Bước đầu tiên của vòng lặp hầu hạ); ③ Kỹ thuật cốt lõi dùng miệng đeo bao——Ngậm vòng bao giữa môi và răng, cúi người nhắm chuẩn quy đầu ở cự ly gần, môi từ từ cuộn thân bao xuống tận gốc, động tác tinh tế không được làm rách, môi tạo áp lực đều, vừa là tiền đề khẩu giao (Quy đầu vào miệng) vừa là nghi thức hầu hạ; ④ Đâm vào liền mạch——Đeo xong đối phương trực tiếp không rút ra mà đâm thẳng vào bỏ qua khoảng trống, sự buồn nôn bị cơ thể trực tiếp chuyển hóa thành tiết dịch và co thắt (Điểm chuyển hóa Đau đớn → Khoái cảm); ⑤ Trói buộc hai tay——Toàn bộ quá trình hai tay có thể bị trói quặt/ấn chặt, chỉ có thể dùng miệng hoàn thành, đẩy sự "Hầu hạ" đến tột cùng.'}),on({id:'p_condom_zero_3',keys:['wb_condom_zero_3'],content:'Bao cao su về 0 · Lần 3 · Gieo giống thật (Tuyến sinh đẻ E3 · Cột mốc tối thượng · Không thể đảo ngược). Tier2 Toàn bộ gọi AI · needsContinuity=Có (turning).\nKích hoạt: Tồn kho bao cao su lại về 0 và dâng hiến không thể gián đoạn · Ô tạm thời chèn vào. Tác dụng phụ của code: pregnant=true (Cơ chế này do ForcedEvent.onApply tự động áp dụng, không cần AI xuất ra phụ thuộc).\nCơ chế (Nói cho AI): Đồng tử La Sát tăng tốc thụ thai = Cặc đầu tiên xuất tinh trong là có thể kích hoạt phán đoán thụ thai. Từ nay lớp bảo vệ của bao cao su hoàn toàn mất tác dụng.\nCách viết bối cảnh:\n  ① Khoảnh khắc tĩnh lặng: Sự tĩnh lặng chết chóc khi chiếc bao cũ cuối cùng dùng xong bị vứt xuống——Nhịp điệu đóng cọc trước đó đột ngột dừng lại, tất cả mọi người nhận ra "Hết rồi".\n  ② Đàn em nhìn nhau và tiếng cười: "Xong rồi" "Hết thật rồi" "Vậy thì cứ thế này đi"——Không phải ác ý, mà là một loại giải thoát dường như đã chờ đợi khoảnh khắc này từ lâu. Thái độ này còn xuyên thấu hơn cả sự đe dọa.\n  ③ Đâm vào không bao: Cặc đầu tiên trực tiếp đâm vào, thứ Rin cảm nhận được không phải là sự đâm rút, mà là xúc cảm da thịt trực tiếp khi "Mất đi lớp màng đó"——Nhiệt độ nóng hơn, kết cấu rõ ràng hơn, nhịp đập của mạch máu dương vật truyền thẳng đến vách trong.\n  ④ Tinh dịch đặc bơm vào tử cung: Khi xuất tinh trong, tinh dịch đặc trực tiếp bơm vào gần miệng tử cung, cảm giác ấm nóng căng đầy càn quét toàn thân, gây ra một lần lên đỉnh co giật tức thời (Tử cung = Điểm yếu chí mạng).\n  ⑤ Đàn em tuyên cáo: "Lần này bắn hết vào trong, đảm bảo Đại tiểu thư lần này có thể mang thai"——Sự sợ hãi khi Rin nghe thấy + Dư âm lên đỉnh của cơ thể = Sự rối loạn (Sự chồng chéo hỗn loạn giữa sợ hãi nhân với sướng).\n  ⑥ Đại nghĩa (Nếu linh đường đã mở khóa): Nối tiếp biến thể tuyên thệ linh đường wb_ancestor_breeding——Đàn em đưa ra đại nghĩa gieo giống "Vì nhà Kujo kéo dài dòng máu La Sát", đưa Rin đến tổ sư đường hoàn thành nghi thức gieo giống. Nếu không thì tiếp tục tại chỗ.\nTiêu điểm cảm quan: Xúc cảm trực tiếp khi không bao/Tinh dịch đặc bơm vào tử cung ấm nóng căng đầy/Co giật toàn thân/Rin kinh hãi trước khoái cảm mà cơ thể mình tiếp nhận.\nTừ vựng L1: Hết rồi/Cái cuối cùng/Vứt xuống → L2 Không bao/Trực tiếp/Bơm vào/Tử cung bị làm nóng → L3 Thụ thai/Phối giống/Bơm đầy tử cung/Dòng máu La Sát thức tỉnh/Dùng để đẻ con/Gieo giống thật.\n【Cách viết · Độc quyền gieo giống thật】\nNhịp điệu câu cú: Tĩnh lặng dừng đột ngột (Nhịp điệu dừng mạnh——Sự tĩnh lặng chết chóc khi bao cũ dùng xong vứt xuống, từ việc đóng cọc bắn liên thanh đột ngột chuyển sang không tiếng động, để lại một nhịp trống) → Nhìn nhau cười giải thoát (Nhịp chậm · Viết sự giải thoát không ác ý của "Xong rồi" "Vậy thì cứ thế này đi", nhịp điệu trầm và hoang đường) → Đâm vào không bao ngưng trệ (Khoảnh khắc cặc đầu tiên trực tiếp đâm vào nhịp điệu lại dừng một nhịp——Rin cảm nhận được xúc cảm trực tiếp của việc "Mất đi lớp màng đó", một câu kéo dài viết nhiệt độ nóng hơn/kết cấu rõ ràng hơn/mạch máu đập truyền thẳng vách trong) → Bơm tinh co giật (Câu ngắn bùng nổ + Từ tượng thanh ừng ực · Tử cung căng đầy gây ra một lần lên đỉnh co giật tức thời) → Tuyên cáo rối loạn thu vĩ (Giảm tốc · Tuyên cáo "Đảm bảo mang thai" + Sự sợ hãi của Rin và dư âm lên đỉnh của cơ thể chồng chéo). Sức căng nằm ở sự sụp đổ nhận thức "Mất đi lớp màng đó", nhịp điệu hai lần dừng đột ngột (Sự tĩnh lặng mở đầu + Khoảnh khắc đâm vào).\nTrọng tâm cảm quan: Xúc giác tuyệt đối chủ đạo và đặc tả sự chênh lệch xúc cảm "Không bao vs Có bao" (Nhiệt độ nóng hơn/Kết cấu rõ ràng hơn/Mạch máu đập truyền thẳng vách trong/Sự ấm nóng căng đầy khi tinh dịch đặc bơm vào) → Thị giác (Đâm vào không kẽ hở/Bụng dưới phồng lên sau khi bị bơm) → Âm thanh (Tĩnh lặng → Ứng ực bơm tinh) → Khứu giác (Sau khi không bao mùi tinh dịch mùi giống cái trực tiếp hòa quyện). Sự "Biến mất của lớp màng đó" của xúc giác trong cách chơi này là cốt lõi, tất cả cảm quan đều xoay quanh sự chênh lệch "Trực tiếp rồi" này.\nTập từ vựng (Trục nhiệt độ độc quyền gieo giống thật): L1 Hết rồi/Cái cuối cùng/Vứt xuống → L2 Không bao/Trực tiếp/Bơm vào/Tử cung bị làm nóng → L3 Thụ thai/Phối giống/Bơm đầy tử cung/Dòng máu La Sát thức tỉnh/Dùng để đẻ con/Gieo giống thật. Cảm giác không rào cản của "Không bao/Trực tiếp" và sự đánh thẳng vào bên trong của "Bơm vào/Tử cung bị làm nóng" là độc quyền của cách chơi này, từ ngữ L3 gieo giống thật càng nhấn mạnh kết quả "Thụ thai".\nTiêu điểm miêu tả cơ thể: Lỗ lồn (Sự chênh lệch xúc cảm trực tiếp khi đâm vào không bao/Vách trong lần đầu tiên tiếp xúc trực tiếp với da thịt) · Bụng (Sự căng đầy phồng lên khi tinh dịch đặc bơm vào tử cung) · Khuôn mặt (Sự thẫn thờ lúc tĩnh lặng → Sự thất thần co giật lúc bơm tinh → Sự sợ hãi rối loạn lúc tuyên cáo). Ống kính nằm giữa "Sự trực tiếp của việc không bao" và "Sự phồng lên của việc bơm tinh", đây là hai tiêu điểm của gieo giống thật.\nChi tiết kỹ thuật (Từ ngữ liệu): ① Tĩnh lặng dừng đột ngột——Khi bao cũ dùng xong vứt xuống nhịp điệu đóng cọc dừng mạnh, tất cả mọi người nhận ra "Hết rồi", sự tĩnh lặng chết chóc là mỏ neo sức căng đầu tiên của sự kiện này; ② Giải thoát không ác ý——Đàn em nhìn nhau cười "Vậy thì cứ thế này đi" là một loại giải thoát dường như đã chờ đợi khoảnh khắc này từ lâu, thái độ này còn xuyên thấu hơn cả sự đe dọa (Hoang đường thường ngày hóa); ③ Chênh lệch xúc cảm không bao——Cặc đầu tiên trực tiếp đâm vào, Rin cảm nhận được nhiệt độ nóng hơn/kết cấu rõ ràng hơn/mạch máu đập truyền thẳng vách trong của sự trực tiếp "Mất đi lớp màng đó" (Sự chênh lệch cốt lõi); ④ Bơm tinh tử cung phồng lên——Khi xuất tinh trong tinh dịch đặc trực tiếp bơm vào gần miệng tử cung, sự ấm nóng căng đầy càn quét toàn thân gây ra một lần lên đỉnh co giật tức thời (Tử cung = Điểm yếu chí mạng · Khi xuất tinh trong tử cung phồng lên nhô cao hình cầu); ⑤ Sợ hãi nhân với sướng rối loạn——Tuyên cáo "Đảm bảo mang thai" khiến sự sợ hãi của Rin + dư âm lên đỉnh của cơ thể đồng thời tồn tại, sự chồng chéo hỗn loạn giữa sợ hãi và sướng là dấu hiệu của sự kiện này; ⑥ Phản ứng thụ thai của miệng tử cung——Khi đâm xuyên không bao miệng tử cung theo bản năng chìm xuống mở ra, cơ thể tiến vào trạng thái chuẩn bị thụ thai, Rin kinh hãi trước sự "Phối hợp" của cơ thể.\nTóm tắt tiếp nối (turning · Bắt buộc viết): "Bao cao su về 0 ba lần, kích hoạt gieo giống thật, phán đoán thụ thai. Tuyến sinh đẻ mở ra. Từ nay dâng hiến = Trạng thái thường quy xuất tinh trong không bao."\nHậu quả code: Sau khi kích hoạt EngineState.pregnant=true, mô thức thai kỳ wb_pregnant được tiêm vào dâng hiến ban đêm trở thành trạng thái thường quy; endings.pregnant=true trực tiếp khóa khuynh hướng kết cục đọa lạc sinh đẻ.'}),on({id:'p_ancestor_breeding',keys:['wb_ancestor_breeding'],content:'Đại nghĩa linh đường · Tuyên thệ gieo giống (Biến thể tuyến sinh đẻ · Khi E3 kích hoạt nếu linh đường đã mở khóa thì chuyển hướng đến đây). Tier2 Toàn bộ gọi AI · needsContinuity=Có.\nMôi trường: Tổ sư đường/Bàn thờ Phật/Ngay trước bài vị · Khói nhang trầm hương ánh nến lay động · Chiếu Tatami bồ đoàn · Rèm che gia huy.\nViện cớ đại nghĩa (Đàn em mượn danh, nói cho AI): Đàn em đưa ra đại nghĩa của nhà Kujo "Kéo dài dòng máu La Sát, làm cho nhà Kujo nhân đinh hưng vượng", tuyên bố việc gieo giống cho Rin là vì sự phồn vinh của gia tộc mà tận trung——Đóng gói việc luân dâm thành một nghi thức gia tộc thần thánh "Khai chi tán diệp cho nhà Kujo". Bộ đại nghĩa này bắt nguồn từ thiết lập (Nhánh phụ đều thèm muốn Rin sinh ra hậu duệ Đồng tử La Sát).\nTuyên thệ dâm loạn (Diễn xuất cốt lõi): Rin bị yêu cầu công khai đọc lời thề gieo giống trước bài vị tổ tiên, ví dụ:\n  "Xin liệt tổ liệt tông chứng giám, tử cung của con, cùng với các người chồng của con, vì để nhà Kujo hưng vượng trở lại, sẽ hoàn thành việc gieo giống tại đây."\nPhối hợp với cảm giác thần thánh hoang đường khi hàng trăm "người chồng" luân phiên xuất tinh trong. Trước/sau mỗi lần xuất tinh trong, đàn em có thể yêu cầu "Đọc lại lời thề lần nữa" "Để tổ tiên nghe thấy" "Hôm nay phải gieo đầy Đại tiểu thư".\nTiêu điểm cảm quan: [Thị giác] Luân dâm dưới sự chứng kiến của di ảnh liệt tổ liệt tông/Rin vẫn duy trì tư thế bái tế dập đầu bị đâm từ phía sau/Khói nhang lượn lờ xuyên qua chỗ giao hợp; [Xúc giác] Sự cứng nhắc của chiếu Tatami/Sàn nhà lạnh lẽo/Sự trực tiếp khi bị đâm vào không bao; [Khứu giác] Khói nhang trầm hương trang nghiêm bị mùi tinh dịch mùi giống cái làm bẩn (Đảo lộn mùi hương=Cốt lõi); [Âm thanh] Trong đường cực kỳ yên tĩnh khiến mỗi tiếng bạch bạch đều chói tai/Âm vang tụng kinh gõ mõ/Tiếng đọc lời thề vỡ vụn của Rin/Đàn em thúc giục "Nói lại lần nữa".\nTừ vựng L1: Tổ tiên/Bài vị/Lời thề/Bái tế → L2 Đại nghĩa/Gieo giống/Gia tộc phồn vinh/Xuất tinh trong không bao → L3 Dòng máu La Sát thức tỉnh/Gieo giống thật/Sinh con cho nhà Kujo/Đạt được túc mệnh.\nDịch khoái cảm: Càng thần thánh càng báng bổ——Rin bị xuất tinh trong không bao tại nơi trang nghiêm nhất của gia tộc, cơ thể trong sự sợ hãi + xấu hổ lại vẫn thành thật tiết dịch nghênh hợp, đại nghĩa bị phản ứng của cơ thể mỉa mai.\n【Cách viết · Độc quyền đại nghĩa linh đường】\nNhịp điệu câu cú: Tuyên thệ trang nghiêm nhịp chậm (Câu dài · Môi trường khói nhang trầm hương ánh nến lót nền, Rin đọc lời thề dùng câu đứt đoạn chậm và rõ ràng, mỗi chữ đều trang trọng) → Luân dâm báng bổ dồn dập (Nhịp điệu bị cặc đâm vào đánh gãy——Từ ngữ trang nghiêm và tiếng bạch bạch đập thịt đan xen, nhịp điệu xé rách) → Đảo lộn mùi hương ngưng trệ (Khoảnh khắc mùi tinh dịch mùi giống cái lẫn vào trầm hương nhịp điệu dừng một nhịp, một câu kéo dài viết "Sự trang nghiêm bị làm bẩn") → Tuần hoàn tuyên thệ thu vĩ (Giảm tốc · "Nói lại lần nữa để tổ tiên nghe thấy", Rin vừa đọc lời thề vừa bị xuất tinh trong hết lần này đến lần khác, sự trang nghiêm và dâm loạn bị hàn chết vào nhau). Sức căng nằm ở sự sai lệch đồng tần giữa từ ngữ nghi thức trang nghiêm và tiếng thịt.\nTrọng tâm cảm quan: Khứu giác chủ đạo (Khói nhang trầm hương trang nghiêm bị mùi tinh dịch mùi giống cái làm bẩn = Đảo lộn mùi hương là cốt lõi), lấn át tất cả; Thị giác (Luân dâm dưới sự chứng kiến của di ảnh liệt tổ liệt tông/Tư thế bái tế dập đầu bị đâm từ phía sau/Khói nhang lượn lờ xuyên qua chỗ giao hợp) xếp thứ hai; Âm thanh (Trong đường cực kỳ yên tĩnh khiến tiếng bạch bạch chói tai/Âm vang tụng kinh gõ mõ/Tiếng đọc lời thề vỡ vụn) làm nền; Xúc giác (Sự trực tiếp khi bị đâm vào không bao/Sàn nhà lạnh lẽo). Trọng lượng khứu giác của cách chơi này là cao nhất, "Mùi hương thần thánh bị làm bẩn" là nguồn gốc xấu hổ độc quyền.\nTập từ vựng (Trục nhiệt độ độc quyền đại nghĩa linh đường): L1 Tổ tiên/Bài vị/Lời thề/Bái tế → L2 Đại nghĩa/Gieo giống/Gia tộc phồn vinh/Xuất tinh trong không bao → L3 Dòng máu La Sát thức tỉnh/Gieo giống thật/Sinh con cho nhà Kujo/Đạt được túc mệnh. Từ ngữ trang nghiêm (Lời thề/Bái tế/Tổ tiên) và hiện thực dâm loạn (Xuất tinh trong không bao/Luân dâm) đặt cạnh nhau trong cùng một câu là dấu hiệu của cách chơi này.\nTiêu điểm miêu tả cơ thể: Tư thế (Tư thế bái tế dập đầu bị đâm từ phía sau——Tư thế thần thánh và động tác xâm phạm cùng chung khung hình) · Khuôn mặt (Biểu cảm trang nghiêm khi đọc lời thề bị đâm vỡ) · Hạ thể (Sự tương phản thị giác của khói nhang lượn lờ xuyên qua chỗ giao hợp). Ống kính chuyển đổi giữa "Tư thế trang nghiêm trước bài vị" và "Hạ thể bị luân dâm", sự tương phản chính là tiêu điểm.\nChi tiết kỹ thuật: ① Môi trường trang nghiêm lót nền——Tổ sư đường/Bàn thờ Phật/Ngay trước bài vị · Khói nhang trầm hương ánh nến lay động · Chiếu Tatami bồ đoàn · Rèm che gia huy, dùng cảm giác thần thánh của môi trường làm hòn đá tảng tương phản; ② Viện cớ đại nghĩa——Đàn em đưa ra đại nghĩa "Kéo dài dòng máu La Sát/Nhân đinh hưng vượng", đóng gói luân dâm thành nghi thức gia tộc thần thánh (Thiết lập bắt nguồn: Nhánh phụ thèm muốn Rin sinh hậu duệ Đồng tử La Sát); ③ Công khai tuyên thệ——Rin bị yêu cầu công khai đọc lời thề gieo giống trước bài vị tổ tiên (Tử cung/Các người chồng/Vì nhà Kujo hưng vượng/Hoàn thành gieo giống), bản thân từ ngữ trang nghiêm đã là sự nhục nhã; ④ Dập đầu bị đâm——Rin duy trì tư thế bái tế dập đầu bị đâm từ phía sau, tư thế thần thánh và động tác xâm phạm cùng chung khung hình (Tương phản cốt lõi); ⑤ Đảo lộn mùi hương——Khói nhang trầm hương trang nghiêm bị mùi tinh dịch mùi giống cái làm bẩn, mùi hương thần thánh bị mùi cơ thể che lấp (Mỏ neo xấu hổ độc quyền); ⑥ Cực tĩnh phóng đại——Trong đường cực kỳ yên tĩnh khiến mỗi tiếng bạch bạch đều chói tai, âm vang tụng kinh gõ mõ đồng tần với tiếng đập thịt; ⑦ Tuần hoàn tuyên thệ——Trước/sau mỗi lần xuất tinh trong đàn em thúc giục "Nói lại lần nữa/Để tổ tiên nghe thấy/Hôm nay gieo đầy", Rin vừa đọc lời thề vừa bị xuất tinh trong hết lần này đến lần khác, trang nghiêm và dâm loạn hàn chết vào nhau.'}),on({id:'p_pregnant',keys:['wb_pregnant'],content:'Thai kỳ (Trạng thái duy trì của tuyến sinh đẻ). Tier1-2 Luân dâm thai kỳ (Trạng thái đặc biệt · Luân dâm vẫn tiếp tục).\nKích hoạt: Sau khi pregnant=true, mô thức dâng hiến ban đêm có thể tiêm vào biến thể này (Phiên bản thai kỳ), xếp chồng với mô thức dâng hiến gốc.\nThay đổi cơ thể (Nói cho AI): Bụng bầu phát triển nhanh hơn người thường (Huyết mạch Đồng tử La Sát); Thể hình nhỏ bé + Đồng tử La Sát = Bụng bầu nhô ra nhưng vẫn khít khao trắng trẻo, cảm giác tương phản cực mạnh (Eo thon đội bụng bầu bị gã khổng lồ luân dâm). Vú hơi căng tức nhạy cảm hơn (Chạm một cái là âm đạo kẹp chặt); Âm đạo sung huyết nóng rực hơn; Cảm giác căng kéo của da eo bụng; Thỉnh thoảng có thai máy.\nDâng hiến như thường: Có đàn em vì thế mà đặc biệt hưng phấn——"Gieo vào trong Đại tiểu thư rồi" "Đại tiểu thư đang mang thai con của tao" "Lỗ lồn của thai phụ sẽ nhạy cảm hơn đúng không"——Tự sự đại nghĩa tiếp tục lên men.\nĐiều chỉnh tư thế (Theo cấu trúc không gian): Bụng bầu cấm tư thế ép bụng (Tư thế gieo giống cần điều chỉnh thành nằm nghiêng/tư thế ngồi, không trực tiếp ép bụng); Quỳ bò từ phía sau hoàn toàn OK; Cưỡi ngựa có thể tiếp tục nhưng thai phụ dễ mất sức hơn (Đồng tử La Sát không có vấn đề thể lực, nhưng trọng lượng bụng bầu là thật); Kẹp bánh mì đâm hai lỗ hạn chế áp lực lên chân dưới.\nDịch khoái cảm: Độ nhạy cảm của Rin trong thai kỳ tăng lên toàn diện——Cùng một lực độ đóng cọc, phản ứng vách trong co thắt kịch liệt hơn, lên đỉnh thường xuyên hơn. Cô kinh hãi trước việc "Mang thai rồi mà vẫn sướng thế này".\nĐiểm bán AV (Móc nối với hệ thống AV): AV thai kỳ là tag giá cao có thời hạn (Dark Web), phơi bày bụng bầu/luân dâm bụng bầu thành đề tài đặc hóa AV trong thời kỳ này. Hệ thống AV có thể mở khóa cấp độ đặc hóa "Thai kỳ".\nCấm kỵ: Không viết thai kỳ thiếu thể lực (Thể phách Đồng tử La Sát); Không bi lụy; Không viết nguy cơ sảy thai (Huyết mạch Đồng tử La Sát đảm bảo).\nTóm tắt tiếp nối (Nếu hiển hiện lần đầu): "Trạng thái mang thai đã hiển hiện · Bụng bắt đầu nhô lên."\n【Cách viết · Độc quyền dâng hiến thai kỳ】\nNhịp điệu câu cú: Thường thái chậm nhiệt (Tương phản bụng bầu lót nền · Câu dài viết sự tương phản thể hình eo thon đội bụng bầu bị gã khổng lồ luân dâm, dấu câu thưa thớt) → Nhạy cảm phóng đại (Nhịp điệu dễ bị châm ngòi hơn giao hợp thường thái——Cùng một lực độ đóng cọc phản ứng kịch liệt hơn, dùng câu ngắn viết những lần lên đỉnh thường xuyên hơn) → Thai máy xen kẽ ngưng trệ (Khoảnh khắc thỉnh thoảng thai máy nhịp điệu dừng một nhịp, một câu kéo dài viết sự hoảng loạn của Rin và sự mất kiểm soát của cơ thể) → Đại nghĩa lên men thu vĩ (Giảm tốc · Ngôn luận hưng phấn "Mang thai con của tao" của đàn em). Nhịp điệu của dâng hiến thai kỳ tổng thể dễ mất kiểm soát hơn thường thái, vì độ nhạy cảm tăng lên toàn diện.\nTrọng tâm cảm quan: Xúc giác chủ đạo và cường hóa "Thai kỳ nhạy cảm gấp bội" (Vách trong sung huyết nóng rực hơn/Phản ứng co thắt kịch liệt hơn/Vú chạm một cái là âm đạo kẹp chặt) → Thị giác (Sự tương phản thể hình bụng bầu nhô ra nhưng vẫn khít khao trắng trẻo/Eo thon đội bụng bầu bị luân dâm) → Khứu giác (Mùi cơ thể thai kỳ nồng hơn) → Âm thanh (Tiếng rên rỉ lên đỉnh thường xuyên hơn). Xúc giác "Nhạy cảm gấp bội" của cách chơi này là cốt lõi, tất cả phản ứng đều bị phóng đại.\nTừ vựng (Trục nhiệt độ độc quyền thai kỳ): L1 Bụng bầu/Mang thai/Nhạy cảm → L2 Sung huyết nóng rực/Co thắt gấp bội/Lên đỉnh thường xuyên hơn/Vú căng đau → L3 Mang thai rồi mà vẫn sướng thế này/Lỗ lồn thai phụ nhạy cảm hơn/Đứa trẻ được gieo vào. Từ ngữ độc quyền thai kỳ nhấn mạnh sự rối loạn nhận thức "Mang thai rồi mà còn sướng hơn".\nTiêu điểm miêu tả cơ thể: Bụng (Bụng bầu nhô ra + Sự tương phản của eo thon · Khi bị đâm bụng bầu nhấp nhô theo) · Vú (Hơi căng tức nhạy cảm hơn/Chạm một cái là âm đạo kẹp chặt/Có thể rỉ sữa) · Da eo bụng (Cảm giác căng kéo). Ống kính đóng đinh vào bụng bầu và vú, sự tương phản thể hình (Nhỏ bé loli + Bụng bầu + Gã khổng lồ) là cốt lõi thị giác.\nChi tiết kỹ thuật (Từ ngữ liệu): ① Tương phản thể hình——Thể hình nhỏ bé + Đồng tử La Sát = Bụng bầu nhô ra nhưng vẫn khít khao trắng trẻo, eo thon đội bụng bầu bị gã khổng lồ luân dâm, tương phản cực mạnh; ② Nhạy cảm gấp bội——Độ nhạy cảm thai kỳ tăng lên toàn diện, cùng lực độ đóng cọc phản ứng vách trong co thắt kịch liệt hơn/lên đỉnh thường xuyên hơn (Cơ chế cốt lõi), Rin kinh hãi "Mang thai rồi mà vẫn sướng thế này"; ③ Vú căng nhạy cảm——Vú hơi căng tức nhạy cảm hơn, chạm một cái là âm đạo kẹp chặt (Liên kết độc quyền thai kỳ); ④ Miệng tử cung chìm xuống trạng thái thụ thai——Cơ thể thai kỳ thời gian dài ở trạng thái chuẩn bị/khao khát, âm đạo sung huyết nóng rực hơn; ⑤ Thai máy xen kẽ——Thỉnh thoảng thai máy làm điểm ngắt nhịp điệu, sự hoảng loạn của Rin và sự mất kiểm soát của cơ thể đặt cạnh nhau (Tín hiệu độc quyền thai kỳ); ⑥ Điều chỉnh tư thế——Bụng bầu cấm tư thế ép bụng (Tư thế gieo giống đổi thành nằm nghiêng/ngồi), quỳ bò từ phía sau OK, cưỡi ngựa chịu ảnh hưởng trọng lượng bụng bầu, kẹp bánh mì đâm hai lỗ hạn chế áp lực chân dưới; ⑦ Đại nghĩa lên men——Ngôn luận hưng phấn "Gieo vào trong Đại tiểu thư rồi/Mang thai con của tao/Lỗ lồn thai phụ nhạy cảm hơn" của đàn em tiếp tục lên men.'}),on({id:'p_birth_show',keys:['wb_birth_show'],content:'Biểu diễn phân娩 (Tuyến sinh đẻ · Phơi bày phân娩 công khai). Tier2 Toàn bộ gọi AI · needsContinuity=Có (turning).\nCơ chế (Nói cho AI): Hai chân của Rin bị kéo ra gác lên đài (Tham khảo tư thế phân娩 "Ghế an hồn"——Giá đỡ chân vểnh cao, hai chân mở rộng, hạ thể hoàn toàn không có sự che chắn, cả người như vật trưng bày), đám đàn em vây quanh bốn phía xem toàn bộ quá trình đứa trẻ ra đời. Máy quay đồng thời ghi hình (Có thể làm tư liệu AV). Sự đau đớn của phân娩, cơn gò tử cung, và cuối cùng là sự sổ thai toàn bộ quá trình bị chứng kiến và ghi lại.\nCảm quan độc quyền:[Thị giác] Hai chân bị nong rộng gác cao và hạ thể hoàn toàn phơi bày/Ánh mắt vây xem của đám đàn em/Đèn đỏ của máy quay/Cảm giác trĩu nặng từng cơn theo cơn gò tử cung;[Xúc giác] Sự co giật của cơn gò tử cung phân娩 (Sự nhầm lẫn với co giật lên đỉnh)/Cảm giác bị nong rộng của hội âm/Mặt bàn/Cảm giác y tế lạnh lẽo;[Âm thanh] Tiếng bàn tán xì xào của đám đàn em/Tiếng hoạt động của thiết bị ghi hình/Tiếng rên rỉ vỡ vụn không thể kìm nén của Rin khi gò tử cung.\nDịch khoái cảm (Cốt lõi của trận này): Sự co giật toàn thân của phân娩 và cơ thể sau khi bị khai phá tột độ hình thành sự hỗn loạn——Sự nhức mỏi co thắt do cơn gò tử cung mang lại và sự co giật của cao trào trong cơ thể Rin không thể phân biệt được, cô kinh hãi trước sự giống nhau của hai việc này. Sự nhục nhã tột cùng khi bị chứng kiến/bị ghi hình hòa trộn với sự rối loạn này. Cô trải nghiệm được khoái cảm không thuộc về bối cảnh này trong nỗi đau sinh con——Bản thân điều này chính là bằng chứng của sự đọa lạc.\nTừ vựng L1: Phân娩/Gò tử cung/Sổ thai → L2 Hai chân mở rộng/Đèn đỏ ghi hình/Đàn em vây xem → L3 Đau đẻ và cao trào không phân biệt được/Sự thất thố triệt để bị ghi lại/Dòng máu La Sát ra đời.\n【Cách viết · Độc quyền biểu diễn phân娩】\nNhịp điệu câu cú: Gác lên trưng bày khởi đầu lạnh (Câu ngắn · Hai chân bị kéo ra gác lên đài như vật trưng bày, hạ thể không che chắn, nhịp điệu bị cố định cưỡng chế) → Cơn gò tử cung đau đẻ nhịp chậm (Câu dài · Viết cảm giác trĩu nặng từng cơn, dấu câu nhấp nhô theo nhịp gò tử cung) → Co giật nhầm lẫn ngưng trệ (Khoảnh khắc đau đẻ và co giật cao trào không thể phân biệt nhịp điệu dừng một nhịp, một câu kéo dài vạch trần "Không phân biệt được") → Sổ thai bùng nổ (Câu ngắn bắn liên thanh · Sự co giật toàn thân của phân娩 + Sự nhục nhã khi bị chứng kiến ghi hình hòa trộn) → Dư âm sau sinh thu vĩ (Giảm tốc · Đàn em vây xem bàn tán + Đèn đỏ vẫn đang ghi hình). Sức căng nằm ở sự nhầm lẫn đồng nguyên giữa đau đẻ và co giật khoái cảm, nhịp điệu nhấp nhô theo cơn gò tử cung.\nTrọng tâm cảm quan: Xúc giác (Sự nhầm lẫn giữa co giật gò tử cung và co giật cao trào/Cảm giác nong rộng hội âm/Cảm giác y tế lạnh lẽo mặt bàn) + Thị giác (Hai chân bị nong rộng gác cao/Hạ thể hoàn toàn phơi bày/Ánh mắt vây xem của đàn em/Đèn đỏ máy quay) là hai trục chính; Âm thanh (Tiếng bàn tán xì xào của đàn em/Thiết bị ghi hình hoạt động/Tiếng rên rỉ vỡ vụn khi gò tử cung) làm nền. Xúc giác "Đau đẻ ≈ Cao trào" của cách chơi này là cốt lõi, thị giác "Bị coi như vật trưng bày chứng kiến" là nguồn gốc xấu hổ.\nTừ vựng (Trục nhiệt độ độc quyền phân娩): L1 Phân娩/Gò tử cung/Sổ thai → L2 Hai chân mở rộng/Đèn đỏ ghi hình/Đàn em vây xem → L3 Đau đẻ và cao trào không phân biệt được/Sự thất thố triệt để bị ghi lại/Dòng máu La Sát ra đời. L3 dùng những từ ngữ xấu hổ rối loạn như "Không phân biệt được/Bị ghi lại/Thất thố", tập trung vào sự nhục nhã ghi chép của sự thất thố khi phân娩.\nTiêu điểm miêu tả cơ thể: Chân (Bị kéo ra gác cao như vật trưng bày/Hai chân mở rộng không thể khép lại) · Hạ thể (Hoàn toàn phơi bày/Trĩu nặng theo cơn gò tử cung/Quá trình sổ thai bị chứng kiến toàn bộ) · Khuôn mặt (Biểu cảm thất thố không thể kiểm soát dưới sự nhầm lẫn giữa đau đẻ và khoái cảm). Ống kính đóng đinh vào "Hạ thể bị gác lên trưng bày" và "Khuôn mặt thất thố", ánh mắt vây xem là tiêu điểm ẩn.\nChi tiết kỹ thuật: ① Tư thế vật trưng bày ghế an hồn——Hai chân bị kéo ra gác lên đài (Giá đỡ chân vểnh cao/Hai chân mở rộng/Hạ thể không che chắn/Như vật trưng bày), bản thân tư thế phân娩 đã là sự trưng bày nhục nhã; ② Cơn gò tử cung đau đẻ nhịp chậm——Cảm giác trĩu nặng từng cơn, nhịp điệu nhấp nhô theo cơn đau; ③ Co giật nhầm lẫn (Cốt lõi)——Sự co giật toàn thân của phân娩 và sự co giật cao trào sau khi bị khai phá tột độ trong cơ thể Rin không thể phân biệt được, cô kinh hãi trước sự giống nhau của hai việc này (Tính đồng nguyên Đau đẻ ≈ Khoái cảm là linh hồn của sự kiện này); ④ Bị chứng kiến nhục nhã——Đám đàn em vây quanh bốn phía xem toàn bộ quá trình đứa trẻ ra đời, sự xấu hổ khi bị coi như vật trưng bày và sự rối loạn co giật hòa trộn; ⑤ Ghi hình ghi chép——Máy quay đồng thời ghi hình (Có thể làm tư liệu AV), đèn đỏ luôn sáng = Sự thất thố triệt để bị ghi lại, sự nhục nhã có bằng chứng để tra cứu; ⑥ Hội âm nong rộng——Cảm giác bị nong rộng của hội âm khi phân娩 làm chi tiết xúc giác (Hòn đá tảng chân thực của đau đẻ); ⑦ Đồng tử La Sát tăng tốc——Huyết mạch đảm bảo toàn bộ quá trình thời gian ngắn, không viết sự giày vò lê thê (Luật thép không bi lụy).\nTóm tắt tiếp nối (turning): "Biểu diễn phân娩 hoàn tất. Bị đám đàn em vây xem ghi lại toàn bộ quá trình phân娩."\nCấm kỵ: Không bi lụy; Không sụp đổ; Đau đớn phân娩 → Nhầm lẫn với co giật khoái cảm; Đồng tử La Sát tăng tốc phân娩 = Toàn bộ quá trình thời gian ngắn.\nBước tiếp theo: Có thể nối tiếp wb_birth_rape (Luân dâm lâm bồn · Xâm phạm liên tục trong lúc phân娩).'}),on({id:'p_birth_rape',keys:['wb_birth_rape'],content:'Luân dâm xuất sản (Tuyến sinh đẻ · Luân dâm lâm bồn · Xâm phạm liên tục trong lúc phân娩). Tier2 Toàn bộ gọi AI · needsContinuity=Có (turning).\nCơ chế (Nói cho AI): Đám đàn em luân dâm Rin đang lâm bồn——Liên tục đâm vào hai lỗ cho đến khi vỡ ối, quá trình phân娩 bắt đầu. Cho dù quá trình phân娩 đã bắt đầu, trong lỗ đít và trong miệng vẫn cắm cặc toàn bộ quá trình không dừng lại (Giải thích cấu trúc không gian: Dưới tư thế nằm lâm bồn/tư thế khuỵu gối phân娩, đường xuất sản của âm đạo được ưu tiên giữ lại, đàn em phía trước tiếp tục cắm miệng, phía sau cắm lỗ đít hoặc thêm dương vật giả bên cạnh).\nCưỡng chế phân娩 (Kích thích → Khoái cảm tăng tốc gò tử cung): Sự rung động đâm vào không ngừng thúc đẩy việc lâm bồn; Nhịp điệu gò tử cung và nhịp điệu đâm vào đan xen, Rin bị oanh tạc kép trong sự nhức mỏi của cơn gò tử cung và khoái cảm khi bị đụ.\nĐại nghĩa (Giọng điệu đàn em): "Mau đẻ ra đi, đẻ xong bọn tao còn phải tiếp tục đụ Đại tiểu thư" "Đang lập công cho nhà Kujo đấy"——Tiếp tục gọi khung đại nghĩa linh đường.\nDịch khoái cảm (Cốt lõi của trận này · Vòng lặp phản hồi dương): Nhịp điệu gò tử cung và nhịp điệu đóng cọc đan xen trong cơ thể Rin——Mỗi lần co thắt do gò tử cung mang lại khiến hai lỗ kẹp chặt cặc của đàn em, đàn em càng hưng phấn đâm càng mạnh, kích thích mạnh hơn lại kích hoạt cơn gò tử cung mạnh hơn. Vòng lặp phản hồi dương = Cơ thể hoàn toàn mất đi ranh giới kiểm soát, ranh giới giữa đau đẻ và khoái cảm hoàn toàn tan biến trong vòng lặp này.\nCảm quan độc quyền:[Xúc giác] Sự co thắt nhức mỏi của cơn gò tử cung và sự căng tức của việc đâm vào xếp chồng/Sự ấm nóng tuôn ra sau khi vỡ ối/Sự căng tức khi bị chiếm dụng nhiều chỗ cùng lúc;[Thị giác] Bụng bầu lâm bồn nhấp nhô theo cơn gò tử cung/Thể dịch ở chỗ kết hợp hòa trộn/Bóng dáng luân phiên của đám đàn em/Nước ối làm ướt đẫm ga trải giường;[Âm thanh] Tiếng thở dốc vỡ vụn cố nhịn của Rin khi gò tử cung/Tiếng đóng cọc bạch bạch/Tiếng thúc giục của đàn em "Dùng sức" "Mau ra đi"/Tiếng nước khi vỡ ối.\nTừ vựng L1: Lâm bồn/Gò tử cung/Nước ối → L2 Đâm vào liên tục/Hai lỗ lấp đầy/Vỡ ối → L3 Đau đẻ và khoái cảm đồng nguyên/Bị giục đẻ/Vòng lặp phản hồi dương/Đọa lạc tột cùng.\n【Cách viết · Độc quyền luân dâm xuất sản】\nNhịp điệu câu cú: Đâm vào liên tục khởi đầu chậm (Câu dài · Dưới tư thế nằm lâm bồn hai lỗ bị lấp đầy liên tục, nhịp điệu bị hai luồng nhịp điệu gò tử cung và đóng cọc giằng xé) → Gò tử cung đóng cọc đan xen (Hai luồng nhịp điệu luân phiên tăng tốc——Gò tử cung co thắt thì hai lỗ kẹp chặt cặc, đàn em đâm mạnh hơn, mạnh hơn lại kích hoạt gò tử cung mạnh hơn, nhịp điệu xoắn ốc đi lên) → Vỡ ối ngưng trệ (Khoảnh khắc vỡ ối nhịp điệu dừng một nhịp, xúc cảm ấm nóng tuôn ra kéo dài một câu) → Phản hồi dương bùng nổ (Câu ngắn bắn liên thanh · Ranh giới đau đẻ và khoái cảm trong vòng lặp hoàn toàn tan biến, Rin bị oanh tạc kép thất thần) → Tuần hoàn sau sinh thu vĩ (Giảm tốc · "Đẻ xong còn phải tiếp tục đụ" + Tuần hoàn sinh đẻ mở ra). Sức căng nằm ở vòng xoắn ốc phản hồi dương của hai luồng nhịp điệu, nhịp điệu tăng tốc theo vòng lặp.\nTrọng tâm cảm quan: Xúc giác tuyệt đối chủ đạo và cường hóa "Xếp chồng kép" (Gò tử cung co thắt nhức mỏi + Đâm vào căng tức tồn tại cùng lúc/Sau khi vỡ ối ấm nóng tuôn ra/Căng tức khi bị chiếm dụng nhiều chỗ) → Thị giác (Bụng bầu lâm bồn nhấp nhô theo gò tử cung/Thể dịch chỗ kết hợp hòa trộn/Nước ối ướt đẫm ga giường) → Âm thanh (Tiếng thở dốc vỡ vụn cố nhịn/Tiếng đóng cọc bạch bạch/Đàn em giục "Dùng sức" "Mau ra đi"/Tiếng nước vỡ ối). Xúc giác "Nhịp điệu kép gò tử cung × đóng cọc xếp chồng" của cách chơi này là cốt lõi, khoái cảm và đau đẻ đồng nguyên.\nTừ vựng (Trục nhiệt độ độc quyền luân dâm xuất sản): L1 Lâm bồn/Gò tử cung/Nước ối → L2 Đâm vào liên tục/Hai lỗ lấp đầy/Vỡ ối → L3 Đau đẻ và khoái cảm đồng nguyên/Bị giục đẻ/Vòng lặp phản hồi dương/Đọa lạc tột cùng. L3 "Đau đẻ và khoái cảm đồng nguyên/Vòng lặp phản hồi dương" là độc quyền của cách chơi này, nhấn mạnh sự tan biến ranh giới chứ không đơn thuần là khoái cảm.\nTiêu điểm miêu tả cơ thể: Bụng (Bụng bầu lâm bồn nhấp nhô theo gò tử cung/Khi bị đâm vào liên tục bụng bầu rung lắc) · Lỗ (Đường xuất sản âm đạo ưu tiên giữ lại/Hậu môn và miệng bị chiếm dụng liên tục/Sự căng tức khi hai lỗ lấp đầy) · Chỗ kết hợp (Thể dịch hòa trộn/Nước ối ướt đẫm). Ống kính nằm giữa "Bụng bầu nhấp nhô theo gò tử cung" và "Hai lỗ bị chiếm dụng liên tục", sự tan biến ranh giới là tiêu điểm.\nChi tiết kỹ thuật: ① Lâm bồn xâm phạm liên tục——Đàn em luân dâm Rin đang lâm bồn, liên tục đâm vào hai lỗ cho đến khi vỡ ối phân娩 bắt đầu, cho dù phân娩 bắt đầu hậu môn và miệng cũng toàn bộ quá trình không dừng lại (Đường xuất sản ưu tiên giữ lại âm đạo); ② Hai nhịp điệu đan xen (Cốt lõi)——Nhịp điệu gò tử cung và nhịp điệu đóng cọc đan xen trong cơ thể Rin, gò tử cung co thắt → hai lỗ kẹp chặt cặc → đàn em đâm mạnh hơn → gò tử cung mạnh hơn, vòng xoắn ốc phản hồi dương; ③ Vòng lặp phản hồi dương——Ranh giới đau đẻ và khoái cảm trong vòng lặp này hoàn toàn tan biến (Cơ thể hoàn toàn mất đi ranh giới kiểm soát, là linh hồn của sự kiện này); ④ Đâm vào rung động thúc đẻ——Sự rung động đâm vào không ngừng thúc đẩy việc lâm bồn, gò tử cung và nhịp điệu đâm vào xúc tác lẫn nhau; ⑤ Xúc cảm vỡ ối——Sau khi vỡ ối xúc cảm ấm nóng tuôn ra làm điểm ngắt nhịp điệu và chi tiết chân thực; ⑥ Thể dịch hòa trộn——Chất tiết gò tử cung/Nước ối/Tinh dịch ở chỗ kết hợp hòa trộn ướt đẫm ga giường (Chi tiết thị giác của việc lâm bồn thực tế); ⑦ Đại nghĩa thúc giục——Đàn em "Mau đẻ ra đi đẻ xong còn phải tiếp tục đụ/Lập công cho nhà Kujo" tiếp tục gọi khu
