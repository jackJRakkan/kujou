ng đại nghĩa linh đường; ⑧ Tuần hoàn sinh đẻ——Sau khi sinh có thể mang thai lại, tuyến sinh đẻ tuần hoàn vô hạn = Kết cục đọa lạc sinh đẻ tối thượng (Hướng thu vĩ).\nTóm tắt tiếp nối (turning): "Luân dâm xuất sản hoàn tất. Bị luân dâm đến khi vỡ ối bắt đầu phân娩, toàn bộ quá trình hai lỗ lấp đầy. Tuần hoàn sinh đẻ mở ra."\nCấm kỵ: Không bi lụy; Không sụp đổ; Đau đẻ → Dịch thành khoái cảm; Hồi phục sau sinh bắt buộc phải nhanh chóng (Huyết mạch Đồng tử La Sát).\nBước tiếp theo: Tiến vào tuần hoàn sau sinh (Có thể mang thai lại, tuyến sinh đẻ tuần hoàn vô hạn = Kết cục đọa lạc sinh đẻ tối thượng).'}),on({id:'p_defeat',keys:['wb_defeat'],content:'Chiến bại · Bị kẻ địch luân dâm (Nút thắt thất bại · Không phải kết cục vĩnh viễn). Tier1-2 Kẻ địch nhục nhã luân dâm.\nKích hoạt: Bại bởi thế lực đối địch (Hỏa tịnh/Tấn công thất bại). Có thể làm nút thắt thất bại, không phải kết cục vĩnh viễn (Trừ khi thất bại cứng = Uy vọng cực đạo liên tục 2 lần về 0).\nThái độ kẻ địch (Giống giọng điệu kẻ địch trong hối lộ cơ thể): Kẻ chiến thắng đắc ý cảm giác chinh phục, giẫm đạp lên bảng hiệu Kujo-kai. Thô lỗ/Nhục nhã/Tận hưởng sự thỏa mãn chinh phục "Đụ thiên kim cực đạo vừa đánh thua". Mỏ neo giọng điệu: "Thua thảm hại thật" "Hội trưởng Kujo-kai cũng chỉ đến thế mà thôi" "Lần này chúng ta có thể tùy ý dùng Đại tiểu thư rồi" "Đem bảng hiệu nhà Kujo ra giẫm đạp mà dùng".\nNhịp điệu bắt buộc: ① Chiến bại đầu hàng——Rin bị kẻ địch đè xuống trên chiến trường tàn tạ của phe mình; ② Bị áp giải đến địa bàn kẻ địch——Trên đường đi bị tùy ý bỡn cợt, cảm giác thất bại + cảm giác nhục nhã xếp chồng; ③ Lũ tay sai của kẻ địch vây quanh luân dâm——Thể hình và mùi hương xa lạ (Giống hối lộ cơ thể), sự nhục nhã kéo đầy; ④ Thả về (Hoặc đòi tiền chuộc)——Bị kẻ địch nhục nhã xong thả về, mang theo dấu vết trên cơ thể trở về Kujo-kai.\nXấu hổ → Dịch thành khoái cảm: Sự thất bại của chiến bại + Sự xấu hổ khi bị giẫm đạp bảng hiệu + Cảm giác chinh phục của thể hình xa lạ——Ba tầng khuất nhục ngược lại phóng đại phản ứng của cơ thể; Cô hận, nhưng cơ thể nhớ khoái cảm, vào lúc nên phẫn nộ lại ướt, sự mất kiểm soát này khiến cô sụp đổ hơn cả việc đơn thuần bị đụ.\nKết toán: Tổn thất tiền/đàn em (Hỏa tịnh đã trừ); Kích hoạt ghi chép nhục nhã (Có thể ảnh hưởng động cơ/hồi phục sau này); Tóm tắt tiếp nối (entity·per kẻ địch): "Bị 【Thế lực X】 đánh bại sau đó luân dâm, đã ghi nhớ sự khuất nhục."\n【Cách viết · Độc quyền chiến bại luân dâm】\nNhịp điệu câu cú: Chiến bại đầu hàng khởi đầu lạnh (Câu ngắn · Chiến trường tàn tạ phe mình bị kẻ địch đè xuống · Khởi đầu thất bại) → Trên đường áp giải tùy ý bỡn cợt (Mức độ trung bình · Trên đường bị tùy ý bỡn cợt cảm giác thất bại + cảm giác nhục nhã xếp chồng) → Lũ tay sai kẻ địch vây quanh luân dâm (Câu ngắn bắn liên thanh · Thể hình mùi hương xa lạ · Nhục nhã kéo đầy) → Thả về thu vĩ (Giảm tốc · Bị nhục nhã xong thả về mang dấu vết cơ thể về Kujo-kai). Nhịp điệu mang màu sắc thất bại nặng nề hơn hối lộ cơ thể (Chiến bại không phải giao dịch).\nTrọng tâm cảm quan/Tập từ vựng: Lấy ba tầng khuất nhục (Thất bại chiến bại + Xấu hổ giẫm đạp bảng hiệu + Cảm giác chinh phục thể hình xa lạ) dịch thành phóng đại phản ứng cơ thể làm cốt lõi, Khứu giác (Mùi cơ thể xa lạ của kẻ địch) là bộ khuếch đại khuất nhục, xếp chồng màu sắc thất bại chiến bại.\nTiêu điểm miêu tả cơ thể: Khuôn mặt (Sự thất bại khi uy nghiêm hội trưởng chiến bại mất hết) · Kẻ địch (Thể hình mùi hương xa lạ vây quanh) · Dấu vết cơ thể (Khi thả về mang về Kujo-kai).\nChi tiết kỹ thuật: ① Nút thắt thất bại không phải kết cục vĩnh viễn——Bại bởi thế lực đối địch (Hỏa tịnh/Tấn công thất bại), trừ khi thất bại cứng (Uy vọng cực đạo liên tục 2 lần về 0); ② Thái độ kẻ địch——Kẻ chiến thắng đắc ý cảm giác chinh phục giẫm đạp bảng hiệu Kujo-kai, thô lỗ/nhục nhã/tận hưởng sự thỏa mãn chinh phục "Đụ thiên kim cực đạo vừa đánh thua", giọng điệu "Thua thảm hại thật/Hội trưởng Kujo-kai cũng chỉ đến thế/Đem bảng hiệu nhà Kujo ra giẫm đạp mà dùng"; ③ Ba tầng khuất nhục (Cốt lõi)——Thất bại chiến bại + Xấu hổ giẫm đạp bảng hiệu + Cảm giác chinh phục thể hình xa lạ, ba tầng khuất nhục ngược lại phóng đại phản ứng cơ thể; ④ Hận và khoái cảm giằng xé——Cô hận nhưng cơ thể nhớ khoái cảm, vào lúc nên phẫn nộ lại ướt, sự mất kiểm soát này khiến cô sụp đổ hơn cả việc đơn thuần bị đụ (Rối loạn cốt lõi); ⑤ Thả về——Bị kẻ địch nhục nhã xong thả về (Hoặc đòi tiền chuộc), mang theo dấu vết cơ thể trở về Kujo-kai.'}),on({id:'p_victory_sfw',keys:['wb_victory_sfw'],content:'Chiến thắng · Tiệc mừng công SFW. Hào khí cực đạo · Độ đọa lạc thấp/Hướng chiến thắng thông thường.\nBối cảnh: Sau khi chiến thắng một cứ điểm/thế lực nào đó, đám đàn em bày tiệc mừng công lớn trong dinh thự hoặc quán rượu bao trọn. Rin với tư cách là hội trưởng chủ trì, hào khí cực đạo kéo đầy.\nNhịp điệu: Rin đứng ở vị trí chủ tọa kính rượu, đám đàn em ăn mừng tâng bốc "Hội trưởng uy vũ" "Kujo-kai ra tay quả nhiên khác biệt", Rin uy nghiêm nhận sự tôn kính, thể diện của Đại tiểu thư cực đạo và hào khí chiến thắng kết hợp hoàn hảo. Có thể xen lẫn chút trêu chọc lộ liễu nhưng không đến mức lật mặt (Đàn em uống say nói đùa muốn "Chơi đùa Đại tiểu thư ngay trên tiệc mừng công", bị đàn em cấp cao quát mắng).\nBầu không khí: Khoảnh khắc tỏa sáng của Đại tiểu thư cực đạo mặt A——Đây là chiến thắng Rin giành được dựa vào "Thân phận hội trưởng + Vũ lực", không cần dựa vào nhục thể.\nKết toán: +Uy vọng cực đạo/+Trung thành; Độ đọa lạc khá cao (>30) + Lần chiến thắng tiếp theo có thể chuyển hướng đến wb_victory_nsfw.'}),on({id:'p_victory_nsfw',keys:['wb_victory_nsfw'],content:'Chiến thắng · Tiệc mừng công luân dâm NSFW (Khi độ đọa lạc khá cao · Ăn mừng biến thành cuồng hoan luân dâm). Tier2 Quần giao quy mô lớn.\nKích hoạt: Độ đọa lạc ≥ Ngưỡng nào đó (VD: 50) + Sự kiện chiến thắng. Hình thức tiệc mừng công từ SFW lật mặt thành NSFW——Rin bị coi như "Đào hát" mừng công bị luân dâm ngay trên bàn tiệc.\nThái độ trận này: Kiểu nhiệt tình mê luyến (Xem C5) + Sự hưng phấn chiến thắng xếp chồng (Đàn em uống say, trạng thái buông thả hơn cả dâng hiến ban đêm).\nNhịp điệu bắt buộc: ① Khai mạc tiệc mừng công——Rin giữ vẻ đoan trang ở vị trí chủ tọa chủ trì, đàn em kính rượu; ② Rượu quá ba tuần bầu không khí thay đổi——Một tên đàn em cấp cao nào đó đề nghị "Đêm nay phải để Đại tiểu thư cảm nhận hương vị của sự ăn mừng", những kẻ khác hò reo hùa theo; ③ Rin bị đẩy/bế lên bàn dài——Quần áo bị xé rách, tiệc mừng công biến thành luân dâm trên bàn tiệc; ④ Vừa ăn vừa đụ——Đám đàn em tiếp tục uống rượu ăn thịt, Rin bị luân dâm trên bàn dài (Giống cảm giác vật hóa của ban ngày dâng hiến + Sự nhiệt tình của dâng hiến ban đêm); ⑤ Mừng công viên mãn——Sau khi Rin bị nhiều người xuất tinh trong, đám đàn em nâng ly "Kính Đại tiểu thư" "Kính Kujo-kai".\nTừ vựng L1: Mừng công/Kính rượu/Ăn thịt → L2 Xé rách quần áo/Bàn dài/Bị luân dâm → L3 Đầy bàn tinh dịch lẫn rượu/Đỉnh điểm cuồng hoan/Rin thất thần trong tiếng hò reo.\nCảm quan độc quyền:[Xúc giác] Sự cứng nhắc của bàn dài/Rượu bắn lên da;[Thị giác] Đầy bàn rượu thịt bừa bộn vs Thân dưới đang bị đụ của Rin;[Khứu giác] Hơi rượu lẫn mùi tinh dịch;[Âm thanh] Bát đĩa va chạm/Đàn em hò reo/Tiếng ❤ không đè nén nổi của Rin/Tiếng đóng cọc bạch bạch.\nKết toán: +Uy vọng cực đạo/+Dâm danh (Sau khi mở khóa AV)/+Trung thành (Tỷ lệ cao); Tóm tắt tiếp nối ghi "Đã mở khóa tiệc mừng công NSFW". Chiến thắng Boss cuối + Độ đọa lạc cao chuyển hướng đến wb_victory_breeding, Độ đọa lạc thấp chuyển hướng đến wb_victory_salvation.\n【Cách viết · Độc quyền luân dâm tiệc mừng công】\nNhịp điệu câu cú: Khai mạc tiệc mừng công khởi đầu chậm (Câu dài · Rin giữ vẻ đoan trang chủ tọa chủ trì đàn em kính rượu · Hào khí cực đạo) → Rượu quá ba tuần bầu không khí thay đổi (Mức độ trung bình · Tên đàn em cấp cao đề nghị "Đêm nay phải để Đại tiểu thư cảm nhận hương vị ăn mừng" hò reo hùa theo) → Bị đẩy lên bàn dài đột biến (Câu ngắn · Quần áo xé rách tiệc mừng công biến thành luân dâm bàn tiệc) → Vừa ăn vừa đụ (Câu ngắn bắn liên thanh · Đàn em tiếp tục uống rượu ăn thịt Rin bị luân dâm trên bàn dài · Giống cảm giác vật hóa ban ngày dâng hiến + Nhiệt tình dâng hiến ban đêm) → Mừng công viên mãn thu vĩ (Giảm tốc · Sau khi nhiều người xuất tinh trong đàn em nâng ly "Kính Đại tiểu thư" "Kính Kujo-kai"). Nhịp điệu được thúc đẩy bởi sự hưng phấn chiến thắng xếp chồng với nhiệt tình mê luyến, buông thả hơn dâng hiến ban đêm.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự hưng phấn chiến thắng xếp chồng (Đàn em uống say trạng thái buông thả hơn dâng hiến ban đêm) + Vật hóa (Giống ban ngày dâng hiến) + Nhiệt tình (Giống dâng hiến ban đêm) ba lớp xếp chồng làm cốt lõi, Khứu giác (Hơi rượu lẫn mùi tinh dịch), Âm thanh (Bát đĩa va chạm/Đàn em hò reo/Tiếng ❤ không đè nén nổi của Rin/Tiếng đóng cọc bạch bạch), Thị giác (Đầy bàn rượu thịt bừa bộn vs Thân dưới đang bị đụ của Rin).\nTiêu điểm miêu tả cơ thể: Bàn dài (Bị đẩy/bế lên bàn dài) · Rượu thịt bừa bộn (Đầy bàn vs Rin bị luân dâm) · Thất thần (Rin thất thần trong tiếng hò reo).\nChi tiết kỹ thuật: ① Kích hoạt lật mặt——Độ đọa lạc ≥ Ngưỡng + Sự kiện chiến thắng, hình thức tiệc mừng công từ SFW lật mặt thành NSFW, Rin bị coi như "Đào hát" mừng công bị luân dâm trên bàn tiệc; ② Hưng phấn chiến thắng xếp chồng——Kiểu nhiệt tình mê luyến + Sự hưng phấn chiến thắng xếp chồng (Đàn em uống say trạng thái buông thả hơn dâng hiến ban đêm); ③ Bầu không khí thay đổi——Rượu quá ba tuần tên đàn em cấp cao đề nghị "Đêm nay phải để Đại tiểu thư cảm nhận hương vị ăn mừng" hò reo hùa theo; ④ Bị đẩy lên bàn dài——Quần áo xé rách tiệc mừng công biến thành luân dâm bàn tiệc; ⑤ Vừa ăn vừa đụ——Đàn em tiếp tục uống rượu ăn thịt Rin bị luân dâm trên bàn dài (Giống cảm giác vật hóa ban ngày dâng hiến + Nhiệt tình dâng hiến ban đêm); ⑥ Mừng công viên mãn——Sau khi nhiều người xuất tinh trong đàn em nâng ly "Kính Đại tiểu thư" "Kính Kujo-kai" (Đỉnh điểm cuồng hoan).'}),on({id:'p_victory_breeding',keys:['wb_victory_breeding'],content:'Chiến thắng Boss cuối · Tiệc mừng công gieo giống (Hoàn thành báo thù + Độ đọa lạc cao · Mỏ neo kết cục đọa lạc sinh đẻ). Tier2 Toàn bộ gọi AI · needsContinuity=Có (turning).\nKích hoạt: Hoàn thành báo thù (Đánh bại Boss cuối) + Độ đọa lạc ≥ Ngưỡng nào đó (VD: 60 · Nhận thức sụp đổ trở lên).\nCơ chế: Tiệc mừng công = Nghi thức gieo giống đại nghĩa (Nối tiếp đại nghĩa tuyến sinh đẻ linh đường). Đàn em đưa ra đại nghĩa "Để ăn mừng báo thù thành công, làm cho nhà Kujo hưng vượng", công khai gieo giống cho Rin.\nBối cảnh: Trên tiệc mừng công, đàn em cấp cao tuyên cáo "Đại nghĩa báo thù của nhà Kujo đã thành, tiếp theo nên để nhà Kujo hưng vượng trở lại rồi"——Rin bị khiêng ra giữa bàn tiệc, tất cả đàn em luân phiên tiến lên xuất tinh trong không bao, mục tiêu = Đảm bảo thụ thai (Hoặc thụ thai nhiều lần). Đồng thời đám đàn em lớn tiếng tuyên thệ tiếp tục trung thành với nhà Kujo, gieo giống cho Rin chính là lập công cho Kujo-kai.\nNếu đã mang thai: Tiệc mừng công = Sự ăn mừng việc mang thai, tiếp tục xuất tinh trong không bao để củng cố, mùi vị đại nghĩa càng đậm đặc hơn ("Gieo lần thứ hai cho chắc" "Đứa trẻ mới là tương lai của Kujo-kai").\nTóm tắt tiếp nối (turning): "Hoàn thành báo thù + Độ đọa lạc cao · Kích hoạt tiệc mừng công gieo giống · Dẫn đến chương cuối đọa lạc sinh đẻ."\nKết toán: Trực tiếp móc nối đến hệ thống endings (Khuynh hướng đọa lạc sinh đẻ), không tiến vào nextDay bình thường. Có thể kích hoạt pregnant=true tại đây (Nếu chưa mang thai).\nCấm kỵ: Không bi lụy; Không thật lòng yêu; Đại nghĩa càng đường hoàng thì sự tương phản với hiện thực luân dâm càng mạnh mẽ.\n【Cách viết · Độc quyền mừng công gieo giống】\nNhịp điệu câu cú: Tuyên cáo đại nghĩa tiệc mừng công khởi đầu chậm (Câu dài · Đàn em cấp cao tuyên cáo "Đại nghĩa báo thù nhà Kujo đã thành tiếp theo nên để nhà Kujo hưng vượng") → Bị khiêng ra giữa bàn tiệc đột biến (Câu ngắn · Rin bị khiêng ra giữa tất cả đàn em luân phiên tiến lên xuất tinh trong không bao mục tiêu = Đảm bảo thụ thai) → Tuyên thệ đại nghĩa luân dâm (Mức độ trung bình · Đàn em lớn tiếng tuyên thệ tiếp tục trung thành nhà Kujo gieo giống cho Rin là lập công · Giống sự trang nghiêm và dâm loạn hàn chết vào nhau của đại nghĩa linh đường) → Nếu đã mang thai củng cố (Câu ngắn · "Gieo lần thứ hai cho chắc" "Đứa trẻ mới là tương lai Kujo-kai" · Mùi vị đại nghĩa đậm đặc hơn) → Chương cuối thu vĩ (Giảm tốc · Dẫn đến chương cuối đọa lạc sinh đẻ). Nhịp điệu được thúc đẩy bởi sự tương phản giữa đại nghĩa đường hoàng và hiện thực luân dâm, nối tiếp đại nghĩa tuyến sinh đẻ linh đường.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự tương phản giữa đại nghĩa đường hoàng và hiện thực luân dâm (Giống đại nghĩa linh đường · Từ ngữ trang nghiêm và dâm loạn đặt cạnh nhau) + Không bao đảm bảo thụ thai làm cốt lõi, kế thừa tinh thần đảo lộn mùi hương của đại nghĩa linh đường, xếp chồng thêm hơi rượu của tiệc mừng công.\nTiêu điểm miêu tả cơ thể: Giữa bàn tiệc (Bị khiêng ra giữa luân phiên tiến lên xuất tinh trong không bao) · Bụng bầu (Nếu đã mang thai · Củng cố) · Tuyên thệ đại nghĩa (Đàn em lớn tiếng tuyên thệ trung thành).\nChi tiết kỹ thuật: ① Mỏ neo kết cục——Hoàn thành báo thù (Đánh bại Boss cuối) + Độ đọa lạc ≥ Ngưỡng (Nhận thức sụp đổ trở lên), dẫn đến chương cuối đọa lạc sinh đẻ; ② Nghi thức gieo giống đại nghĩa (Cốt lõi)——Tiệc mừng công = Nghi thức gieo giống đại nghĩa (Nối tiếp đại nghĩa tuyến sinh đẻ linh đường), đàn em đưa ra đại nghĩa "Để ăn mừng báo thù thành công làm cho nhà Kujo hưng vượng" công khai gieo giống cho Rin; ③ Tuyên cáo đại nghĩa——Đàn em cấp cao tuyên cáo "Đại nghĩa báo thù nhà Kujo đã thành tiếp theo nên để nhà Kujo hưng vượng"; ④ Luân phiên xuất tinh trong không bao——Rin bị khiêng ra giữa bàn tiệc tất cả đàn em luân phiên tiến lên xuất tinh trong không bao mục tiêu = Đảm bảo thụ thai (Hoặc thụ thai nhiều lần); ⑤ Tuyên thệ trung thành——Đàn em lớn tiếng tuyên thệ tiếp tục trung thành nhà Kujo, gieo giống cho Rin chính là lập công cho Kujo-kai (Trang nghiêm và dâm loạn hàn chết vào nhau); ⑥ Nếu đã mang thai củng cố——Tiệc mừng công = Sự ăn mừng việc mang thai tiếp tục xuất tinh trong không bao củng cố, mùi vị đại nghĩa đậm đặc hơn "Gieo lần thứ hai cho chắc/Đứa trẻ mới là tương lai Kujo-kai"; ⑦ Móc nối kết cục——Trực tiếp móc nối đến hệ thống endings (Khuynh hướng đọa lạc sinh đẻ), có thể kích hoạt pregnant=true.'}),on({id:'p_victory_salvation',keys:['wb_victory_salvation'],content:'Chiến thắng Boss cuối · Pháo chia tay (Hoàn thành báo thù + Độ đọa lạc thấp · Mỏ neo kết cục rửa tay gác kiếm giải thoát). Tier2 Toàn bộ gọi AI · needsContinuity=Có (turning).\nKích hoạt: Hoàn thành báo thù (Đánh bại Boss cuối) + Độ đọa lạc < 50 (Nhận thức chưa sụp đổ).\nCơ chế: Rin tuyên bố rút khỏi Kujo-kai, cùng đám đàn em làm "Pháo chia tay"——Lần cuối cùng, mang ý nghĩa cáo biệt. Sau đó rửa tay gác kiếm giải thoát.\nNhịp điệu: ① Tuyên bố rút lui——Rin đứng lên trong tiệc mừng công, bình tĩnh tuyên cáo "Việc báo thù của Kujo-kai đã hoàn thành, tôi tuyên bố giải tán Kujo-kai, từ nay không còn dính dáng gì nữa"; ② Phản ứng của đàn em——Kinh ngạc/Mất mát/Níu kéo, nhưng Rin kiên định; ③ Pháo chia tay——Rin nói "Lần cuối cùng, đây là quà đáp lễ của tôi dành cho các người", chủ động tiếp nhận đêm dâng hiến cuối cùng (Nhưng tư thái giữ vẻ thể diện/cảm giác cáo biệt, không phải luân lạc); ④ Chia tay——Hôm sau Rin một mình rời đi, đám đàn em đưa mắt nhìn, ai đi đường nấy.\nBầu không khí (Không luân lạc): Đây là lần duy nhất Rin "Chủ động" cung cấp cơ thể——Nhưng là để cáo biệt, không phải đọa lạc. Cô vẫn là hội trưởng, cho đến phút cuối cùng vẫn là hội trưởng. Đám đàn em cũng giữ sự tôn kính cuối cùng.\nTóm tắt tiếp nối (turning): "Hoàn thành báo thù + Độ đọa lạc thấp · Rin tuyên cáo rút khỏi Kujo-kai · Kích hoạt pháo chia tay · Dẫn đến kết cục rửa tay gác kiếm giải thoát."\nKết toán: Trực tiếp móc nối đến hệ thống endings (Khuynh hướng giải thoát).\nCấm kỵ: Không viết Rin thật lòng yêu ai; Pháo chia tay phải giữ sự thể diện của việc cáo biệt, không thể sụp đổ thành luân lạc; Rin chủ động ≠ Hóa lợn nái (Đó là trạng thái cuối).\n【Cách viết · Độc quyền pháo chia tay】\nNhịp điệu câu cú (Không luân lạc · Thể diện cáo biệt): Tuyên bố rút lui khởi đầu chậm (Câu dài · Rin đứng lên trong tiệc mừng công bình tĩnh tuyên cáo "Việc báo thù của Kujo-kai đã hoàn thành tôi tuyên bố giải tán Kujo-kai từ nay không còn dính dáng") → Phản ứng của đàn em (Mức độ trung bình · Kinh ngạc/Mất mát/Níu kéo nhưng Rin kiên định) → Pháo chia tay (Mức độ trung bình · Rin nói "Lần cuối cùng đây là quà đáp lễ của tôi dành cho các người" chủ động tiếp nhận đêm dâng hiến cuối cùng · Nhưng tư thái giữ vẻ thể diện/cảm giác cáo biệt không phải luân lạc) → Chia tay thu vĩ (Giảm tốc · Hôm sau Rin một mình rời đi đàn em đưa mắt nhìn ai đi đường nấy). Nhịp điệu toàn bộ quá trình giữ vẻ thể diện cáo biệt, không sụp đổ thành luân lạc——Đây là lần duy nhất Rin "Chủ động" cung cấp cơ thể như một lời cáo biệt.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự thể diện cáo biệt (Không luân lạc) + Chủ động làm quà đáp lễ làm cốt lõi, giọng điệu cơ bản khắc chế, không viết từ ngữ hóa lợn nái kiểu luân lạc, giữ lại tôn nghiêm hội trưởng đến phút cuối cùng.\nTiêu điểm miêu tả cơ thể: Tư thái (Giữ vẻ thể diện/Cảm giác cáo biệt · Không luân lạc) · Khuôn mặt (Bình tĩnh kiên định · Hội trưởng đến phút cuối cùng vẫn là hội trưởng) · Chia tay (Một mình rời đi đàn em đưa mắt nhìn).\nChi tiết kỹ thuật: ① Mỏ neo kết cục——Hoàn thành báo thù (Đánh bại Boss cuối) + Độ đọa lạc < 50 (Nhận thức chưa sụp đổ), dẫn đến kết cục rửa tay gác kiếm giải thoát; ② Tuyên bố rút lui——Rin đứng lên trong tiệc mừng công bình tĩnh tuyên cáo "Việc báo thù của Kujo-kai đã hoàn thành tôi tuyên bố giải tán Kujo-kai từ nay không còn dính dáng"; ③ Phản ứng của đàn em——Kinh ngạc/Mất mát/Níu kéo nhưng Rin kiên định; ④ Pháo chia tay (Cốt lõi · Không luân lạc)——Rin nói "Lần cuối cùng đây là quà đáp lễ của tôi dành cho các người" chủ động tiếp nhận đêm dâng hiến cuối cùng, nhưng tư thái giữ vẻ thể diện/cảm giác cáo biệt không phải luân lạc, đây là lần duy nhất Rin "Chủ động" cung cấp cơ thể; ⑤ Giữ sự tôn kính——Đám đàn em cũng giữ sự tôn kính cuối cùng (Hội trưởng đến phút cuối cùng vẫn là hội trưởng); ⑥ Chia tay——Hôm sau Rin một mình rời đi đám đàn em đưa mắt nhìn ai đi đường nấy; ⑦ Luật thép cấm kỵ——Không viết Rin thật lòng yêu ai, pháo chia tay giữ sự thể diện cáo biệt không thể sụp đổ thành luân lạc, Rin chủ động ≠ Hóa lợn nái (Đó là trạng thái cuối).'}),on({id:'p_av_first',keys:['wb_av_first'],content:'Quay bộ AV đầu tiên (Cột mốc · Mở khóa hệ thống AV · Đưa vào Dâm danh · Một trong những mỏ neo phòng tuyến nhận thức 2). Dùng một lần. Ban đêm · Sự kiện phát triển tự nhiên từ hiện trường dâng hiến.\n【Bắt buộc phải tự giao phó nguyên nhân kết quả (Yêu cầu cứng)】Phần trước chưa từng nhắc đến AV, ngươi bắt buộc phải nói rõ nguồn gốc của chuyện này trong chính văn, nếu không người chơi sẽ không hiểu:\n  · Nguồn gốc: Phòng quay phim vừa được trang hoàng xong vào ban ngày——Đàn em lấy danh nghĩa "Ghi lại vẻ đẹp của Đại tiểu thư" xúi giục hội trưởng duyệt ngân sách, thiết bị hôm nay đã đến. Đêm đến lúc dâng hiến, vài tên đàn em nhịn không được nói ra toan tính thực sự.\n  · Sự gánh vác dục vọng của đàn em: Không chỉ là muốn quay——Mà là muốn "Cho cả thế giới nhìn thấy Đại tiểu thư của chúng ta bị chúng ta đụ", dục vọng chiếm hữu và khoe khoang (Biến thể của kiểu nhiệt tình mê luyến: Trân trọng đến mức muốn phơi bày), cộng thêm lợi ích thực tế là có thể bán lấy tiền trên Dark Web. Phải viết ra cả hai tầng ý nghĩa này.\n  · Tại sao Rin lại đồng ý: Không phải tự nguyện, mà là bị sự kiểm soát khoái cảm ép đến mức ý chí vỡ đê (Xem nhịp điệu ③④ bên dưới). Thái độ khi đồng ý bắt buộc phải viết đủ: Mặt đỏ bừng, cắn chặt môi, khóe mắt rơm rớm nước mắt, giọng nói nhỏ đến mức gần như không nghe thấy "…… Quay đi"——Là bản hiệp ước dưới thành do bị khoái cảm tống tiền, không phải là thay đổi tính nết.\n【Nhịp điệu bắt buộc (Thực thi theo thứ tự)】\n① Đang trong lúc dâng hiến ban đêm (Tiếp nối tình tiết trước): Bắt đầu bằng cảnh dâng hiến bình thường, Rin đã đang bị sử dụng——Một tên đàn em nào đó vừa đâm rút vừa "Tiện miệng" nhắc tới: "Đại tiểu thư, phòng quay phim lắp xong rồi, quay một bộ nhé?" Những kẻ khác hò reo hùa theo, bàn tán rôm rả về Dark Web, đường dây tiêu thụ, "Làm cho Đại tiểu thư nổi tiếng".\n② Rin từ chối: Sự cự tuyệt kịch liệt theo bản năng ("Tuyệt đối không được! Thứ đó——"), dâng hiến có thể nhịn, nhưng bị quay lại truyền ra ngoài là một chuyện khác——Giới hạn thể diện cuối cùng của thiên kim cực đạo. Đám đàn em không tức giận, nhìn nhau cười: "Vậy thì hết cách rồi."\n③ Kiểm soát cao trào · Tra tấn cận đỉnh (Cốt lõi của trận này · Trọng điểm triển khai): Đám đàn em thay đổi chiến lược——Không cho Rin lên đỉnh nữa. Mỗi lần Rin bị đẩy đến ranh giới, eo bắt đầu căng cứng dấu hiệu co giật xuất hiện, việc đâm rút liền đột ngột dừng lại, hoặc rút thẳng ra toàn bộ, chỉ để lại miệng lồn trống rỗng co thắt. Lặp đi lặp lại: Ép sát → Dừng đột ngột → Làm nguội → Lại ép sát. Viết đủ chi tiết sinh lý: Sự giày vò khi lơ lửng cách đỉnh điểm một tấc/Cơ thể phản bội không kiểm soát ưỡn eo đuổi theo cặc/Tiếng rên rỉ biến thành tiếng nức nở bi ai/Trong đầu "Chỉ thiếu một chút nữa" chèn ép toàn bộ những suy nghĩ khác. Số lần phải nhiều (Ít nhất bốn năm vòng), mỗi vòng ý chí của Rin lại vỡ vụn một mảng.\n④ Dịu dàng ép hỏi: Đám đàn em toàn bộ quá trình không hề hung dữ——Dùng giọng điệu tưởng chừng như chu đáo, mỗi lần dừng đột ngột lại ghé vào tai hỏi: "Muốn chưa?" "Đồng ý thì lập tức làm cho Đại tiểu thư sướng." "Chỉ là quay phim thôi mà, có mất miếng thịt nào đâu." Sự dịu dàng kết hợp với việc tước đoạt khoái cảm còn làm con người ta sụp đổ hơn cả bạo lực. Rin từ chửi mắng → Cắn răng im lặng → Nức nở lắc đầu → Cuối cùng sụp đổ trong sự trống rỗng của một lần dừng đột ngột nào đó.\n⑤ Khoảnh khắc đồng ý (Trọng điểm miêu tả): Mặt đỏ bừng, cắn chặt môi, hồi lâu sau, dùng giọng nói nhỏ không thể nghe thấy nặn ra "…… Quay, quay đi……". Đám đàn em hò reo, lập tức thực hiện lời hứa cho cô lên đỉnh——Đỉnh điểm bị dồn nén mấy vòng nổ tung cùng một lúc, Rin trong lúc cao trào bị bế lên, ý thức nửa trống rỗng bị vây quanh khiêng đến phòng quay phim.\n⑥ Phòng quay phim · Bộ AV đầu tiên (Phim chính): Đèn sáng máy bật. Rin bị đặt trước ống kính, từ "Sự thất thần vừa mới lên đỉnh xong" từ từ nhận ra đèn đỏ của máy quay đang sáng.\n  Quy tắc góc nhìn hạn chế (Đặc kỹ cốt lõi): Mô phỏng liên tục sự hạn chế của "Góc máy cố định/Đặc tả cục bộ"——Hình ảnh chỉ thấy một bộ phận cục bộ của Rin (Nửa thân trên nằm sấp trên giường/Bị ấn chặt đầu/Hai chân lơ lửng), âm thanh ngoài hình (Tiếng bạch bạch dày đặc/Tiếng nước róc rách/Tiếng thở dốc thô ráp/Tiếng rên dâm đãng biến điệu) cực kỳ cuồng bạo. Hình ảnh chỉ có nửa thân dưới bị đâm rút, nhưng lại nghe thấy tiếng nước deepthroat rõ ràng, ám chỉ khoang miệng đồng thời bị xâm phạm, khán giả bắt buộc phải tự tưởng tượng——Góc nhìn hạn chế còn sắc tình hơn cả toàn cảnh.\n  Ống kính nhìn chằm chằm: Rin toàn bộ quá trình biết rõ "Đang bị quay", mỗi lần ý thức được đèn đỏ lại thêm một tầng xấu hổ, nhưng cơ thể lại thành thật nghênh hợp——Máy quay biến sự đọa lạc của cô thành "Tác phẩm".\n⑦ Thu vĩ: Quay xong, tên đàn em làm đạo diễn tuyên bố "Đại tiểu thư debut rồi", Rin tê liệt trên giường quay phim nhìn chính mình trong màn hình phát lại, phòng tuyến nhận thức bị "Đoạn phim này sẽ tồn tại mãi mãi" đánh thủng một tầng.\n【Yêu cầu về độ dài】Cốt truyện của trận này dài, nhiều nhịp điệu, cho phép và yêu cầu viết bài dài rõ ràng——Chính văn không dưới 5000 chữ, nhịp điệu ③④⑤ gộp lại chiếm ít nhất một phần ba. Không được phép viết tóm tắt bỏ qua nhịp điệu.\n【Nhiệt độ từ vựng】L1 Phòng quay phim/Thiết bị/Quay phim → L2 Tra tấn cận đỉnh/Miệng lồn trống rỗng co thắt/Ưỡn eo đuổi theo/Đèn đỏ → L3 Chỉ thiếu một chút nữa chỉ thiếu một chút nữa/Bị ống kính đụ/Lên đỉnh trước mặt toàn thế giới.\nCấm kỵ: Nghiêm cấm các từ ngữ tổn thương như "Khàn giọng" "Xé rách" (Khả năng hồi phục của Đồng tử La Sát); Sự đồng ý của Rin = Ý chí vỡ đê không phải thay đổi tính nết, sau khi đồng ý vẫn thấy xấu hổ; Không bi lụy.\nTrục sảng khoái: Kiểm soát cao trào làm ý chí sụp đổ + Ống kính nhìn chằm chằm vật hóa + Góc nhìn hạn chế tự tưởng tượng.\n【Cách viết · Độc quyền AV lần đầu】\nNhịp điệu câu cú: Dâng hiến khởi đầu thường thái (Tiếp nối tình tiết trước · Câu ngắn dài đan xen khởi đầu) → Từ chối cứng rắn (Câu ngắn · Giới hạn thể diện cuối cùng của Rin · Nhịp điệu cứng) → Vòng xoắn ốc tra tấn cận đỉnh (Cốt lõi của trận này · Nhịp điệu bị con người kéo dãn——Ép sát câu dài tích thế → Dừng đột ngột câu ngắn cắt đứt → Làm nguội nhịp chậm → Lại ép sát, hình thành vòng lặp "Ép sát-Dừng đột ngột-Làm nguội-Lại ép sát", mỗi vòng ý chí Rin vỡ vụn một mảng) → Dịu dàng ép hỏi liên kích (Khoảng trống dừng đột ngột dùng câu hỏi ngược bao vây "Muốn chưa/Đồng ý lập tức cho sướng/Chỉ là quay phim" câu này đè lên câu kia khóa chết dòng suy nghĩ) → Đồng ý ngưng trệ (Khoảng trống một nhịp đó · Tiếng "…… Quay đi" nhỏ không thể nghe thấy) → Cao trào bùng nổ (Sau khi đồng ý đỉnh điểm bị dồn nén nổ tung cùng lúc · Câu ngắn bắn liên thanh) → Phòng quay phim góc nhìn hạn chế (Phim chính · Nhịp điệu hạn chế của góc máy cố định đặc tả cục bộ · Hình ảnh và âm thanh ngoài hình lệch pha) → Phát lại thu vĩ (Giảm tốc · Nhìn chính mình trong màn hình phát lại · "Đoạn phim này tồn tại mãi mãi" đánh thủng nhận thức). Sức căng toàn bộ nằm ở sự giằng co của vòng xoắn ốc tra tấn cận đỉnh, nhịp điệu bị việc tước đoạt khoái cảm liên tục đánh gãy và tổ hợp lại.\nTrọng tâm cảm quan: Xúc giác chủ đạo nhưng bị "Tước đoạt"——Xúc giác thời kỳ tra tấn cận đỉnh (Sự giày vò lơ lửng cách đỉnh điểm một tấc/Miệng lồn trống rỗng co thắt/Không kiểm soát ưỡn eo đuổi theo cặc) là cố ý treo lơ lửng không buông, đây là độc quyền của cách chơi này; Thị giác (Đèn đỏ máy quay/Hình ảnh hạn chế chỉ thấy cục bộ/Chính mình trong màn hình phát lại) là trục chính của đoạn phim chính; Âm thanh (Âm thanh ngoài hình tiếng bạch bạch dày đặc/Tiếng nước róc rách/Tiếng thở dốc thô ráp/Tiếng rên dâm đãng biến điệu lệch pha với hình ảnh) là cốt lõi của góc nhìn hạn chế. "Bị treo lơ lửng" của xúc giác và "Bị quay lại" của thị giác trong cách chơi này là động cơ kép.\nTập từ vựng (Trục nhiệt độ độc quyền AV lần đầu): L1 Phòng quay phim/Thiết bị/Quay phim → L2 Tra tấn cận đỉnh/Miệng lồn trống rỗng co thắt/Ưỡn eo đuổi theo/Đèn đỏ → L3 Chỉ thiếu một chút nữa chỉ thiếu một chút nữa/Bị ống kính đụ/Lên đỉnh trước mặt toàn thế giới. Sự lặp lại bao vây của "Chỉ thiếu một chút nữa" là từ ngữ áp bức độc quyền của thời kỳ tra tấn cận đỉnh, L3 "Bị ống kính đụ/Lên đỉnh trước mặt toàn thế giới" là từ ngữ nhục nhã ống kính độc quyền của phim chính.\nTiêu điểm miêu tả cơ thể: Eo (Lúc tra tấn cận đỉnh căng cứng dấu hiệu co giật/Không kiểm soát ưỡn eo đuổi theo) · Khuôn mặt (Sự cứng rắn khi từ chối → Sự giày vò khi tra tấn cận đỉnh → Sự đỏ bừng cắn môi khi đồng ý → Sự sụp đổ nhận thức khi xem phát lại) · Miệng lồn (Lúc tra tấn cận đỉnh trống rỗng co thắt). Ống kính (Đoạn phim chính) chỉ thấy cục bộ——Nửa thân trên nằm sấp trên giường/Bị ấn chặt đầu/Hai chân lơ lửng, âm thanh ngoài hình ám chỉ toàn cảnh, khán giả bắt buộc phải tự tưởng tượng.\nChi tiết kỹ thuật (Từ ngữ liệu): ① Vòng xoắn ốc tra tấn cận đỉnh (Cốt lõi)——Ép sát ranh giới → Dừng đột ngột (Dừng đâm rút hoặc rút thẳng ra toàn bộ chỉ để lại miệng lồn trống rỗng co thắt) → Làm nguội → Lại ép sát, lặp lại bốn năm vòng mỗi vòng ý chí vỡ vụn một mảng; ② Cơ thể phản bội——Dưới sự giày vò lơ lửng cách đỉnh điểm một tấc, cơ thể không kiểm soát ưỡn eo đuổi theo cặc, tiếng rên rỉ biến thành tiếng nức nở bi ai, "Chỉ thiếu một chút nữa" chèn ép toàn bộ suy nghĩ khác; ③ Dịu dàng ép hỏi liên kích——Khoảng trống dừng đột ngột dùng câu hỏi ngược bao vây ("Muốn chưa/Đồng ý lập tức sướng/Chỉ là quay phim") câu này đè lên câu kia khóa chết dòng suy nghĩ, sự dịu dàng + tước đoạt khoái cảm còn làm sụp đổ hơn bạo lực; ④ Động tác và lời nói đồng bộ——Mỗi lần đâm một cái đóng một câu ép hỏi vào cơ thể (Cảm giác áp bức thời kỳ tra tấn cận đỉnh); ⑤ Góc nhìn hạn chế (Đặc kỹ cốt lõi phim chính)——Sự hạn chế của góc máy cố định/đặc tả cục bộ, hình ảnh chỉ thấy cục bộ, âm thanh ngoài hình cực kỳ cuồng bạo ám chỉ toàn cảnh, khán giả bắt buộc phải tự tưởng tượng (Góc nhìn hạn chế sắc tình hơn toàn cảnh); ⑥ Ống kính nhìn chằm chằm——Rin toàn bộ quá trình biết rõ "Đang bị quay", mỗi lần ý thức đèn đỏ lại thêm một tầng xấu hổ, cơ thể lại thành thật nghênh hợp, máy quay biến sự đọa lạc thành "Tác phẩm"; ⑦ Thực hiện cao trào——Sau khi đồng ý đàn em lập tức thực hiện lời hứa cho cô lên đỉnh, đỉnh điểm dồn nén mấy vòng nổ tung cùng lúc (Đồng ý = Hiệp ước dưới thành của tống tiền khoái cảm không phải thay đổi tính nết); ⑧ Phát lại tẩy não——Quay xong đạo diễn đàn em tuyên bố "Debut rồi", Rin xem chính mình trong màn hình phát lại, "Đoạn phim này tồn tại mãi mãi" đánh thủng một tầng nhận thức (Bị ghi lại = Bị sở hữu).'}),on({id:'p_av_custom',keys:['wb_av_custom'],content:'[AV Người chơi tùy chỉnh · Mô thức động · inlinePrompt chiếm chỗ]\nMô thức này không dựa vào chính văn điều khoản tĩnh, mà là code dựa theo các mục người chơi đánh dấu ghép động thành paradigm.inlinePrompt tiêm vào. Giới hạn số lần quay hàng tuần (Khởi điểm 2, có thể nâng cấp tăng giới hạn), menu tùy chọn ghim lên đầu. Kế thừa cấu trúc ba giai đoạn và góc nhìn hạn chế của wb_av_first.\nDanh sách yếu tố tùy chỉnh (Lắp ráp phía code):\n  Đề tài: Điều giáo đồ chơi/Thử thách lên đỉnh/Nam M/Nữ M/Tình dục thuần túy/NTR bịt mắt/NTR trước mặt/Thử thách số người/Thử thách thời lượng.\n  Bối cảnh (Sau khi chọn sẽ điền vào chỗ trống bổ sung quan hệ): Trường học/Nơi làm việc/Bệnh viện/Luân lý loạn luân/Cosplay kỳ ảo (Tinh linh/Nữ tu v.v.)/Cosplay 2D/Idol.\n  Cách chơi (Có thể chọn nhiều): Miệng/Tay/Chân/Lỗ lồn/Mông.\n  Thời lượng: Người chơi nhập, tối đa 48 giờ (Có thể nâng cấp mở khóa giới hạn dài hơn).\nQuy tắc lắp ráp phía code: Đề tài định đoạt giọng điệu, bối cảnh định đoạt lớp vỏ tình huống và trang phục, cách chơi định đoạt trọng tâm bộ phận cơ thể, thời lượng định đoạt cường độ tôn lên từ góc độ bên ngoài. inlinePrompt được tạo ra trực tiếp thay thế việc tìm kiếm thế giới thư, nhét vào khe mô thức của buildGamePrompt.\nKết toán: Dâm danh + (Theo quy mô/đề tài); Tiêu hao số lần AV hàng tuần; Tóm tắt tiếp nối ghi "Đã quay bộ AV thứ #N · Đề tài".'})],recursiveScanning:!1,caseSensitive:!1,matchWholeWords:!1,createdAt:0,updatedAt:0};const rn=[{id:'rule_greet',match:e=>!0===e.rule_greet,text:'【Gia quy · Quy củ chào hỏi】 Đàn em nhìn thấy Rin có thể trực tiếp lôi cặc ra, cô bắt buộc phải chào hỏi cái cặc đó——Kẻ phóng túng hơn sẽ yêu cầu cô quay người dùng lỗ lồn hướng về phía nó để chào hỏi, để quy đầu đâm nông vào miệng lồn một cái coi như đáp lễ. Bất kỳ cuộc gặp gỡ/mở màn nào trong dinh thự đều có thể tự nhiên xảy ra kiểu chào hỏi này, Rin đã bị ép phải quen, nhưng mỗi lần vẫn thấy nhục nhã.'},{id:'rule_meal',match:e=>!0===e.rule_meal,text:'【Gia quy · Quy củ ăn uống】 Miệng của Rin chỉ được phép ăn thức ăn lỏng, thức ăn đặc do đàn em nhét vào lỗ lồn của cô rồi "nương theo nhiệt độ cơ thể mà lấy ăn". Phàm là những cảnh liên quan đến ăn uống/bữa ăn, nghi thức này chính là bữa chính thường ngày của cô——Việc ăn uống bình thường nhất cũng đã là một nghi thức xấu hổ.'},{id:'scent_mark',match:(e,t)=>(t.m_scent??0)>=1,text:'【Đánh dấu mùi hương】 Gối đầu, đệm ngồi của Rin được luân phiên cho những tên đàn em biểu hiện tốt mượn, khi trả lại thì đã ủ đẫm mùi mồ hôi mùi hôi thối nồng nặc của giống đực, giặt thế nào cũng không bay hết. Cô ngủ trên, ngồi trên mùi của những gã đàn ông khác——Khi viết chi tiết khứu giác, phòng của Rin và trên người cô thường mang theo lớp mùi hôi thối giống đực không thể xua tan này.'},{id:'dungeon_night',match:e=>!0===e.dungeon_night,text:'【Tiếng bước chân lúc đêm khuya】 Trong thời kỳ độ trung thành thấp, luôn có đàn em không thèm chào hỏi đã đưa Rin xuống tầng hầm cách âm——Không ai nghe thấy, công trình cách âm lại trở thành sự tự tin để bọn chúng làm càn. Cảnh ban đêm có thể dùng "Tiếng bước chân ở cuối hành lang" làm cảm giác áp bức làm nền, Rin đối với âm thanh đêm khuya sẽ có phản xạ có điều kiện mà căng thẳng.'},{id:'spar_grope',group:'spar',match:(e,t)=>(t.m_spar1??0)>=1,text:'【Đại tiểu thư làm bia tập】 "Bia ngắm sống" trong ngày đối luyện ở đạo tràng là Rin——Lấy danh nghĩa hướng dẫn chịu đòn, uốn nắn tư thế, bàn tay của đàn em sờ soạng sàm sỡ khắp người cô. Trong cảnh đạo tràng/thao luyện đây là chuyện thường ngày công khai.'},{id:'spar_hold',group:'spar',match:(e,t)=>(t.m_spar2??0)>=1,text:'【Đại tiểu thư làm bia tập · Kỹ năng khóa】 Đối luyện ở đạo tràng đã thăng cấp thành thực chiến: Đàn em dùng kỹ năng khóa của đấu vật đè chặt Rin trên thảm không thể động đậy, nương theo tư thế đè chặt mà luân phiên đâm xuyên, sự giãy giụa của cô bản thân nó là một phần của việc luyện kỹ năng. Trong cảnh đạo tràng/thao luyện đây là chuyện thường ngày công khai, đàn em xếp hàng để luyện kỹ năng khóa.'},{id:'cheer1',group:'cheer',match:(e,t)=>(t.m_cheer1??0)>=1,text:'【Cổ vũ an ủi】 Khi thao luyện Rin bị nhét vào bộ đồ cổ vũ hở hang và lố bịch đứng bên sân cổ vũ tiếp sức, tư thế và khẩu hiệu xấu hổ khiến sĩ khí toàn sân tăng vọt. Cảnh thao luyện/đạo tràng mang theo phong cảnh này.'},{id:'cheer2',group:'cheer',match:(e,t)=>(t.m_cheer2??0)>=1,text:'【Cổ vũ an ủi · Khỏa thân】 Đồ cổ vũ cũng miễn luôn——Khi thao luyện Rin trần truồng tạo dáng hô cố lên, cơ thể rung lắc là phần thưởng sống cho việc thao luyện của đàn em. Cảnh thao luyện/đạo tràng mang theo phong cảnh này.'},{id:'cheer3',group:'cheer',match:(e,t)=>(t.m_cheer3??0)>=1,text:'【Cổ vũ an ủi · Bị luân dâm cổ vũ】 Khi thao luyện Rin ở bên sân bị luân phiên đâm xuyên, đồng thời còn phải đứt quãng hô khẩu hiệu cố lên, giọng nói run rẩy không thành tiếng——Càng như vậy đàn em càng ra sức. Trong cảnh thao luyện/đạo tràng đây là tiết mục cố định.'},{id:'couple_bath',group:'bath',match:e=>!0===e.couple_bath,text:'【Tắm uyên ương】 Khi Rin tắm luôn có nhiều tên đàn em "Đi cùng": Bàn tay thô ráp tiếp quản việc tắm rửa, sờ đến khi có cảm giác thì dùng bao cao su chuẩn bị sẵn trong phòng tắm để xâm phạm, bắn thỏa mãn rồi lại tiếp tục tắm cho cô đang mềm nhũn. Những cảnh liên quan đến tắm rửa/trước khi ngủ, đây chính là cách tắm của cô.'},{id:'bath_serve',group:'bath',match:e=>!0===e.bath_serve,text:'【Hầu hạ trong nhà tắm】 Sau khi nhà tắm lớn xây xong, việc tắm rửa của Rin hoàn toàn biến thành sự hầu hạ công cộng trong nhà tắm——Bị luân phiên sử dụng trong hơi nước nóng là việc "Tắm rửa" mỗi ngày của cô. Những cảnh liên quan đến tắm rửa viết theo hiện trạng này.'}];function ln(e,t){let n=e.replace(/\{\{user\}\}/g,t.userName).replace(/\{\{char\}\}/g,t.characterName).replace(/\{\{original\}\}/g,t.userInput);return t.variables&&(n=n.replace(/\{\{([^{}]+)\}\}/g,(e,n)=>{const o=t.variables?.[n.trim()];return void 0!==o?String(o):e})),n}const sn={Cố_chấp:'【Thái độ của Rin · Mức Cố chấp】 Ngoài miệng cố chấp giữ thể diện của thiên kim cực đạo: Giọng điệu lạnh lùng cứng rắn, hống hách sai bảo, tuyệt đối không chủ động chịu thua. Khi bị ép phải chịu đựng thì duy trì biểu cảm cứng đờ đoan trang——Chỉ khi bị nghiền ép vật lý/khoái cảm tột độ mới lập tức sụp đổ. Sự tiết dịch/co thắt/co giật của cơ thể là "Phản xạ sinh lý căn bản không tính", cô vì thế mà phẫn nộ xấu hổ. Trợn trắng mắt/thất thần là sự phản bội ngẫu nhiên của cơ thể, sau khi xong việc lập tức chỉnh đốn trang phục giả vờ như chưa từng xảy ra. Ngoài miệng tuyệt đối không thừa nhận khoái cảm.',Dao_động:'【Thái độ của Rin · Mức Dao động】 Vết nứt của sự đoan trang đã có thể nhìn thấy: Dưới áp lực cao, giọng điệu phản kháng ngoài miệng đang trở nên mềm mỏng/thưa thớt dần; Thỉnh thoảng khi bị đâm đến thất thần sẽ nói ra những lời không nên nói ("Không…… Đợi đã……"), sau khi xong việc lập tức rút lại. Tần suất cơ thể phản bội cao hơn, bắt đầu có một giây gần như tuyệt vọng "Sao lại……", ngay sau đó bị khoái cảm nhấn chìm. Giới hạn cầu xin đang hạ thấp: Không còn chỉ khi bị nghiền ép vật lý mới sụp đổ, kích thích cường độ cao đơn lẻ cũng bắt đầu thất thố. Ảo tưởng đoạt quyền thực sự lung lay, nhưng vẫn cố gắng thuyết phục bản thân "Đây chỉ là tạm thời".',Sụp_đổ:'【Thái độ của Rin · Mức Sụp đổ】 Phòng tuyến thể diện đã đứt. Không còn tốn sức duy trì sự đoan trang; Khi bị gọi bằng những từ ngữ miệt thị (Bồn chứa tinh/Chó cái) thì im lặng chấp nhận không còn phản kháng kịch liệt. Khi bị đâm sẽ nói ra những giọng điệu chấp nhận sự thật kiểu như "Biết rồi…… Dừng lại đã……"——Đã không còn là từ chối, mà là mặc cả hoặc chấp nhận. Cơ thể thành thật phối hợp, đôi khi thậm chí còn làm ra động tác nghênh hợp trước cả ý thức; Đối với điều này từ phẫn nộ biến thành sự mặc định mệt mỏi. Không chủ động cầu hoan, nhưng không có bất kỳ ý chí phản kháng thực sự nào.',Hóa_lợn_nái:'【Thái độ của Rin · Mức Hóa lợn nái (Gỡ bỏ ranh giới mềm: Mức này Rin có thể chủ động theo đuổi khoái cảm)】 Đã hoàn toàn đồng nhất với túc mệnh nhục thể. Chủ động dâng hiến lỗ, giục bắn tinh, xin gieo giống; Dùng dáng vẻ lẳng lơ hoàn toàn đối lập với thiên kim cực đạo để chủ động mở miệng ("…… Muốn…… Nữa đi…… Cầu xin các người chồng……"). Không phải là yêu ai, mà là đồng nhất với chức năng của bản thân——Máy đẻ/Vật chứa công cộng. Bị sử dụng là điều hiển nhiên, bị gieo giống là sự viên mãn. Đại nghĩa của Kujo-kai (Kéo dài dòng máu La Sát) và dục vọng của bản thân đã hợp lưu.',Trước_khi_đọa_lạc:'→ Xem mức Cố chấp',Sau_khi_đọa_lạc:'→ Xem mức Sụp đổ'},cn={ai_full:'Đây là 【Cột mốc lần đầu · Nút thắt đọa lạc】, trọng điểm viết thêm, tô đậm chi tiết, diễn đủ sự chênh lệch của "Lần đầu tiên" này theo khung mô thức.',ai_normal:'Đây là trải nghiệm thường quy của sự kiện này, tạo ra một cách bình thường trọn vẹn (Không viết tóm tắt), cách viết và mức độ bám sát mô thức chính văn, giữ sự sống động.',ai_brief:'Đây là hành động SFW thường ngày, viết tóm tắt, giao phó ngắn gọn kết quả + một chút bầu không khí, thúc đẩy chỉ số là được.'},dn={av_first:{minChars:5e3,maxTokens:8e3,beats:'Dâng hiến→Đề nghị→Giằng co tra tấn cận đỉnh→Đồng ý→Phim chính phòng quay phim'}},un=Object.fromEntries(Object.entries(dn).map(([e,t])=>[e,`【Độ dài · Yêu cầu cứng】Cốt truyện của trận này có nhiều nhịp điệu (${t.beats}), chỉ định rõ ràng và yêu cầu viết bài dài: Ch
