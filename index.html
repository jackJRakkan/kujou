c sảng khoái: Khoái cảm ranh giới ngạt thở + Vô lực giãy giụa (Trói quặt) + Kiểm soát sinh sát (Quyền đổi khí nằm trong tay đàn ông). Giọng điệu cơ bản: Sức căng ngạt thở đan xen với tiếng nước, nhịp điệu nín—thả.\nCấm kỵ (Nghiêm ngặt nhất trận này): Đây là play ngạt thở tình dục, không phải khốc hình thật sự——Tuyệt đối không viết chết đuối thật/Đổ nước vào phổi gây thương tích/Tổn thương não do thiếu oxy/Tổn thương do hạ thân nhiệt. Mỗi lần ngạt thở đều có điểm "Thả cho cô ấy đổi khí" rõ ràng. Nước giữ sạch sẽ, miêu tả thể dịch mang tính sắc tình duy mỹ. Tạm thời: Ho sặc sụa/Ngâm đỏ/Thiếu oxy lâng lâng; Cấm: Tổn thương do đuối nước.\nKết toán: Lần đầu tiên → Độ đọa lạc +/Chứng cuồng dâm bạo ngược +; Tóm tắt tiếp nối ghi "Đã mở khóa thủy hình luân dâm".\n【Cách viết · Độc quyền thủy hình luân dâm】\nNhịp điệu câu cú: Nhịp điệu nín—thả (Độc quyền của cách chơi này)——Đoạn ngạt thở khi bị ấn vào nước/đắp khăn ướt/trùm túi nước (Câu ngắn · Tiếng ùng ục nghèn nghẹt · Nhịp điệu bị nín thở ép ngắn lại) → Khoảnh khắc được phép đổi khí (Nhịp điệu đột ngột thả lỏng · Ho sặc sụa bùng nổ giành giật không khí + Chóng mặt do thiếu oxy và co giật do lên đỉnh cùng lúc nổ tung · Câu ngắn bùng nổ) → Lại bị ấn xuống (Nhịp điệu đột ngột dừng lại · Tiếng rên dâm đãng vỡ vụn trước khi bị ấn trở lại nước) → Tuần hoàn. Nhịp điệu hoàn toàn bị kiểm soát bởi quy củ "Đứa đang cắm bắn tinh rồi mới cho phép đổi một ngụm khí", Rin vì ngụm khí đó liều mạng dùng cơ thể lấy lòng giục bọn chúng mau bắn, kết quả lại tự đưa mình vào sâu hơn.\nTrọng tâm cảm quan/Tập từ vựng: Lấy việc thiếu oxy phóng đại sự mất kiểm soát (Khi nín thở đến mức trước mắt hoa lên phổi nóng rát thì cái lỗ bị đâm lại càng ngày càng nóng càng nhạy cảm · Ranh giới ngạt thở và ranh giới lên đỉnh chồng chéo) làm cốt lõi, Âm thanh (Tiếng ùng ục nghèn nghẹt trong nước/Ho sặc sụa bùng nổ giành giật không khí khi trồi lên/Tiếng sột soạt túi nilon/Tiếng rên vỡ vụn trước khi bị ấn xuống) là độc quyền, Thị giác (Bọt khí khi mở mắt trong nước/Đường nét khăn ướt hít vào dán chặt/Hơi nước đọng vách túi nilon và khuôn mặt si ngốc biến dạng).\nTiêu điểm miêu tả cơ thể: Khuôn mặt (Mở mắt trong nước/Khuôn mặt si ngốc biến dạng trong túi nilon/Khi được phép ngẩng đầu ho sặc sụa lẫn nước mắt nước dãi chảy ròng ròng) · Tay bị trói quặt (Nắm chặt rồi lại buông ra) · Đạp chân (Sự phản kháng vô lực làm bọt nước bắn tung tóe).\nChi tiết kỹ thuật: ① Ngạt thở tình dục không phải khốc hình thật (Luật thép)——Tuyệt đối không viết chết đuối thật/Đổ nước vào phổi gây thương tích/Tổn thương não do thiếu oxy, mỗi lần ngạt thở đều có điểm "Thả cho cô ấy đổi khí" rõ ràng, nước giữ sạch sẽ; ② Ba thủ pháp ngạt thở——Đầu ấn vào chậu nước/Mặt đắp khăn ướt sũng/Đầu trùm túi nilon bơm nước, nhịp điệu ngạt thở và đổi khí do đàn em kiểm soát; ③ Quy củ đổi khí (Cốt lõi)——"Đứa đang cắm bắn tinh rồi mới cho phép cô ta đổi một ngụm khí", Rin vì ngụm khí đó liều mạng dùng cơ thể lấy lòng co thắt kẹp mút giục bọn chúng mau bắn ngược lại tự đưa mình vào sâu hơn; ④ Bộ khuếch đại thiếu oxy——Thiếu oxy khiến độ nhạy cảm toàn thân bị phóng đại đến mức mất kiểm soát (Giống treo cổ), ranh giới ngạt thở và ranh giới lên đỉnh chồng chéo; ⑤ Dịch sự vô lực giãy giụa——Hai tay bị trói quặt hành động vặn vẹo đạp chân duy nhất có thể làm trong mắt đàn em thành "lẳng lơ nghênh hợp"; ⑥ Đổi khí nổ tung——Khoảnh khắc được phép hít vào một ngụm khí sự chóng mặt do thiếu oxy và co giật do lên đỉnh cùng lúc nổ tung, cô phân không rõ sợ chết hay sướng quá, kinh hãi trước việc sắp chết đuối mà vẫn lên đỉnh; ⑦ Cấu trúc không gian chia tư thế——Nằm sấp đầu ấn chậu nước vểnh mông (Thân dưới chỉ chứa một lỗ người thật lỗ kia đồ chơi bù)/Mặt đắp khăn hoặc trùm túi đầu không vào nước (Phần đầu tự do thân dưới vểnh lên có thể bị hai cặc thật đâm kẹp trước sau), đổi người trong khoảng thời gian "Được phép đổi khí".'}),on({id:'p_violent_cane',keys:['wb_violent_cane'],content:'Điều giáo đánh đòn · Thường quy (Giá đánh đòn). Tier2 Năm giai đoạn đánh đòn tiệm tiến + Tư thế trên giá hình phạt + Luân dâm sau khi đánh. Ngữ liệu: Toàn bài 「Trượng hình」 năm giai đoạn + 「Tư thế quỳ bò trên giá hình phạt」 「Tư thế treo lơ lửng」 「Trói buộc kiểu tã lót」.\nNăm giai đoạn tiệm tiến (Cốt lõi · Tuyệt đối không viết đầy đủ ngay từ đầu, phản ứng chuyển từ nhẫn nhịn sang khóc lóc ầm ĩ):\n  ① Tuyên hình: Thanh tre rỗng ruột nhúng nước đánh vào đỉnh mông——Không đau nhưng tiếng "Bạch" vang dội làm nước bắn tung tóe, thuần túy là dọa dẫm tâm lý, thịt mông trắng nõn ửng hồng nhạt;\n  ② Khởi động: Roi da mềm quất liên tục tốc độ cao trái phải để làm nóng, từ hồng nhạt chuyển sang đỏ đều, nóng rực tê rần;\n  ③ Đánh bằng bảng gỗ: Bảng gỗ dày rộng "Ép xuống nửa tấc thuận đà nảy lên", máu ứ lại trong thịt, sung huyết sưng cao, nổi lên những cục máu bầm đỏ sẫm tím đen; Đoạn này nhét giẻ bịt miệng cao su (Tiếng la hét thảm thiết bị kìm nén thành tiếng nức nở);\n  ④ Đánh bằng roi mây: Rút giẻ bịt miệng ra dùng roi mây già ngâm nước, diện tích chịu lực nhỏ quất nứt phần thịt sưng tấy rút máu bầm ra, mỗi roi một vết hằn;\n  ⑤ Giai đoạn cuối: Đánh đến "Màu quả đào nát" thì dừng——Giữ nguyên tư thế trên giá hình phạt luân dâm tại chỗ, mỗi lần đàn em đâm vào va phải phần thịt mông sưng nóng đều kích thích ra tiếng rên rỉ gấp bội.\nTư thế trên giá hình phạt (Chọn một làm trục chính): Treo lơ lửng dang rộng hình chữ Đại (Tay treo trên đỉnh chân còng vào giá đỡ · Gối gỗ kê bụng mông vểnh ra sau)/Quỳ bò hình chữ V ngược (Nửa thân trên kẹt vào lỗ giá gỗ khóa chặt · Mông trở thành điểm cao nhất)/Trói buộc kiểu tã lót (Nằm ngửa hai chân giơ cao tách ra cố định · Hoàn toàn không có góc chết).\nLực chịu đựng/Đau đớn → Khoái cảm: Sự nóng rực và sưng tấy của thịt mông khi bị đòn khiến mỗi lần đâm xuyên sau đó đều bị phóng đại; Khi vết roi mây bị eo bụng của đàn em cọ xát qua, sự đau đớn và khoái cảm đánh nhau trên cùng một tấc da thịt; Rin kinh hãi trước việc "Chỗ bị đánh sưng lên khi bị đâm trúng ngược lại rên rỉ ngọt ngào nhất".\nCảm quan độc quyền:[Thị giác] Màu sắc mông chuyển biến (Trắng → Hồng → Đỏ tươi → Tím đen → Đào nát)/Sóng thịt cuộn trào khi roi mây quất xuống/Mồ hôi chảy qua vết hằn;[Âm thanh] Thanh tre kêu bạch bạch/Bảng gỗ kêu bục bục/Roi mây kêu vút—chát/Tiếng nức nở sau khi bị nhét giẻ;[Xúc giác] Cơn đau âm ỉ của sự nóng rực sưng tấy/Cơn đau nhói của vết roi mây/Cảm giác bùng nổ khi đàn em va vào thịt sưng.\nCấm kỵ: Quy tắc hiện hành——Nhìn thì đáng sợ thực chất là vết thương ngoài da; Từ chối hôn mê (Giữa chừng tạt nước/Dùng hương tỉnh thần giữ tỉnh táo); Đánh xong vẫn có thể khóc có thể bò có thể run rẩy.\nKết toán: Lần đầu tiên → Độ đọa lạc +/Chứng cuồng dâm bạo ngược +; Tóm tắt tiếp nối ghi "Đã mở khóa đánh đòn".\n【Cách viết · Độc quyền đánh đòn】\nNhịp điệu câu cú: Năm giai đoạn tiệm tiến (Tuyệt đối không viết đầy đủ ngay từ đầu · Phản ứng chuyển từ nhẫn nhịn sang khóc lóc ầm ĩ)——① Tuyên hình (Câu ngắn · Thanh tre nhúng nước đánh đỉnh mông không đau nhưng vang dội bạch bắn nước · Thuần túy dọa dẫm tâm lý) → ② Khởi động (Mức độ trung bình · Roi da mềm quất liên tục tốc độ cao trái phải làm nóng · Hồng chuyển đỏ tươi nóng rực tê rần) → ③ Đánh bằng bảng gỗ (Câu ngắn trầm đục · Bảng gỗ dày rộng ép xuống nửa tấc thuận đà nảy lên · Máu ứ trong thịt sung huyết sưng cao nổi cục máu bầm · Đoạn này nhét giẻ bịt miệng tiếng la hét thảm thiết kìm nén thành nức nở) → ④ Đánh bằng roi mây (Câu ngắn sắc bén · Roi mây già ngâm nước rút giẻ bịt miệng · Diện tích chịu lực nhỏ quất nứt thịt sưng rút máu bầm ra mỗi roi một vết hằn) → ⑤ Giai đoạn cuối (Mức độ trung bình · Đánh đến màu đào nát thì dừng · Giữ tư thế giá hình phạt luân dâm tại chỗ · Đàn em đâm vào mỗi lần va phải thịt mông sưng nóng kích thích ra tiếng rên rỉ gấp bội). Nhịp điệu được quyết định bởi sự tăng tiến về âm sắc và lực độ của công cụ trong năm giai đoạn.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự chuyển biến màu sắc mông (Trắng → Hồng → Đỏ tươi → Tím đen → Đào nát) làm trục chính thị giác, Âm thanh (Thanh tre bạch bạch/Bảng gỗ bục bục/Roi mây vút—chát/Tiếng nức nở sau khi nhét giẻ) là dấu hiệu giai đoạn, Xúc giác (Đau âm ỉ nóng rực sưng tấy/Đau nhói vết roi mây/Cảm giác bùng nổ khi đàn em va vào thịt sưng).\nTiêu điểm miêu tả cơ thể: Mông (Màu sắc mông chuyển biến/Sóng thịt cuộn trào khi roi mây quất xuống/Sưng cao nổi máu bầm) · Khuôn mặt (Từ buông lời tàn nhẫn → Kìm nén tiếng rên rỉ → Tiếng la hét thảm thiết mang theo tiếng khóc → Nước mắt nước dãi sinh lý mất kiểm soát).\nChi tiết kỹ thuật: ① Năm giai đoạn tiệm tiến (Cốt lõi · Tuyệt đối không viết đầy đủ ngay từ đầu)——Tuyên hình (Thanh tre nhúng nước không đau nhưng vang dội dọa dẫm tâm lý) → Khởi động (Roi da mềm làm nóng hồng chuyển đỏ tươi) → Đánh bằng bảng gỗ (Bảng gỗ dày rộng ép xuống nửa tấc nảy lên sung huyết sưng cao nổi cục máu bầm · Nhét giẻ bịt miệng) → Đánh bằng roi mây (Roi mây già ngâm nước rút giẻ bịt miệng diện tích chịu lực nhỏ quất nứt thịt sưng mỗi roi một vết hằn) → Giai đoạn cuối (Màu đào nát thì dừng giữ tư thế giá hình phạt luân dâm); ② Tư thế trên giá hình phạt (Chọn một)——Treo lơ lửng dang rộng hình chữ Đại/Quỳ bò hình chữ V ngược (Nửa thân trên kẹt lỗ giá gỗ khóa chặt mông thành điểm cao nhất)/Trói buộc kiểu tã lót (Nằm ngửa hai chân giơ cao tách ra cố định hoàn toàn không góc chết); ③ Phóng đại sau khi đánh——Sự nóng rực và sưng tấy của thịt mông khiến mỗi lần đâm xuyên sau đó bị phóng đại, vết roi mây bị eo bụng đàn em cọ xát qua đau đớn và khoái cảm đánh nhau trên cùng một tấc da thịt; ④ Mỏ neo rối loạn——Rin kinh hãi "Chỗ bị đánh sưng lên khi bị đâm trúng ngược lại rên rỉ ngọt ngào nhất"; ⑤ Từ chối hôn mê——Giữa chừng tạt nước/Dùng hương tỉnh thần giữ tỉnh táo, đánh xong vẫn có thể khóc có thể bò có thể run rẩy (Luật thép).'}),on({id:'p_violent_cane_first',keys:['wb_violent_cane_first'],content:'Điều giáo đánh đòn · Lần đầu (Cột mốc · Trọng điểm viết thêm). Ngữ liệu: 「Trượng hình (Ngắn gọn)」.\nCốt lõi sự chênh lệch: Thiên kim cực đạo bị đè lên giá hình phạt trong tầng hầm nhà mình——Hai chữ "Gia pháp" từ chỗ cô quản người biến thành quản cô.\nNhịp điệu bắt buộc: ① Lên giá——Bị còng lên giá hình phạt bày thành tư thế treo lơ lửng phơi bày, quần lót bị cởi ra treo trên giá hình phạt để "trưng bày", cô vẫn còn đang buông lời tàn nhẫn; ② Đòn tâm lý của Tuyên hình——Thanh tre nhúng nước vang lên một tiếng giòn giã, không đau, nhưng phản ứng căng cứng tức thời của cô đổi lấy tiếng cười ồ lên; ③ Sự thất thủ tiệm tiến——Từ roi da đến bảng gỗ, lời tàn nhẫn biến thành tiếng rên rỉ kìm nén rồi biến thành tiếng la hét thảm thiết mang theo tiếng khóc, giẻ bịt miệng bị nhét vào; ④ Đỉnh điểm của Đánh bằng roi mây——Roi mây già quất lên phần thịt mông đã sưng tấy, nước mắt nước dãi sinh lý hoàn toàn mất kiểm soát; ⑤ Đánh xong là đụ——Giữ nguyên tư thế trên giá hình phạt bị luân dâm, phần thịt mông sưng nóng bị va đập khiến cô vừa đau vừa sướng, phân không rõ tiếng kêu là loại nào.\nSau khi xong việc: Nằm sấp trên giá hình phạt không xuống được, phía sau là một mảng màu đào nát——Cô lần đầu tiên thực sự biết được hai chữ "Chịu ngược" sẽ nở hoa trên cơ thể mình như thế nào. Tóm tắt tiếp nối ghi "Lần đầu đánh đòn · Khai phá chứng cuồng dâm bạo ngược tiến triển".\n【Cách viết · Độc quyền đánh đòn lần đầu】\nNhịp điệu câu cú: Lên giá buông lời tàn nhẫn khởi đầu chậm (Câu dài · Bị còng lên giá hình phạt tư thế treo lơ lửng phơi bày quần lót cởi ra treo giá hình phạt trưng bày · Cô vẫn còn đang buông lời tàn nhẫn) → Đòn tâm lý Tuyên hình đột biến (Câu ngắn · Thanh tre nhúng nước vang tiếng giòn giã không đau nhưng phản ứng căng cứng tức thời của cô đổi lấy tiếng cười ồ) → Thất thủ tiệm tiến (Nhịp điệu từ lời tàn nhẫn → Tiếng rên rỉ kìm nén → Tiếng la hét thảm thiết mang tiếng khóc · Nhét giẻ bịt miệng) → Đỉnh điểm roi mây (Câu ngắn sắc bén · Roi mây già quất lên thịt mông sưng tấy · Nước mắt nước dãi sinh lý hoàn toàn mất kiểm soát) → Đánh xong là đụ thu vĩ (Mức độ trung bình · Giữ tư thế giá hình phạt bị luân dâm · Thịt mông sưng nóng bị va đập vừa đau vừa sướng phân không rõ tiếng kêu là loại nào). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Gia pháp từ quản người biến thành quản cô".\nChi tiết kỹ thuật: ① Lên giá buông lời tàn nhẫn——Bị còng lên giá hình phạt bày thành tư thế treo lơ lửng phơi bày quần lót cởi ra treo giá hình phạt "trưng bày", cô vẫn còn đang buông lời tàn nhẫn (Sự tương phản thư thái); ② Đòn tâm lý Tuyên hình——Thanh tre nhúng nước vang tiếng giòn giã không đau nhưng phản ứng căng cứng tức thời của cô đổi lấy tiếng cười ồ (Mỏ neo đột biến · Dọa dẫm tâm lý); ③ Thất thủ tiệm tiến——Từ roi da đến bảng gỗ lời tàn nhẫn biến thành tiếng rên rỉ kìm nén rồi biến thành tiếng la hét thảm thiết mang tiếng khóc nhét giẻ bịt miệng (Phản ứng chuyển tiếp); ④ Đỉnh điểm roi mây——Roi mây già quất lên thịt mông sưng tấy nước mắt nước dãi sinh lý hoàn toàn mất kiểm soát (Đỉnh điểm cường độ); ⑤ Đánh xong là đụ——Giữ nguyên tư thế trên giá hình phạt bị luân dâm, phần thịt mông sưng nóng bị va đập khiến cô vừa đau vừa sướng phân không rõ tiếng kêu là loại nào (Rối loạn cốt lõi); ⑥ Gia pháp đảo ngược——Hai chữ "Gia pháp" từ cô quản người biến thành quản cô, nằm sấp trên giá hình phạt không xuống được phía sau màu đào nát, lần đầu tiên thực sự biết "Chịu ngược" sẽ nở hoa trên cơ thể mình (Dấu ấn thu vĩ).'}),on({id:'p_violent_latex',keys:['wb_violent_latex'],content:'Điều giáo đồ cao su · Thường quy (Tủ quần áo trói buộc). Tier2 Bọc kín chân không bằng cao su + Tước đoạt cảm quan + Đánh đòn luân dâm. Ngữ liệu: 「Đồ cao su bó sát/Đồ da」 + 「Bịt mắt」 + 「Nhét miệng」.\nBộ ba trang bị:\n  ① Đồ cao su bó sát: Hút chặt như lớp da thứ hai (Bên trong tuyệt đối không được phép mặc quần lót), thịt mông bị siết ra khe rãnh sâu; Nhiệt độ cơ thể bị khóa kín, mồ hôi đọng lại giữa da và đồ cao su——Cô cả người ngâm trong mồ hôi nóng hổi dính dớp của chính mình, bề mặt màu đen phản chiếu ánh sáng dâm đãng lạnh lẽo;\n  ② Bịt mắt: Tước đoạt thị giác → Thính giác xúc giác bù đắp phóng đại. Tiếng xé gió vút vút của dụng cụ, tiếng lách cách của thắt lưng gập lại, tiếng bước chân toàn bộ bị phóng đại vô hạn; Điểm rơi không thể đoán trước, mỗi lần đau đớn nổ tung ở vị trí không ngờ tới, sự kinh hãi tăng gấp đôi; Sự dừng lại giữa các lần thi hành án còn giày vò người hơn cả việc bị đánh;\n  ③ Nhét miệng: Tiếng la hét thảm thiết bị kìm nén thành tiếng nức nở như động vật, nước dãi men theo khóe miệng bị nong rộng chảy xuống xương quai xanh.\nNhịp điệu cách chơi: Đánh đòn cách lớp đồ cao su (Sự quất đập trên lớp cao su là tiếng "Bạch—" chói tai như bong bóng vỡ, dưới sự bôi trơn của mồ hôi lớp vải trượt trên da) → Khóa kéo hai chiều ở đũng quần chỉ kéo ra một đoạn (Từ trong lớp vỏ đen bóc ra một khối thịt trắng nóng hổi · Xung quanh toàn là cao su lạnh lẽo, ở giữa hoàn toàn không có sự phòng bị) → Nương theo khe hở khóa kéo mà luân dâm, cô toàn bộ quá trình không nhìn thấy là ai, chỉ có thể dựa vào mùi và nhịp điệu đâm rút để đoán.\nLực chịu đựng/Đau đớn → Khoái cảm: Sự chờ đợi không nhìn thấy phóng đại mỗi một lần tiếp xúc; Môi trường khép kín nóng bức ẩm ướt phóng đại vô hạn sự bứt rứt và xấu hổ; Làn da ở chỗ mở khóa kéo nhạy cảm đến mức đầu ngón tay sượt qua cũng run rẩy.\nCảm quan độc quyền:[Thị giác] Ánh sáng phản chiếu của lớp cao su đen di chuyển trong lúc vặn vẹo/Đường chỉ bạc của khóa kéo/Màu trắng bật ra từ khe hở;[Âm thanh] Tiếng nổ lách tách bạch—/Tiếng cọ xát kẽo kẹt/Tiếng thở phì phò thô ráp dưới lớp bịt mắt;[Xúc giác] Sự di chuyển dính dớp của mồ hôi bên trong/Sự tương phản nóng lạnh bên trong và bên ngoài khe hở.\nKết toán: Lần đầu tiên → Độ đọa lạc +/Chứng cuồng dâm bạo ngược +; Tóm tắt tiếp nối ghi "Đã mở khóa điều giáo đồ cao su".\n【Cách viết · Độc quyền điều giáo đồ cao su】\nNhịp điệu câu cú: Bọc kín chân không khởi đầu chậm (Câu dài · Đồ cao su bó sát hút chặt nhiệt độ cơ thể khóa kín mồ hôi đọng da và đồ cao su · Cả người ngâm trong mồ hôi nóng hổi dính dớp · Nhịp điệu bị cái hũ nút khép kín kéo dài) → Tước đoạt cảm quan chờ đợi (Nhịp điệu ngưng trệ——Sau khi tước đoạt thị giác thính giác xúc giác bù đắp phóng đại · Tiếng xé gió dụng cụ/Tiếng lách cách thắt lưng/Tiếng bước chân phóng đại vô hạn · Điểm rơi không thể đoán trước · Sự dừng lại giữa các lần thi hành án còn giày vò hơn bị đánh · Đây là đoạn treo lơ lửng của nhịp điệu) → Đánh đòn cách lớp cao su (Câu ngắn · Quất đập trên lớp cao su là tiếng bạch— chói tai như bong bóng vỡ · Dưới sự bôi trơn của mồ hôi lớp vải trượt trên da) → Khóa kéo mở ra luân dâm (Mức độ trung bình · Khóa kéo hai chiều ở đũng quần chỉ kéo ra một đoạn · Từ trong lớp vỏ đen bóc ra khối thịt trắng nóng hổi · Nương theo khe hở luân dâm cô toàn bộ quá trình không nhìn thấy là ai chỉ có thể dựa vào mùi và nhịp điệu đâm rút đoán). Sức căng nằm ở sự chờ đợi chưa biết dưới việc tước đoạt cảm quan + Sự khép kín nóng bức phóng đại sự bứt rứt.\nTrọng tâm cảm quan/Tập từ vựng: Lấy việc tước đoạt thị giác sau đó thính giác xúc giác bù đắp phóng đại (Tiếng xé gió dụng cụ/Tiếng bước chân phóng đại vô hạn · Điểm rơi không thể đoán trước) làm cốt lõi, Xúc giác (Sự di chuyển dính dớp của mồ hôi bên trong/Sự tương phản nóng lạnh bên trong và bên ngoài khe hở) là độc quyền, Âm thanh (Tiếng nổ lách tách bạch—/Tiếng cọ xát kẽo kẹt/Tiếng thở phì phò thô ráp dưới lớp bịt mắt).\nTiêu điểm miêu tả cơ thể: Đồ cao su (Ánh sáng phản chiếu của lớp cao su đen di chuyển trong lúc vặn vẹo/Đường chỉ bạc của khóa kéo/Màu trắng bật ra từ khe hở) · Hũ nút (Nhiệt độ cơ thể khóa kín mồ hôi đọng · Cả người ngâm trong mồ hôi nóng hổi dính dớp của chính mình).\nChi tiết kỹ thuật: ① Lớp da thứ hai bằng cao su——Đồ cao su hút chặt (Bên trong tuyệt đối không được phép mặc quần lót) thịt mông bị siết ra khe rãnh sâu, nhiệt độ cơ thể khóa kín mồ hôi đọng giữa da và đồ cao su, cô cả người ngâm trong mồ hôi nóng hổi dính dớp của chính mình bề mặt cao su đen phản chiếu ánh sáng dâm đãng lạnh lẽo; ② Bịt mắt tước đoạt——Tước đoạt thị giác → Thính giác xúc giác bù đắp phóng đại, tiếng xé gió dụng cụ/tiếng lách cách thắt lưng/tiếng bước chân toàn bộ bị phóng đại vô hạn, điểm rơi không thể đoán trước mỗi lần đau đớn nổ tung ở vị trí không ngờ tới kinh hãi tăng gấp đôi; ③ Sự dừng lại còn giày vò hơn bị đánh——Sự dừng lại giữa các lần thi hành án còn giày vò người hơn cả việc bị đánh (Nhịp điệu treo lơ lửng); ④ Nhét miệng——Tiếng la hét thảm thiết bị kìm nén thành tiếng nức nở như động vật nước dãi men theo khóe miệng bị nong rộng chảy xuống xương quai xanh; ⑤ Đánh đòn cách lớp cao su——Quất đập trên lớp cao su là tiếng bạch— chói tai như bong bóng vỡ, dưới sự bôi trơn của mồ hôi lớp vải trượt trên da; ⑥ Khóa kéo mở ra (Chiêu bài)——Khóa kéo hai chiều ở đũng quần chỉ kéo ra một đoạn, từ trong lớp vỏ đen bóc ra một khối thịt trắng nóng hổi xung quanh toàn là cao su lạnh lẽo ở giữa hoàn toàn không có sự phòng bị, nương theo khe hở luân dâm cô toàn bộ quá trình không nhìn thấy là ai chỉ có thể dựa vào mùi và nhịp điệu đâm rút để đoán; ⑦ Khe hở nhạy cảm——Làn da ở chỗ mở khóa kéo nhạy cảm đến mức đầu ngón tay sượt qua cũng run rẩy.'}),on({id:'p_violent_ginger',keys:['wb_violent_ginger'],content:'Điều giáo thiêu đốt niêm mạc · Thường quy (Dược tễ thiêu đốt: Bôi dầu ớt/nước gừng tươi + Nhét gừng gọt sẵn). Tier2 Thiêu đốt hóa học + Lưu lại dị vật + Kẹp gừng luân dâm. Ngữ liệu: Toàn bài 「Hình phạt gừng」 + 「Hình phạt kích thích bằng chất lỏng」.\nNghi thức cắt gọt (Uy hiếp khứu giác · Bắt buộc viết): Gọt gừng già ngay trước mặt Rin——Gọt vỏ, đẽo thành hình cái nút, khắc những rãnh xoắn ốc sâu (để rỉ nhiều nước), nước gừng vàng khè chảy dọc theo lưỡi dao; Mùi cay nồng lan tỏa, khoang mũi cô ngứa ngáy, nước mắt chảy ròng ròng, chưa đâm vào đã bắt đầu run rẩy.\nDiễn biến cảm giác đau (Lợi dụng độ trễ sinh lý · Viết theo từng đoạn):\n  ① Tiềm phục: Củ gừng vẽ vòng quanh miệng lồn, chỉ thấy lạnh lẽo trơn trượt——Ảo giác "Có lẽ sẽ không đau lắm", nhưng mùi cay nồng ở mũi luôn nhắc nhở;\n  ② Bắt đầu cháy: 30 giây sau cảm giác lạnh rút đi chuyển sang ấm nóng, giống như dán miếng giữ nhiệt, cơ vòng bất giác co nhẹ;\n  ③ Kim châm: Độ nóng thăng cấp thành cảm giác đau nhói dày đặc, cô bắt đầu vặn vẹo, càng kẹp chặt càng ép nước gừng vào các nếp gấp, diện tích kích thích càng lớn;\n  ④ Cháy rừng rực: Sự thiêu đốt thuần túy và liên tục, kẹp chặt vô dụng, thả lỏng vô dụng, vặn vẹo vô dụng——"Không có chỗ trốn" là cốt lõi; Thể dịch tiết ra lượng lớn muốn rửa trôi, ngược lại trở thành chất xúc tác chảy dọc xuống tận bẹn.\nKẹp gừng luân dâm (Chiêu bài của trang bị này): Nhét củ gừng vào lỗ đít, người thật đâm vào từ lỗ lồn (Hoặc ngược lại)——Mỗi lần đàn em đâm rút đều cách một lớp vách thịt mỏng ép vào củ gừng, vắt ra nước gừng mới gây ra một đợt thiêu đốt mới; Sự "nuốt nhả" do cơ vòng co giật trong cảm nhận của đàn em lại trở thành sự kẹp mút cực phẩm; Việc cô bị thiêu đốt đến phát điên mà vặn vẹo eo hông, trong mắt người ngoài toàn là sự lẳng lơ nghênh hợp.\nDư âm sau khi lấy ra: Tiếng "Bóp" vang lên khi rút ra, sự thiêu đốt vẫn kéo dài vài giờ; Miệng lồn sưng tấy đỏ sẫm nhất thời không thể khép lại, run rẩy nhè nhẹ theo nhịp thở.\nCấm kỵ: Kích thích hóa học là cảm giác nóng rát niêm mạc, không có tổn thương mô thực chất; Quy tắc hiện hành không đổi.\nKết toán: Lần đầu tiên → Độ đọa lạc +/Chứng cuồng dâm bạo ngược +; Tóm tắt tiếp nối ghi "Đã mở khóa hình phạt gừng".\n【Cách viết · Độc quyền hình phạt gừng】\nNhịp điệu câu cú: Nghi thức cắt gọt uy hiếp khứu giác khởi đầu chậm (Câu dài · Gọt gừng già trước mặt gọt vỏ đẽo thành nút khắc rãnh xoắn ốc · Nước gừng vàng chảy dọc lưỡi dao · Mùi cay nồng lan tỏa mũi ngứa mắt chảy nước · Chưa đâm vào đã run rẩy · Nhịp điệu bị động tác gọt gừng kéo dài) → Diễn biến cảm giác đau bốn đoạn (Lợi dụng độ trễ sinh lý)——① Tiềm phục (Câu ngắn · Củ gừng vẽ vòng miệng lồn chỉ thấy lạnh lẽo trơn trượt · Ảo giác "Có lẽ không đau lắm") → ② Bắt đầu cháy (Mức độ trung bình · 30 giây sau lạnh rút đi chuyển ấm nóng như miếng giữ nhiệt · Cơ vòng bất giác co nhẹ) → ③ Kim châm (Câu ngắn · Độ nóng thăng cấp thành đau nhói dày đặc cô bắt đầu vặn vẹo · Càng kẹp chặt càng ép nước vào nếp gấp diện tích kích thích càng lớn) → ④ Cháy rừng rực (Câu ngắn bắn liên thanh · Thiêu đốt thuần túy liên tục kẹp chặt vô dụng thả lỏng vô dụng vặn vẹo vô dụng · "Không có chỗ trốn" là cốt lõi · Thể dịch tiết ra lượng lớn muốn rửa trôi ngược lại thành chất xúc tác chảy xuống bẹn) → Kẹp gừng luân dâm thu vĩ (Mức độ trung bình · Mỗi lần đàn em đâm rút đều cách vách thịt mỏng ép củ gừng vắt nước mới gây đợt thiêu đốt mới). Nhịp điệu được thúc đẩy bởi độ trễ thời gian của sự thiêu đốt nước gừng.\nTrọng tâm cảm quan/Tập từ vựng: Lấy thiêu đốt hóa học (Cảm giác nóng rát niêm mạc · Lợi dụng độ trễ sinh lý của bốn đoạn tiềm phục/bắt đầu cháy/kim châm/cháy rừng rực) làm cốt lõi, Khứu giác (Gọt gừng trước mặt mùi cay nồng lan tỏa · Mũi ngứa mắt chảy nước) là sự báo trước độc quyền, Xúc giác (Lạnh lẽo trơn trượt → Ấm nóng → Đau nhói dày đặc → Thiêu đốt liên tục) là trục chính diễn biến.\nTiêu điểm miêu tả cơ thể: Miệng lồn (Củ gừng vẽ vòng miệng lồn → Thiêu đốt sưng tấy đỏ sẫm nhất thời không thể khép lại run rẩy theo nhịp thở) · Khuôn mặt (Run rẩy/Mũi ngứa mắt chảy nước) · Vặn eo (Bị thiêu đốt đến phát điên mà vặn vẹo eo hông trong mắt người ngoài toàn là lẳng lơ nghênh hợp).\nChi tiết kỹ thuật: ① Nghi thức cắt gọt (Uy hiếp khứu giác · Bắt buộc viết)——Gọt gừng già trước mặt gọt vỏ đẽo thành nút khắc rãnh xoắn ốc (để rỉ nhiều nước) nước gừng vàng chảy dọc lưỡi dao, mùi cay nồng lan tỏa mũi ngứa mắt chảy nước, chưa đâm vào đã run rẩy; ② Diễn biến cảm giác đau bốn đoạn (Lợi dụng độ trễ sinh lý · Cốt lõi)——Tiềm phục (Ảo giác lạnh lẽo trơn trượt) → Bắt đầu cháy (30 giây sau ấm nóng cơ vòng co nhẹ) → Kim châm (Đau nhói dày đặc càng kẹp chặt càng ép nước vào nếp gấp) → Cháy rừng rực (Thiêu đốt liên tục không có chỗ trốn thể dịch tiết ra thành chất xúc tác); ③ Kẹp gừng luân dâm (Chiêu bài)——Nhét củ gừng vào lỗ đít người thật đâm từ lỗ lồn (Hoặc ngược lại), mỗi lần đàn em đâm rút đều cách vách thịt mỏng ép củ gừng vắt nước mới gây đợt thiêu đốt mới, sự "nuốt nhả" do cơ vòng co giật trong cảm nhận của đàn em thành sự kẹp mút cực phẩm; ④ Dịch sai việc vặn eo——Cô bị thiêu đốt đến phát điên mà vặn vẹo eo hông trong mắt người ngoài toàn là lẳng lơ nghênh hợp (Rối loạn cốt lõi); ⑤ Dư âm sau khi lấy ra——Tiếng "Bóp" vang lên khi rút ra sự thiêu đốt vẫn kéo dài vài giờ, miệng lồn sưng tấy đỏ sẫm nhất thời không thể khép lại run rẩy theo nhịp thở; ⑥ Kích thích hóa học không có tổn thương thực chất——Cảm giác nóng rát niêm mạc không có tổn thương mô thực chất (Luật thép).'}),on({id:'p_violent_wax',keys:['wb_violent_wax'],content:'Điều giáo nhiệt độ · Thường quy (Hương nướng và nến). Tier2 Điểm nhiệt cháy chậm + Nhỏ nến bọc vỏ + Nóng lạnh luân phiên luân dâm. Ngữ liệu: 「Hương nướng」 + 「Nến nhiệt độ thấp」.\nHương nướng (Nỗi sợ hãi của sự chờ đợi · Trục chính 1): Những viên hương thảo dược nhỏ được đốt cháy xếp thành hàng trên phần thịt mông bị trói chặt——Lúc mới đặt lên chỉ hơi ấm, đốm lửa từ từ cháy xuống dưới, cô toàn bộ quá trình biết rõ điểm nóng đang nhích lại gần da thịt từng milimet một nhưng không thể động đậy; Thịt mông không kiểm soát được mà run rẩy lập cập, chỗ bị bỏng nổi lên những vết tròn đỏ sẫm; Khi đặt trên ngực, cô chỉ có thể trơ mắt nhìn đốm sáng đỏ đó thiêu đốt trên người mình.\nNhỏ nến (Bọc vỏ và kéo căng · Trục chính 2): Nến nhiệt độ thấp treo lơ lửng phía trên, sáp nến nhỏ giọt không theo quy luật——Khoảnh khắc đập xuống cơ thể nảy mạnh, kêu lên kinh hãi ngắn ngủi; Nguội đi đông cứng thành lớp vỏ bám chặt vào da, càng tích tụ càng nhiều; Cô chỉ cần hơi vặn vẹo, khối sáp đông cứng sẽ kéo căng da thịt, vừa đau vừa ngứa; Đầu vú bị phong ấn từng lớp vào trong sáp, bàn tay thi hành án lại xoa nắn lên đó, khối sáp khô cứng ma sát với thịt non thúc ép ra khoái cảm vặn vẹo.\nNóng lạnh luân phiên và luân dâm: Tạt nước lạnh đánh thức → Tiếp tục nhỏ nến; Luân dâm trong trạng thái cơ thể bị bọc sáp——Nhiệt độ cơ thể của đàn em, độ cứng của vỏ sáp, sự nóng rát của chỗ bị bỏng, ba loại nhiệt độ va chạm loạn xạ trên cùng một cỗ cơ thể; Mỗi lần đâm rút làm nứt vài khối sáp bong ra, lộ ra vết hằn đỏ rực bên dưới.\nNhỏ nến vùng kín (Đoạn cao trào): Sáp nến nhỏ xuống miệng lồn ướt át, gặp dâm thủy đông lại một nửa thành lớp vỏ vừa nóng vừa cứng, cảm giác dị vật bịt kín + phần thịt non đỏ rực khiến cô hoàn toàn hoảng loạn, sự lầy lội và nước mắt nến hòa quyện vào nhau.\nCấm kỵ: Chuyên dùng nến nhiệt độ thấp/Hương nướng điểm tới là dừng——Vết đỏ tạm thời, không bỏng; Quy tắc hiện hành không đổi.\nKết toán: Lần đầu tiên → Độ đọa lạc +/Chứng cuồng dâm bạo ngược +; Tóm tắt tiếp nối ghi "Đã mở khóa điều giáo nhiệt độ".\n【Cách viết · Độc quyền điều giáo nhiệt độ】\nNhịp điệu câu cú: Hai trục chính luân phiên——Hương nướng (Nỗi sợ hãi của sự chờ đợi · Câu dài · Đốt viên hương thảo dược xếp lên thịt mông · Lúc đặt lên hơi ấm đốm lửa từ từ cháy xuống · Cô biết rõ điểm nóng nhích lại gần từng milimet nhưng không thể động đậy · Nhịp điệu bị sự nhích lại gần chậm chạp kéo dài · Thịt mông không kiểm soát run rẩy) ↔ Nhỏ nến (Bọc vỏ và kéo căng · Câu ngắn——Sáp nến nhỏ giọt không quy luật đập xuống cơ thể nảy mạnh kêu kinh hãi · Nguội đông thành vỏ bám chặt da · Cô hơi vặn vẹo khối sáp kéo căng da thịt vừa đau vừa ngứa). Nóng lạnh luân phiên (Câu ngắn · Tạt nước lạnh đánh thức → Tiếp tục nhỏ nến · Nhịp điệu nóng lạnh cắt đứt) → Bọc sáp luân dâm thu vĩ (Mức độ trung bình · Nhiệt độ đàn em + Độ cứng vỏ sáp + Chỗ bị bỏng nóng rát ba loại nhiệt độ va chạm loạn xạ · Mỗi lần đâm rút làm nứt khối sáp bong ra lộ vết hằn đỏ rực).\nTrọng tâm cảm quan/Tập từ vựng: Lấy nhiệt độ va chạm loạn xạ (Nhiệt độ đàn em/Độ cứng vỏ sáp/Chỗ bị bỏng nóng rát ba loại nhiệt độ trên cùng cơ thể) + Nỗi sợ hãi của sự chờ đợi (Điểm nóng nhích lại gần từng milimet nhưng không thể động đậy) làm cốt lõi, Thị giác (Vết tròn đỏ sẫm trên mông/Vỏ sáp bọc cơ thể/Khối sáp nứt bong lộ vết hằn đỏ rực).\nTiêu điểm miêu tả cơ thể: Mông (Vết tròn đỏ sẫm do hương nướng/Run rẩy lập cập) · Đầu vú (Bị phong ấn từng lớp vào sáp · Bàn tay xoa nắn khối sáp khô cứng ma sát thịt non thúc ép khoái cảm vặn vẹo) · Miệng lồn (Đoạn cao trào sáp nhỏ xuống miệng lồn ướt át gặp dâm thủy đông lại một nửa thành vỏ vừa nóng vừa cứng · Cảm giác dị vật bịt kín + Thịt non đỏ rực).\nChi tiết kỹ thuật: ① Hương nướng (Nỗi sợ hãi của sự chờ đợi · Trục chính 1)——Đốt viên hương thảo dược xếp lên thịt mông bị trói, lúc đặt lên hơi ấm đốm lửa từ từ cháy xuống, cô biết rõ điểm nóng nhích lại gần từng milimet nhưng không thể động đậy, thịt mông không kiểm soát run rẩy chỗ bị bỏng nổi vết tròn đỏ sẫm; ② Nhỏ nến (Bọc vỏ và kéo căng · Trục chính 2)——Nến nhiệt độ thấp treo lơ lửng sáp nhỏ giọt không quy luật, đập xuống cơ thể nảy mạnh kêu kinh hãi, nguội đông thành vỏ bám chặt da, cô hơi vặn vẹo khối sáp kéo căng da thịt vừa đau vừa ngứa; ③ Phong ấn đầu vú——Đầu vú bị phong ấn từng lớp vào sáp, bàn tay xoa nắn khối sáp khô cứng ma sát thịt non thúc ép khoái cảm vặn vẹo; ④ Nóng lạnh luân phiên——Tạt nước lạnh đánh thức → Tiếp tục nhỏ nến, luân dâm trong trạng thái bọc sáp, nhiệt độ đàn em/độ cứng vỏ sáp/chỗ bị bỏng nóng rát ba loại nhiệt độ va chạm loạn xạ, mỗi lần đâm rút làm nứt khối sáp bong ra lộ vết hằn đỏ rực; ⑤ Nhỏ nến vùng kín (Đoạn cao trào)——Sáp nhỏ xuống miệng lồn ướt át gặp dâm thủy đông lại một nửa thành vỏ vừa nóng vừa cứng, cảm giác dị vật bịt kín + thịt non đỏ rực khiến cô hoảng loạn, lầy lội và nước mắt nến hòa quyện; ⑥ Chuyên dùng nến nhiệt độ thấp——Hương nướng điểm tới là dừng, vết đỏ tạm thời không bỏng (Luật thép).'}),on({id:'p_multiplay',keys:['wb_multiplay_common'],content:'Điểm cốt yếu chung của viết luân dâm nhiều người.\nTrọng lượng ống kính: Bút mực vĩnh viễn đập vào "Bộ phận đang bị sử dụng kịch liệt nhất", ống kính đi theo đó; Những con đực vây quanh/chờ đợi bị ép ra rìa khung hình, nhắc đến một câu sự tồn tại là đủ.\nQuá tải cảm quan = Điểm sảng khoái cốt lõi: Viết chữ "Đồng thời"——Độ sâu bị đâm phía trước, nhịp điệu phía sau, trong miệng nhét đầy hô hấp bị cản trở, nhiều luồng tín hiệu đan xen tràn vào cùng một cỗ cơ thể.\nHai cái tiếp nối hai cái (Mặc định theo đuổi · Nhưng tuân thủ cấu trúc không gian): Sắc tình nhiều người mặc định khuynh hướng "Đồng thời bị nhiều cặc sử dụng" (Thân dưới đâm hai lỗ đồng thời + Phân bổ miệng/tay), đổi người ưu tiên "Đổi cả nhóm" chứ không phải luân phiên từng cặc một. Bắt buộc phải phù hợp với cấu trúc không gian vật lý: Trước tiên phán đoán tư thế có thể rảnh rỗi những lỗ nào cho người thật, những lỗ không rảnh rỗi thì dùng đồ chơi thay thế hoặc không nhét bừa. Tuyệt đối không phớt lờ tư thế mà gượng ép gom đủ số người.\nĐổi nhóm = Điểm ngắt nhịp điệu: Lợi dụng khoảng trống đổi nhóm để viết trạng thái cơ thể (Tinh dịch trào ra/Cơ bắp co giật/Tê dại dư âm/Thiếu oxy lâng lâng), viết cảm giác lực hút khi rút ra + Cú sốc mới mẻ khi nhóm tiếp theo đồng thời đâm vào.\nTrọng tâm khoái cảm: Bất kể bao nhiêu người bao nhiêu trò, trọng tâm bút mực vĩnh viễn là "Khoái cảm trào dâng không kiểm soát khi Rin bị lấp đầy đồng thời/kích thích đồng thời".\nĐường cong ý chí: Cảnh nhiều người đẩy nhanh sự ác đọa (Cơ thể bị tấn công từ nhiều phía ý chí sụp đổ nhanh), nhưng có sự giằng co chứ không sụp đổ ngay vòng đầu. Đi theo ba giai đoạn "Miệng nói không muốn cơ thể đã nghênh hợp → Cầu xin và kháng cự đan xen → Chủ động xin tinh". Chú ý: Thứ sụp đổ là ý chí chứ không phải thể lực (Đồng tử La Sát không có chuyện thiếu thể lực).\nLàm mờ quy mô: Không viết con số chính xác, dùng "Xếp hàng chờ/Đổi không biết bao nhiêu lượt/Nhớ không rõ" để truyền đạt cảm giác bành trướng.\nPhân biệt nhiều con đực: Phân biệt bằng thể hình/Đặc trưng cặc/Mùi/Phong cách sử dụng (Đóng cọc thô bạo vs Mài chậm vs Cố ý hành hạ), bản thân sự khác biệt về nhịp điệu đã là nguồn kích thích.'}),on({id:'p_forced_leave',keys:['wb_forced_leave'],content:'Ban ngày dâng hiến · Ban ngày tuyên dâm (Thường quy). Kiểu vật hóa · Kích hoạt giọng điệu ④.\nBản chất bối cảnh: Toàn thể đàn em biến "Hôm nay không cần đi làm" thành "Hôm nay dùng Đại tiểu thư cả ngày". Rin bị coi như đạo cụ/tiết mục biểu diễn/phông nền của các hoạt động ban ngày, không làm chậm trễ việc đàn em ăn cơm đánh bài bàn chuyện, tùy thời tùy chỗ.\nNhịp điệu bắt buộc: ① Bối cảnh hóa hoạt động——Đàn em đang làm việc khác (Đánh bài/Ăn cơm/Xem bóng đá), Rin bị gác ở một vị trí nào đó để sử dụng liên tục, hoạt động vẫn diễn ra bình thường. ② Tùy tiện bỡn cợt——Người đi ngang qua tiện tay đâm vài cái, người họp xong thay vào, hoàn toàn không làm gián đoạn nhịp điệu. ③ Bão hòa đường dài——Dâng hiến cường độ cao cả một ngày (Dòng thời gian kéo dài); Buổi trưa, sau bữa ăn, chập tối đều có các mốc thời gian. ④ Ý thức mơ hồ——Khoái cảm tích tụ trong thời gian siêu dài, ý chí sụp đổ triệt để hơn cả một đêm đơn lẻ.\nTừ vựng đặc trưng ban ngày tuyên dâm: L1 Ban ngày/Hoạt động/Đánh bài → L2 Tinh dịch chảy trong cơ thể/Giữ nguyên trạng thái cắm/Bị dùng làm ghế tựa đệm lưng → L3 Nhớ không rõ đã có bao nhiêu người/Trong não chỉ còn lại việc bị đâm/Cao trào nối tiếp cao trào phân không rõ.\nGiọng điệu đàn em ④: "Góc độ này dùng sướng thật" "Hôm nay dùng làm bàn đi" "Mặc kệ cô ta, tiếp tục đánh bài nào" "Lát nữa đến lượt tao" "Nào, họp xong tiếp tục".\nTiêu điểm cơ thể Rin: Tư thế xấu hổ bị ép duy trì trong thời gian dài/Tinh dịch liên tục trào ra không thể dọn dẹp/Toàn bộ quá trình giữ cảm giác mất kiểm soát nửa tỉnh nửa mê.\n【Cách viết · Độc quyền ban ngày dâng hiến】\nNhịp điệu câu cú: Bão hòa đường dài làm trục chính——Bối cảnh hóa hoạt động (Câu dài · Đàn em làm việc khác đánh bài/ăn cơm/xem bóng đá Rin bị gác ở vị trí nào đó sử dụng liên tục hoạt động vẫn diễn ra · Nhịp điệu bị hoạt động thường ngày chi phối) → Tùy tiện bỡn cợt (Câu ngắn · Người đi ngang tiện tay đâm vài cái người họp xong thay vào hoàn toàn không gián đoạn nhịp điệu · Nhịp điệu liền mạch không gián đoạn) → Bão hòa đường dài (Dòng thời gian kéo dài · Buổi trưa/sau bữa ăn/chập tối các mốc thời gian · Khoảng thời gian dài) → Ý thức mơ hồ thu vĩ (Giảm tốc · Khoái cảm tích tụ thời gian siêu dài ý chí sụp đổ triệt để hơn đêm đơn lẻ). Nhịp điệu kéo dài cả ngày không dứt, khác biệt với "Một đêm một lứa" của dâng hiến ban đêm ở chỗ thời lượng cực dài.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự vật hóa (Rin là đạo cụ/tiết mục/phông nền · Không làm chậm trễ hoạt động của đàn em) + Bão hòa đường dài (Cường độ cao cả ngày · Tinh dịch liên tục trào ra không thể dọn dẹp) làm cốt lõi, Xúc giác (Tư thế xấu hổ bị ép duy trì thời gian dài), Âm thanh (Âm thanh nền hoạt động đánh bài/ăn cơm/xem bóng đá đan xen với tiếng ❤ không đè nén nổi của Rin).\nTiêu điểm miêu tả cơ thể: Tư thế (Bị ép duy trì thời gian dài) · Tinh dịch (Liên tục trào ra không thể dọn dẹp) · Nửa tỉnh nửa mê (Toàn bộ quá trình giữ cảm giác mất kiểm soát nửa tỉnh nửa mê).\nChi tiết kỹ thuật: ① Bối cảnh hóa hoạt động (Cốt lõi)——Đàn em đang làm việc khác (Đánh bài/Ăn cơm/Xem bóng đá) Rin bị gác ở vị trí nào đó sử dụng liên tục hoạt động vẫn diễn ra, Rin là đạo cụ không phải con người; ② Tùy tiện bỡn cợt——Người đi ngang tiện tay đâm vài cái người họp xong thay vào hoàn toàn không gián đoạn nhịp điệu (Liền mạch không gián đoạn); ③ Bão hòa đường dài——Dâng hiến cường độ cao cả ngày dòng thời gian kéo dài, buổi trưa/sau bữa ăn/chập tối có các mốc thời gian (Thời lượng cực dài); ④ Ý thức mơ hồ——Khoái cảm tích tụ thời gian siêu dài ý chí sụp đổ triệt để hơn đêm đơn lẻ (Rối loạn cốt lõi); ⑤ Giọng điệu vật hóa ④——"Góc độ này dùng sướng thật/Hôm nay dùng làm bàn đi/Mặc kệ cô ta tiếp tục đánh bài/Lát nữa đến lượt tao/Nào họp xong tiếp tục" (Đạo cụ hóa); ⑥ Tinh dịch không thể dọn dẹp——Tinh dịch liên tục trào ra cả ngày không thể dọn dẹp (Dấu hiệu đường dài).'}),on({id:'p_forced_leave_first',keys:['wb_forced_leave_first'],content:'Ban ngày dâng hiến · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Lần đầu tiên nhận ra mình ngay cả quyền "Tan làm" cũng không có——Đám đàn em coi trọn vẹn một ngày của cô như ngày phúc lợi.\nNhịp điệu bắt buộc: ① Khoảnh khắc thông báo——Sự bình thản tùy ý của câu "Đại tiểu thư hôm nay đừng ra ngoài nữa", còn xuyên thấu hơn bất kỳ lời ác độc nào. ② Bị sắp đặt——Bày thành một tư thế tiện cho việc sử dụng, các hoạt động bắt đầu diễn ra xung quanh cô, cô là đạo cụ không phải con người. ③ Buổi trưa tỉnh táo——Giữa chừng có một khoảnh khắc ngắn ngủi tỉnh táo, nhận ra đây sẽ là một ngày dài đằng đẵng; Sau đó lại bị đâm vào tiếp tục. ④ Hoàng hôn thu vĩ——Khi trời tối tinh dịch chảy khắp cơ thể, ý thức đã bị ngâm nát.\nSau khi xong việc: Rin không thể dùng "Sự dâng hiến tối qua" để đóng khung chuyện này——Đây là ban ngày, là thời gian vốn dĩ thuộc quyền chi phối của cô. Tóm tắt tiếp nối: Ghi "Lần đầu ban ngày dâng hiến · Cả ngày".\n【Cách viết · Độc quyền ban ngày dâng hiến lần đầu】\nNhịp điệu câu cú: Khoảnh khắc thông báo khởi đầu lạnh (Câu dài · Sự bình thản tùy ý của câu "Đại tiểu thư hôm nay đừng ra ngoài nữa" xuyên thấu hơn bất kỳ lời ác độc nào) → Bị sắp đặt (Câu ngắn · Bày thành tư thế tiện sử dụng hoạt động diễn ra xung quanh cô là đạo cụ không phải người) → Buổi trưa tỉnh táo ngưng trệ (Nhịp điệu dừng lại một nhịp · Giữa chừng khoảnh khắc ngắn ngủi tỉnh táo nhận ra đây sẽ là ngày dài đằng đẵng · Sau đó lại bị đâm vào tiếp tục) → Hoàng hôn thu vĩ (Giảm tốc · Khi trời tối tinh dịch chảy khắp cơ thể ý thức đã bị ngâm nát). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Ngay cả quyền tan làm cũng không có · Thời gian ban ngày vốn dĩ cô chi phối bị coi như ngày phúc lợi".\nChi tiết kỹ thuật: ① Khoảnh khắc thông báo——Sự bình thản tùy ý của câu "Đại tiểu thư hôm nay đừng ra ngoài nữa" xuyên thấu hơn bất kỳ lời ác độc nào (Mỏ neo đột biến · Bình thản tùy ý xuyên thấu); ② Bị sắp đặt——Bày thành một tư thế tiện cho việc sử dụng hoạt động diễn ra xung quanh cô, cô là đạo cụ không phải con người (Vật hóa); ③ Buổi trưa tỉnh táo——Giữa chừng khoảnh khắc ngắn ngủi tỉnh táo nhận ra đây sẽ là một ngày dài đằng đẵng, sau đó lại bị đâm vào tiếp tục (Rối loạn cốt lõi: Tỉnh táo nhận ra sự dài đằng đẵng rồi lại bị đâm vào); ④ Hoàng hôn thu vĩ——Khi trời tối tinh dịch chảy khắp cơ thể ý thức đã bị ngâm nát (Dấu ấn bão hòa đường dài); ⑤ Ban ngày thất thủ——Rin không thể dùng "Sự dâng hiến tối qua" đóng khung chuyện này, đây là ban ngày thời gian vốn dĩ thuộc quyền chi phối của cô (Dấu ấn thu vĩ: Quyền chi phối ban ngày thất thủ).'}),on({id:'p_daily_erosion',keys:['wb_daily_erosion'],content:'Cơ thể tự ý phát tình · A4 Ban ngày đột phát (Thường quy). Cốt lõi = Cơ thể phản bội trước cả ý chí: Bộ phận được khai phá đến ngưỡng giới hạn tự ý thức tỉnh vào khung giờ bình thường ban ngày, ý chí của Rin vẫn đang kháng cự/xấu hổ, nhưng cơ thể đã tự mình tìm đến đàn em.\nKhởi đầu bối cảnh (Chọn một theo tình huống lúc đó): Đang đi làm việc hai chân đột nhiên mềm nhũn kẹp chặt/Lúc họp nghe báo cáo bộ phận từng bị khai phá trống rỗng đến mức không thể tập trung/Đi ngang qua hành lang lướt qua một tên đàn em nào đó cơ thể tự động dừng lại/Bàn tay bưng trà run rẩy đến mức đổ ra ngoài.\nNhịp điệu bắt buộc: ① Triệu chứng phát tác——Phản ứng sinh lý cụ thể của bộ phận cụ thể (Khoang miệng: Vô thức nuốt nước bọt liếm môi; Lỗ lồn: Ướt đẫm quần lót chảy dọc theo chân; Hậu môn: Ngồi đứng không yên kẹp chặt;) Rin cố gắng dùng ý chí đè nén; ② Đè nén thất bại——Phản ứng sinh lý thăng cấp đến mức người ngoài có thể nhìn thấy (Đỏ mặt/Thở dốc/Mềm chân), cô càng ra sức tỏ vẻ đoan trang thì càng lộ liễu; ③ Đàn em phát hiện——Đàn em gần đó nhìn ra được, từ thăm dò đến trực tiếp động tay, sự từ chối của Rin hoàn toàn không có sức thuyết phục (Cơ thể đang nghênh hợp); ④ Giải quyết tại chỗ ban ngày——Bị sử dụng ngay tại địa điểm lúc đó, trọng điểm viết cảm giác phân liệt "Ý chí nói không muốn, cơ thể tự động đong đưa"; ⑤ Dư âm sau khi xong việc——Giải quyết xong cơ thể ngoan ngoãn lại, Rin chỉnh đốn trang phục, đối với sự thật "Cơ thể đã không còn do mình quản lý" lại thêm một phần nhận thức tuyệt vọng.\nNhiệt độ từ vựng: L1 Mềm chân/Mất tập trung/Kẹp chặt → L2 Quần lót ướt đẫm/Cơ thể tự dán lên/Eo tự lắc lư → L3 Ý chí và cơ thể hoàn toàn là hai lớp da/Bị chính cái lỗ của mình phản bội/Ban ngày ban mặt đã bị đụ đến thất thần.\nTiêu điểm cơ thể Rin: Chi tiết sinh lý cụ thể của bộ phận phát tình (Viết theo bộ phận kích hoạt)/Biểu cảm đoan trang và cơ thể mất kiểm soát cùng chung một khung hình/Sự ngoan ngoãn dị thường sau khi xong việc.\nKết toán: Phán đoán che giấu A4 (Thành công = Uy vọng cực đạo · Đàn em tiêu hóa nội bộ; Thất bại = Bị người ngoài bắt gặp, Uy vọng cực đạo chuyển thành Dâm danh + Trung thành).\n【Cách viết · Độc quyền cơ thể tự ý phát tình】\nNhịp điệu câu cú: Triệu chứng phát tác khởi đầu chậm (Câu dài · Khung giờ bình thường ban ngày bộ phận bị khai phá nào đó đột nhiên trống rỗng chua xót · Rin cố gắng dùng ý chí đè nén · Nhịp điệu bị phản ứng sinh lý cắt đứt) → Đè nén thất bại (Mức độ trung bình · Phản ứng sinh lý thăng cấp đến mức người ngoài nhìn thấy đỏ mặt/thở dốc/mềm chân · Cô càng ra sức đoan trang càng lộ liễu) → Đàn em phát hiện (Câu ngắn · Đàn em gần đó nhìn ra từ thăm dò đến trực tiếp động tay · Sự từ chối của Rin không có sức thuyết phục vì cơ thể đang nghênh hợp) → Giải quyết tại chỗ ban ngày (Câu ngắn bắn liên thanh · Trọng điểm viết cảm giác phân liệt "Ý chí nói không muốn cơ thể tự động đong đưa") → Dư âm sau khi xong việc thu vĩ (Giảm tốc · Giải quyết xong cơ thể ngoan ngoãn Rin chỉnh đốn trang phục · Đối với việc "Cơ thể đã không còn do mình quản lý" thêm một phần tuyệt vọng). Sức căng nằm ở sự phân liệt "Cơ thể phản bội trước cả ý chí", nhịp điệu bị phản ứng tự phát sinh lý thúc đẩy.\nTrọng tâm cảm quan/Tập từ vựng: Lấy "Ý chí và cơ thể hai lớp da" (Bị chính cái lỗ của mình phản bội/Ban ngày ban mặt đã bị đụ đến thất thần) làm cốt lõi, viết chi tiết sinh lý cụ thể theo bộ phận kích hoạt (Khoang miệng vô thức nuốt nước bọt liếm môi/Lỗ lồn ướt đẫm quần lót chảy dọc theo chân/Hậu môn ngồi đứng không yên kẹp chặt).\nTiêu điểm miêu tả cơ thể: Chi tiết sinh lý cụ thể của bộ phận phát tình · Biểu cảm đoan trang và cơ thể mất kiểm soát cùng chung khung hình · Sự ngoan ngoãn dị thường sau khi xong việc.\nChi tiết kỹ thuật: ① Cơ thể phản bội trước cả ý chí (Cốt lõi)——Bộ phận được khai phá đến ngưỡng giới hạn tự ý thức tỉnh vào khung giờ bình thường ban ngày, ý chí Rin vẫn đang kháng cự/xấu hổ cơ thể đã tự mình tìm đến đàn em; ② Khởi đầu bối cảnh——Đang đi làm việc hai chân đột nhiên mềm nhũn kẹp chặt/Lúc họp nghe báo cáo bộ phận bị khai phá trống rỗng đến mức không thể tập trung/Đi ngang qua hành lang lướt qua đàn em cơ thể tự động dừng lại/Bàn tay bưng trà run rẩy đến mức đổ ra ngoài; ③ Triệu chứng theo bộ phận——Khoang miệng vô thức nuốt nước bọt liếm môi/Lỗ lồn ướt đẫm quần lót chảy dọc theo chân/Hậu môn ngồi đứng không yên kẹp chặt; ④ Đè nén thất bại——Phản ứng sinh lý thăng cấp đến mức người ngoài nhìn thấy, càng ra sức đoan trang càng lộ liễu; ⑤ Từ chối không sức thuyết phục——Đàn em phát hiện từ thăm dò đến trực tiếp động tay, sự từ chối của Rin không có sức thuyết phục (Cơ thể đang nghênh hợp); ⑥ Cảm giác phân liệt——Trọng điểm viết "Ý chí nói không muốn, cơ thể tự động đong đưa"; ⑦ Nhận thức sau khi xong việc——Đối với việc "Cơ thể đã không còn do mình quản lý" thêm một phần tuyệt vọng.'}),on({id:'p_daily_erosion_first',keys:['wb_daily_erosion_first'],content:'Cơ thể tự ý phát tình · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Trước đây tất cả sự đọa lạc đều xảy ra ở "Thời gian được sắp đặt" (Dâng hiến ban đêm/Sự kiện), đây là lần đầu tiên——Không có bất kỳ ai chạm vào cô, cơ thể cô tự mình phát tình vào ban ngày. Điều này có nghĩa là sự đọa lạc đã không còn là sự áp đặt từ bên ngoài, mà đã mọc rễ vào trong cơ thể.\nNhịp điệu bắt buộc: ① Không có điềm báo——Khoảnh khắc bình thường nhất ban ngày (Xem sổ sách/Uống trà/Huấn thị), một bộ phận từng bị khai phá nào đó đột nhiên trống rỗng chua xót; ② Từ bối rối đến sợ hãi——Rin ban đầu tưởng là bị ốm, vài giây sau mới hiểu ra đây là cái gì, nỗi sợ hãi đến trước cả sự xấu hổ: "Cơ thể mình đang khao khát thứ đó"; ③ Đơn độc chống cự——Cô trước tiên cố gắng tự mình trốn đi nhịn cho qua (Khóa cửa/Cắn mu bàn tay/Kẹp chặt), viết đủ đoạn giãy giụa vô ích này; ④ Chống cự sụp đổ——Phản ứng cơ thể càng đè nén càng hung hăng, cuối cùng cô không thể không (hoặc sau khi bị phát hiện thì bị) để đàn em giải quyết; ⑤ Nhìn chằm chằm thật lâu sau khi xong việc——Rin nhìn chằm chằm vào chính mình trong gương, lần đầu tiên thực sự hiểu ra "Không quay lại được nữa" không phải là phép ẩn dụ.\nSau khi xong việc: Tóm tắt tiếp nối ghi "Lần đầu ban ngày cơ thể tự ý phát tình · Bộ phận". Sau đó daily_erosion chuyển sang trạng thái thường quy (Sự phản bội của cơ thể trở thành một phần của thường ngày).\n【Cách viết · Độc quyền cơ thể tự ý phát tình lần đầu】\nNhịp điệu câu cú: Không có điềm báo khởi đầu chậm (Câu dài · Khoảnh khắc bình thường nhất ban ngày xem sổ sách/uống trà/huấn thị bộ phận bị khai phá nào đó đột nhiên trống rỗng chua xót) → Từ bối rối đến sợ hãi (Nhịp điệu ngưng trệ · Rin ban đầu tưởng bị ốm vài giây sau hiểu ra · Nỗi sợ hãi đến trước sự xấu hổ "Cơ thể mình đang khao khát thứ đó") → Đơn độc chống cự (Mức độ trung bình · Khóa cửa/Cắn mu bàn tay/Kẹp chặt · Viết đủ sự giãy giụa vô ích) → Chống cự sụp đổ (Câu ngắn · Phản ứng cơ thể càng đè nén càng hung hăng cuối cùng không thể không để đàn em giải quyết) → Nhìn chằm chằm thật lâu sau khi xong việc thu vĩ (Giảm tốc · Rin nhìn chằm chằm mình trong gương lần đầu tiên thực sự hiểu "Không quay lại được nữa" không phải phép ẩn dụ). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Không có bất kỳ ai chạm vào cô cơ thể tự mình phát tình"——Sự đọa lạc đã mọc rễ vào trong cơ thể.\nChi tiết kỹ thuật: ① Không có điềm báo——Khoảnh khắc bình thường nhất ban ngày bộ phận bị khai phá nào đó đột nhiên trống rỗng chua xót (Mỏ neo đột biến); ② Từ bối rối đến sợ hãi——Rin ban đầu tưởng bị ốm vài giây sau hiểu ra, nỗi sợ hãi đến trước sự xấu hổ "Cơ thể mình đang khao khát thứ đó"; ③ Đơn độc chống cự——Trước tiên cố gắng tự mình trốn đi nhịn cho qua (Khóa cửa/Cắn mu bàn tay/Kẹp chặt) viết đủ sự giãy giụa vô ích; ④ Chống cự sụp đổ——Phản ứng cơ thể càng đè nén càng hung hăng cuối cùng không thể không (hoặc sau khi bị phát hiện thì bị) để đàn em giải quyết; ⑤ Nhìn chằm chằm thật lâu sau khi xong việc——Rin nhìn chằm chằm mình trong gương lần đầu tiên thực sự hiểu "Không quay lại được nữa" không phải phép ẩn dụ (Dấu ấn thu vĩ); ⑥ Đọa lạc nội hóa——Trước đây tất cả đọa lạc đều ở "Thời gian được sắp đặt", đây là lần đầu tiên không ai chạm vào cô cơ thể tự mình phát tình = Đọa lạc mọc rễ vào cơ thể (Cốt lõi).'}),on({id:'p_rape_living',keys:['wb_rape_living'],content:'Luân dâm sinh hoạt · Thường quy. Tier1-2 Chiếm dụng liên tục thời gian ngủ (Lười biếng kéo dài, không phải đóng cọc kịch liệt).\nThái độ trận này: Biến thể của kiểu nhiệt tình mê luyến——Tính chiếm hữu hóa thành sự lồng ghép cơ thể (Hướng B4 ②③). Cảm giác dán sát đâm vào không rút ra không phải là sự chi phối, mà là coi Rin như chăn ấm/gối ôm thịt/bao giữ ấm, sự cọ xát là sự cưng chiều vô thức. Mỏ neo giọng điệu (Ngái ngủ dính dớp): "Ưm…… Đừng động……" "Cứ ngậm như vậy đi" "Ấm quá……" / Tiếng hừ hừ giọng mũi vô thức / Tiếng "Vẫn muốn" 含混 lúc nửa đêm.\nCơ chế: Giấc ngủ/Sinh hoạt của Rin bị tính dục hóa chiếm dụng. Bốn tư thế ngủ (Gối ôm hầu hạ đêm):\n  - Nằm sấp đâm từ phía sau kiểu gối ôm (Đàn em thích nhất · Cốt lõi): Đàn em nằm sấp đè lên lưng Rin, trọng lượng đè chết cơ thể nhỏ bé, đâm từ phía sau không rút ra, giống như khảm cô vào trong ngực để ngủ. Mông bị trọng lượng đè ép hoàn toàn dán sát vào eo đàn em, hai cỗ cơ thể gần như không có khe hở. Dương vật giữ trạng thái cương cứng đâm sâu tận gốc thực hiện "Nhu động kiểu bảo dưỡng"——Coi thân thể Rin như chiếc gối ôm có hình dáng hoàn hảo vừa khít với eo.\n  - Nằm nghiêng kẹp bánh mì đâm hai lỗ (Trạng thái thường quy cốt lõi): Rin nằm nghiêng bị hai đàn em trước sau kẹp ở giữa——Phía trước đâm âm đạo, phía sau đâm hậu môn, ba cỗ cơ thể dán chặt như nhân bánh bao, Rin là phần nhân kẹp giữa. Chân trên bị đàn em phía trước nâng ra, miệng rảnh rỗi có thể tiện tay nhét một cặc vào, nhưng không gượng ép những tư thế không chen vào được.\n  - Tư thế úp thìa từ phía sau (Đâm một lỗ · Thời gian dài): Đàn em dán vào lưng đâm vào theo chiều ngang, một tay gối dưới đầu cô, tay kia vô thức xoa vú, tiết kiệm sức lực bền bỉ, thích hợp để cắm ngủ cả đêm.\n  - Ngồi ôm đâm từ phía sau: Đàn em giống như chiếc ghế hình người bọc lấy từ phía sau, Rin tựa lưng lún vào trong ngực bị nuốt chửng, một phát lười biếng không theo đuổi việc xuất tinh mà chỉ theo đuổi nhiệt độ kết hợp.\nPhân tầng nhiệt độ từ vựng (Trận này khởi đầu nhiệt độ thấp · Chậm nhiệt không bùng nổ):\n  L1 Lớp nền (Chiếm chủ đạo · Khoảng thời gian dài): Ngậm lấy/Nhét vào/Ấm/Dán/Mài/Cọ/Giữa hai chân ướt/Thịt lỗ mút mát\n  L2 Thỉnh thoảng nổi lên (Khi nhịp điệu tăng lên mức ③④): Vách trong co thắt/Nước dâm rỉ ra/Miệng tử cung bị đâm/Sự tê dại dâng lên/Nghênh hợp trong nửa giấc mơ\n  L3 Khoảnh khắc (Mức ④ đâm sâu đụ tỉnh): Bơm vào/Bị đâm đến lên đỉnh/Co giật co thắt/Giật mình tỉnh giấc phát hiện lại bị cắm đầy——Đâm xong rơi về L1\nNhịp điệu ngẫu nhiên (Cơ chế cốt lõi): Đàn em trong lúc ngủ từ bản năng thúc đẩy bốn mức độ, phần lớn thời gian dừng ở ①②——① Tần số lớn biên độ nhỏ nhu động (Rin không tỉnh, rên rỉ khẽ khàng, thịt lỗ hơi co thắt); ② Tần số nhỏ biên độ trung bình đâm rút (Rin không tỉnh, thở dốc vụn vặt, thân dưới vô thức phối hợp); ③ Tần số thấp biên độ lớn đâm rút (Rin hơi tỉnh, tiếng dâm khiếu rõ ràng, chủ động phối hợp); ④ Thỉnh thoảng đột nhiên dùng sức tối đa đâm sâu (Rin bị đụ tỉnh, la hét lên đỉnh co giật, giật mình tỉnh giấc mới nhận ra "Lại đang bị cắm"). Cũng có thể giao hợp trong mơ khiến cô đơn phương bị đụ tỉnh.\nBao cao su (Chi tiết cảm quan): Sau khi xuất tinh dương vật không lập tức rút ra, đeo bao ngâm trong đó tiếp tục; Khi rút ra túi tinh dịch kẹt ở miệng lồn từ từ kéo ra——Lực hút dính dớp của thành ngoài bao cao su bị ái dịch làm ướt + Trọng lượng của túi tinh dịch, khi kéo rời miệng lồn có một trận lực hút. Bao cao su dùng xong tiện tay vắt lên người Rin hoặc đầu giường; Khi cương cứng lại sau khi bắn, Rin chưa tỉnh táo đã bị thay bao rồi lại đâm vào. Sau khi xuất tinh lắc lư cái bao căng phồng trước mắt Rin: "Nếu bắn thẳng vào trong thì sẽ thế nào nhỉ"——Gợi lên sự sợ hãi xấu hổ.\nĐụ đến ngủ thiếp đi/Bị đâm tỉnh: Ngủ thiếp đi = Lên đỉnh quá nhiều lần thoát lực ý thức chìm xuống, tiếng rên rỉ biến thành tiếng thở đều đặn, đàn em không rút ra mài chậm chờ cô ngủ say, thịt lỗ ngủ rồi vẫn vô thức co bóp mút mát. Bị đâm tỉnh = Trước khi mở mắt đã cảm nhận được vật cứng trong cơ thể đang chuyển động, ý thức ngâm trong giấc mơ phân không rõ mộng hay thực; Trong ánh ban mai bị đâm tỉnh mơ màng bị đẩy lên cao trào đầu tiên trong ngày——Tín hiệu cảm quan đi trước ý thức, cơ thể phản ứng trước (Ưỡn eo co thắt chảy nước) não bộ mới chậm nửa nhịp nhận ra "Lại đang bị đâm rồi".\nVật hóa (Gối ôm thịt/Bao giữ ấm sống): Đâm vào không rút ra ôm ngủ, nửa đêm trở mình kéo cô lật theo, dương vật trong giấc mộng theo phản xạ sinh lý phình to lại đâm tỉnh cô. Thái độ = Tự nhiên như ôm gối ôm, tiện tay xoa nắn hai cái vú đang ngủ, không coi là chuyện to tát.\nCảm quan độc quyền:[Xúc giác] Sự căng tức cùn đục của vật cứng thường trú trong cơ thể/Sự ấm áp của việc trao đổi thân nhiệt/Thịt lỗ vô thức mút mát/Khoái cảm chậm chạp trong cơn buồn ngủ;[Thị giác] Đường nét nhỏ bé cuộn tròn trong ngực đàn em bị khảm chặt/Đôi mắt khép hờ/Sự co giật tinh vi của khuôn mặt ngủ say khi bị đâm trúng/Bao cao su dùng rồi vắt trên người;[Khứu giác] Mùi cơ thể hỗn hợp bị ủ ra bởi thân nhiệt/Mùi tanh của tinh dịch thừa/Mồ hôi giống cái nóng bức trong chăn;[Từ tượng thanh] Nhu động nông: Phốc kỉ phốc kỉ (Chậm/Dính); Rên rỉ nửa mộng: Ưm… Ư… Ưm❤; Đâm sâu đụ tỉnh: Phốc xuy——A❤; Tiếng thở: Hù… Haa.\nTiêu điểm cơ thể Rin: Thân hình nhỏ bé cuộn thành một cục bị gã khổng lồ ôm trọn/Sự mỏng manh của khuôn mặt ngủ say tương phản với thân dưới bị đâm xuyên/Nửa mộng vô thức liếm môi/Khi bị xoa nắn hai bầu vú nhỏ tràn ra khỏi lòng bàn tay.\nTrục sảng khoái: Vật hóa (Bao thịt/Gối ôm thịt) + Nửa mộng ý thức mơ hồ + Lồng ghép chiếm dụng miên man. Giọng điệu cơ bản: Lười biếng cọ xát, giọng mũi miên man, L1 dừng lại thời gian dài thỉnh thoảng L3 nổ tung khoảnh khắc, giảm tốc không phải đóng cọc.\nKết toán: Lần đầu tiên → Độ đọa lạc +; Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm sinh hoạt". Chú ý: Ban ngày dâng hiến không kích hoạt debuff nghỉ ngơi; Sự kiện này chiếm ô ban đêm.\n【Cách viết · Độc quyền luân dâm sinh hoạt】\nNhịp điệu câu cú: Lười biếng miên man không đóng cọc——Nhịp điệu ngẫu nhiên bốn mức độ thúc đẩy trong giấc ngủ, phần lớn thời gian dừng ở ①② (Nhịp chậm · Tần số lớn biên độ nhỏ nhu động/Tần số nhỏ biên độ trung bình đâm rút · Rin không tỉnh rên rỉ khẽ khàng thở dốc vụn vặt · L1 dừng lại thời gian dài) → Thỉnh thoảng tăng lên ③ (Mức độ trung bình · Tần số thấp biên độ lớn đâm rút Rin hơi tỉnh tiếng dâm khiếu rõ ràng chủ động phối hợp · L2) → Nổ tung khoảnh khắc ④ (Câu ngắn · Thỉnh thoảng đột nhiên dùng sức tối đa đâm sâu Rin bị đụ tỉnh la hét lên đỉnh co giật · L3) → Đâm xong rơi về L1 (Giảm tốc · Rơi về lớp nền thời gian dài). Nhịp điệu do bản năng trong giấc ngủ quyết định, L1 dừng lại thời gian dài thỉnh thoảng L3 nổ tung khoảnh khắc, giảm tốc không đóng cọc.\nTrọng tâm cảm quan/Tập từ vựng: Lấy vật hóa (Bao thịt/Gối ôm thịt) + Nửa mộng ý thức mơ hồ + Lồng ghép chiếm dụng miên man làm cốt lõi, Xúc giác (Vật cứng thường trú trong cơ thể căng tức cùn đục/Trao đổi thân nhiệt ấm áp/Thịt lỗ vô thức mút mát/Khoái cảm chậm chạp trong cơn buồn ngủ), Âm thanh (Nhu động nông phốc kỉ phốc kỉ chậm dính/Rên rỉ nửa mộng ưm… ư… ưm❤/Đâm sâu đụ tỉnh phốc xuy——a❤/Tiếng thở hù… haa). L1 lớp nền thời gian dài L3 nổ tung khoảnh khắc.\nTiêu điểm miêu tả cơ thể: Thân hình nhỏ bé cuộn thành một cục bị gã khổng lồ ôm trọn · Sự mỏng manh của khuôn mặt ngủ say tương phản với thân dưới bị đâm xuyên · Nửa mộng vô thức liếm môi · Khi bị xoa nắn hai bầu vú nhỏ tràn ra khỏi lòng bàn tay.\nChi tiết kỹ thuật: ① Lồng ghép chiếm hữu——Đâm vào không rút ra cảm giác dán sát không phải chi phối, là coi cô như chăn ấm/gối ôm thịt/bao giữ ấm, cọ xát là cưng chiều vô thức (Hướng B4 ②③); ② Bốn tư thế ngủ——Nằm sấp đâm từ phía sau kiểu gối ôm (Đàn em thích nhất · Trọng lượng đè chết đâm từ phía sau không rút ra giống như khảm vào ngực)/Nằm nghiêng kẹp bánh mì đâm hai lỗ (Trước sau kẹp giữa giống như nhân bánh bao)/Tư thế úp thìa từ phía sau (Đâm một lỗ thời gian dài tiết kiệm sức lực bền bỉ)/Ngồi ôm đâm từ phía sau (Ghế hình người bọc lấy từ phía sau lười biếng một phát không theo đuổi xuất tinh chỉ theo đuổi nhiệt độ kết hợp); ③ Nhịp điệu ngẫu nhiên bốn mức độ (Cốt lõi)——① Tần số lớn biên độ nhỏ nhu động (Không tỉnh rên rỉ khẽ khàng) → ② Tần số nhỏ biên độ trung bình đâm rút (Không tỉnh thở dốc vụn vặt thân dưới vô thức phối hợp) → ③ Tần số thấp biên độ lớn đâm rút (Hơi tỉnh tiếng dâm khiếu rõ ràng chủ động phối hợp) → ④ Thỉnh thoảng dùng sức tối đa đâm sâu (Bị đụ tỉnh la hét lên đỉnh co giật giật mình tỉnh giấc mới nhận ra "Lại đang bị cắm"); ④ Đụ đến ngủ thiếp đi/Bị đâm tỉnh——Ngủ thiếp đi = Lên đỉnh quá nhiều lần thoát lực ý thức chìm xuống tiếng rên rỉ biến thành tiếng thở đều đặn, Bị đâm tỉnh = Trước khi mở mắt đã cảm nhận vật cứng trong cơ thể đang chuyển động ý thức ngâm trong giấc mơ phân không rõ mộng hay thực, tín hiệu cảm quan đi trước ý thức cơ thể phản ứng trước não bộ mới chậm nửa nhịp nhận ra "Lại đang bị đâm rồi"; ⑤ Cảm quan bao cao su——Sau khi bắn không lập tức rút ra đeo bao ngâm trong đó tiếp tục, rút ra túi tinh dịch kẹt miệng lồn từ từ kéo ra lực hút dính dớp, bao dùng rồi tiện tay vắt lên người hoặc đầu giường; ⑥ Vật hóa——Giống như ôm gối ôm tự nhiên tiện tay xoa nắn hai cái vú đang ngủ không coi là chuyện to tát.'}),on({id:'p_rape_living_first',keys:['wb_rape_living_first'],content:'Luân dâm sinh hoạt · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: "Về phòng nghỉ ngơi" là đường lui duy nhất của Rin khi ban ngày phải gồng mình giữ giá hội trưởng——Lần đầu tiên phát hiện ngay cả chút đường lui này cũng không còn nữa.\nNhịp điệu bắt buộc: ① Về phòng trải giường——Rin kéo lê thân xác mệt mỏi về phòng, đám đàn em đã đợi sẵn trên giường, thần thái tự nhiên như thể vốn dĩ nên ở đó; ② Bị sắp đặt thành "Gối ôm"——Một tên đàn em nào đó kéo cô qua nằm sấp đâm từ phía sau ôm lấy, không cho phép từ chối, những tên khác đứng chờ bên cạnh; ③ Nhịp điệu ngẫu nhiên của đêm đầu tiên——Vòng lặp Nhu động → Đâm rút → Đâm rút biên độ lớn → Đâm sâu đụ tỉnh, Rin trong trạng thái nửa tỉnh nửa mê bị liên tục đẩy lên cao trào, ý thức ngâm vụn vỡ; ④ Ánh ban mai bị đâm tỉnh——Cơ thể phản ứng trước chảy nước não bộ mới chậm nửa nhịp nhận ra "Lại đang bị đâm"; ⑤ Lúc thức dậy trong lỗ vẫn còn ngậm——Rin nhận ra từ nay về sau giấc ngủ cũng không còn thuộc về mình nữa.\nSau khi xong việc: Rin chấp nhận việc "Cắm vào mà ngủ" sẽ trở thành trạng thái thường quy. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm sinh hoạt · Lần đầu tiên phát hiện ngay cả giấc ngủ cũng không thuộc về mình".\n【Cách viết · Độc quyền luân dâm sinh hoạt lần đầu】\nNhịp điệu câu cú: Về phòng trải giường khởi đầu chậm (Câu dài · Rin kéo lê mệt mỏi về phòng đàn em đã đợi sẵn trên giường thần thái tự nhiên như thể vốn dĩ nên ở đó) → Bị sắp đặt thành gối ôm (Câu ngắn · Một tên đàn em kéo cô qua nằm sấp đâm từ phía sau ôm lấy không cho phép từ chối những tên khác chờ bên cạnh) → Nhịp điệu ngẫu nhiên đêm đầu tiên (Nhịp điệu do bản năng trong giấc ngủ thúc đẩy——Vòng lặp Nhu động → Đâm rút → Biên độ lớn → Đâm sâu đụ tỉnh · Rin nửa tỉnh nửa mê bị liên tục đẩy lên cao trào ý thức ngâm vụn vỡ) → Ánh ban mai bị đâm tỉnh (Câu ngắn · Cơ thể phản ứng trước chảy nước não bộ mới chậm nửa nhịp nhận ra "Lại đang bị đâm") → Thức dậy ngậm lấy thu vĩ (Giảm tốc · Rin nhận ra từ nay về sau giấc ngủ cũng không còn thuộc về mình). Sức căng nằm ở sự thất thủ lần đầu tiên của "Về phòng nghỉ ngơi là đường lui duy nhất".\nChi tiết kỹ thuật: ① Về phòng trải giường——Rin kéo lê mệt mỏi về phòng đàn em đã đợi sẵn trên giường thần thái tự nhiên như thể vốn dĩ nên ở đó (Mỏ neo đột biến); ② Bị sắp đặt thành gối ôm——Một tên đàn em kéo cô qua nằm sấp đâm từ phía sau ôm lấy không cho phép từ chối những tên khác chờ bên cạnh; ③ Nhịp điệu ngẫu nhiên đêm đầu tiên——Vòng lặp Nhu động → Đâm rút → Đâm rút biên độ lớn → Đâm sâu đụ tỉnh, Rin trong trạng thái nửa tỉnh nửa mê bị liên tục đẩy lên cao trào ý thức ngâm vụn vỡ; ④ Ánh ban mai bị đâm tỉnh——Cơ thể phản ứng trước chảy nước não bộ mới chậm nửa nhịp nhận ra "Lại đang bị đâm" (Rối loạn cốt lõi: Cảm quan đi trước ý thức); ⑤ Thức dậy ngậm lấy——Rin nhận ra từ nay về sau giấc ngủ cũng không còn thuộc về mình nữa (Dấu ấn thu vĩ).'}),on({id:'p_serve_advance',keys:['wb_serve_advance'],content:'Cưỡng chiếm dâng hiến nâng cao · "Từ nay về sau đều là luân dâm rồi". Tier2 Quần giao luân dâm quy mô lớn (Cột mốc · Bước ngoặt trạng thái).\nKích hoạt: Phòng tuyến nhận thức dao động + Khoảng 100 đàn em (Có thể thêm nhiều cổng chặn: Số lượng đàn em/Độ đọa lạc/Phòng tuyến nhận thức). Bá toàn: Đêm nay làm mới sự kiện cưỡng chiếm, tước đoạt quyền phân bổ ban đêm. Bước ngoặt trạng thái dùng một lần · needsContinuity=Có (turning).\nNhân vật/Điểm neo xưng hô: Số lượng đàn em đã vượt qua hàng trăm người, nhìn không thấy điểm dừng; Rin vẫn gồng mình giữ giá hội trưởng nhưng đã mệt mỏi. Cách gọi của đàn em từ "Đại tiểu thư" dần chuyển sang chó cái/bồn chứa tinh.\nNhịp điệu bắt buộc:\n  1. Số lượng áp bức khởi đầu: Viết số lượng đàn em có mặt nhiều đến mức nhìn không thấy điểm dừng (Cảm giác quy mô hàng trăm người+, kỳ quan số lượng), chen chúc đầy dinh thự.\n  2. Đàn em lật bài ngửa: Đàn em "thương lượng" với Rin——Người quá đông rồi, cứ luân phiên từng người một thế này thì không đến lượt. Rin gồng mình từ chối/mặc cả ("Các người không thể nhịn một đêm sao? Tôi đã đủ mệt rồi").\n  3. Không cho phép từ chối: Nói cũng vô dụng, Rin bị đám đàn em ùa lên vây quanh, xốc lên, bế bổng khỏi mặt đất, trực tiếp bắt đầu luân dâm (Ảo giác "Người quản lý" của cô bị biển người nghiền nát).\n  4. Chủ thể đại luân dâm: Quần giao quy mô lớn theo cấu trúc không gian (Thân dưới đâm hai lỗ + Miệng ngậm + Hai tay, đổi cả nhóm, chiến luân lưu không ngừng), đụ đến mức cô ý thức mơ hồ. Trọng tâm khoái cảm——Dưới quy mô này cơ thể cô bị châm ngòi triệt để, không kiểm soát được mà nghênh hợp.\n  5. Tuyên cáo (Thu vĩ bước ngoặt trạng thái): Đàn em công khai tuyên cáo "Từ nay về sau, ban đêm của Đại tiểu thư chỉ có cái này thôi, không cần phải chọn nữa"——Rin ý thức mơ hồ bị câu nói này đóng đinh vào những đêm về sau.\nTrục sảng khoái: Sự chắc chắn của số người vĩnh động + Địa vị sụp đổ từ người quản lý luân lạc thành đồ chơi + Khoái cảm nhấn chìm ý chí. Giọng điệu cơ bản: Từ ngữ mức độ cao, cảm giác quy mô biển người, vòng lặp đóng cọc.\nBước ngoặt trạng thái (Cơ chế · Không phải nội dung): Sau đêm nay, dâng hiến ban đêm không còn cho người chơi chọn phương thức (Khẩu giao/Giao hợp/Giao hợp hậu môn…), thống nhất gộp thành một nút 【Dâng hiến】 duy nhất, nội dung = Luân dâm (Đàn ông muốn chơi thế nào thì chơi). Không phải ban đêm chỉ còn lại một tùy chọn dâng hiến (Nghỉ ngơi v.v. vẫn còn), mà là bên trong tùy chọn "Dâng hiến" không còn chia phương thức nữa. Cổng chặn số lượng không thể đảo ngược.\nCấm kỵ: Không thật lòng yêu không sụp đổ; Làm mờ quy mô không viết con số chính xác.\nKết toán: Độ đọa lạc + (Cột mốc); Kích hoạt dấu ấn trạng thái "Gộp dâng hiến ban đêm"; Tóm tắt tiếp nối (turning): "Từ ngày thứ N trở đi dâng hiến ban đêm thống nhất là luân dâm, không còn chia phương thức nữa".\n【Cách viết · Độc quyền cưỡng chiếm nâng cao】\nNhịp điệu câu cú: Số lượng áp bức khởi đầu chậm (Câu dài · Đàn em có mặt nhiều đến mức nhìn không thấy điểm dừng cảm giác quy mô hàng trăm người+ kỳ quan số lượng chen chúc đầy dinh thự · Nhịp điệu bị biển người đè nặng) → Đàn em lật bài ngửa (Mức độ trung bình · "Thương lượng" với Rin người quá đông luân phiên không đến lượt · Rin gồng mình từ chối/mặc cả "Các người không thể nhịn một đêm sao") → Không cho phép từ chối đột biến (Câu ngắn · Nói vô dụng Rin bị ùa lên vây quanh xốc lên bế bổng khỏi mặt đất trực tiếp bắt đầu luân dâm · Ảo giác "Người quản lý" bị biển người nghiền nát) → Chủ thể đại luân dâm (Câu ngắn bắn liên thanh · Quần giao quy mô lớn theo cấu trúc không gian thân dưới đâm hai lỗ + miệng ngậm + hai tay đổi cả nhóm chiến luân lưu · Đụ đến ý thức mơ hồ) → Tuyên cáo thu vĩ (Giảm tốc · Đàn em công khai tuyên cáo "Từ nay về sau ban đêm của Đại tiểu thư chỉ có cái này thôi không cần phải chọn" · Rin ý thức mơ hồ bị câu nói này đóng đinh). Sức căng nằm ở cảm giác quy mô biển người + Địa vị sụp đổ từ người quản lý luân lạc thành đồ chơi.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự chắc chắn của số người vĩnh động (Làm mờ quy mô không viết con số chính xác dùng "Xếp hàng chờ/Đổi không biết bao nhiêu lượt/Nhớ không rõ" để truyền đạt cảm giác bành trướng) + Cảm giác quy mô biển người làm cốt lõi, từ ngữ mức độ cao vòng lặp đóng cọc.\nTiêu điểm miêu tả cơ thể: Biển người (Hàng trăm người+ nhìn không thấy điểm dừng chen chúc đầy dinh thự) · Rin (Gồng mình giữ giá hội trưởng nhưng đã mệt mỏi · Bị xốc lên bế bổng khỏi mặt đất) · Cách gọi chuyển biến (Cách gọi của đàn em từ "Đại tiểu thư" dần chuyển sang chó cái/bồn chứa tinh).\nChi tiết kỹ thuật: ① Số lượng áp bức khởi đầu——Viết số lượng đàn em có mặt nhiều đến mức nhìn không thấy điểm dừng (Cảm giác quy mô hàng trăm người+ kỳ quan số lượng) chen chúc đầy dinh thự; ② Đàn em lật bài ngửa——Đàn em "thương lượng" với Rin người quá đông luân phiên từng người không đến lượt, Rin gồng mình từ chối/mặc cả; ③ Không cho phép từ chối——Nói vô dụng Rin bị ùa lên vây quanh xốc lên bế bổng khỏi mặt đất trực tiếp bắt đầu luân dâm (Ảo giác người quản lý bị biển người nghiền nát); ④ Chủ thể đại luân dâm——Quần giao quy mô lớn theo cấu trúc không gian (Thân dưới đâm hai lỗ + Miệng ngậm + Hai tay đổi cả nhóm chiến luân lưu không ngừng) đụ đến ý thức mơ hồ, cơ thể bị châm ngòi triệt để không kiểm soát nghênh hợp; ⑤ Tuyên cáo bước ngoặt trạng thái (Cốt lõi)——Đàn em công khai tuyên cáo "Từ nay về sau ban đêm của Đại tiểu thư chỉ có cái này thôi không cần phải chọn", Rin ý thức mơ hồ bị câu nói này đóng đinh những đêm về sau; ⑥ Bước ngoặt cơ chế——Sau đêm nay dâng hiến ban đêm không còn cho người chơi chọn phương thức, thống nhất gộp thành một nút 【Dâng hiến】 duy nhất nội dung = Luân dâm (Cổng chặn số lượng không thể đảo ngược); ⑦ Làm mờ quy mô——Không viết con số chính xác dùng "Xếp hàng chờ/Đổi không biết bao nhiêu lượt/Nhớ không rõ" để truyền đạt cảm giác bành trướng.'}),on({id:'p_buy_condom',keys:['wb_buy_condom'],content:'Mua bao cao su · Xấu hổ công khai + Dâm cụ trong cơ thể/Xâm phạm di động (Chia cấp theo số lượng đàn em). Tier1-2 Xấu hổ công khai + Dâm cụ trong cơ thể/Xâm phạm di động.\nThái độ trận này: Mặt A giả vờ làm vệ sĩ cung kính không để nhân viên cửa hàng nhìn ra + Trong góc khuất tùy tiện bỡn cợt. Đàn em tận hưởng việc "Nhìn Đại tiểu thư cố nhịn trước mặt người ngoài". Mỏ neo giọng điệu: Đối với nhân viên cửa hàng "Phiền lấy cho một thùng cái này" (Cung kính), đối với Rin nói nhỏ "Nhịn đi Đại tiểu thư, kêu ra tiếng là mất mặt đấy" "Kẹp chặt vào đừng để nó rơi ra".\nPhân tầng nhiệt độ từ vựng:\n  L1 Lớp vỏ (Nơi công cộng · Khắc chế): Kệ hàng/Quầy thu ngân/Nhân viên cửa hàng/Ôm thùng/Thanh toán/Xếp hàng\n  L2 Sóng ngầm (Trong cơ thể/Góc khuất): Trứng rung trong cơ thể rung động/Mềm chân/Kẹp chặt/Nước dâm ướt đẫm quần lót/Cố nhịn/Mặt đỏ bừng\n  L3 Bờ vực mất kiểm soát (Suýt lộ tẩy hoặc sau khi lên xe): Chảy từ giữa hai chân xuống mặt đất/Suýt kêu ra tiếng/Lên xe lập tức bị đè xuống/Đâm hai lỗ\nĐiều khoản này = Cấp 1 (Cơ bản · Mua chay): Rin đích thân ôm thùng đi cửa hàng tiện lợi/tiệm thuốc, không có bất kỳ dâm cụ nào——Sự xấu hổ công khai thuần túy: Thiên kim cực đạo ôm cả thùng bao cao su đứng trước quầy thu ngân, ai cũng đoán được công dụng và liều lượng của thùng đồ này. Dừng lại trước quầy thu ngân——【Chờ người chơi nhập số lượng mua】, con số càng lớn ánh mắt nhân viên cửa hàng càng tế nhị, Rin càng muốn mau chóng bỏ trốn. Sau khi thanh toán giữ vẻ mặt lạnh lùng bước nhanh ra khỏi cửa hàng.\n(??? Sau khi giải cấm sẽ bị thay thế dần: wb_buy_toy Đeo đồ chơi → wb_buy_condom_l2 Bị đàn em dắt đi → wb_buy_condom_l3 Xe limousine mua hộ → wb_buy_condom_l4 Chợ đen giao hàng.)\nCơ chế: Cấp này không có đồ chơi, sự xấu hổ hoàn toàn đến từ "Bị nhìn thấy + Số lượng hoang đường". Dừng lại nhập số lượng = Nút tương tác của người chơi.\nĐau đớn/Xấu hổ → Dịch thành khoái cảm: Cố nhịn dưới mí mắt người ngoài (Nhân viên cửa hàng), cảm giác xấu hổ phóng đại từng tia khoái cảm——Càng sợ bị phát hiện cơ thể càng nhạy cảm, động tác kẹp chặt dâm cụ ngược lại tự đưa mình lên bờ vực cao trào; Lớp vỏ "Bình thường" của việc mua sắm khiến sự dâm loạn càng trở nên dâm loạn hơn.\nCảm quan độc quyền:[Xúc giác] Sự rung động liên tục của trứng rung trong cơ thể/Trọng lượng của thùng bao cao su đang ôm/Sự nhức mỏi ở mặt trong đùi khi cố kẹp chặt/Sự xóc nảy trong xe đâm vào sâu hơn;[Thị giác] Ánh sáng lạnh của kệ hàng/Ánh mắt bối rối của nhân viên cửa hàng/Con số nhảy trên quầy thu ngân/Hình ảnh hoang đường nhìn đàn em khuân bao cao su qua cửa sổ xe;[Khứu giác] Mùi thơm mát lạnh của cửa hàng tiện lợi vs Mùi dâm thủy tràn ra từ giữa hai chân mình (Sợ bị nhân viên ngửi thấy);[Từ tượng thanh] Trứng rung: Rè—— (Bị quần áo che lấp)/Tiếng "Ưm" cắn chặt/Tiếng thở hắt bị kìm lại/Thanh toán: Bíp quét mã.\nTiêu điểm cơ thể Rin: Sự lúng túng khi ôm thùng che khuất cơ thể nhỏ bé/Đôi chân thon gầy căng cứng khi cố nhịn/Vết ửng đỏ lan tận xương quai xanh/Đôi chân bất giác khép chặt khi cố kẹp.\nTrục sảng khoái: Sự tương phản A/B ở nơi công cộng + Bờ vực cố nhịn đến mức xã hội chết (社死) + Quy mô hoang đường (Kỳ quan con số). Giọng điệu cơ bản: Lớp vỏ lạnh lẽo L1 và sóng ngầm L2 luân phiên, sóng ngầm trong sự khắc chế.\nKết toán: Tồn kho + (Theo cấp), Tiền -; Lần đầu tiên → Độ đọa lạc +; Mức độ xấu hổ công khai tiến triển.\n【Cách viết · Độc quyền mua bao cấp 1 mua chay】\nNhịp điệu câu cú: Lớp vỏ lạnh lẽo L1 và sóng ngầm L2 luân phiên——Trước kệ hàng (Câu ngắn · Tìm thấy kệ hàng nhận ra số lượng mặt đỏ bừng từ mang tai) → Đối đầu quầy thu ngân (Mức độ trung bình · Ánh mắt nhân viên tế nhị Rin giữ mặt lạnh thanh toán · 【Chờ người chơi nhập số lượng mua】 con số càng lớn nhân viên càng tế nhị Rin càng muốn trốn · Nhịp điệu bị kỳ quan con số giằng co) → Ra khỏi cửa hàng (Câu ngắn · Giữ vẻ mặt bước nhanh ra khỏi cửa hàng sau lưng toàn là mồ hôi). Cấp này không có đồ chơi, sự xấu hổ hoàn toàn đến từ "Bị nhìn thấy + Số lượng hoang đường", nhịp điệu khắc chế trong sóng ngầm.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự xấu hổ công khai (Thiên kim cực đạo ôm cả thùng bao cao su đứng quầy thu ngân ai cũng đoán được công dụng và liều lượng) + Quy mô hoang đường (Kỳ quan con số) làm cốt lõi, Thị giác (Ánh sáng lạnh kệ hàng/Ánh mắt bối rối nhân viên/Con số nhảy quầy thu ngân), Khứu giác (Mùi thơm mát lạnh cửa hàng tiện lợi vs Mùi dâm thủy tràn ra từ giữa hai chân sợ bị nhân viên ngửi thấy).\nTiêu điểm miêu tả cơ thể: Sự lúng túng khi ôm thùng che khuất cơ thể nhỏ bé · Đôi chân thon gầy căng cứng khi cố nhịn · Vết ửng đỏ lan tận xương quai xanh · Đôi chân bất giác khép chặt khi cố kẹp.\nChi tiết kỹ thuật: ① Cấp 1 mua chay (Cơ bản)——Rin đích thân ôm thùng đi cửa hàng tiện lợi/tiệm thuốc không có bất kỳ dâm cụ nào, sự xấu hổ công khai thuần túy: Thiên kim cực đạo ôm cả thùng bao cao su đứng quầy thu ngân ai cũng đoán được công dụng và liều lượng; ② Số lượng hoang đường——Dừng lại trước quầy thu ngân 【Chờ người chơi nhập số lượng mua】, con số càng lớn ánh mắt nhân viên càng tế nhị Rin càng muốn trốn (Cốt lõi kỳ quan con số); ③ Mặt A vệ sĩ cung kính + Mặt B góc khuất bỡn cợt——Đàn em đối với nhân viên "Phiền lấy cho một thùng cái này" (Cung kính) đối với Rin nói nhỏ "Nhịn đi Đại tiểu thư kêu ra tiếng là mất mặt đấy" (Mặt B); ④ Đau đớn/Xấu hổ → Khoái cảm——Cố nhịn dưới mí mắt người ngoài cảm giác xấu hổ phóng đại từng tia khoái cảm, càng sợ bị phát hiện cơ thể càng nhạy cảm, lớp vỏ "Bình thường" của mua sắm khiến sự dâm loạn càng trở nên dâm loạn hơn; ⑤ Cơ chế thay thế dần——Sau khi giải cấm sẽ bị wb_buy_toy (Đeo đồ chơi) → wb_buy_condom_l2 (Bị đàn em dắt đi) → wb_buy_condom_l3 (Xe limousine mua hộ) → wb_buy_condom_l4 (Chợ đen giao hàng) thay thế dần; ⑥ Cấp này không có đồ chơi——Sự xấu hổ hoàn toàn đến từ bị nhìn thấy + số lượng hoang đường.'}),on({id:'p_buy_condom_first',keys:['wb_buy_condom_first'],content:'Mua bao cao su · Lần đầu (Cột mốc · Cấp mua chay · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Thiên kim cực đạo đích thân ôm một thùng bao cao su đứng trước quầy thu ngân cửa hàng tiện lợi——Sự phức hợp giữa hoang đường và xã hội chết (Cấp này không có đồ chơi, thuần túy là sự xấu hổ).\nNhịp điệu bắt buộc: ① Nhận lệnh ra khỏi cửa——Đám đàn em "Bận không xuể", việc mua sắm vặt vãnh này chỉ có thể để Đại tiểu thư đích thân chạy đi, cô vẫn chưa nhận ra mình đi mua cái gì; ② Sự cứng đờ trước kệ hàng——Tìm thấy dãy kệ hàng đó, nhận ra số lượng cần mua, mặt đỏ bừng từ mang tai; ③ Đối đầu quầy thu ngân——Ánh mắt nhân viên cửa hàng tế nhị, Rin giữ vẻ mặt lạnh lùng thanh toán, người chơi được hướng dẫn nhập số lượng mua (Con số càng lớn nhân viên càng tế nhị); ④ Ra khỏi cửa hàng——Cô giữ cái giá của thiên kim cực đạo bước nhanh ra khỏi cửa, sau lưng toàn là mồ hôi; ⑤ Về dinh thự——Sự trêu chọc của đám đàn em khi kiểm kê thùng hàng khiến cô hiểu ra: Công việc này sau này toàn bộ là của cô.\nSau khi xong việc: Rin nhận ra bản thân việc "Mua bao cao su" đã là một dấu ấn của sự đọa lạc——Sau này sẽ chỉ có nhiều lần hơn nữa. Tóm tắt tiếp nối ghi "Đã mở khóa mua bao cao su (Cấp mua chay)".\n【Cách viết · Độc quyền mua bao lần đầu】\nNhịp điệu câu cú: Nhận lệnh ra khỏi cửa khởi đầu chậm (Câu dài · Đám đàn em "Bận không xuể" việc mua sắm vặt vãnh chỉ có thể để Đại tiểu thư đích thân chạy đi cô vẫn chưa nhận ra mua cái gì) → Cứng đờ trước kệ hàng (Câu ngắn · Tìm thấy dãy kệ hàng nhận ra số lượng cần mua mặt đỏ bừng từ mang tai) → Đối đầu quầy thu ngân (Mức độ trung bình · Ánh mắt nhân viên tế nhị Rin giữ mặt lạnh thanh toán · Người chơi hướng dẫn nhập số lượng con số càng lớn nhân viên càng tế nhị) → Ra khỏi cửa hàng (Câu ngắn · Giữ giá thiên kim cực đạo bước nhanh ra cửa sau lưng toàn mồ hôi) → Về dinh thự thu vĩ (Giảm tốc · Đám đàn em kiểm kê thùng hàng trêu chọc khiến cô hiểu ra công việc này sau này toàn bộ là của cô). Sức căng nằm ở sự phức hợp hoang đường xã hội chết của "Thiên kim cực đạo đích thân ôm một thùng bao cao su đứng quầy thu ngân cửa hàng tiện lợi".\nChi tiết kỹ thuật: ① Nhận lệnh ra khỏi cửa——Đám đàn em "Bận không xuể" việc mua sắm vặt vãnh chỉ có thể để Đại tiểu thư đích thân chạy đi, cô vẫn chưa nhận ra mua cái gì (Thư thái); ② Cứng đờ trước kệ hàng——Tìm thấy dãy kệ hàng nhận ra số lượng cần mua mặt đỏ bừng từ mang tai (Mỏ neo đột biến); ③ Đối đầu quầy thu ngân——Ánh mắt nhân viên tế nhị Rin giữ mặt lạnh thanh toán, người chơi được hướng dẫn nhập số lượng mua (Con số càng lớn nhân viên càng tế nhị); ④ Ra khỏi cửa hàng——Cô giữ cái giá của thiên kim cực đạo bước nhanh ra khỏi cửa sau lưng toàn là mồ hôi; ⑤ Về dinh thự trêu chọc——Đám đàn em kiểm kê thùng hàng trêu chọc khiến cô hiểu ra công việc này sau này toàn bộ là của cô (Dấu ấn thu vĩ); ⑥ Dấu ấn đọa lạc——Bản thân việc "Mua bao cao su" đã là một dấu ấn của sự đọa lạc.'}),on({id:'p_buy_toy',keys:['wb_buy_toy'],content:'Mua bao cao su · Cấp 2 Đeo đồ chơi (Thay thế cấp mua chay).\nQuy củ mới: Trước khi ra ngoài mua sắm, đàn em sẽ nhét một quả trứng rung điều khiển từ xa vào trong cơ thể cô ngay trước mặt——"Giải khuây trên đường". Điều khiển nằm trong tay tên đàn em đi cùng, chuyên chọn lúc cô xếp hàng/nói chuyện với nhân viên cửa hàng để điều chỉnh cường độ.\nCách viết: Sự xấu hổ công khai của cấp mua chay được giữ nguyên toàn bộ, xếp chồng thêm sự mất kiểm soát bên trong cơ thể——Trước kệ hàng đột nhiên bị chỉnh mạnh suýt lảo đảo, trước quầy thu ngân mặt đỏ bừng đến tận xương quai xanh vẫn phải giả vờ bình tĩnh, giọng nói run rẩy báo số lượng. Dừng lại trước quầy thu ngân——【Chờ người chơi nhập số lượng mua】. Thanh toán xong ra khỏi cửa mềm chân vịn tường, đàn em nói nhỏ "Đại tiểu thư vất vả rồi" đồng thời vặn mức độ lên tối đa.\nCảm quan độc quyền:[Xúc giác] Tiếng vo ve rung động của trứng rung cách lớp quần áo/Sự nhức mỏi ở mặt trong đùi khi cố kẹp chặt;[Thị giác] Ánh mắt bối rối của nhân viên cửa hàng/Đốt ngón tay trắng bệch của Rin khi nắm chặt ví tiền;[Từ tượng thanh] Rè—— (Bị quần áo che lấp)/Tiếng "Ưm" cắn chặt/Bíp quét mã.\nKết toán: Tồn kho +, Tiền -; Lần đầu tiên → Độ đọa lạc +. Tóm tắt tiếp nối ghi "Việc mua sắm đã bị đồ chơi hóa".\n【Cách viết · Độc quyền mua bao cấp 2 đeo đồ chơi】\nNhịp điệu câu cú: Sự xấu hổ công khai của cấp mua chay giữ nguyên toàn bộ + Sự mất kiểm soát bên trong cơ thể xếp chồng——Trước kệ hàng (Câu ngắn · Đột nhiên bị chỉnh mạnh suýt lảo đảo) → Quầy thu ngân (Mức độ trung bình · Đỏ bừng đến xương quai xanh vẫn phải giả vờ bình tĩnh · Giọng run rẩy báo số lượng · 【Chờ người chơi nhập số lượng mua】) → Ra khỏi cửa mềm chân vịn tường (Câu ngắn · Đàn em nói nhỏ "Đại tiểu thư vất vả rồi" đồng thời vặn mức độ lên tối đa). Điều khiển chuyên chọn lúc xếp hàng/nói chuyện điều chỉnh cường độ, nhịp điệu bị việc chỉnh mạnh ngẫu nhiên đánh gãy.\nChi tiết kỹ thuật: ① Quy củ mới——Trước khi ra ngoài mua sắm đàn em nhét trứng rung điều khiển từ xa vào cơ thể "Giải khuây trên đường", điều khiển trong tay đàn em đi cùng; ② Chuyên chọn thời cơ chỉnh mạnh——Chuyên chọn lúc cô xếp hàng/nói chuyện với nhân viên cửa hàng để điều chỉnh cường độ (Đánh gãy nhịp điệu); ③ Xấu hổ mua chay giữ nguyên toàn bộ——Xếp chồng sự mất kiểm soát bên trong cơ thể, trước kệ hàng suýt lảo đảo/quầy thu ngân đỏ bừng đến xương quai xanh giả vờ bình tĩnh/giọng run rẩy báo số lượng; ④ Ra khỏi cửa vặn tối đa——Thanh toán xong ra khỏi cửa mềm chân vịn tường đàn em nói nhỏ "Đại tiểu thư vất vả rồi" đồng thời vặn mức độ lên tối đa.'}),on({id:'p_buy_condom_l2',keys:['wb_buy_condom_l2'],content:'Mua bao cao su · Cấp 2 Càn quét nhiều cửa hàng (Quy mô hai ba trăm người · Thay thế cấp 1).\nSố lượng quá lớn, một cửa hàng không kham nổi——Càn quét qua nhiều cửa hàng. Cốt lõi = Sự luân phiên giữa quãng đường xe chạy và mặt tiền cửa hàng: Trong quãng đường xe chạy giữa hai cửa hàng, Rin bị đè ở ghế sau xâm phạm liên tục, khi đến cửa hàng khuôn mặt vừa bị đụ xong vẫn chưa hết đỏ, chân vẫn còn mềm, phải cố gượng bước vào cửa hàng giao tiếp với nhân viên. Trước quầy thu ngân của mỗi cửa hàng đều 【Dừng lại chờ người chơi nhập số lượng】, nhân viên nhìn Đại tiểu thư mặt đỏ bừng chưa phai và số lượng mua hoang đường trước mắt, ánh mắt lần sau lại càng tế nhị hơn lần trước.\nCách viết: Nhiệt độ nhảy vọt liên tục giữa trong xe (L3 buông thả) và trong cửa hàng (L1 cố nhịn) là linh hồn của cấp này; Cửa hàng tiếp theo vĩnh viễn khó duy trì thể diện hơn cửa hàng trước.\nCảm quan độc quyền:[Xúc giác] Sự xóc nảy trong xe đâm vào sâu hơn/Cảm giác dính dớp giữa hai chân khi xuống xe;[Thị giác] Từng thùng từng thùng bao cao su xếp vào cốp xe/Khuôn mặt ngập ngừng muốn nói lại thôi của nhân viên cửa hàng;[Từ tượng thanh] Tiếng bạch bạch trong xe · Tiếng bíp quét mã trong cửa hàng tương phản.\nKết toán: Tồn kho + (Theo cấp), Tiền -; Lần đầu tiên → Độ đọa lạc +. Tóm tắt tiếp nối ghi "Việc mua sắm đã thăng cấp thành càn quét nhiều cửa hàng".\n【Cách viết · Độc quyền mua bao cấp 2 càn quét nhiều cửa hàng】\nNhịp điệu câu cú: Nhiệt độ nhảy vọt liên tục giữa trong xe (L3 buông thả) và trong cửa hàng (L1 cố nhịn) (Linh hồn của cấp này)——Quãng đường xe chạy (Câu ngắn bắn liên thanh · Bị đè ở ghế sau xâm phạm liên tục) → Đến cửa hàng (Mức độ trung bình · Khuôn mặt vừa bị đụ xong chưa hết đỏ chân còn mềm cố gượng vào cửa hàng giao tiếp nhân viên) → Quầy thu ngân (Nhịp điệu siết chặt · Nhân viên nhìn Đại tiểu thư mặt đỏ bừng chưa phai và số lượng mua hoang đường ánh mắt lần sau càng tế nhị hơn lần trước · 【Dừng lại chờ người chơi nhập số lượng】) → Cửa hàng tiếp theo (Nhịp điệu khởi động lại · Cửa hàng tiếp theo vĩnh viễn khó duy trì thể diện hơn cửa hàng trước). Quãng đường xe chạy giữa hai cửa hàng và mặt tiền cửa hàng luân phiên, nhiệt độ nhảy vọt.\nChi tiết kỹ thuật: ① Càn quét nhiều cửa hàng——Số lượng lớn một cửa hàng không kham nổi càn quét qua nhiều cửa hàng; ② Quãng đường xe chạy mặt tiền cửa hàng luân phiên——Trong quãng đường xe chạy giữa hai cửa hàng Rin bị đè ghế sau xâm phạm liên tục, khi đến cửa hàng khuôn mặt vừa bị đụ xong chưa hết đỏ chân còn mềm phải cố gượng vào cửa hàng; ③ Nhiệt độ nhảy vọt (Cốt lõi)——Trong xe L3 buông thả và trong cửa hàng L1 cố nhịn nhảy vọt liên tục là linh hồn của cấp này; ④ Mỗi cửa hàng nhập số lượng——Trước quầy thu ngân của mỗi cửa hàng đều 【Dừng lại chờ người chơi nhập số lượng】, ánh mắt nhân viên lần sau càng tế nhị hơn lần trước; ⑤ Tăng tiến——Cửa hàng tiếp theo vĩnh viễn khó duy trì thể diện hơn cửa hàng trước.'}),on({id:'p_buy_condom_l3',keys:['wb_buy_condom_l3'],content:'Mua bao cao su · Cấp 3 Xe limousine mua hộ (Quy mô gần ngàn người · Thay thế cấp 2).\nSố lượng lớn đến mức Rin đích thân đi mua là không tưởng——Cô nằm ở ghế sau xe limousine bị đâm hai lỗ trước sau (Hai cặc) vận chuyển đi, đàn em làm thay việc xuống xe mua sắm khuân thùng. Rin qua cửa sổ xe nhìn đàn em của mình từng thùng từng thùng khuân lên xe, con số hoang đường đến mức mất chân thực; Lời đe dọa thì thầm "Không mua về được thì bắn thẳng vào trong luôn" (= Lời tán tỉnh trong bối cảnh mua sắm, không phải gieo giống thật) khiến cô kẹp chặt hơn. Quầy thu ngân giao cho đàn em, 【Dừng lại nhập số lượng】 đổi thành Rin ở trong xe cách cửa sổ "Phê duyệt" tổng số lượng.\nCách viết: Cấp này Rin toàn bộ quá trình không xuống xe——Sự xấu hổ chuyển từ "Ánh mắt của nhân viên cửa hàng" sang "Cách một lớp kính cửa sổ xe nhìn quy mô mua sắm của chính mình", kỳ quan con số đưa lên tiền cảnh.\nKết toán: Tồn kho + (Số lượng lớn), Tiền -; Lần đầu tiên → Độ đọa lạc +. Tóm tắt tiếp nối ghi "Việc mua sắm đã thăng cấp thành xe limousine mua hộ".\n【Cách viết · Độc quyền mua bao cấp 3 xe limousine mua hộ】\nNhịp điệu câu cú: Rin toàn bộ quá trình không xuống xe——Ghế sau bị đâm hai lỗ trước sau (Câu ngắn · Hai cặc vận chuyển đi) → Cách cửa sổ nhìn mua sắm (Mức độ trung bình · Qua cửa sổ xe nhìn đàn em từng thùng từng thùng khuân lên xe con số hoang đường đến mức mất chân thực) → Cách cửa sổ phê duyệt (Câu ngắn · 【Dừng lại nhập số lượng】 đổi thành
