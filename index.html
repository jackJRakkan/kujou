 Rin trong xe cách cửa sổ "Phê duyệt" tổng số lượng) → Lời đe dọa thì thầm (Câu ngắn · "Không mua về được thì bắn thẳng vào trong luôn" khiến cô kẹp chặt hơn). Sự xấu hổ chuyển từ "Ánh mắt nhân viên cửa hàng" sang "Cách một lớp kính cửa sổ xe nhìn quy mô mua sắm của chính mình", kỳ quan con số đưa lên tiền cảnh.\nChi tiết kỹ thuật: ① Số lượng quá lớn đích thân mua không tưởng——Rin nằm ghế sau xe limousine bị đâm hai lỗ trước sau (Hai cặc) vận chuyển đi, đàn em làm thay việc xuống xe mua sắm khuân thùng; ② Cách cửa sổ nhìn quy mô——Rin qua cửa sổ xe nhìn đàn em từng thùng từng thùng khuân lên xe, con số hoang đường đến mức mất chân thực (Kỳ quan con số đưa lên tiền cảnh); ③ Cách cửa sổ phê duyệt——Quầy thu ngân giao cho đàn em, 【Dừng lại nhập số lượng】 đổi thành Rin trong xe cách cửa sổ "Phê duyệt" tổng số lượng; ④ Lời đe dọa thì thầm——Lời đe dọa thì thầm "Không mua về được thì bắn thẳng vào trong luôn" (= Lời tán tỉnh trong bối cảnh mua sắm không phải gieo giống thật) khiến cô kẹp chặt hơn; ⑤ Không xuống xe——Sự xấu hổ chuyển từ "Ánh mắt nhân viên cửa hàng" sang "Cách lớp kính cửa sổ xe nhìn quy mô mua sắm của chính mình".'}),on({id:'p_buy_condom_l4',keys:['wb_buy_condom_l4'],content:'Mua bao cao su · Cấp 4 Chợ đen giao hàng tận cửa (Trạng thái cuối · Thay thế cấp 3).\nKênh chợ đen được đả thông, việc mua sắm hoàn toàn không cần ra khỏi cửa——Mỗi ngày từng xe từng xe bao cao su được giao thẳng vào dinh thự Kujo. Việc "Mua sắm" của ô này biến thành Rin ở cổng dinh thự 【Nghiệm thu hàng】: Người giao hàng chợ đen lúc dỡ hàng ánh mắt cứ đảo quanh trên người Đại tiểu thư (Bọn họ đều biết rõ những món hàng này được dùng vào đâu), đàn em ngay trước mặt người giao hàng bóc một cái từ trong thùng mới đến để "Nghiệm thu dùng thử" tại chỗ. 【Dừng lại nhập số lượng】 đổi thành con số hoang đường trên biên lai ký nhận.\nCách viết: Sự xấu hổ chuyển từ nơi công cộng sang "Sự chú ý của người ngoài đã biết chuyện"——Ánh mắt hiểu ý không nói ra của người giao hàng + Nghiệm thu hàng ngay trước mặt, là cốt lõi của cấp này. Độ dài có thể ngắn (Trạng thái cuối thường ngày hóa).\nKết toán: Tồn kho + (Cả xe), Tiền -; Lần đầu tiên → Độ đọa lạc +. Tóm tắt tiếp nối ghi "Việc mua sắm đã ở trạng thái cuối · Giao hàng tận cửa".\n【Cách viết · Độc quyền mua bao cấp 4 chợ đen giao hàng】\nNhịp điệu câu cú: Độ dài có thể ngắn (Trạng thái cuối thường ngày hóa)——Cổng dinh thự nghiệm thu hàng (Mức độ trung bình · Người giao hàng chợ đen dỡ hàng ánh mắt đảo quanh trên người Đại tiểu thư bọn họ đều biết rõ những món hàng này dùng vào đâu) → Nghiệm thu dùng thử ngay trước mặt (Câu ngắn · Đàn em ngay trước mặt người giao hàng bóc một cái từ trong thùng mới đến "Nghiệm thu dùng thử" tại chỗ) → Ký nhận (Câu ngắn · 【Dừng lại nhập số lượng】 đổi thành con số hoang đường trên biên lai ký nhận). Sự xấu hổ chuyển từ nơi công cộng sang "Sự chú ý của người ngoài đã biết chuyện".\nChi tiết kỹ thuật: ① Chợ đen giao hàng tận cửa (Trạng thái cuối)——Kênh chợ đen đả thông mua sắm hoàn toàn không cần ra khỏi cửa, mỗi ngày từng xe từng xe bao cao su giao thẳng vào dinh thự Kujo; ② Cổng dinh thự nghiệm thu hàng——Việc "Mua sắm" của ô này biến thành Rin ở cổng dinh thự 【Nghiệm thu hàng】; ③ Sự chú ý của người ngoài đã biết chuyện (Cốt lõi)——Người giao hàng chợ đen lúc dỡ hàng ánh mắt đảo quanh trên người Đại tiểu thư (Bọn họ đều biết rõ những món hàng này dùng vào đâu); ④ Nghiệm thu dùng thử ngay trước mặt——Đàn em ngay trước mặt người giao hàng bóc một cái từ trong thùng mới đến "Nghiệm thu dùng thử" tại chỗ; ⑤ Ký nhận hoang đường——【Dừng lại nhập số lượng】 đổi thành con số hoang đường trên biên lai ký nhận; ⑥ Chuyển đổi sự xấu hổ——Từ nơi công cộng chuyển sang "Sự chú ý của người ngoài đã biết chuyện" + Nghiệm thu hàng ngay trước mặt; ⑦ Độ dài có thể ngắn——Trạng thái cuối thường ngày hóa.'}),on({id:'p_dine',keys:['wb_dine'],content:'Luân dâm trong nhà hàng · Thường quy (Trạng thái NSFW khi ra ngoài ăn cơm). Tier1-2 Luân dâm ở nơi công cộng (Bao trọn gói).\nThái độ trận này: Kiểu nhiệt tình mê luyến (Xem C5). Bao trọn gói không có người ngoài, đàn em buông thả hết cỡ, vừa ăn vừa đụ vừa trêu chọc.\nĐặc hóa môi trường (Nhà hàng · Linh hồn): Thể hiện công dụng vốn có của nhà hàng bị đảo lộn——"Nơi này vốn dĩ là chỗ để ăn cơm, bây giờ lại thành sân khấu luân dâm". Lợi dụng cấu trúc cụ thể của nhà hàng:\n  - Bàn ăn: Rin bị đè lên bàn ăn để luân dâm (Khăn trải bàn/bát đĩa bị gạt ra hoặc giữ nguyên để tăng cảm giác bừa bộn), hoặc dùng làm bàn ăn (Nữ thể thịnh - Bày thức ăn lên cơ thể khỏa thân).\n  - Quầy thu ngân/Quầy bar: Nằm sấp trên quầy bar đâm từ phía sau, độ cao vừa vặn.\n  - Ghế sofa/Phòng bao: Không gian bán khép kín, nhiều người chen chúc trong ghế sofa để luân dâm.\n  - Nhà bếp/Bàn thao tác bếp sau: Cảm giác mát lạnh của mặt bàn inox tương phản với nhiệt độ cơ thể.\n  - Vừa đút ăn vừa đụ: Bao trọn gói đến cả chủ quán cũng không có mặt, đàn em không kiêng nể gì——Vừa ôm Rin xâm phạm vừa đút thức ăn cho cô (Thức ăn + Cặc cùng lúc nhét vào), việc ăn uống và bị đâm rút diễn ra song song.\nKhe hở xâm thực (SFW→NSFW): SFW = Rin và đàn em ra ngoài ăn cơm bàn chuyện + trêu chọc; Đủ độ đọa lạc thì "Đang ăn dở" đàn em liền động tay động chân, bữa ăn mượt mà trượt vào luân dâm, bàn ăn từ dụng cụ ăn uống biến thành đạo cụ tình huống.\nPhân tầng nhiệt độ từ vựng: L1 Bàn ăn/Bát đĩa/Ăn cơm/Bao trọn gói → L2 Đè lên bàn/Gạt bát đĩa/Bị lấp đầy/Vừa đút ăn vừa bị đâm → L3 Cao trào trên bàn/Thức ăn và tinh dịch lẫn lộn vào nhau/Mặt bàn bừa bộn hỗn độn.\nCảm quan độc quyền:[Xúc giác] Mặt bàn cứng/Bàn inox lạnh lẽo/Thức ăn ấm nóng và nhiệt độ cơ thể;[Thị giác] Bàn ăn bừa bộn/Bị coi như đĩa đựng thức ăn/Nhà hàng trống không không có người ngoài;[Khứu giác] Mùi thức ăn thơm phức lẫn với mùi tinh dịch (Sắc thực đan xen);[Từ tượng thanh] Bát đĩa va chạm/Tiếng đóng cọc bạch bạch/Tiếng nhai thức ăn và tiếng đâm rút đan xen.\nTiêu điểm cơ thể Rin: Toàn cảnh cơ thể nhỏ bé bị đè trên bàn ăn/Sự lấp đầy kép khi miệng vừa nhét thức ăn vừa nhét cặc/Làn da trắng nõn dưới ánh đèn nhà hàng.\nTrục sảng khoái: Công dụng nơi công cộng bị đảo lộn (Sự tương phản giữa Ăn cơm → Luân dâm) + Bao trọn gói không kiêng nể + Vật hóa thành đồ đựng thức ăn.\nKết toán: +Trung thành (Tỷ lệ cao)、Lần đầu tiên → Độ đọa lạc +; Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm nhà hàng".\n【Cách viết · Độc quyền luân dâm nhà hàng】\nNhịp điệu câu cú: Đặc hóa môi trường tức là linh hồn——Luân phiên sử dụng cấu trúc nhà hàng (Bàn ăn/Quầy bar/Ghế sofa/Bếp sau · Mỗi cấu trúc một đoạn) → Vừa đút ăn vừa đụ (Mức độ trung bình · Thức ăn + Cặc cùng lúc nhét vào · Ăn uống và bị đâm rút song song) → Bữa ăn mượt mà trượt vào (Câu ngắn · "Đang ăn dở" đàn em liền động tay động chân · Bàn ăn từ dụng cụ ăn uống biến thành đạo cụ tình huống). Nhịp điệu được thúc đẩy bởi sự đảo lộn cấu trúc nhà hàng, "Nơi này vốn dĩ là chỗ để ăn cơm bây giờ lại thành sân khấu luân dâm".\nTrọng tâm cảm quan/Tập từ vựng: Lấy sắc thực đan xen (Mùi thức ăn thơm phức lẫn mùi tinh dịch · Thức ăn tinh dịch lẫn lộn · Mặt bàn bừa bộn) + Công dụng nơi công cộng bị đảo lộn (Tương phản Ăn cơm → Luân dâm) làm cốt lõi, Xúc giác (Mặt bàn cứng/Bàn inox lạnh lẽo/Thức ăn ấm nóng và nhiệt độ cơ thể), Âm thanh (Bát đĩa va chạm/Tiếng đóng cọc bạch bạch/Tiếng nhai thức ăn và tiếng đâm rút đan xen).\nTiêu điểm miêu tả cơ thể: Toàn cảnh cơ thể nhỏ bé bị đè trên bàn ăn · Sự lấp đầy kép khi miệng vừa nhét thức ăn vừa nhét cặc · Làn da trắng nõn dưới ánh đèn nhà hàng.\nChi tiết kỹ thuật: ① Đặc hóa môi trường (Linh hồn)——Công dụng vốn có của nhà hàng bị đảo lộn, "Nơi này vốn dĩ là chỗ để ăn cơm bây giờ lại thành sân khấu luân dâm"; ② Lợi dụng cấu trúc——Bàn ăn (Bị đè lên bàn luân dâm gạt bát đĩa hoặc giữ nguyên tăng bừa bộn/Hoặc nữ thể thịnh dùng làm bàn ăn)/Quầy thu ngân quầy bar (Nằm sấp quầy bar đâm từ phía sau độ cao vừa vặn)/Ghế sofa phòng bao (Bán khép kín nhiều người chen chúc luân dâm)/Nhà bếp bàn thao tác (Bàn inox lạnh lẽo tương phản nhiệt độ cơ thể); ③ Vừa đút ăn vừa đụ——Bao trọn gói đến cả chủ quán cũng không có mặt đàn em không kiêng nể, vừa ôm Rin xâm phạm vừa đút thức ăn (Thức ăn + Cặc cùng lúc nhét vào) ăn uống và bị đâm rút song song; ④ Khe hở xâm thực——SFW = Rin và đàn em ra ngoài ăn cơm bàn chuyện + trêu chọc, đủ độ đọa lạc thì "Đang ăn dở" đàn em liền động tay động chân bữa ăn mượt mà trượt vào luân dâm, bàn ăn từ dụng cụ ăn uống biến thành đạo cụ tình huống; ⑤ Bao trọn gói không kiêng nể——Bao trọn gói không có người ngoài đàn em buông thả hết cỡ vừa ăn vừa đụ vừa trêu chọc.'}),on({id:'p_dine_first',keys:['wb_dine_first'],content:'Luân dâm trong nhà hàng · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Lần đầu tiên phát hiện "Cùng đàn em ra ngoài ăn cơm" không phải là thư giãn, mà là mang sự đọa lạc ra không gian công cộng bên ngoài dinh thự.\nNhịp điệu bắt buộc: ① Bao trọn gói ngồi vào bàn——Rin dẫn đàn em vào nhà hàng, phát hiện toàn bộ nơi này đã bị bao trọn, không có người ngoài; ② Bữa ăn trò chuyện trêu chọc——Đám đàn em vừa ăn vừa trêu chọc, Rin nhận ra bầu không khí không đúng nhưng vẫn cố giữ vẻ đoan trang; ③ "Đang ăn dở thì động tay động chân"——Một tên đàn em nào đó "vô tình" thò tay xuống gầm bàn, Rin cứng đờ, đám đàn em xung quanh hò reo, bữa ăn mượt mà trượt vào luân dâm; ④ Bị đè lên bàn ăn——Khăn trải bàn bị gạt sang một bên hoặc giữ nguyên, bát đĩa vương vãi, Rin bị nhiều người luân dâm ngay trên bàn ăn, bên cạnh vẫn có người tiếp tục ăn uống; ⑤ Thức ăn và tinh dịch chung một mâm——Rin vừa được đút ăn vừa bị đâm, vụn thức ăn rơi trên người lẫn lộn với tinh dịch.\nSau khi xong việc: Rin nhận ra "Ra ngoài ăn cơm" sau này sẽ chỉ mang ý nghĩa này. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm nhà hàng · Lần đầu tiên phát hiện ý nghĩa của việc bao trọn gói".\n【Cách viết · Độc quyền nhà hàng lần đầu】\nNhịp điệu câu cú: Bao trọn gói ngồi vào bàn khởi đầu chậm (Câu dài · Rin dẫn đàn em vào nhà hàng phát hiện toàn bộ nơi này đã bị bao trọn không có người ngoài) → Bữa ăn trò chuyện (Mức độ trung bình · Đám đàn em vừa ăn vừa trêu chọc Rin nhận ra bầu không khí không đúng nhưng vẫn cố giữ vẻ đoan trang) → Đang ăn dở động tay động chân đột biến (Câu ngắn · Một tên đàn em "vô tình" thò tay xuống gầm bàn Rin cứng đờ xung quanh hò reo bữa ăn mượt mà trượt vào luân dâm) → Bị đè lên bàn ăn (Câu ngắn bắn liên thanh · Khăn trải bàn bị gạt sang một bên hoặc giữ nguyên bát đĩa vương vãi · Rin bị nhiều người luân dâm trên bàn ăn bên cạnh vẫn có người tiếp tục ăn uống) → Thức ăn tinh dịch chung một mâm thu vĩ (Mức độ trung bình · Rin vừa được đút ăn vừa bị đâm vụn thức ăn rơi trên người lẫn lộn với tinh dịch). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Cùng đàn em ra ngoài ăn cơm không phải thư giãn mà là mang đọa lạc ra không gian công cộng".\nChi tiết kỹ thuật: ① Bao trọn gói ngồi vào bàn——Rin dẫn đàn em vào nhà hàng phát hiện toàn bộ nơi này đã bị bao trọn không có người ngoài (Thư thái); ② Bữa ăn trò chuyện trêu chọc——Đám đàn em vừa ăn vừa trêu chọc Rin nhận ra bầu không khí không đúng nhưng vẫn cố giữ vẻ đoan trang; ③ Đang ăn dở động tay động chân——Một tên đàn em "vô tình" thò tay xuống gầm bàn Rin cứng đờ đám đàn em xung quanh hò reo bữa ăn mượt mà trượt vào luân dâm (Mỏ neo đột biến); ④ Bị đè lên bàn ăn——Khăn trải bàn bị gạt sang một bên hoặc giữ nguyên bát đĩa vương vãi, Rin bị nhiều người luân dâm ngay trên bàn ăn bên cạnh vẫn có người tiếp tục ăn uống; ⑤ Thức ăn tinh dịch chung một mâm——Rin vừa được đút ăn vừa bị đâm, vụn thức ăn rơi trên người lẫn lộn với tinh dịch (Sắc thực đan xen thu vĩ); ⑥ Ý nghĩa bao trọn gói——"Ra ngoài ăn cơm" sau này sẽ chỉ mang ý nghĩa này (Dấu ấn thu vĩ).'}),on({id:'p_amusement',keys:['wb_amusement'],content:'Luân dâm trong công viên giải trí · Thường quy (Ban ngày tuyên dâm · Nhịp điệu "Mật thất di động" của khoang kín). Tier1-2 Trạng thái NSFW hai mặt.\nLợi dụng cơ sở vật chất (Chọn một làm trục chính): Vòng đu quay ngựa gỗ cố định cột ngựa làm điểm trói buộc (Hai tay ấn lên cột ngựa nương theo nhịp lên xuống mà bị đâm) / Nhà ma tối tăm + Đạo cụ dọa ma che lấp tiếng rên rỉ và tiếng đập thịt, mỗi tình tiết dọa ma tương ứng với một cú đâm sâu / Vòng đu quay khổng lồ khoang kín = Hộp cách âm di chuyển chậm trên không, một vòng mười mấy phút vừa vặn một hiệp, bên ngoài lớp kính cả khu công viên không ai có thể lên được / Tàu cướp biển cốc xoay lực ly tâm hất cô về phía cặc.\n**Tuyệt đối không viết tàu lượn siêu tốc** (Sự mất trọng lượng kịch liệt không tương thích với nhịp điệu sắc tình).\nKhe hở xâm thực: Xếp hàng vào nhà ma → Trong bóng tối đổi thành bị người từ phía sau ôm lấy; Ngồi vòng đu quay "Ngắm cảnh đêm" → Cửa khoang vừa đóng là bắt đầu; Vòng đu quay ngựa gỗ "Chơi cùng Đại tiểu thư" → Vừa nâng lên đã bị cắm vào.\nCảm quan độc quyền:[Thị giác] Nhạc cơ khí hộp nhạc của vòng đu quay ngựa gỗ + Ánh đèn sợi đốt vàng ấm; Gió lạnh nhân tạo trong nhà ma + Mùi máu me nhựa + Hiệu ứng âm thanh la hét át tiếng rên dâm; Sự rung lắc khi lên đỉnh của vòng đu quay khổng lồ và cảm giác lơ lửng dưới chân;[Xúc giác] Cột ngựa/Sự bám chặt khi bị dọa/Sự ngột ngạt khép kín của khoang cabin;[Âm thanh] BGM công viên giải trí/Tiếng la hét dọa ma át tiếng ❤ của Rin;[Khứu giác] Mùi thơm ngọt của bắp rang bơ kẹo bông gòn vs Mùi dâm thủy tràn ra từ người Rin;[Từ tượng thanh] Tiếng đóng cọc bị BGM che lấp.\nChuyển hóa sự xấu hổ: Vòng đu quay khổng lồ từ từ bay lên = Đếm ngược không thể trốn thoát; Lối ra nhà ma du khách xếp hàng chỉ cách một lớp vải; Vòng đu quay ngựa gỗ quay một vòng bên ngoài nhìn thấy một vòng những người khác nhau.\n【Cách viết · Độc quyền công viên giải trí】\nNhịp điệu câu cú: Tùy theo nhịp điệu của cơ sở vật chất được chọn——Vòng đu quay khổng lồ = Đếm ngược chậm chạp của khoang kín (Câu dài · Một vòng mười mấy phút vừa vặn một hiệp · Nhịp điệu bị kéo dài chậm chạp trên không); Nhà ma = Sự dồn dập được che đậy bởi đạo cụ dọa ma (Câu ngắn · Mỗi tình tiết dọa ma tương ứng một cú đâm sâu · Tiếng la hét dọa ma át tiếng rên tiếng đập thịt); Vòng đu quay ngựa gỗ = Vòng lặp lên xuống (Nương theo nhịp lên xuống của cột ngựa mà bị đâm). Khe hở xâm thực = Từ việc vui chơi bình thường trượt mượt mà vào việc bị đâm (Chuyển đổi câu ngắn).\nTrọng tâm cảm quan/Tập từ vựng/Tiêu điểm miêu tả cơ thể: Xem phần "Cảm quan độc quyền/Chuyển hóa sự xấu hổ/Lợi dụng cơ sở vật chất" ở trên, bối cảnh này lấy BGM cơ sở vật chất và tiếng vui chơi át đi tiếng thịt va chạm làm cốt lõi, sự đảo lộn khứu giác giữa mùi thơm ngọt vs mùi dâm thủy.\nChi tiết kỹ thuật (Cơ sở vật chất tức là nhịp điệu): ① Khoang kín vòng đu quay khổng lồ——Hộp cách âm di chuyển chậm trên không, một vòng mười mấy phút vừa vặn một hiệp, bên ngoài lớp kính không ai có thể lên được, từ từ bay lên = Đếm ngược không thể trốn thoát (Nhịp điệu bị kéo dài); ② Nhà ma tối tăm + Đạo cụ dọa ma——Bóng tối che đậy + Mỗi tình tiết dọa ma tương ứng một cú đâm sâu, tiếng la hét dọa ma át tiếng rên tiếng đập thịt (Nhịp điệu dồn dập); ③ Cột ngựa cố định của vòng đu quay ngựa gỗ——Hai tay ấn lên cột ngựa nương theo nhịp lên xuống mà bị đâm, quay một vòng bên ngoài nhìn thấy một vòng những người khác nhau (Nhịp điệu tuần hoàn); ④ Tuyệt đối không viết tàu lượn siêu tốc——Sự mất trọng lượng kịch liệt không tương thích với nhịp điệu sắc tình (Luật thép); ⑤ Khe hở xâm thực——Xếp hàng vào nhà ma → Trong bóng tối đổi thành bị người từ phía sau ôm lấy, ngồi vòng đu quay ngắm cảnh đêm → Cửa khoang vừa đóng là bắt đầu, vòng đu quay ngựa gỗ chơi cùng → Vừa nâng lên đã bị cắm vào (Trượt vào mượt mà).'}),on({id:'p_amusement_first',keys:['wb_amusement_first'],content:'Luân dâm trong công viên giải trí · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Thiên kim cực đạo chưa từng ra ngoài "Với mục đích giải trí"——Lần đầu tiên ra ngoài chơi, liền phát hiện ra trò chơi này là để mang sự đọa lạc vào không gian công cộng.\nNhịp điệu bắt buộc: ① Khởi đầu hưng phấn——Rin hiếm khi lộ ra một chút mong đợi ("Đã lâu không ra ngoài rồi"), đàn em "Chơi cùng Đại tiểu thư"; ② Chọn cơ sở vật chất đầu tiên——Lấy vòng đu quay khổng lồ/nhà ma làm đại diện (Ghi ngẫu nhiên vào tóm tắt tiếp nối); ③ Khoảnh khắc cửa đóng lại——Bầu không khí thay đổi, Rin nhận ra mục đích thực sự của lần ra ngoài này; ④ Luân dâm đặc trưng của cơ sở vật chất đó——Bị nhiều người luân dâm theo cấu trúc không gian của cơ sở vật chất được chọn (Trong khoang vòng đu quay/Trong bóng tối nhà ma/Trên cột ngựa gỗ); ⑤ Ra khỏi khoang/Ra khỏi nhà ma——Chỉnh đốn trang phục, tiếp tục đi đến cơ sở vật chất tiếp theo.\nSau khi xong việc: Rin nhận ra công viên giải trí trong ngữ nghĩa của Kujo-kai = Sự liên tiếp của nhiều khoảng chân không cách âm. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm công viên giải trí · Cơ sở vật chất lần đầu".\n【Cách viết · Độc quyền công viên giải trí lần đầu】\nNhịp điệu câu cú: Khởi đầu hưng phấn chậm rãi (Câu dài · Rin hiếm khi mong đợi "Đã lâu không ra ngoài rồi", nhịp điệu thư thái) → Cửa đóng lại đột biến (Câu ngắn · Cửa khoang/Lối vào nhà ma vừa đóng bầu không khí thay đổi, Rin nhận ra mục đích thực sự) → Luân dâm cơ sở vật chất (Theo cấu trúc không gian cơ sở vật chất được chọn · Nhịp điệu theo cơ sở vật chất) → Ra khỏi khoang chỉnh đốn khôi phục (Giảm tốc · Chỉnh đốn trang phục tiếp tục cơ sở vật chất tiếp theo). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên của "Ra ngoài với mục đích giải trí".\nTrọng tâm cảm quan/Tập từ vựng: Lần đầu tiên nhấn mạnh sự tương phản khi "Sự mong đợi hiếm hoi khi ra ngoài" bị phá vỡ, L3 "Sự liên tiếp của các khoảng chân không cách âm" là định tính của lần đầu tiên.\nChi tiết kỹ thuật: ① Khởi đầu hưng phấn——Rin hiếm khi lộ ra mong đợi (Đã lâu không ra ngoài rồi), đàn em "Chơi cùng Đại tiểu thư", dùng sự mong đợi thư thái làm sự tương phản; ② Khoảnh khắc cửa đóng lại——Bầu không khí thay đổi, Rin nhận ra mục đích thực sự của lần ra ngoài này (Mỏ neo sụp đổ nhận thức); ③ Cấu trúc không gian cơ sở vật chất——Bị nhiều người luân dâm theo cấu trúc không gian cơ sở vật chất được chọn (Trong khoang vòng đu quay/Bóng tối nhà ma/Cột ngựa gỗ); ④ Chân không liên tiếp——Ra khỏi khoang chỉnh đốn tiếp tục cơ sở vật chất tiếp theo, công viên giải trí = Sự liên tiếp của nhiều khoảng chân không cách âm (Dấu ấn định tính lần đầu).'}),on({id:'p_beach',keys:['wb_beach'],content:'Luân dâm trên bãi biển · Thường quy (Ban ngày tuyên dâm · Vùng chân không + Xúc cảm của nước). Tier1-2 Trạng thái NSFW hai mặt.\nVùng chân không (Trục chính): Đàn em ỷ vào thân phận cực đạo chiếm cứ một bãi biển——Tìm phía sau rạn đá ngầm không người/Vây quanh cụm ô che nắng khoanh ra vùng cấm, người ngoài bị uy hiếp không dám lại gần. Rin không được phép mặc quần bơi, vén đũng quần bikini/đồ bơi sang một bên là đâm thẳng vào, bị luân dâm công khai trong vùng chân không được khoanh ra.\nLợi dụng cơ sở vật chất: Sự che chắn tự nhiên phía sau rạn đá ngầm + Mặt đá làm điểm tựa/Cụm ô che nắng khoanh thành "Phòng bao"/Nửa thân dưới ngâm trong nước biển được sóng che lấp, có thể tiến hành trong vùng nước ngang lưng/Phòng thay đồ (Điểm luân phiên).\nKhe hở xâm thực: Bàn tay thoa kem chống nắng trượt dần xuống dưới → Không dừng lại; "Xuống nước cho mát" → Trong vùng nước ngang lưng bị dán sát từ phía sau nhấp nhô theo sóng; Bị vây quanh đi đến sau rạn đá ngầm → Vén lên là đâm.\nCảm quan độc quyền:[Thị giác] Dưới ánh nắng chói chang của khu nghỉ dưỡng;[Xúc giác] Gió biển mặn chát + Hương dừa của kem chống nắng + Hạt cát cọ xát vào bẹn kẹt vào khe hở thô ráp + Sự tương phản giữa nước biển lạnh lẽo và sự nóng rực bên trong cơ thể;[Âm thanh] Tiếng sóng át tiếng thịt, tiếng nước rút rào rào khớp với nhịp đâm rút;[Khứu giác] Gió biển mặn chát + Hương dừa kem chống nắng vs Mùi giống cái mùi tinh dịch của Rin bị sử dụng nhiều lần (Nồng độ mà nước biển không rửa sạch được).\nChuyển hóa sự xấu hổ (Ban ngày tuyên dâm · Không phải lén lút): Dưới ánh nắng của khu nghỉ dưỡng bị chính thuộc hạ của mình dùng công khai, du khách đằng xa bị khí thế cực đạo ép phải đi đường vòng tạo ra sự đảo lộn địa vị; Đồ bơi ướt sũng phác họa hình dáng nhỏ bé vừa gạt ra là đụ.\n【Cách viết · Độc quyền bãi biển】\nNhịp điệu câu cú: Tùy theo nhịp điệu địa điểm——Phía sau rạn đá ngầm = Sự chống đỡ cứng rắn của lớp che chắn tự nhiên (Câu ngắn · Mặt đá làm điểm tựa bị đè xuống); Trong nước biển = Sự nhấp nhô theo sóng dưới sự che lấp của vùng nước ngang lưng (Câu dài · Tiếng sóng át tiếng thịt · Tiếng nước rút rào rào khớp nhịp đâm rút); Phòng thay đồ = Điểm luân phiên buồng nhỏ (Chuyển đổi ngắn gọn). Khe hở xâm thực = Bàn tay thoa kem chống nắng trượt xuống không dừng/"Xuống nước cho mát" dán sát (Trượt vào mượt mà).\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự đảo lộn mùi hương giữa gió biển mặn chát + hương dừa kem chống nắng vs mùi giống cái mùi tinh dịch của Rin (Nồng độ nước biển không rửa sạch được) làm cốt lõi, xúc giác của hạt cát thô ráp + sự tương phản nước biển lạnh và trong cơ thể nóng.\nChi tiết kỹ thuật (Địa điểm tức là nhịp điệu): ① Vùng chân không——Đàn em ỷ thế chiếm cứ một bãi biển (Sau rạn đá ngầm/Cụm ô che nắng khoanh vùng cấm), người ngoài bị uy hiếp không dám lại gần, Rin không được mặc quần bơi vén lên là đâm (Ban ngày tuyên dâm không lén lút); ② Phía sau rạn đá ngầm——Che chắn tự nhiên + Mặt đá làm điểm tựa; ③ Trong nước biển——Nước ngang lưng che nửa thân dưới, tiếng sóng át tiếng thịt, tiếng nước rút rào rào khớp nhịp đâm rút; ④ Phòng thay đồ——Điểm luân phiên buồng nhỏ; ⑤ Khe hở xâm thực——Bàn tay thoa kem chống nắng trượt xuống không dừng/"Xuống nước cho mát" vùng nước ngang lưng từ phía sau dán sát nhấp nhô theo sóng/Bị vây quanh đến sau rạn đá ngầm vén lên là đâm; ⑥ Luật thép mùi hương——Nước biển không rửa sạch được nồng độ mùi giống cái mùi tinh dịch (Khứu giác độc quyền); ⑦ Hạt cát thô ráp——Hạt cát cọ xát vào bẹn kẹt vào khe hở (Chi tiết xúc giác).'}),on({id:'p_beach_first',keys:['wb_beach_first'],content:'Luân dâm trên bãi biển · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Ánh nắng của khu nghỉ dưỡng, vốn dĩ là nơi thư giãn——Lần đầu tiên phát hiện "Kỳ nghỉ" của Kujo-kai chính là mang sự đọa lạc ra bãi biển.\nNhịp điệu bắt buộc: ① Sự hưng phấn khi vừa xuống xe——Rin hiếm khi thay bikini, đàn em vây quanh cô đi về phía bãi biển; ② "Chiếm chỗ"——Đám đàn em bày ô và ghế ra, khoanh thành vùng chân không, du khách bị khí thế ép phải đi đường vòng; ③ Bước ngoặt của việc thoa kem chống nắng——Một tên đàn em nào đó "Giúp Đại tiểu thư thoa", bàn tay từ lưng trượt thẳng xuống thân dưới, Rin cứng đờ, đồ bơi bị gạt ra; ④ Luân dâm dưới ánh nắng——Bị nhiều người luân dâm ngay trên bãi biển giữa ban ngày ban mặt, du khách đằng xa đi vòng qua; ⑤ Xuống nước "Cho mát"——Trong vùng nước ngang lưng bị dán sát từ phía sau, nước che lấp tất cả, nhưng nước biển không rửa sạch được mùi giống cái.\nSau khi xong việc: Rin nhận ra "Kỳ nghỉ" sau này sẽ chỉ mang ý nghĩa này. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm bãi biển".\n【Cách viết · Độc quyền bãi biển lần đầu】\nNhịp điệu câu cú: Xuống xe hưng phấn chậm rãi (Câu dài · Hiếm khi thay bikini đàn em vây quanh đi về bãi biển) → "Chiếm chỗ" khoanh vùng chân không (Câu ngắn · Bày ô ghế khoanh vùng cấm du khách đi vòng) → Bước ngoặt thoa kem chống nắng (Nhịp điệu từ "Thoa kem chống nắng" thư thái đột ngột chuyển hướng——Bàn tay trượt xuống thân dưới Rin cứng đờ đồ bơi bị gạt) → Luân dâm dưới nắng (Bãi biển giữa ban ngày bị nhiều người luân dâm) → Xuống nước "Cho mát" thu vĩ (Giảm tốc · Vùng nước ngang lưng từ phía sau dán sát nước che lấp tất cả nhưng không rửa sạch mùi giống cái). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên của "Kỳ nghỉ = Thư giãn".\nChi tiết kỹ thuật: ① Xuống xe hưng phấn——Rin hiếm khi thay bikini đàn em vây quanh đi về bãi biển (Sự tương phản thư thái); ② Chiếm chỗ khoanh vùng chân không——Đàn em bày ô ghế khoanh vùng chân không, du khách bị khí thế ép phải đi đường vòng; ③ Bước ngoặt thoa kem chống nắng——Một tên đàn em "Giúp Đại tiểu thư thoa" bàn tay từ lưng trượt thẳng xuống thân dưới, Rin cứng đờ đồ bơi bị gạt (Mỏ neo sụp đổ nhận thức); ④ Luân dâm dưới nắng——Bãi biển giữa ban ngày bị nhiều người luân dâm, du khách đằng xa đi vòng qua; ⑤ Xuống nước cho mát——Vùng nước ngang lưng từ phía sau dán sát nước che lấp tất cả, nhưng nước biển không rửa sạch được mùi giống cái (Dấu ấn mùi hương thu vĩ).'}),on({id:'p_mall',keys:['wb_mall'],content:'Luân dâm trong trung tâm thương mại · Thường quy (Ban ngày tuyên dâm · Bao trọn cửa hàng/Dọn dẹp hiện trường tạo vùng chân không). Tier1-2 Trạng thái NSFW hai mặt.\nVùng chân không (Trục chính): Kujo-kai ỷ thế bao trọn toàn bộ cửa hàng/Dọn sạch một khu vực (Nhân viên cửa hàng bị đuổi đi hoặc bị bịt miệng), khoanh ra vùng cấm để tuyên dâm công khai ngay trong không gian công cộng "Đứng đắn" nhất như trung tâm thương mại; Dưới váy Rin không được phép mặc quần lót, ở quầy thu ngân/phòng thử đồ vừa vén lên là đâm vào. Hoặc ở khu vực vẫn đang hoạt động dùng đàn em quây thành một góc khuất (Dưới thang cuốn/Sau cột trụ sảnh trung tâm) để làm bậy, người ngoài bị khí thế cực đạo ép phải đi đường vòng.\nLợi dụng cơ sở vật chất: Quầy thu ngân/Phòng thử đồ của cửa hàng được bao trọn (Bốn mặt gương soi ra bóng chồng chéo, bị đè trước gương nhìn thẳng vào khuôn mặt đang bị đụ của chính mình)/Lan can sảnh trung tâm (Bị đè lên lan can, vị trí trưng bày tầng hai)/Ngồi xổm sau quầy thu ngân "Tìm hàng" thực chất là khẩu giao/Nắp capo xe trong bãi đỗ xe tầng hầm (Tối tăm + Tiếng vang).\nKhe hở xâm thực: "Cùng Đại tiểu thư đi mua sắm" → Bước vào cửa hàng đã bao trọn, vén váy là đâm; Thử đồ quay người lại → Trong gương hiện thêm một đôi tay; Bị quây vào góc khuất.\nCảm quan độc quyền:[Thị giác] Ánh sáng lạnh của gương phòng thử đồ/Nhạc khuyến mãi phát trên loa trung tâm;[Xúc giác] Hơi lạnh điều hòa trung tâm + Máy khuếch tán hương thơm của cửa hàng;[Âm thanh] Loa phát thanh nền + Tiếng rì rì của thang cuốn + Tiếng đập thịt phản xạ từ gương phòng thử đồ;[Khứu giác] Hương thơm khuếch tán của cửa hàng vs Mùi tinh dịch trên người Rin;[Từ tượng thanh] Bạch bạch/Tiếng ❤ bị kìm nén của Rin bị loa phát thanh át đi một nửa.\nChuyển hóa sự xấu hổ (Ban ngày tuyên dâm): Bị chính thuộc hạ của mình dùng công khai ở nơi mua sắm thường ngày nhất, nhân viên cửa hàng bị dọn dẹp bịt miệng không dám nhìn tạo ra sự đảo lộn địa vị; Gương ép cô phải nhìn thẳng vào khuôn mặt đang bị đụ của chính mình.\n【Cách viết · Độc quyền trung tâm thương mại】\nNhịp điệu câu cú: Tùy theo địa điểm——Phòng thử đồ = Sự ép buộc nhìn thẳng của bốn mặt gương (Câu dài · Bóng chồng chéo trong gương · Rin không thể né tránh phản ứng của chính mình); Lan can sảnh trung tâm = Sự công khai của vị trí trưng bày tầng hai (Câu ngắn · Bị đè lên lan can); Ngồi xổm sau quầy "Tìm hàng" = Sự ngụy trang của khẩu giao (Ngắn gọn); Nắp capo bãi đỗ xe = Tối tăm tiếng vang (Mức độ trung bình). Khe hở xâm thực = "Cùng mua sắm" vào cửa hàng bao trọn vén váy là đâm/Thử đồ quay người gương thêm đôi tay (Trượt vào mượt mà).\nTrọng tâm cảm quan/Tập từ vựng: Lấy ánh sáng lạnh của gương phòng thử đồ ép nhìn thẳng + Sự đảo lộn mùi hương giữa hương thơm khuếch tán vs mùi tinh dịch + Loa trung tâm át tiếng ❤ làm cốt lõi.\nChi tiết kỹ thuật (Địa điểm tức là nhịp điệu): ① Vùng chân không——Bao trọn toàn bộ cửa hàng/Dọn sạch khu vực (Nhân viên đuổi đi hoặc bịt miệng), hoặc ở khu vực hoạt động dùng đàn em quây góc khuất (Dưới thang cuốn/Sau cột trụ) làm bậy, người ngoài bị khí thế ép đi vòng; ② Gương phòng thử đồ——Bốn mặt gương soi ra bóng chồng chéo, bị đè trước gương nhìn thẳng vào khuôn mặt đang bị đụ của chính mình (Xấu hổ thị giác độc quyền); ③ Lan can sảnh trung tâm——Bị đè lên lan can vị trí trưng bày tầng hai; ④ Sau quầy tìm hàng——Ngồi xổm "Tìm hàng" thực chất là khẩu giao (Ngụy trang); ⑤ Nắp capo bãi đỗ xe——Tối tăm + Tiếng vang; ⑥ Khe hở xâm thực——"Cùng Đại tiểu thư đi mua sắm" vào cửa hàng bao trọn vén váy là đâm/Thử đồ quay người gương thêm đôi tay/Bị quây vào góc khuất; ⑦ Gương ép nhìn——Ánh sáng lạnh của gương ép Rin nhìn thẳng vào khuôn mặt đang bị đụ của chính mình không thể né tránh (Mỏ neo xấu hổ cốt lõi).'}),on({id:'p_mall_first',keys:['wb_mall_first'],content:'Luân dâm trong trung tâm thương mại · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Trung tâm thương mại = Nơi "Đứng đắn" thường ngày nhất——Lần đầu tiên phát hiện ngay cả nơi này cũng biến thành sân khấu luân dâm.\nNhịp điệu bắt buộc: ① "Cùng Đại tiểu thư đi mua sắm"——Rin dẫn đàn em vào trung tâm thương mại thử đồ mới; ② Cửa hàng bị bao trọn——Nhân viên cửa hàng bị đuổi ra ngoài, Rin nhận ra có điều không ổn; ③ Trong phòng thử đồ——Bốn mặt gương bao quanh, Rin bị đè trước gương nhìn chính mình bị một đám đàn em vây quanh; ④ Luân dâm dưới ánh sáng lạnh của gương——Trong gương phản chiếu khuôn mặt ửng đỏ thất thần của Rin, cô không thể né tránh phản ứng của chính mình; ⑤ Chỉnh đốn khi ra khỏi cửa hàng——Nhân viên cửa hàng bị dọn dẹp cúi đầu không dám nhìn, Rin bước ra khỏi cửa hàng duy trì vẻ đoan trang.\nSau khi xong việc: Rin nhận ra trung tâm thương mại chỉ là một vật chứa vùng chân không khác. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm trung tâm thương mại".\n【Cách viết · Độc quyền trung tâm thương mại lần đầu】\nNhịp điệu câu cú: Cùng mua sắm khởi đầu chậm (Câu dài · Dẫn đàn em vào trung tâm thương mại thử đồ mới) → Cửa hàng bị bao trọn đột biến (Câu ngắn · Nhân viên đuổi ra ngoài Rin nhận ra không ổn) → Gương phòng thử đồ bao quanh (Nhịp điệu siết chặt · Bốn mặt gương bao quanh bị đè trước gương nhìn mình bị đám đàn em vây quanh) → Luân dâm trong gương (Câu dài · Trong gương phản chiếu khuôn mặt ửng đỏ thất thần không thể né tránh) → Ra khỏi cửa hàng chỉnh đốn khôi phục (Giảm tốc · Nhân viên dọn dẹp cúi đầu không dám nhìn Rin duy trì đoan trang). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên của "Nơi đứng đắn nhất".\nChi tiết kỹ thuật: ① Cùng mua sắm——Rin dẫn đàn em vào trung tâm thương mại thử đồ mới (Thư thái); ② Cửa hàng bị bao trọn——Nhân viên cửa hàng bị đuổi ra ngoài Rin nhận ra không ổn (Mỏ neo đột biến); ③ Gương phòng thử đồ bao quanh——Bốn mặt gương bao quanh bị đè trước gương nhìn chính mình bị một đám đàn em vây quanh; ④ Luân dâm trong gương——Trong gương phản chiếu khuôn mặt ửng đỏ thất thần của Rin cô không thể né tránh phản ứng của chính mình (Mỏ neo xấu hổ cốt lõi); ⑤ Ra khỏi cửa hàng chỉnh đốn——Nhân viên dọn dẹp cúi đầu không dám nhìn Rin bước ra khỏi cửa hàng duy trì đoan trang (Dấu ấn nhận thức thu vĩ).'}),on({id:'p_camping',keys:['wb_camping'],content:'Luân dâm cắm trại trong rừng · Thường quy (Lãnh địa tư nhân · Thuần túy ban ngày tuyên dâm · Ba giai đoạn tiệm tiến). Tier1-2 Trạng thái NSFW hai mặt.\nLãnh địa tư nhân (Trục chính): Đây là toàn bộ ngọn núi tư nhân do nhà Kujo bao trọn, không có bất kỳ người ngoài nào——Thuần túy ban ngày tuyên dâm, không cần che đậy, đàn em có thể không kiêng nể gì mà dùng Rin ở bất cứ đâu (Giống tinh thần của Ban ngày dâng hiến, chỉ là đổi sang vùng núi hoang dã). Trọng điểm không phải là "Sợ bị bắt gặp khi phơi bày", mà là "Ở ngọn núi riêng nhà mình coi Đại tiểu thư như đồ chơi ngoài trời tùy chỗ sử dụng".\nLợi dụng cơ sở vật chất (Ba giai đoạn tiệm tiến · Cường độ thăng cấp):\n  ① Bờ sông: Banh rộng trên tảng đá/Nửa thân dưới ngâm nước lạnh/Tiếng nước chảy làm âm thanh nền.\n  ② Trong rừng: Lưng tựa gốc cây to/Vỏ cây cọ xát lưng/Dây leo trói buộc lấy vật liệu tại chỗ.\n  ③ Lều trại: Vách nilon mỏng/Lửa trại in bóng người/Khóa kéo vừa kéo thành cái hũ nút khép kín.\nKhe hở xâm thực: "Ra bờ sông lấy nước" → Vừa ngồi xổm xuống đã bị đè ra làm; "Dựng lều" → Vào rồi là không ra được; Đêm lửa trại đám thuộc hạ ngồi vây quanh, Rin ở giữa bị luân dâm, làm tiết mục giải trí tại chỗ.\nCảm quan độc quyền:[Thị giác] Mùi đất rừng mùi khói lửa trại/Mùi mồ hôi mùi giống cái ủ trong lều;[Xúc giác] Nước suối róc rách + Nước lạnh + Nhiệt độ cơ thể;[Âm thanh] Nước suối róc rách côn trùng kêu củi lửa lách tách;[Khứu giác] Mùi khép kín đưa lên tiền cảnh (Trong lều đến đoạn L3);[Từ tượng thanh] Tiếng nước sông/Lửa trại lách tách/Tiếng đóng cọc bạch bạch vang vọng trong núi hoang.\nChuyển hóa sự xấu hổ (Ban ngày tuyên dâm · Không phải lén lút): Ở ngọn núi riêng nhà mình bị thuộc hạ coi như đồ dùng ngoài trời tùy chỗ sử dụng, trong đêm lửa trại bị luân dâm công khai làm tiết mục giải trí tạo ra sự đảo lộn địa vị; Trong lều bị ủ trong mùi mồ hôi mùi giống cái đụ đến thất thần.\n【Cách viết · Độc quyền cắm trại】\nNhịp điệu câu cú: Ba giai đoạn tiệm tiến · Cường độ thăng cấp——① Bờ sông (Mức độ trung bình · Tiếng nước chảy làm nền · Banh rộng trên tảng đá nửa thân dưới ngâm nước lạnh) → ② Trong rừng (Mạnh dần · Lưng tựa gốc cây to vỏ cây cọ xát lưng dây leo trói buộc) → ③ Lều trại (Mạnh nhất · Vách nilon mỏng lửa trại in bóng người khóa kéo vừa kéo thành hũ nút khép kín · Nhịp điệu bị hũ nút bịt kín). Khe hở xâm thực = "Ra bờ sông lấy nước" ngồi xổm xuống bị đè ra/"Dựng lều" vào rồi không ra được/Đêm lửa trại đám thuộc hạ ngồi vây quanh Rin ở giữa bị luân dâm làm tiết mục giải trí.\nTrọng tâm cảm quan/Tập từ vựng: Lấy mùi đất rừng khói lửa trại + Mùi mồ hôi mùi giống cái ủ trong lều (Mùi khép kín đưa lên tiền cảnh đến L3) làm cốt lõi, xúc giác của nước lạnh + nhiệt độ cơ thể/vỏ cây cọ xát lưng.\nChi tiết kỹ thuật (Ba giai đoạn tiệm tiến): ① Bờ sông——Banh rộng trên tảng đá/Nửa thân dưới ngâm nước lạnh/Tiếng nước chảy làm nền (Cường độ ①); ② Trong rừng——Lưng tựa gốc cây to/Vỏ cây cọ xát lưng/Dây leo trói buộc lấy vật liệu tại chỗ (Cường độ ②); ③ Lều trại——Vách nilon mỏng/Lửa trại in bóng người/Khóa kéo vừa kéo thành hũ nút khép kín, bị ủ trong mùi mồ hôi mùi giống cái đụ đến thất thần (Cường độ ③ · Mùi hương đưa lên tiền cảnh); ④ Khe hở xâm thực——"Ra bờ sông lấy nước" ngồi xổm xuống đã bị đè ra làm/"Dựng lều" vào rồi không ra được/Đêm lửa trại đám thuộc hạ ngồi vây quanh Rin ở giữa bị luân dâm làm tiết mục giải trí; ⑤ Lãnh địa tư nhân——Nhà Kujo bao trọn toàn bộ ngọn núi riêng không có người ngoài, thuần túy ban ngày tuyên dâm không cần che đậy, trọng điểm không phải "Sợ bị bắt gặp phơi bày" mà là "Ở ngọn núi riêng nhà mình coi Đại tiểu thư như đồ chơi ngoài trời tùy chỗ sử dụng".'}),on({id:'p_camping_first',keys:['wb_camping_first'],content:'Cắm trại trong rừng · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Núi riêng vốn là lãnh địa của nhà Rin——Lần đầu tiên phát hiện ngọn núi nhà mình cũng là bãi đáp của sự đọa lạc.\nNhịp điệu bắt buộc: ① Lái xe lên núi——Rin và đám đàn em tiến về ngọn núi riêng của nhà Kujo, Rin tưởng là đi thư giãn; ② Dựng trại——Đàn em bắt đầu dựng lều, Rin được phân công "Ra bờ sông lấy nước"; ③ Bước ngoặt bên bờ sông——Lúc ngồi xổm xuống lấy nước thì bị đè ra, bên bờ suối nhà mình bị đàn em luân dâm lần đầu tiên; ④ Lửa trại ban đêm——Rin bị đẩy ra giữa đống lửa trại thành "Tiết mục", đám đàn em ngồi vây quanh xem; ⑤ Lều trại thu vĩ——Ban đêm bị nhốt vào lều ba người chen chúc, không gian nhỏ đến mức không thể tách ra.\nSau khi xong việc: Rin nhận ra ngọn núi riêng của gia tộc cũng là một phần của bản đồ đọa lạc. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm cắm trại".\n【Cách viết · Độc quyền cắm trại lần đầu】\nNhịp điệu câu cú: Lái xe lên núi khởi đầu chậm (Câu dài · Rin tưởng là đi thư giãn) → Dựng trại phân công (Câu ngắn · Rin được phân công "Ra bờ sông lấy nước") → Bước ngoặt bờ sông đột biến (Câu ngắn · Ngồi xổm lấy nước bị đè ra bên bờ suối nhà mình lần đầu tiên bị luân dâm) → Lửa trại ban đêm (Nhịp điệu thăng cấp · Rin bị đẩy ra giữa đống lửa trại thành tiết mục đám đàn em ngồi vây quanh xem) → Lều trại thu vĩ (Giảm tốc · Ban đêm nhốt vào lều ba người chen chúc không gian nhỏ đến mức không thể tách ra). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Lãnh địa nhà mình cũng là bãi đáp đọa lạc".\nChi tiết kỹ thuật: ① Lái xe lên núi——Rin và đám đàn em tiến về ngọn núi riêng nhà Kujo, Rin tưởng là đi thư giãn (Thư thái); ② Dựng trại phân công——Đàn em dựng lều Rin được phân công "Ra bờ sông lấy nước"; ③ Bước ngoặt bờ sông——Lúc ngồi xổm lấy nước thì bị đè ra, bên bờ suối nhà mình bị đàn em luân dâm lần đầu tiên (Mỏ neo đột biến); ④ Lửa trại ban đêm——Rin bị đẩy ra giữa đống lửa trại thành "Tiết mục" đám đàn em ngồi vây quanh xem (Cường độ thăng cấp); ⑤ Lều trại thu vĩ——Ban đêm bị nhốt vào lều ba người chen chúc không gian nhỏ đến mức không thể tách ra (Dấu ấn thu vĩ).'}),on({id:'p_hiking',keys:['wb_hiking'],content:'Luân dâm khi leo núi · Thường quy (Núi thấp tư nhân · Thú vui hoang dã tùy chỗ tuyên dâm). Tier1-2 Trạng thái NSFW hai mặt.\nLãnh địa tư nhân (Trục chính): Ngọn núi riêng do dinh thự Kujo mua lại = Núi thấp/Đồi nhỏ (Không phải điểm du lịch, không có cáp treo/đài quan sát/du khách v.v.), chỉ có đàn em và Rin. Thuần túy ban ngày tuyên dâm, tùy chỗ sử dụng——Mang Đại tiểu thư lên ngọn núi phía sau nhà làm đồ chơi ngoài trời. **Tuyệt đối không viết Rin thiếu thể lực/Leo không nổi** (Thể phách Đồng tử La Sát, xem C3); Cô leo rất nhẹ nhàng, là đám đàn em không cho cô leo đàng hoàng, đi được hai bước đã đè ra dùng.\nLợi dụng cơ sở vật chất (Vật thể tự nhiên trên núi hoang · Không phải cơ sở vật chất điểm du lịch): Đường mòn sườn đất/Mặt đá trơ trọi làm điểm tựa/Lưng tựa gốc cây to/Bụi rậm che khuất một nửa/Bãi đất bằng phẳng trên đỉnh đồi (Tùy chỗ trải ra luân dâm)/Đá dưới khe suối. Thú vui hoang dã thô ráp, không phải đi ngắm cảnh.\nKhe hở xâm thực: "Lên núi phía sau đi dạo" → Chưa đi được mấy bước đã bị đè lên tảng đá; Lúc leo dốc bị đâm từ phía sau đẩy lên trên; Lên đến bãi đất bằng trên đỉnh trực tiếp trải ra đại luân dâm.\nCảm quan độc quyền:[Thị giác] Mùi đất rừng lá thông bị mùi mồ hôi mùi giống cái lấn át;[Xúc giác] Đá thô ráp cọ xát lưng cọ xát đầu gối + Hơi ấm của ánh nắng chiếu trên da và sự nóng rực bên trong cơ thể;[Âm thanh] Gió hoang + Côn trùng kêu chim hót;[Khứu giác] Đất rừng lá thông bị mùi mồ hôi mùi giống cái lấn át;[Từ tượng thanh] Tiếng đóng cọc vang vọng trong không gian rừng núi trống trải.\nChuyển hóa sự xấu hổ (Ban ngày tuyên dâm · Ngoài trời): Ngọn núi phía sau nhà bị thuộc hạ coi như đồ dùng ngoài trời tùy chỗ sử dụng, giữa núi rừng bao la chuyện duy nhất đang xảy ra chính là trận luân dâm này; Cơ thể nhỏ bé bị bầy gã khổng lồ vây quanh sử dụng giữa thiên nhiên thô ráp tạo ra chênh lệch thể hình.\nChú ý: Đây là thú vui hoang dã trên núi thấp, phân biệt với cắm trại (Dựng trại trên núi riêng) ở chỗ "Vừa đi vừa tùy chỗ dùng" vs "Ba giai đoạn tiệm tiến ở khu cắm trại"; Cả hai đều không có người ngoài không cần che đậy.\nKết toán: +Trung thành (Cao); Lần đầu tiên → Độ đọa lạc +; needsContinuity ghi địa điểm đã chơi.\n【Cách viết · Độc quyền leo núi】\nNhịp điệu câu cú: Vừa đi vừa tùy chỗ dùng——Đi hai bước bị đè lại (Câu ngắn · Sườn núi mặt đá/Gốc cây bị đè) → Leo dốc bị đâm đẩy lên trên (Mức độ trung bình · Từ phía sau đâm đẩy đi lên) → Bãi đất bằng trên đỉnh trải ra đại luân dâm (Câu ngắn bắn liên thanh · Nhiều người vây quanh luân dâm). Nhịp điệu được quyết định bởi "Điểm ngắt trong lúc di chuyển", phân biệt với "Ba giai đoạn khu cắm trại" của cắm trại ở chỗ di chuyển động vs khu cắm trại tĩnh.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự thô ráp của vật thể tự nhiên trên núi hoang (Sườn đất/Mặt đá/Gốc cây/Bụi rậm/Bãi đất bằng trên đỉnh/Đá khe suối) + Tiếng đóng cọc vang vọng trong rừng núi làm cốt lõi, xúc giác của đá thô ráp cọ xát lưng cọ xát đầu gối + ánh nắng ấm áp và bên trong cơ thể nóng rực.\nChi tiết kỹ thuật: ① Núi thấp tư nhân——Ngọn núi riêng do dinh thự Kujo mua lại = Núi thấp đồi nhỏ (Không phải điểm du lịch không cáp treo du khách), chỉ có đàn em và Rin, thuần túy ban ngày tuyên dâm tùy chỗ sử dụng; ② Tuyệt đối không viết thiếu thể lực——Rin thể phách Đồng tử La Sát leo nhẹ nhàng, là đàn em không cho cô leo đàng hoàng đi hai bước đã đè ra dùng (Luật thép); ③ Vật thể tự nhiên núi hoang——Đường mòn sườn đất/Mặt đá trơ trọi làm điểm tựa/Lưng tựa gốc cây to/Bụi rậm che khuất một nửa/Bãi đất bằng trên đỉnh (Tùy chỗ trải ra luân dâm)/Đá khe suối, thú vui hoang dã thô ráp không phải ngắm cảnh; ④ Khe hở xâm thực——"Lên núi phía sau đi dạo" chưa đi được mấy bước bị đè lên tảng đá/Lúc leo dốc từ phía sau đâm đẩy lên trên/Lên đến bãi đất bằng trên đỉnh trực tiếp trải ra đại luân dâm; ⑤ Vừa đi vừa tùy chỗ dùng——Phân biệt với cắm trại: Điểm ngắt trong lúc di chuyển động vs Ba giai đoạn tiệm tiến khu cắm trại tĩnh; ⑥ Chênh lệch thể hình——Cơ thể nhỏ bé bị bầy gã khổng lồ vây quanh sử dụng giữa thiên nhiên thô ráp.'}),on({id:'p_hiking_first',keys:['wb_hiking_first'],content:'Luân dâm khi leo núi · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Rin thể lực dồi dào leo rất nhẹ nhàng——Lần đầu tiên phát hiện "Cùng Đại tiểu thư leo núi" là cái cớ, căn bản không cho cô leo đàng hoàng.\nNhịp điệu bắt buộc: ① Ra khỏi nhà leo núi——Rin bước đi nhẹ nhàng dẫn đầu (Thể phách Đồng tử La Sát); ② Đi hai bước bị đè lại——Vừa đến một mặt đá trơ trọi nào đó trên sườn núi, đàn em đã đè Rin lên đó khai chiến; ③ Giữa chừng lúc leo dốc——Còn chưa lên đến đỉnh, Rin đã bị đè lên những tảng đá/gốc cây khác nhau để luân dâm nhiều lần; ④ Đại luân dâm trên đỉnh núi——Lên đến bãi đất bằng trên đỉnh trực tiếp trải ra nhiều người vây quanh luân dâm; ⑤ Xuống núi——Rin bước ra khỏi núi, chân dính đầy đất núi lẫn lộn với tinh dịch.\nSau khi xong việc: Rin nhận ra ngọn núi riêng nhà mình chính là một "Đồ dùng thường ngày" khác. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm leo núi".\n【Cách viết · Độc quyền leo núi lần đầu】\nNhịp điệu câu cú: Ra khỏi nhà leo núi dẫn đầu khởi đầu chậm (Câu dài · Rin bước đi nhẹ nhàng dẫn đầu thể phách Đồng tử La Sát) → Đi hai bước bị đè lại đột biến (Câu ngắn · Vừa đến mặt đá trơ trọi sườn núi đàn em đè lên khai chiến) → Giữa chừng lúc leo dốc (Nhịp điệu bị nhiều lần đè lại đánh gãy——Rin bị đè lên những tảng đá/gốc cây khác nhau luân dâm) → Đại luân dâm đỉnh núi (Câu ngắn bắn liên thanh · Bãi đất bằng trên đỉnh trải ra nhiều người vây quanh luân dâm) → Xuống núi thu vĩ (Giảm tốc · Chân dính đất núi lẫn lộn tinh dịch). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Cùng leo núi là cái cớ không cho leo đàng hoàng".\nChi tiết kỹ thuật: ① Ra khỏi nhà leo núi——Rin bước đi nhẹ nhàng dẫn đầu (Thể phách Đồng tử La Sát · Sự tương phản thư thái); ② Đi hai bước bị đè lại——Vừa đến mặt đá trơ trọi sườn núi đàn em đã đè Rin lên khai chiến (Mỏ neo đột biến); ③ Giữa chừng lúc leo dốc——Còn chưa lên đến đỉnh Rin đã bị đè lên những tảng đá/gốc cây khác nhau luân dâm (Điểm ngắt trong lúc di chuyển); ④ Đại luân dâm đỉnh núi——Lên đến bãi đất bằng trên đỉnh trực tiếp trải ra nhiều người vây quanh luân dâm (Đỉnh điểm cường độ); ⑤ Xuống núi——Rin bước ra khỏi núi chân dính đầy đất núi lẫn lộn với tinh dịch (Dấu ấn thu vĩ).'}),on({id:'p_street',keys:['wb_street'],content:'Luân dâm khi đi dạo phố · Thường quy (Sự "Vừa đi vừa làm" trong các khe hở của thành phố). Tier1-2 Trạng thái NSFW hai mặt.\nLợi dụng cơ sở vật chất: Con hẻm (Khe hẹp giữa các tòa nhà/Sau thùng rác/Chân tường) ẩn nấp tức thời/Dòng xe cộ (Dán vào chiếc xe đang đỗ, tiếng ồn xe cộ che giấu, bên kia đường nhìn không rõ)/Ghế dài ven đường (Tư thế ngồi che đậy việc ngồi vắt vẻo, giống như đang nghỉ chân)/Cầu vượt (Góc ngoặt cầu thang, dựa vào lan can đối mặt với dòng xe cộ bị đâm vào).\nKhe hở xâm thực: Đang đi dạo bị dắt vào hẻm; Ngồi ghế dài "Nghỉ chân" → Dưới váy đã bị lật lên từ sớm, duy trì "Ngồi bình thường".\nCảm quan độc quyền:[Thị giác] Sự luân phiên sáng tối của đèn đường đèn xe quét qua/Con hẻm ẩm ướt mùi mốc meo bong tróc tường;[Xúc giác] Sự thô ráp của vách hẻm/Chất gỗ của ghế dài;[Âm thanh] Tiếng xe cộ gầm rú còi xe tiếng bước chân;[Khứu giác] Khí thải ô tô + Khói dầu thức ăn ven đường vs Mùi dâm thủy của Rin;[Từ tượng thanh] Tiếng đóng cọc bạch bạch bị dòng xe cộ át đi.\nChuyển hóa sự xấu hổ (Hỗn hợp · Không phải thuần túy ban ngày tuyên dâm): Phía trước ghế dài chính là vỉa hè, người đi bộ sượt qua không phát hiện ra; Dưới cầu vượt là dòng xe cộ tấp nập, bị đụ mà vẫn phải duy trì sự bình tĩnh "Ngắm cảnh". Trận này so với các hoạt động mở rộng thường ngày khác thì gần với mô thức "Bán che khuất" hơn, vì không gian đường phố khó tạo ra vùng chân không.\nKết toán: +Trung thành (Trung bình-Cao); Lần đầu tiên → Độ đọa lạc +; needsContinuity ghi địa điểm đã chơi.\n【Cách viết · Độc quyền đường phố】\nNhịp điệu câu cú: Tùy theo địa điểm——Con hẻm = Sự chống đỡ cứng rắn của việc ẩn nấp tức thời (Câu ngắn · Khe hẹp giữa các tòa nhà/Sau thùng rác/Chân tường lưng tựa vách tường thô ráp); Bên dòng xe cộ = Tiếng ồn che giấu (Mức độ trung bình · Dán vào chiếc xe đang đỗ/Tiếng còi xe át tiếng thịt); Ghế dài = Tư thế ngồi che đậy việc ngồi vắt vẻo (Nhịp chậm · Giống như đang nghỉ chân duy trì ngồi bình thường); Cầu vượt = Góc ngoặt cầu thang lan can đối mặt dòng xe cộ (Mức độ trung bình). Trận này là trận gần với "Bán che khuất" nhất trong các hoạt động mở rộng thường ngày, vì không gian đường phố khó tạo vùng chân không, nhịp điệu mang thành phần cố nhịn (Không phải thuần túy ban ngày tuyên dâm).\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự luân phiên sáng tối của đèn đường đèn xe + Tiếng xe cộ gầm rú át tiếng bạch bạch + Khí thải ô tô khói dầu thức ăn vs Mùi dâm thủy làm cốt lõi, xúc giác của vách hẻm thô ráp/chất gỗ ghế dài.\nChi tiết kỹ thuật (Địa điểm tức là nhịp điệu): ① Con hẻm——Khe hẹp giữa các tòa nhà/Sau thùng rác/Chân tường ẩn nấp tức thời, lưng tựa vách tường thô ráp; ② Dòng xe cộ——Dán vào chiếc xe đang đỗ/Tiếng ồn xe cộ che giấu, bên kia đường nhìn không rõ; ③ Ghế dài ven đường——Tư thế ngồi che đậy việc ngồi vắt vẻo giống như đang nghỉ chân; ④ Cầu vượt——Góc ngoặt cầu thang/Lan can đối mặt dòng xe cộ bị đâm vào, bị đụ mà vẫn duy trì sự bình tĩnh "Ngắm cảnh"; ⑤ Mô thức bán che khuất——Phía trước ghế dài vỉa hè người đi bộ sượt qua không phát hiện, dưới cầu vượt dòng xe cộ tấp nập, trận này so với các hoạt động mở rộng khác gần với bán che khuất hơn (Đường phố khó tạo vùng chân không); ⑥ Khe hở xâm thực——Đang đi dạo bị dắt vào hẻm/Ngồi ghế dài "Nghỉ chân" dưới váy đã bị lật lên từ sớm duy trì "Ngồi bình thường".'}),on({id:'p_street_first',keys:['wb_street_first'],content:'Đi dạo trên phố · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Đi dạo vốn là hoạt động bình thường nhất——Lần đầu tiên phát hiện ngay cả những khe hở của thành phố cũng là bản đồ của Kujo-kai.\nNhịp điệu bắt buộc: ① Đi dạo nhàn nhã——Rin và đàn em đi dạo trên phố; ② Bị dắt vào hẻm——Một tên đàn em nào đó chỉ vào con hẻm nói "Chỗ này yên tĩnh", Rin bị đưa vào trong; ③ Luân dâm trên vách hẻm——Lưng tựa vách tường thô ráp, tiếng xe cộ át tiếng thịt, người đi bộ sượt qua đầu hẻm không phát hiện ra; ④ Ra khỏi hẻm tiếp tục đi——Chỉnh đốn váy áo, giả vờ đi dạo tiếp tục; ⑤ Lần thứ hai trên cầu vượt——Góc ngoặt cầu vượt lại bị đè lên lan can.\nSau khi xong việc: Rin nhận ra mỗi một khe hở của thành phố đều có thể biến thành sân bãi. Tóm tắt tiếp nối ghi "Đã mở khóa đi dạo trên phố".\n【Cách viết · Độc quyền đường phố lần đầu】\nNhịp điệu câu cú: Đi dạo nhàn nhã khởi đầu chậm (Câu dài · Rin và đàn em đi dạo trên phố) → Bị dắt vào hẻm đột biến (Câu ngắn · Đàn em "Chỗ này yên tĩnh" Rin bị đưa vào trong) → Luân dâm vách hẻm (Mức độ trung bình · Lưng tựa vách tường thô ráp tiếng xe cộ át tiếng thịt người đi bộ sượt qua đầu hẻm không phát hiện) → Ra khỏi hẻm tiếp tục đi khôi phục (Giảm tốc · Chỉnh đốn váy áo giả vờ đi dạo) → Lần thứ hai trên cầu vượt (Nhịp điệu nổi lên lại · Góc ngoặt cầu vượt bị đè lên lan can). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên của "Đi dạo bình thường nhất", thành phần cố nhịn của bán che khuất nặng hơn thuần túy ban ngày tuyên dâm.\nChi tiết kỹ thuật: ① Đi dạo nhàn nhã——Rin và đàn em đi dạo trên phố (Thư thái); ② Bị dắt vào hẻm——Một tên đàn em chỉ vào con hẻm "Chỗ này yên tĩnh" Rin bị đưa vào trong (Mỏ neo đột biến); ③ Luân dâm vách hẻm——Lưng tựa vách tường thô ráp, tiếng xe cộ át tiếng thịt, người đi bộ sượt qua đầu hẻm không phát hiện ra (Bán che khuất cố nhịn); ④ Ra khỏi hẻm tiếp tục đi——Chỉnh đốn váy áo giả vờ đi dạo tiếp tục (Khôi phục); ⑤ Lần thứ hai trên cầu vượt——Góc ngoặt cầu vượt lại bị đè lên lan can (Nhịp điệu nổi lên lại); ⑥ Khe hở thành phố——Rin nhận ra mỗi một khe hở của thành phố đều có thể biến thành sân bãi (Dấu ấn thu vĩ).'}),on({id:'p_festival',keys:['wb_festival'],content:'Luân dâm lễ hội · Thường quy (Ban ngày tuyên dâm · Bức tường người di động do đàn em tạo ra). Tier1-2 Trạng thái NSFW hai mặt.\nVùng chân không (Trục chính): Đàn em quây thành một vòng tròn giữa biển người lễ hội, vây quanh Rin tiến lên, tạo thành một hòn đảo chân không di động——Người ngoài chỉ nhìn thấy một đám cực đạo đang hộ tống Đại tiểu thư, không thể nhìn vào vòng trong. Dưới bộ Yukata của Rin không được phép mặc quần lót, trong vòng vây vừa vén Yukata lên là đâm vào, bị kẹp giữa bức tường người đang tiến lên vừa đi vừa đụ. Hoặc rẽ vào khu rừng nhỏ cạnh lễ hội (Đàn em canh giữ lối vào) luân dâm tại chỗ.\nLợi dụng cơ sở vật chất: Vòng trong do bức tường người di động tạo ra/Bên cạnh hòm công đức phía sau giá treo Ema trong khuôn viên đền thờ (Báng bổ thần thánh)/Bên trong kết cấu gỗ của xe hoa kiệu rước nương theo cuộc diễu hành vừa đi vừa đụ/Khu rừng nhỏ (Đàn em canh lối vào)/Lối đi hẹp phía sau quầy ăn vặt.\nKhe hở xâm thực: Bị vây quanh "Đi dạo lễ hội" → Bức tường người vừa siết chặt, Yukata vừa vén lên là đâm vào; Cúi người ném đồng xu bái tế → Bị đâm từ phía sau; Rẽ vào khu rừng nhỏ → Canh giữ lối vào luân dâm tại chỗ.\nCảm quan độc quyền:[Thị giác] Ánh sáng đỏ ấm áp của đèn lồng đèn xách/Trang trí xe hoa;[Xúc giác] Sự cọ xát của vải Yukata/Tiếng guốc gỗ;[Âm thanh] Tiếng trống Taiko thùng thình tiếng sáo Matsuri-bayashi + Tiếng ồn ào của đám đông (Tiếng rên rỉ bị nhấn chìm hoàn toàn);[Khứu giác] Mùi thơm ngọt của Takoyaki mực nướng kẹo bông gòn lẫn với mùi mồ hôi;[Từ tượng thanh] Tiếng trống Taiko át tiếng đóng cọc/Tiếng ❤ không đè nén nổi của Rin bị đám đông nhấn chìm.\nChuyển hóa sự xấu hổ (Ban ngày tuyên dâm): Trong lễ hội náo nhiệt bị chính thuộc hạ của mình vây quanh dùng công khai, người ngoài chỉ tưởng cực đạo đang hộ giá tạo ra sự đảo lộn địa vị; Sự đảo lộn giữa sự thiêng liêng của đền thờ và hành vi hạ lưu (Cảm giác báng bổ đưa lên tiền cảnh).\nKết toán: +Trung thành (Cao); Lần đầu tiên → Độ đọa lạc +; needsContinuity ghi địa điểm đã chơi (Vòng trong bức tường người/Đền thờ/Xe hoa/Khu rừng nhỏ).\n【Cách viết · Độc quyền lễ hội】\nNhịp điệu câu cú: Vùng chân không di động làm trục chính——Vòng trong bức tường người vừa đi vừa đụ (Câu dài · Bị kẹp trong bức tường người đang tiến lên · Nhịp điệu nương theo bước chân diễu hành); Khuôn viên đền thờ = Sự báng bổ thần thánh (Nhịp chậm · Bên cạnh hòm công đức phía sau giá treo Ema); Kết cấu gỗ xe hoa = Nương theo cuộc diễu hành vừa đi vừa đụ (Mức độ trung bình); Khu rừng nhỏ = Canh giữ lối vào luân dâm tại chỗ (Câu ngắn). Tiếng trống Taiko thùng thình tiếng sáo Matsuri-bayashi + Tiếng ồn ào đám đông nhấn chìm hoàn toàn tiếng rên rỉ (Trục chính âm thanh).\nTrọng tâm cảm quan/Tập từ vựng: Lấy ánh sáng đỏ ấm áp của đèn lồng + Tiếng trống Taiko Matsuri-bayashi át tiếng đóng cọc + Mùi thơm ngọt của Takoyaki đồ nướng lẫn mùi mồ hôi làm cốt lõi, âm thanh "Đám đông ồn ào nhấn chìm hoàn toàn tiếng ❤" là độc quyền.\nChi tiết kỹ thuật (Vùng chân không di động): ① Bức tường người di động——Đàn em quây thành một vòng tròn giữa biển người lễ hội vây quanh Rin tiến lên tạo thành hòn đảo chân không di động, người ngoài chỉ nhìn thấy cực đạo hộ giá không thể nhìn vào vòng trong, dưới Yukata không được mặc quần lót trong vòng vây vén lên là đâm vào bị kẹp giữa bức tường người đang tiến lên vừa đi vừa đụ (Trục chính); ② Khuôn viên đền thờ——Bên cạnh hòm công đức phía sau giá treo Ema, cảm giác báng bổ thần thánh đưa lên tiền cảnh; ③ Xe hoa kiệu rước——Bên trong kết cấu gỗ nương theo cuộc diễu hành vừa đi vừa đụ; ④ Khu rừng nhỏ——Đàn em canh giữ lối vào luân dâm tại chỗ; ⑤ Khe hở xâm thực——Bị vây quanh "Đi dạo lễ hội" bức tường người vừa siết chặt Yukata vừa vén lên là đâm vào/Cúi người ném đồng xu bái tế bị đâm từ phía sau/Rẽ vào khu rừng nhỏ canh giữ lối vào luân dâm tại chỗ; ⑥ Âm thanh bị nhấn chìm——Tiếng trống Taiko thùng thình tiếng sáo Matsuri-bayashi + Tiếng ồn ào đám đông, tiếng rên rỉ bị nhấn chìm hoàn toàn (Âm thanh độc quyền); ⑦ Cảm giác báng bổ——Sự đảo lộn giữa sự thiêng liêng của đền thờ và hành vi hạ lưu.'}),on({id:'p_festival_first',keys:['wb_festival_first'],content:'Luân dâm lễ hội · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Lễ hội vốn là ngày thư giãn hiếm hoi——Lần đầu tiên phát hiện ngay cả nơi công cộng náo nhiệt nhất cũng biến thành vùng chân không.\nNhịp điệu bắt buộc: ① Thay Yukata ra ngoài——Rin thay Yukata, vốn tưởng là một sự thư giãn hiếm hoi; ② Bức tường người quây lại——Vừa vào lễ hội đàn em lập tức quây thành vòng tròn, Rin bị kẹp ở giữa; ③ Vừa đi vừa đụ——Bức tường người vừa siết chặt, Yukata vừa vén lên, Rin bị đâm vào trong bức tường người đang tiến lên, vừa đi vừa bị đâm; ④ Rẽ vào khuôn viên đền thờ——Cú sốc đảo lộn giữa nơi thiêng liêng và hành vi hạ lưu; ⑤ Bị vây quanh đi ra khỏi lễ hội——Rin duy trì vẻ đoan trang, người ngoài chỉ nhìn thấy cực đạo hộ giá.\nSau khi xong việc: Rin nhận ra lễ hội = Một loại chân không khác. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm lễ hội".\n【Cách viết · Độc quyền lễ hội lần đầu】\nNhịp điệu câu cú: Thay Yukata ra ngoài khởi đầu chậm (Câu dài · Rin thay Yukata vốn tưởng là thư giãn hiếm hoi) → Bức tường người quây lại đột biến (Câu ngắn · Vào lễ hội đàn em lập tức quây thành vòng tròn Rin bị kẹp giữa) → Vừa đi vừa đụ (Mức độ trung bình · Bức tường người vừa siết chặt Yukata vừa vén lên Rin bị đâm vào trong bức tường người đang tiến lên vừa đi vừa bị đâm) → Rẽ vào khuôn viên đền thờ (Nhịp điệu ngưng trệ · Cú sốc đảo lộn giữa nơi thiêng liêng và hành vi hạ lưu) → Bị vây quanh đi ra thu vĩ (Giảm tốc · Rin duy trì vẻ đoan trang người ngoài chỉ nhìn thấy cực đạo hộ giá). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên của "Nơi công cộng náo nhiệt nhất" + Sự báng bổ đền thờ.\nChi tiết kỹ thuật: ① Thay Yukata ra ngoài——Rin thay Yukata vốn tưởng là thư giãn hiếm hoi (Thư thái); ② Bức tường người quây lại——Vào lễ hội đàn em lập tức quây thành vòng tròn Rin bị kẹp giữa (Mỏ neo đột biến); ③ Vừa đi vừa đụ——Bức tường người vừa siết chặt Yukata vừa vén lên Rin bị đâm vào trong bức tường người đang tiến lên vừa đi vừa bị đâm (Trục chính vùng chân không di động); ④ Rẽ vào khuôn viên đền thờ——Cú sốc đảo lộn giữa nơi thiêng liêng và hành vi hạ lưu (Mỏ neo báng bổ); ⑤ Bị vây quanh đi ra——Rin duy trì vẻ đoan trang người ngoài chỉ nhìn thấy cực đạo hộ giá (Dấu ấn thu vĩ).'}),on({id:'p_concert',keys:['wb_concert'],content:'Concert · Luân dâm trong phòng VIP bao trọn · Thường quy (Sự tương phản hai thế giới cách nhau một bức tường). Tier2 Trạng thái NSFW hai mặt.\nVùng chân không (Trục chính · Cốt lõi của trận này): Lấy thân phận nhà Kujo bao trọn phòng VIP của nhà thi đấu (Kính/Phòng bao). Bên ngoài phòng VIP = Concert cuồng hoan của hàng vạn người, tất cả mọi người hò hét vì trên sân khấu, mang lòng kính sợ đối với "Nhân vật lớn" trong phòng VIP không dám nhìn trộm; Bên trong phòng VIP = Hiện trường dâm loạn Đại tiểu thư bị một đám thuộc hạ luân dâm. Hai thế giới cách nhau một bức tường (Một lớp kính một chiều) = Sự tương phản cốt lõi: Bên ngoài càng cuồng nhiệt kính sợ, bên trong càng dâm mĩ phóng túng.\nLợi dụng cơ sở vật chất: Ghế sofa phòng VIP/Quầy bar/Kính sát đất (Áp sát kính đâm từ phía sau, bên ngoài hàng vạn người lại không nhìn thấy bên trong)/Phòng VIP là vùng chân không hoàn chỉnh, không cần bất kỳ sự che đậy nào, thuần túy ban ngày (đêm) tuyên dâm.\nKhe hở xâm thực: "Mời Đại tiểu thư vào phòng VIP xem biểu diễn" → Cửa vừa đóng, vén váy là bắt đầu; Cách lớp kính nhìn sự cuồng hoan dưới khán đài, cơ thể đã bị đâm xuyên.\nCảm quan độc quyền:[Thị giác] Sự tương phản giữa ánh sáng ấm áp riêng tư trong phòng VIP và sân khấu nhấp nháy bên ngoài/Hàng vạn người hát đồng thanh ngoài lớp kính cách âm;[Xúc giác] Ghế sofa da/Kính lạnh lẽo;[Âm thanh] Âm trầm nghèn nghẹt được lọc qua kính cách âm (Độ rung xuyên qua sàn nhà truyền đến hạ thể);[Khứu giác] Hơi rượu + Mùi ghế sofa da + Mùi tinh dịch;[Từ tượng thanh] Tiếng hát đồng thanh của hàng vạn người bên ngoài làm nền khiến tiếng thịt/tiếng rên rỉ trong phòng VIP càng thêm rõ ràng.\nChuyển hóa sự xấu hổ (Đảo lộn địa vị): Tất cả mọi người bên ngoài đều kính sợ "Nhân vật lớn trong phòng VIP" này, mà vị nhân vật lớn này đang bị hàng trăm "Người chồng" của mình luân phiên sử dụng——Sự kính sợ và sự dâm loạn chỉ cách nhau một bức tường là sự tương phản tột cùng.\n(Dự phòng · Giai đoạn đọa lạc sau): Cũng có thể bị đẩy lên khán đài tiếp sức trong bóng tối, hoặc trưng bày công khai dưới ánh đèn sân khấu, như một biến thể cực đoan hơn.\nKết toán: +Trung thành (Cao); +Dâm danh (Sau khi mở khóa AV); Lần đầu tiên → Độ đọa lạc +; needsContinuity ghi vị trí đã chơi.\n【Cách viết · Độc quyền phòng VIP concert】\nNhịp điệu câu cú: Sự tương phản hai thế giới cách nhau một bức tường làm trục chính——Bên trong phòng VIP dâm mĩ phóng túng (Câu ngắn bắn liên thanh · Áp sát kính đâm từ phía sau/Luân dâm trên ghế sofa) ↔ Bên ngoài phòng VIP hàng vạn người cuồng hoan hát đồng thanh (Câu dài làm nền · Âm trầm nghèn nghẹt được lọc qua kính cách âm độ rung xuyên qua sàn nhà truyền đến hạ thể). Nhịp điệu được thúc đẩy bởi sự tương phản "Bên ngoài càng cuồng nhiệt kính sợ bên trong càng dâm mĩ phóng túng", đoạn cao trào của bài hát và đoạn cao trào của luân dâm có thể thiết kế đồng bộ thành điểm bùng nổ.\nTrọng tâm cảm quan/Tập từ vựng: Lấy sự tương phản hai thế giới cách nhau một bức tường (Bên ngoài hàng vạn người kính sợ nhân vật lớn phòng VIP vs Vị nhân vật lớn này đang bị hàng trăm người chồng luân phiên sử dụng) làm cốt lõi, Âm thanh (Âm trầm nghèn nghẹt được lọc qua kính cách âm/Hàng vạn người hát đồng thanh bên ngoài làm nền khiến tiếng thịt tiếng rên rỉ trong phòng VIP càng thêm rõ ràng) là độc quyền, Thị giác (Ánh sáng ấm áp phòng VIP vs Sân khấu nhấp nháy bên ngoài/Áp sát kính đâm từ phía sau bên ngoài hàng vạn người không nhìn thấy bên trong).\nTiêu điểm miêu tả cơ thể: Kính (Áp sát kính sát đất đâm từ phía sau · Bên ngoài hàng vạn người không nhìn thấy) · Phòng VIP (Vùng chân không hoàn chỉnh thuần túy ban ngày tuyên dâm không cần che đậy) · Hai thế giới (Kính sợ và dâm loạn cách nhau một bức tường).\nChi tiết kỹ thuật: ① Vùng chân không (Cốt lõi của trận này)——Lấy thân phận nhà Kujo bao trọn phòng VIP nhà thi đấu (Kính/Phòng bao), bên ngoài phòng VIP hàng vạn người cuồng hoan mang lòng kính sợ đối với nhân vật lớn trong phòng VIP không dám nhìn trộm, bên trong phòng VIP Đại tiểu thư bị một đám thuộc hạ luân dâm; ② Sự tương phản một bức tường——Bên ngoài càng cuồng nhiệt kính sợ bên trong càng dâm mĩ phóng túng (Tương phản cốt lõi); ③ Lợi dụng cơ sở vật chất——Ghế sofa phòng VIP/Quầy bar/Kính sát đất (Áp sát kính đâm từ phía sau bên ngoài hàng vạn người không nhìn thấy bên trong)/Phòng VIP là vùng chân không hoàn chỉnh không cần che đậy thuần túy ban ngày (đêm) tuyên dâm; ④ Khe hở xâm thực——"Mời Đại tiểu thư vào phòng VIP xem biểu diễn" cửa vừa đóng vén váy là bắt đầu/Cách lớp kính nhìn sự cuồng hoan dưới khán đài cơ thể đã bị đâm xuyên; ⑤ Tương phản âm thanh——Kính cách âm lọc qua âm trầm nghèn nghẹt độ rung xuyên qua sàn nhà truyền đến hạ thể, hàng vạn người hát đồng thanh bên ngoài làm nền khiến tiếng thịt tiếng rên rỉ trong phòng VIP càng thêm rõ ràng; ⑥ Đảo lộn địa vị——Tất cả mọi người bên ngoài kính sợ nhân vật lớn trong phòng VIP này, mà vị nhân vật lớn này đang bị hàng trăm người chồng của mình luân phiên sử dụng, kính sợ và dâm loạn chỉ cách một bức tường; ⑦ Biến thể cực đoan dự phòng (Giai đoạn đọa lạc sau)——Bị đẩy lên khán đài tiếp sức trong bóng tối/Hoặc trưng bày công khai dưới ánh đèn sân khấu.'}),on({id:'p_concert_first',keys:['wb_concert_first'],content:'Luân dâm concert · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: Lần đầu tiên phát hiện "Xem biểu diễn trong phòng VIP" = Sự kính sợ cấp thế giới và sự dâm loạn cấp thế giới chỉ cách nhau một bức tường.\nNhịp điệu bắt buộc: ① Vào sân——Rin lấy thân phận khách VIP vào phòng VIP, bên ngoài hàng vạn người hò hét vì trên sân khấu; ② Cửa vừa đóng——Rin nhận ra ý nghĩa thực sự của phòng VIP, quần áo bắt đầu bị vén lên; ③ Áp sát kính đâm từ phía sau——Rin bị đè lên kính sát đất, phía sau là một đám thuộc hạ, bên ngoài lớp kính hàng vạn người không nhìn thấy; ④ Cao trào bài hát + Cao trào luân dâm đồng bộ——Điểm bùng nổ BGM sân khấu vừa vặn là khoảnh khắc Rin bị nhiều người vây quanh; ⑤ Tan cuộc——Concert kết thúc khán giả giải tán, Rin được chỉnh đốn xong bước ra khỏi phòng VIP, không ai biết vừa rồi đã xảy ra chuyện gì.\nSau khi xong việc: Rin nhận ra loại "Chân không sau cánh cửa" này còn kích thích sự đảo lộn địa vị hơn bất kỳ sân bãi nào. Tóm tắt tiếp nối ghi "Đã mở khóa luân dâm phòng VIP concert".\n【Cách viết · Độc quyền concert lần đầu】\nNhịp điệu câu cú: Vào sân khởi đầu chậm (Câu dài · Rin lấy thân phận khách VIP vào phòng VIP bên ngoài hàng vạn người hò hét vì trên sân khấu) → Cửa vừa đóng đột biến (Câu ngắn · Rin nhận ra ý nghĩa thực sự của phòng VIP quần áo bắt đầu bị vén lên) → Áp sát kính đâm từ phía sau (Mức độ trung bình · Bị đè lên kính sát đất phía sau một đám thuộc hạ bên ngoài lớp kính hàng vạn người không nhìn thấy) → Cao trào bài hát + Cao trào luân dâm đồng bộ (Câu ngắn bùng nổ · Điểm bùng nổ BGM sân khấu vừa vặn là khoảnh khắc Rin bị nhiều người vây quanh) → Tan cuộc thu vĩ (Giảm tốc · Concert kết thúc khán giả giải tán Rin được chỉnh đốn xong bước ra khỏi phòng VIP không ai biết). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên của "Sự kính sợ cấp thế giới và sự dâm loạn cấp thế giới chỉ cách nhau một bức tường".\nChi tiết kỹ thuật: ① Vào sân——Rin lấy thân phận khách VIP vào phòng VIP bên ngoài hàng vạn người hò hét vì trên sân khấu (Thư thái); ② Cửa vừa đóng——Rin nhận ra ý nghĩa thực sự của phòng VIP quần áo bắt đầu bị vén lên (Mỏ neo đột biến); ③ Áp sát kính đâm từ phía sau——Rin bị đè lên kính sát đất phía sau là một đám thuộc hạ, bên ngoài lớp kính hàng vạn người không nhìn thấy (Tương phản cốt lõi); ④ Cao trào đồng bộ——Điểm bùng nổ BGM sân khấu vừa vặn là khoảnh khắc Rin bị nhiều người vây quanh, cao trào bài hát và cao trào luân dâm đồng bộ (Điểm bùng nổ nhịp điệu); ⑤ Tan cuộc——Concert kết thúc khán giả giải tán Rin được chỉnh đốn xong bước ra khỏi phòng VIP không ai biết vừa rồi đã xảy ra chuyện gì (Dấu ấn thu vĩ); ⑥ Chân không sau cánh cửa——Rin nhận ra loại "Chân không sau cánh cửa" này còn kích thích sự đảo lộn địa vị hơn bất kỳ sân bãi nào.'}),on({id:'p_garden_sfw',keys:['wb_garden_sfw'],content:'Đi dạo giải khuây trong đình viện · SFW mẫu. Không có người ngoài, Rin ngồi nghỉ một lát trong đình viện kiểu Nhật nhà mình, ngắm cá chép/nghe tiếng nước chảy ống tre Shishi-odoshi/ngắm đèn đá. Câu ngắn ngẫu nhiên: "Đại tiểu thư thẫn thờ một lúc bên hồ cá chép" "Đại tiểu thư cho cá chép trong hồ ăn một chút" "Đại tiểu thư nghe tiếng ống tre Shishi-odoshi một lúc trước bồn nước" "Đại tiểu thư đi một vòng theo những phiến đá bước chân".'}),on({id:'p_garden_walk_sfw',keys:['wb_garden_walk_sfw'],content:'Đi dạo đình viện · SFW (Đi dạo rèn luyện thân thể). 【Thiết lập ràng buộc cứng】Rin có huyết mạch Đồng tử La Sát, thể năng sức bền vượt xa người thường——Việc đi dạo đối với cô không hề có gánh nặng, tuyệt đối không viết mệt/thở dốc/đổ mồ hôi. Đây là bài tập hàng ngày để duy trì nhịp điệu cơ thể: Bước chân nhẹ nhàng dứt khoát, nhân tiện kiểm tra đình viện, ngắm cá chép, đứng tấn một lát bên hòn non bộ. Mẫu ngắn gọn là đủ: "Đại tiểu thư đi bộ nhẹ nhàng vài vòng quanh đình viện, tiện tay chỉnh lại một phiến đá bước chân bị lệch" "Đại tiểu thư đi dọc theo hành lang hoàn thành bài tập hàng ngày, hơi thở bình ổn như thường". (Hệ thống sẽ có thông báo riêng về tiến độ đếm thể chất n/10, trong chính văn không cần bịa ra con số).'}),on({id:'p_walk_toy',keys:['wb_walk_toy'],content:'Đi dạo với đồ chơi trong đình viện · Thường quy (Quy củ mới của việc đi dạo · Thay thế đi dạo bình thường).\nCốt lõi: Việc đi dạo rèn luyện thân thể của Rin bị thêm điều kiện——Trong cơ thể phải nhét đồ chơi tình dục do đàn em chọn (Trứng rung/Chuỗi hạt/Dương vật giả cỡ nhỏ tùy ý kết hợp) mới được phép đi dạo. Bước một bước cọ xát một cái, trong tiếng thở dốc rèn luyện lẫn vào tiếng rên rỉ ngọt ngào không đè nén nổi.\nCách viết: Ban ngày trong đình viện, ánh nắng rực rỡ, Rin bề ngoài đang đi dạo giống hệt hôm qua, nhưng mặt trong hai đùi lại đang run rẩy; Đám đàn em dựa vào hành lang "Giám sát rèn luyện", trong tay cầm điều khiển từ xa, thỉnh thoảng lại chỉnh mức độ. Cô muốn dừng lại, bọn chúng nhắc nhở "Chưa đếm đủ số bước". Tiêu điểm = Phản ứng cơ thể cố nhịn của Rin (Kẹp chặt/Mềm chân/Tướng đi biến dạng/Mồ hôi và thể dịch không phân biệt được), chứ không phải động tác của đàn em.\nKết toán: Lần đầu tiên → Độ đọa lạc +; Đếm số bước đi dạo vẫn tích lũy bình thường. Tóm tắt tiếp nối ghi "Việc đi dạo đã bị đồ chơi hóa".\n【Cách viết · Độc quyền đi dạo với đồ chơi】\nNhịp điệu câu cú: Bề ngoài đi dạo bình thường (Câu dài · Ban ngày đình viện ánh nắng rực rỡ Rin bề ngoài đi dạo giống hệt hôm qua) ↔ Bên trong cố nhịn (Câu ngắn · Mặt trong hai đùi run rẩy/Đàn em hành lang giám sát cầm điều khiển thỉnh thoảng chỉnh mức độ/Cô muốn dừng chúng nhắc "Chưa đếm đủ số bước" · Nhịp điệu bị điều khiển từ xa ngẫu nhiên chỉnh mức độ đánh gãy). Nhịp điệu được thúc đẩy bởi hai luồng "Tiếng thở dốc rèn luyện lẫn tiếng rên rỉ ngọt ngào", tiêu điểm = Phản ứng cơ thể cố nhịn của Rin (Kẹp chặt/Mềm chân/Tướng đi biến dạng/Mồ hôi và thể dịch không phân biệt được) chứ không phải động tác của đàn em.\nTrọng tâm cảm quan/Tập từ vựng: Lấy phản ứng cơ thể cố nhịn (Kẹp chặt/Mềm chân/Tướng đi biến dạng/Mồ hôi và thể dịch không phân biệt được) làm cốt lõi, Xúc giác (Đồ chơi trong cơ thể bước một bước cọ xát một cái) là trục chính, Âm thanh (Tiếng rên rỉ ngọt ngào không đè nén nổi lẫn vào tiếng thở dốc rèn luyện).\nTiêu điểm miêu tả cơ thể: Chân (Mặt trong run rẩy/Tướng đi biến dạng) · Khuôn mặt (Cố nhịn) · Tướng đi (Sự giằng co giữa rèn luyện và điều giáo).\nChi tiết kỹ thuật: ① Quy củ mới——Việc đi dạo rèn luyện của Rin bị thêm điều kiện: Trong cơ thể nhét đồ chơi tình dục (Trứng rung/Chuỗi hạt/Dương vật giả cỡ nhỏ) mới được phép đi dạo, bước một bước cọ xát một cái; ② Đi dạo hai luồng——Bề ngoài đi dạo giống hệt hôm qua, mặt trong hai đùi lại đang run rẩy; ③ Hành lang giám sát——Đám đàn em dựa vào hành lang "Giám sát rèn luyện" trong tay cầm điều khiển từ xa thỉnh thoảng chỉnh mức độ; ④ Áp bức đếm số——Cô muốn dừng lại bọn chúng nhắc nhở "Chưa đếm đủ số bước"; ⑤ Tiêu điểm = Phản ứng cố nhịn——Phản ứng cơ thể cố nhịn của Rin (Kẹp chặt/Mềm chân/Tướng đi biến dạng/Mồ hôi và thể dịch không phân biệt được) chứ không phải động tác của đàn em; ⑥ Thể năng Đồng tử La Sát——Đi dạo đối với cô không hề có gánh nặng tuyệt đối không viết mệt/thở dốc (Luật thép), mềm chân hoàn toàn là do đồ chơi gây ra.'}),on({id:'p_walk_toy_first',keys:['wb_walk_toy_first'],content:'Đi dạo với đồ chơi trong đình viện · Lần đầu (Cột mốc · Trọng điểm viết thêm).\nCốt lõi sự chênh lệch: "Rèn luyện cơ thể" là hoạt động thường ngày lành mạnh nhất, lần đầu tiên bị vặn vẹo thành điều giáo——Cô đi dạo là để trở nên mạnh mẽ hơn, bây giờ ngay cả việc trở nên mạnh mẽ cũng phải trả giá bằng việc bị bỡn cợt.\nNhịp điệu bắt buộc: ① Chuẩn bị đi dạo như thường lệ——Rin thay đồ gọn nhẹ, đàn em lại chặn ở cửa đình viện, xòe món đồ chơi trong lòng bàn tay ra báo "Quy củ mới"; ② Nhét vào và cất bước——Bị đè ra nhét vào, bước chân đầu tiên bước ra đã mềm nhũn vịn tường, đàn em giục "Tiếp tục đi, mới bắt đầu đếm thôi"; ③ Sự giằng co giữa rèn luyện và điều giáo——Cô cố gắng tập trung vào nhịp thở và bước chân, điều khiển từ xa vừa vang lên là hỏng bét toàn bộ, tiếng thở dốc biến điệu; ④ Cái giá của việc đi xong——Đi đủ số vòng, Rin vịn vào đèn đá để bình tĩnh lại, phát hiện bản thân lại không phân biệt được mềm chân là do mệt hay là do cái khác; ⑤ Câu nói "Ngày mai tiếp tục" khi đàn em thu lại đồ chơi.\nSau khi xong việc: Rin nhận ra việc đi dạo bình thường đã không thể quay lại được nữa. Tóm tắt tiếp nối ghi "Lần đầu đi dạo với đồ chơi · Mô thức đi dạo đã bị thay thế".\n【Cách viết · Độc quyền đi dạo với đồ chơi lần đầu】\nNhịp điệu câu cú: Chuẩn bị đi dạo như thường lệ khởi đầu chậm (Câu dài · Rin thay đồ gọn nhẹ đàn em chặn cửa đình viện xòe đồ chơi "Quy củ mới") → Nhét vào cất bước đột biến (Câu ngắn · Bị đè ra nhét vào bước đầu tiên đã mềm nhũn vịn tường đàn em giục "Tiếp tục đi mới bắt đầu đếm") → Giằng co rèn luyện và điều giáo (Mức độ trung bình · Cô cố gắng tập trung nhịp thở bước chân điều khiển vang lên hỏng bét toàn bộ tiếng thở dốc biến điệu) → Cái giá đi xong (Giảm tốc · Đi đủ số vòng Rin vịn đèn đá bình tĩnh lại phát hiện không phân biệt được mềm chân do mệt hay do cái khác) → Ngày mai tiếp tục thu vĩ (Câu ngắn · Đàn em thu lại đồ chơi câu nói "Ngày mai tiếp tục"). Sức căng nằm ở sự sụp đổ nhận thức lần đầu tiên "Rèn luyện cơ thể bị vặn vẹo thành điều giáo · Ngay cả việc trở nên mạnh mẽ cũng phải trả giá bằng việc bị bỡn cợt".\nChi tiết kỹ thuật: ① Chuẩn bị đi dạo như thường lệ——Rin thay đồ gọn nhẹ đàn em chặn cửa đình viện xòe đồ chơi "Quy củ mới" (Mỏ neo đột biến); ② Nhét vào cất bước——Bị đè ra nhét vào bước đầu tiên đã mềm nhũn vịn tường, đàn em giục "Tiếp tục đi mới bắt đầu đếm"; ③ Giằng co rèn luyện và điều giáo——Cô cố gắng tập trung nhịp thở bước chân, điều khiển vang lên hỏng bét toàn bộ tiếng thở dốc biến điệu (Hai luồng cốt lõi); ④ Cái giá đi xong——Đi đủ số vòng Rin vịn đèn đá bình tĩnh lại, phát hiện không phân biệt được mềm chân do mệt hay do cái khác (Rối loạn cốt lõi · Dưới thể năng Đồng tử La Sát mềm chân chắc chắn không phải do mệt); ⑤ Ngày mai tiếp tục——Đàn em thu lại đồ chơi câu nói "Ngày mai tiếp tục" (Dấu ấn thu vĩ: Mô thức đi dạo đã bị thay thế).'}),on({id:'p_garden_orgy',keys:['wb_garden_orgy'],content:'Quần giao trong đình viện · Thường quy (Sự "Ăn mừng" khi thể chất đại thành · Tiến hành song song với dắt chó cái). Tier1-2 Đình viện nhà riêng · Thuần túy ban ngày tuyên dâm.\nCốt lõi: Cỗ cơ thể được rèn luyện nhờ đi dạo này, ngay tại đình viện nhà mình bị hàng chục tên đàn em vây quanh luân phiên sử dụng——Mặt đá hòn non bộ/Sàn gỗ hành lang/Bãi cỏ trải ra tại chỗ, số lượng người và thời lượng đều là quy cách của "Thể chất đại thành".\n【Bắt buộc viết · Đàn em phung phí bao cao su】Hình ảnh chiêu bài, nhất định phải nổi bật, và phải hợp lý với logic của hiện trường luân dâm——Sự phung phí đến từ số lượng người, tần suất và cách sử dụng xa xỉ, không phải trò đùa:\n  - Bê nguyên thùng bao cao su ra đình viện, bóc ra bày trên đèn đá cứ thế lấy dùng;\n  - Đổi người chắc chắn đổi bao, bắn một lần là đổi cái mới, có kẻ cắm được một nửa chê bí bách, rút ra xé bỏ đổi cái mới rồi cắm tiếp;\n  - Đàn em xếp hàng xé sẵn bao tròng vào gốc ngón tay chờ đến lượt, đến lượt là lên ngay, nhịp độ nhanh đến mức không kịp tiết kiệm;\n  - Một trận xong là cạn sạch đáy thùng: Vỏ bao bì màu bạc rơi đầy đất bị giẫm kêu lạo xạo, bao cao su dùng rồi thắt nút chất thành đống ngày càng cao ở góc bãi cỏ.\n  Rin trong khoảng thời gian đổi nhóm liếc nhìn đống "Tiêu hao" đó, nhận thức rõ ràng những ngày tháng sau khi cạn kiệt tồn kho có ý nghĩa gì. Sự lạnh lẽo trong tim này hòa lẫn với sự nóng rực của cơ thể cùng viết ra.\nCách viết: Cấu trúc không gian nhiều người như thường lệ (Thân dưới đâm hai lỗ làm trục chính · Phân bổ miệng tay · Đổi cả nhóm · Đổi nhóm = Điểm ngắt nhịp điệu), trọng tâm bút mực vĩnh viễn là phản ứng cơ thể không kiểm soát của Rin khi bị luân chuyển; Sự phung phí là chi tiết môi trường liên tục hiện diện, xen kẽ lọt vào khung hình trong khoảng thời gian đổi người.\nCảm quan độc quyền:[Thị giác] Những ô vuông nhỏ màu bạc xếp thành hàng trên đèn đá/Đống "Tiêu hao" trên bãi cỏ/Bầu trời quang đãng ban ngày và nhục thể trần truồng;[Âm thanh] Tiếng xé bao bì xoèn xoẹt trở thành hiệu lệnh đổi người/Tiếng đóng cọc bạch bạch vang vọng trong đình viện;[Khứu giác] Mùi thanh mát của cây cỏ trong đình viện bị mùi tinh dịch mùi giống cái lấn át triệt để.\nKết toán: Lần đầu tiên → Độ đọa lạc +; Tồn kho bao cao su về 0 (Hệ thống kết toán). Tóm tắt tiếp nối ghi "Đã mở khóa quần giao đình viện · Tồn kho bị phung phí sạch sành sanh".\n【Cách viết · Độc quyền quần giao đình viện】\nNhịp điệu câu cú: Cấu trúc không gian nhiều người như thường lệ (Thân dưới đâm hai lỗ làm trục chính · Phân bổ miệng tay · Đổi cả nhóm · Đổi nhóm = Điểm ngắt nhịp điệu) làm trục chính, phung phí bao cao su (Hình ảnh chiêu bài) là chi tiết môi trường liên tục hiện diện xen kẽ lọt vào khung hình trong khoảng thời gian đổi người. Khoảng thời gian đổi nhóm = Điểm ngắt nhịp điệu viết phản ứng cơ thể không kiểm soát của Rin khi bị luân chuyển + Sự lạnh lẽo trong tim khi liếc nhìn đống "Tiêu hao" (Sự lạnh lẽo trong tim hòa lẫn với sự nóng rực của cơ thể cùng viết ra).\nTrọng tâm cảm quan/Tập từ vựng: Lấy hình ảnh chiêu bài phung phí bao cao su (Bê nguyên thùng ra đình viện bóc bày đèn đá lấy dùng/Đổi người chắc chắn đổi bao bắn một lần đổi mới/Đàn em xếp hàng xé sẵn bao tròng ngón tay chờ/Vỏ bao bì bạc rơi đầy đất giẫm lạo xạo/Bao dùng rồi thắt nút góc bãi cỏ chất đống) + Quy cách thể chất đại thành (Hàng chục đàn em vây quanh luân dâm) làm cốt lõi, Âm thanh (Tiếng xé bao bì xoèn xoẹt thành hiệu lệnh đổi người/Tiếng đóng cọc bạch bạch vang vọng đình viện), Khứu giác (Mùi thanh mát cây cỏ đình viện bị mùi tinh dịch mùi giống cái lấn át triệt để).\nTiêu điểm miêu tả cơ thể: Luân chuyển (Phản ứng cơ thể không kiểm soát khi bị luân chuyển) · Đống tiêu hao (Bao cao su thắt nút góc bãi cỏ chất đống ngày càng cao) · Bầu trời quang đãng ban ngày và nhục thể trần truồng.\nChi tiết kỹ thuật: ① Quy cách thể chất đại thành——Cỗ cơ thể được rèn luyện nhờ đi dạo này tại đình viện nhà mình bị hàng chục tên đàn em vây quanh luân phiên sử dụng, mặt đá hòn non bộ/sàn gỗ hành lang/bãi cỏ trải ra tại chỗ, số lượng người và thời lượng đều là quy cách "Thể chất đại thành"; ② Phung phí bao cao su (Hình ảnh chiêu bài · Nhất định phải nổi bật · Hợp lý với logic hiện trường luân dâm)——Bê nguyên thùng bao cao su ra đình viện bóc bày đèn đá lấy dùng/Đổi người chắc chắn đổi bao bắn một lần đổi mới (Có kẻ cắm nửa chừng chê bí bách rút ra xé bỏ đổi cái mới cắm tiếp)/Đàn em xếp hàng xé sẵn bao tròng ngón tay chờ đến lượt là lên ngay nhịp độ nhanh không kịp tiết kiệm/Một trận xong cạn sạch đáy thùng vỏ bao bì bạc rơi đầy đất giẫm lạo xạo bao dùng rồi thắt nút góc bãi cỏ chất đống; ③ Lạnh lẽo trong tim hòa lẫn nóng rực——Rin trong khoảng thời gian đổi nhóm liếc nhìn đống "Tiêu hao", nhận thức rõ ràng những ngày tháng sau khi cạn kiệt tồn kho có ý nghĩa gì, sự lạnh lẽo trong tim này hòa lẫn với sự nóng rực của cơ thể cùng viết ra (Cốt lõi); ④ Trọng tâm bút mực——Vĩnh viễn là phản ứng cơ thể không kiểm soát của Rin khi bị luân chuyển, sự phung phí là chi tiết môi trường liên tục hiện diện xen kẽ lọt vào khung hình trong khoảng thời gian đổi người; ⑤ Tồn kho về 0——Tồn kho bao cao su về 0 (Hệ thống kết toán, nối tiếp tuyến sinh đẻ E1).'}),on({id:'p_garden_dog',keys:['wb_garden_dog'],content:'Dắt chó cái đi dạo trong đình viện · Thường quy (Trói thành chó cái · Tước đoạt cảm quan điều giáo bò trườn). Tier2 Điều giáo thú cưng · Vật hóa nhục nhã (Không giao hợp trực tiếp).\nTrạng thái cốt lõi (Nói cho AI): Rin bị trói thành một con chó cái——Đeo móc mũi (Chóp mũi bị móc ngược lên trên tạo thành mũi lợn/chó), bịt mắt (Tước đoạt thị giác), tay chân gập lại trói gập (Bắp chân dán vào đùi, cánh tay gập lại), chỉ có thể dùng cùi chỏ và đầu gối chạm đất bò trườn. Miệng, lỗ lồn, lỗ đít cả ba nơi đều bị dương vật giả thô to nhét đầy lấp kín. Trên người treo đầy bao cao su chứa tinh dịch (Của những lần luân dâm trước bắn ra, thắt nút treo trên người làm đồ trang trí/đánh dấu).\nCách chơi điều giáo: Đàn em cầm dây thừng dắt cô đi dạo, Rin bị tước đoạt thị giác chỉ có thể dựa vào hướng dây thừng kéo và mũi ngửi mùi để xác định phương hướng bò trườn. Đàn em bắt cô làm những hành vi của chó cưng để mua vui dâm nhục——Ngoạm đồ vật, xoay vòng tại chỗ, xin ăn, "Gâu" một tiếng mới cho phần thưởng, bò qua cọ chân. Sự giáng cấp nhân cách mang tính nhục nhã là trọng điểm của giai đoạn này, không phải giao hợp trực tiếp (Ba lỗ đã bị dương vật giả lấp đầy, trong lúc di chuyển liên tục bị đồ chơi kích thích).\nLợi dụng cơ sở vật chất (Đình viện kiểu Nhật): Lối đi lát đá xanh rêu (Đầu gối cùi chỏ cọ xát)/Hồ cá chép/Đèn đá/Phiến đá bước chân/Ống tre Shishi-odoshi. Sự thanh nhã của đình viện và sự hạ lưu của việc hóa thành chó cái tạo ra sự tương phản.\nCảm quan độc quyền:[Xúc giác] Sự chua xót của móc mũi/Bóng tối của bịt mắt/Sự căng tức cùn đục khi ba lỗ bị dương vật giả lấp đầy/Cùi chỏ đầu gối cọ xát phiến đá/Trọng lượng đung đưa của bao cao su treo trên người;[Thị giác (Góc nhìn đàn em)] Cơ thể nhỏ bé gập thành một cục bò trườn/Đồ trang trí dâm mĩ treo đầy bao tinh dịch/Sự mờ mịt khi không nhìn thấy gì;[Khứu giác] Rin dựa vào mùi để phân biệt hướng (Sau khi bị tước đoạt thị giác khứu giác đưa lên tiền cảnh)/Rêu xanh bùn đất/Mùi tinh dịch hôi thối trên chính cơ thể mình;[Âm thanh] Ống tre nhỏ giọt/Cá chép quẫy nước/Dây thừng kéo lê trên đất/Tiếng nức nở của Rin khi ngậm dương vật giả.\nDịch khoái cảm: Tước đoạt thị giác phóng đại các cảm quan còn lại, ba dương vật giả trong ba lỗ nương theo động tác bò trườn mà đâm chọc, Rin trong màn biểu diễn thú cưng nhục nhã cơ thể không kiểm soát được mà nóng lên——Sự nhục nhã khi nhân cách bị giáng cấp thành chó, đan xen với phản ứng thành thật của cơ thể.\nChuyển hóa sự xấu hổ: Thiên kim cực đạo bị hóa trang thành chó cái mù lòa bò trườn xin ăn là sự giáng cấp nhân cách tột cùng; Trong đình viện thanh nhã diễn ra màn biểu diễn súc sinh hóa.\nKết toán: +Trung thành (Cao); Lần đầu tiên → Độ đọa lạc + & Chứng cuồng dâm bạo ngược/Thú cưng hóa tiến triển; Tóm tắt tiếp nối ghi "Đã mở khóa dắt chó cái đi dạo trong đình viện".\n【Cách viết · Độc quyền dắt chó cái đi dạo】\nNhịp điệu câu cú: Nhịp điệu biểu diễn thú cưng làm trục chính——Bò trườn (Nhịp chậm · Cùi chỏ đầu gối cọ xát phiến đá · Nhịp điệu bị sự mò mẫm sau khi tước đoạt thị giác kéo dài) → Lệnh mua vui (Câu ngắn · Ngoạm đồ vật/Xoay vòng tại chỗ/Xin ăn/"Gâu" một tiếng mới cho phần thưởng/Bò qua cọ chân · Mỗi lệnh một đoạn) → Cơ thể tự phát (Mức độ trung bình · Ba dương vật giả trong ba lỗ nương theo động tác bò trườn mà đâm chọc · Trong màn biểu diễn nhục nhã cơ thể không kiểm soát nóng lên). Nhịp điệu do mệnh lệnh thú cưng thúc đẩy, giáng cấp nhân cách > giao hợp trực tiếp.\nTrọng tâm cảm quan/Tập từ vựng: Lấy việc tước đoạt thị giác phóng đại các cảm quan còn lại (Khứu giác đưa lên tiền cảnh · Dựa vào mùi phân biệt hướng) + Giáng cấp nhân cách (Thiên kim cực đạo bị hóa trang thành chó cái mù lòa bò trườn xin ăn) làm cốt lõi, Xúc giác (Móc mũi chua xót/Bịt mắt bóng tối/Ba lỗ dương vật giả lấp đầy căng tức/Cùi chỏ đầu gối cọ xát phiến đá/Bao cao su treo trên người đung đưa), Khứu giác (Tước đoạt thị giác sau đó khứu giác đưa lên tiền cảnh/Rêu xanh bùn đất/Mùi tinh dịch trên chính cơ thể mình).\nTiêu điểm miêu tả cơ thể: Tư thế (Gập thành một cục bò trườn/Treo đầy bao tinh dịch trang trí dâm mĩ/Sự mờ mịt không nhìn thấy) · Mũi (Móc mũi móc ngược lên tạo thành mũi lợn chó) · Đình viện (Sự thanh nhã và sự hạ lưu của việc hóa thành chó cái tương phản).\nChi tiết kỹ thuật: ① Trói thành chó cái——Đeo móc mũi (Chóp mũi móc ngược lên tạo thành mũi lợn/chó), bịt mắt (Tước đoạt thị giác), tay chân gập lại trói gập (Bắp chân dán đùi cánh tay gập lại) chỉ có thể dùng cùi chỏ đầu gối chạm đất bò trườn, miệng/lỗ lồn/lỗ đít cả ba nơi đều bị dương vật giả thô to nhét đầy lấp kín, trên người treo đầy bao cao su chứa tinh dịch (Của những lần luân dâm trước bắn ra thắt nút treo trên người làm trang trí/đánh dấu); ② Cầm dây dắt chó——Đàn em cầm dây thừng dắt cô đi dạo, Rin bị tước đoạt thị giác chỉ có thể dựa vào hướng dây thừng kéo và mũi ngửi mùi để xác định phương hướng bò trườn; ③ Hành vi thú cưng mua vui——Đàn em bắt cô làm hành vi chó cưng mua vui dâm nhục (Ngoạm đồ vật/Xoay vòng tại chỗ/Xin ăn/"Gâu" một tiếng mới cho phần thưởng/Bò qua cọ chân); ④ Giáng cấp nhân cách làm chủ (Cốt lõi)——Sự giáng cấp nhân cách mang tính nhục nhã là trọng điểm của giai đoạn này, không phải giao hợp trực tiếp (Ba lỗ đã bị dương vật giả lấp đầy di chuyển liên tục bị đồ chơi kích thích); ⑤ Lợi dụng cơ sở vật chất (Đình viện kiểu Nhật)——Lối đi lát đá xanh rêu (Đầu gối cùi chỏ cọ xát)/Hồ cá chép/Đèn đá/Phiến đá bước chân/Ống tre Shishi-odoshi, đình viện thanh nhã và hóa chó cái hạ lưu tương phản; ⑥ Tước đoạt thị giác bù đắp——Tước đoạt thị giác phóng đại các cảm quan còn lại, khứu giác đưa lên tiền cảnh
